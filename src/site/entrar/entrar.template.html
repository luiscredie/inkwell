<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · Inkwell</title>
<meta name="description" content="Confirme sua entrada no Inkwell.">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b192c">
<link rel="icon" href="../ink/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="../ui/tokens.css"><script>try{document.documentElement.dataset.theme=localStorage.getItem("inkwell-theme")==="noite"?"noite":"dia"}catch(e){document.documentElement.dataset.theme="dia"}</script>
</head>
<body>
<script>window.INKWELL_CLOUD_CONFIG = {"url": "https://sorefaetiaebmjploanp.supabase.co", "key": "sb_publishable_RkAWW-ENz70CXA6_QV7aHw_MpfD7Gn2", "redirect": "https://luiscredie.github.io/inkwell/feed/"};
/*@CLOUD_JS@*/</script>
<style>
/* layout only; components come from ../ui/tokens.css */
.en-box { max-width: 460px; margin: var(--sp-8) auto; padding: var(--sp-6); border-radius: var(--r-lg); background: var(--surface-2); box-shadow: var(--e2); display: grid; gap: var(--sp-4); text-align: center; }
.en-box h1 { margin: 0; font-size: var(--fs-h2); }
.en-box p { margin: 0; color: var(--text-2); line-height: 1.5; }
.en-box .btn { justify-self: center; }
</style>
<main class="page" id="page"><div class="en-box" id="app" aria-live="polite"></div></main>
<script>
// The link in the sign-in e-mail lands here with the token hash in the address (?h=…). Nothing is used until the
// person presses "Entrar no Inkwell": mail scanners (Outlook/Hotmail Safe Links) open links but don't press buttons.
// Used once the Supabase e-mail templates point here (SUPABASE_SETUP.md); until then, nothing links to this page.
(() => {
  const CLOUD = window.INKWELL_CLOUD, $ = (id) => document.getElementById(id), app = $("app");
  let lang = "pt"; try { lang = localStorage.getItem("inkwell-lang") || "pt"; } catch { /* */ }
  const T = (pt, en) => (lang === "pt" ? pt : en);
  const q = new URLSearchParams(location.search);
  const hash = (q.get("h") || q.get("token_hash") || "").trim();
  const type = /^(email|magiclink|signup)$/.test(q.get("t") || "") ? q.get("t") : "email";
  if (hash) history.replaceState(null, "", location.pathname);   // the hash isn't left in the address bar or history entry
  // back to the page where the code was asked for (same site, within a day), else Início
  const back = () => {
    try {
      const r = JSON.parse(localStorage.getItem("inkwell-return") || "null");
      localStorage.removeItem("inkwell-return");
      if (r && Date.now() - r.at < 864e5 && /^\/(inkwell\/)?[a-z-]+\/?/.test(r.path) && !/\/entrar\//.test(r.path)) return r.path;
    } catch { /* */ }
    return "../feed/";
  };
  const show = (html) => { app.innerHTML = html; };
  if (CLOUD?.status().signedIn) {
    show(`<h1>${T("Você já entrou", "You're already signed in")}</h1><p>${T("Esta conta já está aberta neste navegador.", "This account is already open in this browser.")}</p><a class="btn primary" href="${back()}">${T("Continuar", "Continue")}</a>`);
    return;
  }
  if (!hash || !CLOUD) {
    show(`<h1>${T("Link incompleto", "Incomplete link")}</h1><p>${T("Este link não tem o que precisa para entrar. Peça um código novo.", "This link is missing what it needs to sign in. Ask for a new code.")}</p><button type="button" class="btn primary" id="code">${T("Entrar com código", "Sign in with a code")}</button>`);
    $("code").onclick = () => window.INKWELL_SIGNIN?.();
    return;
  }
  show(`<h1>${T("Entrar no Inkwell", "Sign in to Inkwell")}</h1><p>${T("Toque no botão para confirmar que é você.", "Press the button to confirm it's you.")}</p>
    <button type="button" class="btn primary large" id="go">${T("Entrar no Inkwell", "Sign in to Inkwell")}</button><p class="small" id="msg" role="alert"></p>`);
  $("go").onclick = async () => {
    const b = $("go"); b.disabled = true; b.setAttribute("aria-busy", "true");
    try { await CLOUD.verifyHash(hash, type); window.INKWELL_TRACK?.("signin_done"); location.replace(back()); }
    catch (e) {
      b.removeAttribute("aria-busy");
      show(`<h1>${T("Este link não vale mais", "This link no longer works")}</h1><p>${e?.status >= 400 && e?.status < 500
        ? T("Ele já foi usado ou expirou. Peça um código novo.", "It was already used or expired. Ask for a new code.")
        : T("Sem conexão com o servidor. Tente de novo.", "No connection to the server. Try again.")}</p>
        <button type="button" class="btn primary" id="code">${T("Pedir código novo", "Ask for a new code")}</button>`);
      $("code").onclick = () => window.INKWELL_SIGNIN?.();
    }
  };
})();
</script>
<script>window.INKWELL_SHELL = {"page": "entrar"};
/*@SHELL_JS@*/</script>
</body>
</html>
