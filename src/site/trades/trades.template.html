  }

  function wirePicker(root, key, items, onChange, own) {

  const people = () => [...new Set([...loans.map((l) => l.person), ...trades.map((t) => t.person)])].sort((a, b) => a.localeCompare(b));

    return `<section class="card${attention ? " attention" : ""}" data-uloan="${u.id}" data-status="${u.status}">${head(who, title, sub, trail)}

  async function applyTrade(kind, id, apply) {

  function tradesHtml() {
    const waiting = waitingTrades();
    const live = utrades.filter((t) => !waiting.includes(t) && t.status !== "declined" && t.status !== "cancelled" && !(t.status === "completed" && t[mySide(t)]));
    const past = utrades.filter((t) => !waiting.includes(t) && !live.includes(t));
    return `${autoNote ? `<div class="notice" id="autoNote"><i class="ic i-check"></i><span>${esc(autoNote)}</span></div>` : ""}
      ${waiting.length ? `<div class="section-title"><h2>${Tx("Waiting for you")}</h2></div><div class="stack">${waiting.map(siteTradeCard).join("")}</div>` : ""}
      ${live.length ? `<div class="section-title"><h2>${Tx("With friends on the site")}</h2></div><div class="stack">${live.map(siteTradeCard).join("")}</div>` : ""}
      ${trades.length || past.length ? `<div class="section-title"><h2>${Tx("Trades")}</h2></div><div class="stack">${trades.map(tradeCard).join("")}${past.map(siteTradeCard).join("")}</div>` : ""}
      ${!waiting.length && !live.length && !trades.length && !past.length ? `<div class="empty"><img src="../ui/assets/empty/trades.svg" alt=""><b>${Tx("No trades yet.")}</b><p>${Tx("Propose a trade to a friend, or note one you made off the site.")}</p></div>` : ""}
      <p class="small faint" style="margin-top:var(--sp-6)">${esc(Tx("Prices: Liga Lorcana, {date}. Cards without a price count as R$ 0.", { date: pricesDate ? fmtDate(pricesDate) : "–" }))} ${Tx("Changes go to your Inkwell collection; Inkwell picks them up on its next sync.")}</p>`;
  }

  // ---------- public board ----------
  const KIND = { borrow: ["I want to borrow", "wants to borrow"], buy: ["I want to buy", "wants to buy"], lend: ["I lend", "lends"], sell: ["I sell", "sells"] };
  function boardHtml() {
    const st = stock();
    const mine = listings.filter((l) => l.user_id === me.id);
    const myWants = new Set(mine.filter((l) => l.kind === "borrow" || l.kind === "buy").map((l) => l.card_id));
    const words = norm(boardQ).split(" ").filter(Boolean);
    const matchOf = (l) => {
      if (l.kind === "borrow" || l.kind === "buy") { const n = freeOf(st, l.card_id, false) + freeOf(st, l.card_id, true); return n > 0 ? Tx("You have {n} free", { n }) : ""; }
      return myWants.has(l.card_id) ? Tx("On your list") : "";
    };
    const rows = listings.filter((l) => l.user_id !== me.id && CARDS.has(l.card_id)
        && (boardKind === "all" || (boardKind === "want" ? l.kind === "borrow" || l.kind === "buy" : l.kind === "lend" || l.kind === "sell"))
        && (!words.length || words.every((w) => norm(`${cardLabel(l.card_id)} ${l.card_id} ${nameOf(l.user_id)}`).includes(w))))
      .map((l) => ({ l, m: matchOf(l) })).sort((a, b) => (b.m ? 1 : 0) - (a.m ? 1 : 0) || String(b.l.created_at).localeCompare(String(a.l.created_at)));
    const action = (l) => {
      if (friends.includes(l.user_id)) {
        const [k, label] = { lend: ["ask", "Ask to borrow"], borrow: ["offer", "Offer to lend"], sell: ["buy", "Propose to buy"], buy: ["sell", "Propose to sell"] }[l.kind];
        return `<button type="button" class="btn small" data-bact="${k}:${l.id}">${Tx(label)}</button>`;
      }
      return pendingWith.has(l.user_id) ? `<span class="small muted">${Tx("Friend request sent")}</span>` : `<button type="button" class="btn small" data-addfriend="${l.user_id}"><i class="ic i-user-plus"></i>${Tx("Add friend")}</button>`;
    };
    const line = (l, m, own) => `<div class="list-row" data-listing="${l.id}" data-kind="${l.kind}">${thumb(l.card_id, "sm", l.foil)}
      <span class="t"><span>${esc(cardLabel(l.card_id))}</span>
        <span class="meta">${own ? `${Tx(KIND[l.kind][0])} · ${l.qty}×${l.foil ? ` ${Tx("foil")}` : ""}` : `${esc(nameOf(l.user_id))} ${Tx(KIND[l.kind][1])} · ${l.qty}×${l.foil ? ` ${Tx("foil")}` : ""} · ${esc(fmtDate(l.created_at))}`}</span>
        ${l.note ? `<span class="meta">${esc(l.note)}</span>` : ""}
        ${m ? `<span class="meta" style="margin-top:4px"><span class="tag match">${esc(m)}</span></span>` : ""}
        ${!own && !friends.includes(l.user_id) ? `<span class="meta" style="margin-top:4px">${Tx("To lend or trade with someone, you need to be friends on the site.")}</span>` : ""}</span>
      <span class="trail">${l.price_brl != null ? `<b class="money">${esc(brl(+l.price_brl))}</b>` : ""}${own ? `<button type="button" class="btn ghost small" data-dellist="${l.id}">${Tx("Remove")}</button>` : action(l)}</span></div>`;
    return `<div class="row between" style="margin-bottom:var(--sp-4)"><div class="seg" role="group" aria-label="${Tx("Kind")}">${[["all", "All"], ["want", "Looking for"], ["offer", "Offering"]].map(([k, l]) => `<button type="button" data-bkind="${k}" aria-pressed="${boardKind === k}">${Tx(l)}</button>`).join("")}</div>
        <span class="search" style="max-width:280px;flex:1"><i class="ic i-search"></i><input type="search" id="boardQ" value="${esc(boardQ)}" placeholder="${Tx("Search a card by name")}" aria-label="${Tx("Search the board")}"></span></div>
      ${rows.length ? `<div class="list">${rows.map(({ l, m }) => line(l, m, false)).join("")}</div>` : `<div class="empty plain"><b>${Tx("Nothing on the board matches.")}</b></div>`}
      <div class="section-title"><h2>${Tx("My posts")}</h2><span class="small">${mine.length}</span></div>
      ${mine.length ? `<div class="list">${mine.map((l) => line(l, "", true)).join("")}</div>` : `<div class="empty plain"><p>${Tx("No posts yet.")}</p></div>`}`;
  }

  // ---------- forms (a sheet on a phone, a dialog on a computer) ----------
  const newTradeForm = () => ({ kind: "trade", withSite: friends.length > 0, person: "", traded_on: today(), note: "", gave: [], got: [], cashMode: "none", cash: "" });
  const newLoanForm = () => ({ kind: "loan", withSite: friends.length > 0, direction: "lent", person: "", due_on: "", deliver_on: "", note: "", items: [] });
  const newPostForm = () => ({ kind: "post", post: "lend", items: [], price: "", note: "" });
  function formHtml() {
    const f = form, site = f.withSite;
    if (f.kind === "loan") return { title: Tx("New loan"), wide: false, note: site ? Tx("{name} gets the request and needs to accept.", { name: f.friend ? nameOf(f.friend).split(" ")[0] : Tx("Your friend") }) : "", save: Tx(site ? "Send request" : "Save"),
      body: `<div class="form-block"><h3><span class="step">1</span>${Tx("With whom")}</h3>
        <div class="seg block" role="group" aria-label="${Tx("Direction")}"><button type="button" data-dir="lent" aria-pressed="${f.direction === "lent"}">${Tx(site ? "I lend" : "I lent")}</button><button type="button" data-dir="borrowed" aria-pressed="${f.direction === "borrowed"}">${Tx(site ? "I ask to borrow" : "I borrowed")}</button></div>
        ${withSeg(site)}
        ${site && !friends.length ? `<div class="notice"><i class="ic i-info"></i><span>${Tx("Add friends on the home page to lend between site players.")}</span></div>` : ""}
        ${site ? friendSelect(f) : `<label class="field">${Tx("Person")}<input type="text" id="fPerson" list="people" maxlength="60" value="${esc(f.person)}" placeholder="${Tx("Name of who you lent to or borrowed from")}"></label>`}</div>
      <div class="form-block"><h3><span class="step">2</span>${Tx("Cards")}</h3>${pickerHtml("li", f.items, Tx("Cards"), f.direction === "lent")}</div>
      <div class="form-block"><h3><span class="step">3</span>${Tx("Dates")}</h3>
        <label class="field">${Tx("Due date (optional)")}<input type="date" id="fDue" value="${esc(f.due_on || "")}"></label>
        <label class="field">${Tx("Note (optional)")}<textarea id="fNote" maxlength="500" placeholder="${Tx("E.g. I'll hand them over at the store, before the tournament")}">${esc(f.note)}</textarea></label>
        <p class="small muted" style="margin:0">${Tx("Value")}: <b class="money">${esc(brl(valueOf(f.items)))}</b></p></div>${peopleList()}` };
    if (f.kind === "trade") {
      const cashPaid = f.cashMode === "paid" ? +f.cash || 0 : f.cashMode === "received" ? -(+f.cash || 0) : 0;
      return { title: Tx("New trade"), wide: true, note: site ? Tx("{name} confirms the trade on their side.", { name: f.friend ? nameOf(f.friend).split(" ")[0] : Tx("Your friend") }) : "", save: Tx(site ? "Send proposal" : "Save trade"),
        body: `<div class="form-block"><h3><span class="step">1</span>${Tx("With whom")}</h3>${withSeg(site)}
          ${site && !friends.length ? `<div class="notice"><i class="ic i-info"></i><span>${Tx("Add friends on the home page to lend between site players.")}</span></div>` : ""}
          <div class="grid2">${site ? friendSelect(f) : `<label class="field">${Tx("Person")}<input type="text" id="fPerson" list="people" maxlength="60" value="${esc(f.person)}" placeholder="${Tx("Who you traded with")}"></label>
            <label class="field">${Tx("Date")}<input type="date" id="fDate" value="${esc(f.traded_on)}"></label>`}</div></div>
        <div class="form-block"><h3><span class="step">2</span>${Tx("Cards")}</h3><div class="grid2" style="gap:var(--sp-5) var(--sp-4);align-items:start">
          ${pickerHtml("gv", f.gave, Tx(site ? "I give" : "I gave"), true)}${pickerHtml("gt", f.got, Tx(site ? "I get" : "I got"))}</div></div>
        <div class="form-block"><h3><span class="step">3</span>${Tx("Money and balance")}</h3>
          <div class="seg block" role="group" aria-label="${Tx("Money")}">${[["none", "No money"], ["paid", "I paid"], ["received", "I received"]].map(([k, l]) => `<button type="button" data-cash="${k}" aria-pressed="${f.cashMode === k}">${Tx(l)}</button>`).join("")}</div>
          ${f.cashMode !== "none" ? `<label class="field" style="max-width:220px">${Tx("Amount (R$)")}<span class="prefix"><span>R$</span><input type="number" id="fCash" min="0" step="0.01" inputmode="decimal" value="${esc(f.cash)}"></span></label>` : ""}
          <div id="fBalance">${balanceHtml(f.gave, f.got, cashPaid)}</div>
          <label class="field">${Tx("Note (optional)")}<textarea id="fNote" maxlength="500">${esc(f.note)}</textarea></label></div>${peopleList()}` };
    }
    const own = f.post === "lend" || f.post === "sell";
    return { title: Tx("New post"), wide: false, note: "", save: Tx("Post"),
      body: `<div class="form-block"><div class="chips" role="group" aria-label="${Tx("Kind")}">${Object.entries(KIND).map(([k, [l]]) => `<button type="button" class="chipbtn" data-post="${k}" aria-pressed="${f.post === k}">${Tx(l)}</button>`).join("")}</div></div>
        <div class="form-block">${pickerHtml("bd", f.items, Tx("Cards"), own)}
          <div class="grid2">${f.post === "buy" || f.post === "sell" ? `<label class="field">${Tx("Price per card (optional)")}<span class="prefix"><span>R$</span><input type="number" id="fPrice" min="0" step="0.01" inputmode="decimal" value="${esc(f.price || "")}"></span></label>` : ""}
          <label class="field">${Tx("Note (optional)")}<input type="text" id="fNote" maxlength="200" value="${esc(f.note || "")}"></label></div></div>` };
  }
  function renderSheet() {
    const sh = $("formSheet");
    if (!form) { if (sh.open) sh.close(); sh.innerHTML = ""; return; }
    const keepFocus = document.activeElement?.id, caret = document.activeElement?.selectionStart;
    const x = formHtml();
    sh.className = `sheet${x.wide ? " wide" : ""}`;
    sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><div><h2 id="formT">${esc(x.title)}</h2></div><button type="button" class="btn ghost icon" id="fClose" aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>
      <div class="sheet-body" id="${form.kind === "loan" ? "loanForm" : form.kind === "trade" ? "tradeForm" : "postForm"}">${x.body}<p class="small" id="fMsg" role="alert"></p></div>
      <div class="sheet-foot">${x.note ? `<span class="note">${esc(x.note)}</span>` : ""}<button type="button" class="btn ghost" id="fCancel">${Tx("Cancel")}</button><button type="button" class="btn primary" id="fSave">${esc(x.save)}</button></div>`;
    if (!sh.open) { sh.showModal(); sh.querySelector("input, select, button:not(#fClose)")?.focus(); }
    wireForm(sh);
    if (keepFocus && $(keepFocus)) { const el = $(keepFocus); el.focus(); try { if (caret != null) el.setSelectionRange(caret, caret); } catch { /* */ } }
  }
  const keep = () => {   // copy typed values into the draft before a re-render
    if (!form) return;
    if ($("fPerson")) form.person = $("fPerson").value;
    if ($("fFriend")) form.friend = $("fFriend").value;
    if ($("fNote")) form.note = $("fNote").value;
    if ($("fPrice")) form.price = $("fPrice").value;
    if ($("fDue")) form.due_on = $("fDue").value;
    if ($("fDate")) form.traded_on = $("fDate").value;
    if ($("fCash")) form.cash = $("fCash").value;
  };
  function wireForm(sh) {
    const changed = (key) => { keep(); renderSheet(); sh.querySelector(`[data-search="${key}"]`)?.focus(); };
    if (form.kind === "loan") {
      wirePicker(sh, "li", form.items, changed, form.direction === "lent");
      sh.querySelectorAll("[data-dir]").forEach((b) => b.onclick = () => { keep(); form.direction = b.dataset.dir; renderSheet(); });
    } else if (form.kind === "post") {
      wirePicker(sh, "bd", form.items, changed, form.post === "lend" || form.post === "sell");
      sh.querySelectorAll("[data-post]").forEach((b) => b.onclick = () => { keep(); form.post = b.dataset.post; renderSheet(); });
    } else {
      wirePicker(sh, "gv", form.gave, changed, true); wirePicker(sh, "gt", form.got, changed);
      sh.querySelectorAll("[data-cash]").forEach((b) => b.onclick = () => { keep(); form.cashMode = b.dataset.cash; renderSheet(); });
      $("fCash")?.addEventListener("input", () => { keep(); const p = form.cashMode === "paid" ? +form.cash || 0 : -(+form.cash || 0); $("fBalance").innerHTML = balanceHtml(form.gave, form.got, p); });
    }
    sh.querySelectorAll("[data-with]").forEach((b) => b.onclick = () => { keep(); form.withSite = b.dataset.with === "site"; renderSheet(); });
    $("fFriend")?.addEventListener("change", () => { keep(); renderSheet(); });
    const close = () => { form = null; sh.close(); };
    $("fCancel").onclick = close; $("fClose").onclick = close;
    $("fSave").onclick = saveForm;
  }

  // ---------- page ----------
  function render() {
    const app = $("app");
    if (!me) {
      $("headActions").innerHTML = "";
      app.innerHTML = `<div class="empty"><img src="../ui/assets/empty/signedout.svg" alt=""><b>${Tx("Sign in to lend and trade with friends")}</b><p>${Tx("Use your e-mail. We send a 6-digit code, no password.")}</p><button type="button" class="btn primary" id="signIn">${Tx("Sign in")}</button></div>`;
      $("signIn").onclick = () => window.INKWELL_SIGNIN?.();
      return;
    }
    const wl = waitingLoans().length, wt = waitingTrades().length, pc = pendingColl().length;
    window.INKWELL_SHELL_BADGE?.(wl + wt);
    const waitingHere = tab === "loans" ? wl : tab === "trades" ? wt : 0;
    const [act, icon, label] = tab === "loans" ? ["newLoan", "loan", "New loan"] : tab === "trades" ? ["newTrade", "trades", "New trade"] : ["newPost", "plus", "New post"];
    $("headActions").innerHTML = `<button type="button" class="btn${waitingHere ? "" : " primary"}" id="${act}"><i class="ic i-${icon}"></i>${Tx(label)}</button>`;
    const count = (n) => (n ? `<span class="count">${n}</span>` : "");
    app.innerHTML = `<div class="tabs" role="tablist" aria-label="${Tx("Loans and trades")}">${[["loans", "Loans", wl], ["trades", "Trades", wt + pc], ["board", "Board", 0]].map(([k, l, n]) => `<button type="button" class="tab" role="tab" id="tab-${k}" data-tab="${k}" aria-selected="${tab === k}" aria-controls="tabBody">${Tx(l)}${count(n)}</button>`).join("")}</div>
      <div id="tabBody" role="tabpanel" aria-labelledby="tab-${tab}">${tab === "loans" ? loansHtml() : tab === "trades" ? tradesHtml() : boardHtml()}</div>`;
    const t = app.querySelector(".tab[aria-selected=true]"), tabs = app.querySelector(".tabs");
    if (t && tabs) tabs.scrollLeft = Math.max(0, t.offsetLeft - 16);
    wire(app);
    renderSheet();
  }
  async function confirmThen(btn, label, action) {
    if (btn.dataset.c !== "1") {
      btn.dataset.c = "1"; const old = btn.innerHTML; btn.textContent = Tx(label);
      setTimeout(() => { if (btn.isConnected && btn.dataset.c === "1" && !btn.disabled) { btn.dataset.c = ""; btn.innerHTML = old; } }, 4000);
      return;
    }
    btn.disabled = true; btn.setAttribute("aria-busy", "true");
    try { await action(); await refresh(); } catch { btn.disabled = false; btn.removeAttribute("aria-busy"); btn.textContent = Tx("Couldn't save. Try again."); }
  }
  const now = (btn, action) => { btn.dataset.c = "1"; return confirmThen(btn, "", action); };
  function wire(app) {
    app.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { tab = b.dataset.tab; form = null; try { sessionStorage.setItem("inkwell-trades-tab", tab); } catch { /* */ } render(); });
    $("newLoan")?.addEventListener("click", () => { form = newLoanForm(); renderSheet(); });
    $("newTrade")?.addEventListener("click", () => { form = newTradeForm(); renderSheet(); });
    $("newPost")?.addEventListener("click", () => { form = newPostForm(); renderSheet(); });
    $("toggleReturned")?.addEventListener("click", () => { showReturned = !showReturned; render(); });
    app.querySelectorAll("[data-ul]").forEach((b) => b.onclick = () => {
      const [id, status] = b.dataset.ul.split(":");
      const body = { status };
      const d = app.querySelector(`[data-uldate="${id}"]`)?.value;
      if (status === "delivered") body.delivered_on = d || today();
      if (status === "returned") body.returned_on = d || today();
      const go = () => CLOUD.api(`user_loans?id=eq.${id}`, { method: "PATCH", prefer: "return=minimal", body });
      if (status === "cancelled" || status === "declined") confirmThen(b, status === "declined" ? "Confirm decline" : "Confirm cancel", go);
      else now(b, go);
    });
    app.querySelectorAll("[data-uldel]").forEach((b) => b.onclick = () => confirmThen(b, "Confirm delete", () => CLOUD.api(`user_loans?id=eq.${b.dataset.uldel}`, { method: "DELETE" })));
    app.querySelectorAll("[data-return]").forEach((b) => b.onclick = () => confirmThen(b, "Confirm returned", () => CLOUD.api(`loans?id=eq.${b.dataset.return}`, { method: "PATCH", prefer: "return=minimal", body: { returned_at: new Date().toISOString() } })));
    app.querySelectorAll("[data-delloan]").forEach((b) => b.onclick = () => confirmThen(b, "Confirm delete", () => CLOUD.api(`loans?id=eq.${b.dataset.delloan}`, { method: "DELETE" })));
    app.querySelectorAll("[data-deltrade]").forEach((b) => b.onclick = () => confirmThen(b, "Confirm delete", () => CLOUD.api(`trades?id=eq.${b.dataset.deltrade}`, { method: "DELETE" })));
    app.querySelectorAll("[data-ut]").forEach((b) => b.onclick = () => {
      const [id, status] = b.dataset.ut.split(":");
      const body = { status };
      if (status === "completed") body.completed_on = app.querySelector(`[data-utdate="${id}"]`)?.value || today();
      const go = () => CLOUD.api(`user_trades?id=eq.${id}`, { method: "PATCH", prefer: "return=minimal", body });
      if (status === "cancelled" || status === "declined") confirmThen(b, status === "declined" ? "Confirm decline" : "Confirm cancel", go);
      else now(b, go);
    });
    app.querySelectorAll("[data-utdel]").forEach((b) => b.onclick = () => confirmThen(b, "Confirm delete", () => CLOUD.api(`user_trades?id=eq.${b.dataset.utdel}`, { method: "DELETE" })));
    const decide = (b, apply) => {
      const [kind, id] = (apply ? b.dataset.capply : b.dataset.cskip).split(":");
      now(b, async () => {
        try { await applyTrade(kind, id, apply); }
        catch (e) { if (e?.message === "no-profile") b.closest("[data-cprompt]").querySelector(".cp-text").textContent = Tx("No Inkwell collection to update."); throw e; }
      });
    };
    app.querySelectorAll("[data-capply]").forEach((b) => b.onclick = () => decide(b, true));
    app.querySelectorAll("[data-cskip]").forEach((b) => b.onclick = () => decide(b, false));
    app.querySelectorAll(".autoColl").forEach((c) => c.onchange = async () => {
      autoColl = c.checked;
      app.querySelectorAll(".autoColl").forEach((x) => { x.checked = autoColl; });
      try { await CLOUD.api(`profiles?user_id=eq.${me.id}`, { method: "PATCH", prefer: "return=minimal", body: { auto_collection: autoColl } }); } catch { /* kept for this visit */ }
      if (autoColl && await autoApply()) await refresh();
    });
    app.querySelectorAll("[data-bkind]").forEach((b) => b.onclick = () => { boardKind = b.dataset.bkind; render(); });
    $("boardQ")?.addEventListener("input", (e) => { boardQ = e.target.value; render(); const i = $("boardQ"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); });
    app.querySelectorAll("[data-dellist]").forEach((b) => b.onclick = () => confirmThen(b, "Confirm delete", () => CLOUD.api(`listings?id=eq.${b.dataset.dellist}`, { method: "DELETE" })));
    app.querySelectorAll("[data-addfriend]").forEach((b) => b.onclick = () => now(b, () => CLOUD.api("friendships", { method: "POST", prefer: "return=minimal", body: { addressee: b.dataset.addfriend } })));
    app.querySelectorAll("[data-bact]").forEach((b) => b.onclick = () => {
      const [act, id] = b.dataset.bact.split(":"), l = listings.find((x) => x.id === id);
      if (!l) return;
      const item = { card_id: l.card_id, qty: l.qty, foil: !!l.foil };
      if (act === "ask" || act === "offer") { tab = "loans"; form = { ...newLoanForm(), withSite: true, friend: l.user_id, direction: act === "ask" ? "borrowed" : "lent", items: [item] }; }
      else {
        const cash = l.price_brl != null ? String(+l.price_brl * l.qty) : "";
        tab = "trades"; form = { ...newTradeForm(), withSite: true, friend: l.user_id, ...(act === "buy" ? { got: [item], cashMode: "paid" } : { gave: [item], cashMode: "received" }), cash };
      }
      try { sessionStorage.setItem("inkwell-trades-tab", tab); } catch { /* */ }
      render();
    });
  }
  function overStock(items) {   // a card asked for more copies than are free
    const st = stock(); if (!st.has) return null;
    return items.find((e, i) => i === items.findIndex((x) => x.card_id === e.card_id && !!x.foil === !!e.foil) && inForm(items, e.card_id, e.foil) > freeOf(st, e.card_id, e.foil)) || null;
  }
  async function saveForm() {
    keep();
    const msg = $("fMsg"), f = form;
    const over = overStock(f.kind === "loan" ? (f.direction === "lent" ? f.items : []) : f.kind === "post" ? (f.post === "lend" || f.post === "sell" ? f.items : []) : f.gave);
    if (over) { msg.textContent = Tx("{card}: you only have {n} available.", { card: cardLabel(over.card_id), n: freeOf(stock(), over.card_id, over.foil) }); return; }
    const person = (f.person || "").trim();
    const busy = () => { $("fSave").disabled = true; $("fSave").setAttribute("aria-busy", "true"); };
    try {
      if (f.kind === "loan" && f.withSite) {
        const items = cleanItems(f.items);
        if (!f.friend) { msg.textContent = Tx("Choose a friend."); return; }
        if (!items.length) { msg.textContent = Tx("Add at least one card and the person's name."); return; }
        busy();
        const lending = f.direction === "lent";
        await CLOUD.api("user_loans", { method: "POST", prefer: "return=minimal", body: { lender: lending ? me.id : f.friend, borrower: lending ? f.friend : me.id, created_by: me.id, items, due_on: f.due_on || null, note: (f.note || "").slice(0, 500) } });
      } else if (f.kind === "loan") {
        const items = cleanItems(f.items);
        if (!person || !items.length) { msg.textContent = Tx("Add at least one card and the person's name."); return; }
        busy();
        await CLOUD.api("loans", { method: "POST", prefer: "return=minimal", body: { direction: f.direction, person, items, due_on: f.due_on || null, note: (f.note || "").slice(0, 500) } });
      } else if (f.kind === "post") {
        const items = cleanItems(f.items);
        if (!items.length) { msg.textContent = Tx("Add at least one card."); return; }
        const price = (f.post === "buy" || f.post === "sell") && f.price !== "" && +f.price >= 0 ? Math.round(+f.price * 100) / 100 : null;
        busy();
        await CLOUD.api("listings", { method: "POST", prefer: "return=minimal", body: items.map((e) => ({ kind: f.post, card_id: e.card_id, qty: e.qty, foil: e.foil, price_brl: price, note: (f.note || "").slice(0, 200) })) });
      } else if (f.withSite) {
        const gave = cleanItems(f.gave), got = cleanItems(f.got);
        if (!f.friend) { msg.textContent = Tx("Choose a friend."); return; }
        if (!gave.length && !got.length) { msg.textContent = Tx("Add at least one card and the person's name."); return; }
        const cash = f.cashMode === "paid" ? +f.cash || 0 : f.cashMode === "received" ? -(+f.cash || 0) : 0;
        busy();
        await CLOUD.api("user_trades", { method: "POST", prefer: "return=minimal", body: { proposer: me.id, partner: f.friend, gave, got, cash_brl: Math.round(cash * 100) / 100, note: (f.note || "").slice(0, 500) } });
      } else {
        const gave = cleanItems(f.gave), got = cleanItems(f.got);
        if (!person || !gave.length && !got.length) { msg.textContent = Tx("Add at least one card and the person's name."); return; }
        const cash = f.cashMode === "paid" ? +f.cash || 0 : f.cashMode === "received" ? -(+f.cash || 0) : 0;
        busy();
        await CLOUD.api("trades", { method: "POST", prefer: "return=minimal", body: { person, traded_on: f.traded_on || today(), gave, got, cash_brl: Math.round(cash * 100) / 100, note: (f.note || "").slice(0, 500) } });
      }
      form = null;
      await refresh();
    } catch { msg.textContent = Tx("Couldn't save. Try again."); $("fSave").disabled = false; $("fSave").removeAttribute("aria-busy"); }
  }
  async function refresh() { await loadAll(); if (await autoApply()) await loadAll(); render(); }

  // ---------- boot ----------
  document.title = `${Tx("Loans and trades")} · Inkwell`;
  $("title").textContent = Tx("Loans and trades");
  $("sub").textContent = Tx("Between friends, with dates and a clear deal.");
  document.documentElement.lang = LOC;
  $("formSheet").addEventListener("close", () => { if (form) { form = null; } });
  $("formSheet").addEventListener("cancel", () => { form = null; });
  $("formSheet").addEventListener("click", (e) => { if (e.target === $("formSheet")) { form = null; $("formSheet").close(); } });
  if (!me) { render(); return; }
  $("app").innerHTML = `<div class="stack"><span class="skel" style="height:44px"></span><span class="skel" style="height:160px;border-radius:var(--r-lg)"></span><span class="skel" style="height:160px;border-radius:var(--r-lg)"></span></div><p class="sr-only">${Tx("Loading…")}</p>`;
  const go = () => refresh().catch(() => {
    $("app").innerHTML = `<div class="empty"><img src="../ui/assets/empty/error.svg" alt=""><b>${Tx("Couldn't load your data.")}</b><p>${Tx("Check your connection and try again.")}</p><button type="button" class="btn" id="retry"><i class="ic i-refresh"></i>${Tx("Try again")}</button></div>`;
    $("retry").onclick = go;
  });
  go();
})();
</script>

<script>window.INKWELL_SHELL = {"page": "trades"};
/*@SHELL_JS@*/</script>
</body>
