    const draw = () => {
      sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="shT">${Tx("Members")}</h2><button type="button" class="btn ghost icon" data-close aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>
        <div class="sheet-body"><p class="small muted" style="margin:0 0 var(--sp-3)">${Tx(owner ? "Admins edit the details and moderate, like you. Only the owner picks admins and can hand the community to someone else." : "Admins edit the details and moderate. The owner picks the admins.")}</p>
        ${view.access ? `<div class="field" style="margin-bottom:var(--sp-3)">${Tx("Who can join")}<div class="seg block" role="group" data-testid="join-mode">${[["open", "Anyone 18+"], ["approval", "With approval"]].map(([k, l]) => `<button type="button" data-mode="${k}" aria-pressed="${view.access.join_mode === k}">${Tx(l)}</button>`).join("")}</div></div>` : ""}
        ${view.access?.requests?.length ? `<h3 style="margin:0 0 var(--sp-2)">${Tx("Requests")} <span class="count">${view.access.requests.length}</span></h3><div class="list" data-testid="requests" style="margin-bottom:var(--sp-4)">${view.access.requests.map((r) => `<div class="list-row flat" data-req="${esc(r.uid)}"><span class="t"><span>${r.handle ? `<a href="../perfil/?u=${encodeURIComponent(r.handle)}">${esc(r.name || "?")}</a>` : esc(r.name || "?")}</span></span><span class="row" style="gap:6px"><button type="button" class="btn small ghost" data-ans="${esc(r.uid)}:0">${Tx("Decline")}</button><button type="button" class="btn small primary" data-ans="${esc(r.uid)}:1">${Tx("Accept")}</button></span></div>`).join("")}</div>` : ""}
        <div class="list" data-testid="manage">${(view.manage || []).map((x) => { const self = x.uid === me?.id, u = esc(x.uid);
          const btns = x.role === "owner" || self ? "" : [
            owner ? `<button type="button" class="btn small" data-role="${u}:${x.role === "admin" ? "member" : "admin"}">${Tx(x.role === "admin" ? "Remove admin" : "Make admin")}</button>` : "",
            owner && x.adult ? `<button type="button" class="btn small ghost" data-own="${u}">${armed === "own:" + x.uid ? Tx("Tap again: they become the owner") : Tx("Make owner")}</button>` : "",
            owner || x.role === "member" ? `<button type="button" class="btn small ghost" data-rm="${u}">${armed === "rm:" + x.uid ? Tx("Tap again to confirm") : Tx("Remove")}</button>` : ""].join("");
          return `<div class="list-row flat" data-member="${u}"><span class="t"><span>${esc(x.name || "?")}${self ? ` · ${Tx("you")}` : ""}</span><span class="meta">${roleName(x.role)}</span></span><span class="row" style="gap:6px;flex-wrap:wrap;justify-content:flex-end">${btns}</span></div>`; }).join("")}</div></div>`;
      sh.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => sh.close());
      const run = async (fn, msg) => {
        try { await fn(); armed = null; await reloadView(); if (view.role !== "owner" && view.role !== "admin") sh.close(); else draw(); drawOne(); toast(msg || Tx("Done")); }
        catch { armed = null; draw(); toast(Tx("Couldn't send. Try again."), true); }
      };
      sh.querySelectorAll("[data-rm]").forEach((b) => b.onclick = () => {
        const uid = b.dataset.rm; if (armed !== "rm:" + uid) { armed = "rm:" + uid; draw(); return; }
        run(() => rpc("moderate_community", { p_action: "remove_member", p_slug: view.slug, p_user: uid }));
      });
      sh.querySelectorAll("[data-mode]").forEach((b) => b.onclick = () => run(() => rpc("set_community_join_mode", { p_slug: view.slug, p_mode: b.dataset.mode })));
      sh.querySelectorAll("[data-ans]").forEach((b) => b.onclick = () => { const [uid, a] = b.dataset.ans.split(":"); run(() => rpc("answer_community_request", { p_slug: view.slug, p_user: uid, p_accept: a === "1" })); });
      sh.querySelectorAll("[data-role]").forEach((b) => b.onclick = () => { const [uid, r] = b.dataset.role.split(":"); run(() => rpc("set_community_role", { p_slug: view.slug, p_user: uid, p_role: r })); });
      sh.querySelectorAll("[data-own]").forEach((b) => b.onclick = () => {
        const uid = b.dataset.own; if (armed !== "own:" + uid) { armed = "own:" + uid; draw(); return; }
        run(() => rpc("transfer_community", { p_slug: view.slug, p_user: uid }), Tx("Ownership handed over. You stay as admin."));
      });
    };
    draw(); sh.showModal();
  }
  // invite my Inkwell friends who aren't members yet; they get a notice (supabase/community_invites.sql)
  async function openInvite() {
    const sh = $("sheet");
    let friends = [];
    try { friends = (await rpc("my_friends")) || []; } catch { friends = []; }
    const members = new Set((view.manage || []).map((m) => m.uid)), invited = new Set(view.access?.invites || []);
    const draw = () => {
      const list = friends.filter((f) => !members.has(f.id));
      sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="shT">${Tx("Invite friends")}</h2><button type="button" class="btn ghost icon" data-close aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>
        <div class="sheet-body"><p class="small muted" style="margin:0 0 var(--sp-3)">${Tx("They get a notice and join without waiting for approval. Someone who isn't on Inkwell yet: send the community link.")}</p>
        ${list.length ? `<div class="list" data-testid="invite-list">${list.map((f) => `<div class="list-row flat"><span class="t"><span>${esc(f.name || "?")}</span>${f.handle ? `<span class="meta">@${esc(f.handle)}</span>` : ""}</span>${invited.has(f.id) ? `<span class="small muted">${Tx("Invited")}</span>` : `<button type="button" class="btn small" data-inv="${esc(f.id)}"><i class="ic i-user-plus"></i>${Tx("Invite")}</button>`}</div>`).join("")}</div>`
          : `<p class="muted">${Tx("All your friends are already here, or you have no friends on Inkwell yet.")}</p>`}
        <div class="row" style="margin-top:var(--sp-4)"><button type="button" class="btn ghost" id="invShare"><i class="ic i-send"></i>${Tx("Share the community link")}</button></div></div>`;
      sh.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => sh.close());
      sh.querySelectorAll("[data-inv]").forEach((b) => b.onclick = async () => {
        b.disabled = true;
        try { await rpc("invite_to_community", { p_slug: view.slug, p_user: b.dataset.inv }); invited.add(b.dataset.inv); (view.access.invites ||= []).push(b.dataset.inv); draw(); }
        catch { b.disabled = false; toast(Tx("Couldn't send. Try again."), true); }
      });
      $("invShare").onclick = () => $("share")?.click();
    };
    draw(); sh.showModal();
  }
  function openReport(id) {
    const sh = $("sheet");
    sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="shT">${Tx("Report")}</h2><button type="button" class="btn ghost icon" data-close aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>
      <div class="sheet-body"><label class="field">${Tx("Why are you reporting this message?")}<textarea id="rpWhy" maxlength="300" rows="3"></textarea></label><p class="small" id="rpMsg" role="alert"></p></div>
      <div class="sheet-foot"><button type="button" class="btn ghost" data-close>${Tx("Cancel")}</button><button type="button" class="btn primary" id="rpSend">${Tx("Send report")}</button></div>`;
    sh.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => sh.close());
    $("rpSend").onclick = async () => { const why = $("rpWhy").value.trim(); if (why.length < 3) { $("rpWhy").focus(); return; }
      try { await rpc("report_community_post", { p_post: id, p_reason: why }); sh.close(); toast(Tx("Report sent. Thank you.")); } catch { $("rpMsg").textContent = Tx("Couldn't send. Try again."); } };
    sh.showModal(); setTimeout(() => $("rpWhy").focus(), 30);
  }

  function emptyBox(img, title, text, extra = "") { return `<div class="empty"><img src="../ui/assets/empty/${img}.svg" alt=""><b>${esc(title)}</b><p>${esc(text)}</p>${extra}</div>`; }
  let toastTimer = null;
  function toast(text, err) { const t = $("toast"); t.className = `toast${err ? " err" : ""}`; t.innerHTML = `<i class="ic ${err ? "i-alert" : "i-check"}"></i><span>${esc(text)}</span>`; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 5000); }

  document.documentElement.lang = LOC;
  $("app").innerHTML = `<div class="skel" style="height:220px;border-radius:20px"></div><p class="sr-only">${Tx("Loading…")}</p>`;
  (async () => {
    if (me) { try { mine = await CLOUD.api("rpc/my_profile", { method: "POST", body: {} }); } catch { mine = null; } }
    try { if (slugQ) await showOne(slugQ); else await showList(); }
    catch { $("app").innerHTML = emptyBox("error", Tx("Couldn't load."), Tx("Check your connection and try again."), `<button type="button" class="btn" onclick="location.reload()">${Tx("Try again")}</button>`); }
  })();
})();
</script>

<script>window.INKWELL_SHELL = {"page": "communities"};
/*@SHELL_JS@*/</script>
