      sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><div><h2 id="cT">${esc(a)}${b ? ` · ${esc(b)}` : ""}</h2><div class="sub">${esc(setName(c.set))} · nº ${esc(c.num)}</div></div><button type="button" class="btn ghost icon" data-close aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>
        <div class="sheet-body">${thumb(c, "big", o.f > 0)}</span>
          <div class="row" style="gap:var(--sp-2)">${inkDots(c)}<span class="small muted">${esc([inksOf(c).join("/"), c.cost != null ? Tx("cost {c}", { c: c.cost }) : "", rarName(c.rarity)].filter(Boolean).join(" · "))}</span></div>

          <p class="small faint" style="margin:var(--sp-3) 0 0">${Tx("Changes save right away. You can undo from the notice at the bottom.")}</p></div>
        <div class="sheet-foot"><a class="btn" href="../trades/?tab=board&q=${encodeURIComponent(a)}"><i class="ic i-board"></i>${Tx("Post on the board")}</a></div>`;
      sh.querySelectorAll("[data-close]").forEach((x) => x.onclick = () => sh.close());
      sh.querySelectorAll("[data-d]").forEach((x) => x.onclick = () => {
        const [k, d, place] = x.dataset.d.split(":"), pl = place || "binder";
        if (+d > 0 && lstate() && !readOnly()) {
          const add = lg.add || (askLang() ? null : lastLang || defLang());
          if (!add) { lg.pend = { k, place: pl }; lg.rm = null; draw(); sh.querySelector("[data-lg-add]")?.focus(); return; }
          lastLang = add; change(id, k, 1, false, pl, add);
        } else if (+d < 0 && CL?.removeChoice(coll()[id], k)) {
          lg.rm = { k, place: pl, choice: CL.removeChoice(coll()[id], k) }; lg.pend = null; draw(); sh.querySelector("[data-lg-rm]")?.focus(); return;
        } else change(id, k, +d, false, pl);
        lg.rm = null; lg.pend = null; draw(); sh.querySelector(`[data-d="${x.dataset.d}"]`)?.focus();
      });
      sh.querySelectorAll("[data-lg-add]").forEach((x) => x.onclick = () => {
        const val = x.dataset.lgAdd; lg.add = val; lastLang = val;
        if (lg.pend) { const pe = lg.pend; lg.pend = null; change(id, pe.k, 1, false, pe.place, val); }
        draw(); sh.querySelector(`[data-lg-add="${val}"]`)?.focus();
      });
      sh.querySelectorAll("[data-lg-rm]").forEach((x) => x.onclick = () => { const r = lg.rm; lg.rm = null; change(id, r.k, -1, false, r.place, x.dataset.lgRm); draw(); });
      sh.querySelector("[data-lg-rmx]")?.addEventListener("click", () => { lg.rm = null; draw(); });
      sh.querySelector("[data-lg-edit]")?.addEventListener("click", () => { lg.edit = JSON.parse(JSON.stringify(CL.split(coll()[id]).l)); lg.rm = lg.pend = lg.saved = null; draw(); sh.querySelector("[data-le]")?.focus(); });
      sh.querySelectorAll("[data-le]").forEach((x) => x.onclick = () => {
        const [l2, k, d] = x.dataset.le.split(":"), e = lg.edit[l2] = { ...(lg.edit[l2] || {}) }; e[k] = Math.max(0, (e[k] || 0) + +d);
        draw(); (sh.querySelector(`[data-le="${x.dataset.le}"]:not([disabled])`) || sh.querySelector("[data-lg-save]"))?.focus();

      sh.querySelector("[data-lg-cancel]")?.addEventListener("click", () => { lg.edit = null; draw(); });

      sh.querySelector("[data-lg-save]")?.addEventListener("click", async (ev) => {

        clearTimeout(pendingTimer); if (!(await flush(true))) { draw(); return; }   // the quantities first, then the split
        const p = prof(), op = newOpId();

          const r = await rpc("set_card_langs", { p_owner: ownerOf(p), p_profile: pnameOf(p), p_card_id: id, p_langs: lg.edit, p_op: op });
          if (r?.entry) p.collection[id] = r.entry;
          const st = lstate(); if (st && r?.revision != null) st.revision = r.revision;
          lg.edit = null; lg.saved = op; draw(); sh.querySelector("[data-lg-undo]")?.focus();
        } catch (e) {
          toast(/too_many/.test(String(e?.why || e?.message)) ? P("A carta mudou: são menos cópias agora. Confira e salve de novo.", "The card changed: fewer copies now. Check and save again.") : Tx("Couldn't save. Try again."), null, true);
          await reloadColl(p).catch(() => {}); draw();
        }
      });
      sh.querySelectorAll("[data-open-place]").forEach((x) => x.onclick = () => { const k = x.dataset.openPlace; openPlaces.add(k); draw(); sh.querySelector(`[data-d="n:1:${k}"]`)?.focus(); });
      sh.querySelectorAll("[data-undeck]").forEach((x) => x.onclick = async () => {
        const deck = x.dataset.undeck; if (undeckArmed !== deck) { undeckArmed = deck; draw(); return; }
        undeckArmed = null; x.disabled = true;
        const p = prof(), name = deckedOf(id).decks.find((y) => y.id === deck)?.name || "";
        try {
          await CLOUD.api("rpc/build_deck", { method: "POST", prefer: "return=minimal", body: { p_owner: p.shared ? p.owner : null, p_profile: p.shared ? p.pname : p.profile, p_deck: deck, p_name: name, p_items: [], p_from_home: [] } });
          for (const [k, e] of [...DECKED]) { if (!k.startsWith(`${p.profile}|`)) continue; const rest = e.decks.filter((y) => y.id !== deck); if (rest.length === e.decks.length) continue;
            if (!rest.length) DECKED.delete(k); else DECKED.set(k, { n: rest.reduce((t, y) => t + y.n, 0), f: rest.reduce((t, y) => t + y.f, 0), decks: rest }); }
          toast(P(`${name || "Deck"}: as cartas voltaram para o fichário.`, `${name || "Deck"}: the cards are back in the binder.`)); draw();

      });
      sh.querySelectorAll("[data-mv]").forEach((x) => x.onclick = () => { const [k, to, fr] = x.dataset.mv.split(":"); mv = { k, to, from: fr || (to === "binder" ? "home" : "binder"), qty: 1, key: x.dataset.mv }; draw(); $("mvOk")?.focus(); });
      sh.querySelectorAll("[data-mq]").forEach((x) => x.onclick = () => {
        const max = where(id)[mv.from][mv.k];

        (sh.querySelector(`[data-mq="${x.dataset.mq}"]:not([disabled])`) || $("mvOk"))?.focus();

      $("aLoan")?.addEventListener("click", () => { const k = avail(id).n ? "n" : "f"; act = { kind: "loan", items: [{ id, k, qty: 1 }], person: "", due: "", note: "" }; draw(); });
      $("aSale")?.addEventListener("click", () => { const k = avail(id).n ? "n" : "f"; act = { kind: "sale", combo: false, items: [{ id, k, qty: 1, price: unitPrice(id, k) }], date: today(), buyer: "", total: null, q: "" }; draw(); });
      if (act) actPanel(sh, act, () => { act = null; draw(); });
      $("mvCancel")?.addEventListener("click", () => { const back = `[data-mv="${mv.key}"]`; mv = null; draw(); sh.querySelector(back)?.focus(); });
      $("mvOk")?.addEventListener("click", () => { const { k, to, from: fr, qty, key } = mv; mv = null; move(id, k, qty, to, false, fr); draw(); sh.querySelector(`[data-mv="${key}"]:not([disabled])`)?.focus(); });
    };
    draw(); redrawSheet = () => { if (sh.open) { mv = null; act = null; lg.pend = lg.rm = null; draw(); } };
    openSheet(sh, from);
    sh.addEventListener("close", () => { redrawSheet = null; renderAll(); }, { once: true });
  }
  // ---------- Emprestar / Vender / Venda combo (from the card sheet) ----------
  // A loan goes to Trocas → Empréstimos; a sale is a trade where you gave the cards and received money, each card
  // keeping its own price (trades.gave[].price) and the total allowing a discount. Sold cards leave the binder first, then home.
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const avail = (id) => { const w = where(id); return { n: w.binder.n + w.home.n, f: w.binder.f + w.home.f }; };   // what can leave (not lent)
  const unitPrice = (id, k) => { const v = priceOf(id, k === "f"); return v == null ? "" : (Math.round(v * 100) / 100).toFixed(2); };
  const num = (v) => { const x = parseFloat(String(v).replace(",", ".")); return Number.isFinite(x) ? x : 0; };
  // which language a lent or sold copy is: [] when the card has no languages, else the choices ("" = sem idioma)
  const langOpts = (id, k) => {
    if (!CL || !lstate()) return [];
    const sp = CL.split(coll()[id]), o = LANGS.filter((x) => (sp.l[x]?.[k] || 0) > 0).map((x) => ({ lang: x, max: sp.l[x][k] }));
    if (!o.length) return [];
    if (sp.unknown[k] > 0) o.unshift({ lang: "", max: sp.unknown[k] });
    return o;
  };
  const fitLang = (it) => { const o = langOpts(it.id, it.k); if (!o.length) { it.lang = null; return o; } if (!o.some((x) => x.lang === it.lang)) it.lang = o[0].lang; return o; };
  const maxOf = (it) => { const o = fitLang(it), m = avail(it.id)[it.k]; return o.length ? Math.min(m, o.find((x) => x.lang === it.lang).max) : m; };
  function actPanel(sh, a, close) {
    const box = $("actBox"), sale = a.kind === "sale";
    const sum = () => Math.round(a.items.reduce((t, it) => t + num(it.price) * it.qty, 0) * 100) / 100;
    const total = () => (a.total == null || a.total === "" ? sum() : num(a.total));
    const draw = () => {
      const item = (it, i) => {
        const c = BY.get(it.id), [nm, ver] = split(c?.name || it.id), av = avail(it.id), both = av.n > 0 && av.f > 0, lo = fitLang(it), max = maxOf(it);
        if (it.qty > max) it.qty = Math.max(1, max);
        return `<div class="act-item" data-i="${i}">
          <div class="row between" style="gap:var(--sp-2)"><div style="min-width:0"><b>${esc(nm)}</b>${ver ? ` <span class="small muted">${esc(ver)}</span>` : ""}<div class="small muted">${esc(setName(c?.set))} · nº ${esc(c?.num || "")}${!both ? " · " + Tx(it.k === "f" ? "foil" : "normal") : ""}</div></div>
            ${a.items.length > 1 ? `<button type="button" class="btn ghost icon small" data-rm="${i}" aria-label="${esc(Tx("Remove {c}", { c: nm }))}"><i class="ic i-close"></i></button>` : ""}</div>
          <div class="row" style="gap:var(--sp-2);flex-wrap:wrap;margin-top:6px">
            ${both ? `<div class="seg" role="group" aria-label="${Tx("Finish")}">${["n", "f"].map((k) => `<button type="button" ${k === "f" ? 'class="is-foil" ' : ""}data-fin="${i}:${k}" aria-pressed="${it.k === k}">${Tx(k === "f" ? "Foil" : "Normal")}</button>`).join("")}</div>` : ""}
            ${lo.length > 1 ? `<div class="seg" role="group" aria-label="${esc(P("Idioma", "Language"))}" data-testid="act-lang">${lo.map((x) => `<button type="button" data-alng="${i}:${x.lang}" aria-pressed="${it.lang === x.lang}">${esc(x.lang ? x.lang.toUpperCase() : P("sem idioma", "no language"))} <span class="muted">${x.max}</span></button>`).join("")}</div>` : lo.length === 1 && lo[0].lang ? `<span class="tag" data-testid="act-lang">${lo[0].lang.toUpperCase()}</span>` : ""}
            <div class="qty"><button type="button" data-q="${i}:-1" aria-label="${Tx("One less")}" ${it.qty <= 1 ? "disabled" : ""}>−</button><output data-qn="${i}">${it.qty}</output><button type="button" data-q="${i}:1" aria-label="${Tx("One more")}" ${it.qty >= max ? "disabled" : ""}>+</button></div>
            ${sale ? `<label class="field inline-field">${Tx("Each")}<span class="prefix"><span>R$</span><input type="text" inputmode="decimal" data-price="${i}" value="${esc(it.price)}" aria-label="${esc(Tx("Price of {c}", { c: nm }))}"></span></label>` : ""}
          </div></div>`;
      };
      const results = () => {
        const words = norm(a.q).split(" ").filter(Boolean); if (!words.length) return "";
        const rows = CARDS.filter((x) => (avail(x.id).n + avail(x.id).f) > 0 && words.every((w) => x.k.includes(w))).slice(0, 8);
        return rows.length ? rows.map((x) => { const [nm, ver] = split(x.name); return `<button type="button" class="list-row flat" data-add="${esc(x.id)}">${thumb(x, "xs", false)}</span><span class="t"><span>${esc(nm)}${ver ? ` · ${esc(ver)}` : ""}</span><span class="meta">${esc(setName(x.set))} · nº ${esc(x.num)}</span></span><i class="ic i-plus"></i></button>`; }).join("")
          : `<p class="small muted">${Tx("None of your cards match.")}</p>`;
      };
      box.innerHTML = `<div class="card inset stack actbox">
        <b>${sale ? Tx(a.combo ? "Combo sale" : "Sell") : Tx("New loan")}</b>
        ${sale ? `<label class="field">${Tx("Date")}<input type="date" id="aDate" value="${esc(a.date)}"></label>
            <label class="field">${Tx("Buyer (optional)")}<input type="text" id="aBuyer" maxlength="60" value="${esc(a.buyer)}"></label>`
          : `<label class="field">${Tx("Who is borrowing")}<input type="text" id="aPerson" maxlength="60" value="${esc(a.person)}" required></label>
            <label class="field">${Tx("Return by (optional)")}<input type="date" id="aDue" value="${esc(a.due)}"></label>`}
        <div class="act-items">${a.items.map(item).join("")}</div>
        ${sale && a.combo ? `<label class="field">${Tx("Add a card to the combo")}<input type="search" id="aQ" value="${esc(a.q)}" placeholder="${Tx("Search your cards")}" autocomplete="off"></label><div class="list tight" id="aRes">${results()}</div>` : ""}
        ${sale ? `<div class="act-sum"><div class="row between"><span class="muted">${Tx("Sum of the cards")}</span><b id="aSum">${esc(money(sum()))}</b></div>
            <label class="field">${Tx("Total of the sale")}<span class="prefix"><span>R$</span><input type="text" inputmode="decimal" id="aTotal" value="${esc(a.total ?? sum().toFixed(2))}"></span></label>
            <div class="row between" id="aDiscRow"></div></div>`
          : `<label class="field">${Tx("Note (optional)")}<input type="text" id="aNote" maxlength="300" value="${esc(a.note)}"></label>`}
        <p class="small" id="aMsg" role="status" aria-live="polite"></p>
        <div class="row act-foot"><button type="button" class="btn" id="aCancel">${Tx("Cancel")}</button>
          ${sale && !a.combo ? `<button type="button" class="btn" id="aCombo">${Tx("Combo sale")}</button>` : ""}
          <button type="button" class="btn primary" id="aOk">${sale ? Tx("Sell") : Tx("Lend")}</button></div></div>`;
      upd();
      wire();
    };
    const upd = () => {   // totals and discount, without redrawing (keeps the cursor in the field)
      if (!sale) return;
      const s = sum(), t = total(), d = Math.round((s - t) * 100) / 100;
      $("aSum").textContent = money(s);
      $("aDiscRow").innerHTML = d ? `<span class="muted">${Tx(d > 0 ? "Discount" : "Extra")}</span><b class="${d > 0 ? "good" : ""}" data-testid="discount">${esc(money(Math.abs(d)))}${s > 0 && d > 0 ? ` · ${Math.round((100 * d) / s)}%` : ""}</b>` : "";
    };
    const wire = () => {
      const on = (sel, ev, fn) => box.querySelectorAll(sel).forEach((x) => x.addEventListener(ev, fn));
      $("aCancel").onclick = close;
      $("aCombo")?.addEventListener("click", () => { a.combo = true; draw(); $("aQ")?.focus(); });
      $("aDate")?.addEventListener("input", (e) => { a.date = e.target.value; });
      $("aBuyer")?.addEventListener("input", (e) => { a.buyer = e.target.value; });
      $("aPerson")?.addEventListener("input", (e) => { a.person = e.target.value; });
      $("aDue")?.addEventListener("input", (e) => { a.due = e.target.value; });
      $("aNote")?.addEventListener("input", (e) => { a.note = e.target.value; });
      $("aTotal")?.addEventListener("input", (e) => { a.total = e.target.value; upd(); });
      $("aQ")?.addEventListener("input", (e) => { a.q = e.target.value; $("aRes").innerHTML = ""; const keep = e.target.selectionStart; draw(); const q = $("aQ"); q.focus(); q.setSelectionRange(keep, keep); });
      on("[data-price]", "input", (e) => { a.items[+e.target.dataset.price].price = e.target.value; if (a.total == null) $("aTotal").value = sum().toFixed(2); upd(); });
      on("[data-q]", "click", (e) => { const [i, d] = e.currentTarget.dataset.q.split(":"), it = a.items[+i]; it.qty = Math.max(1, Math.min(maxOf(it), it.qty + +d)); draw(); });
      on("[data-fin]", "click", (e) => { const [i, k] = e.currentTarget.dataset.fin.split(":"), it = a.items[+i]; it.k = k; it.lang = undefined; it.qty = Math.min(it.qty, maxOf(it)) || 1; it.price = unitPrice(it.id, k); draw(); });
      on("[data-alng]", "click", (e) => { const [i, l2] = e.currentTarget.dataset.alng.split(":"), it = a.items[+i]; it.lang = l2; it.qty = Math.min(it.qty, maxOf(it)) || 1; draw(); });
      on("[data-rm]", "click", (e) => { a.items.splice(+e.currentTarget.dataset.rm, 1); draw(); });
      on("[data-add]", "click", (e) => {
        const id = e.currentTarget.dataset.add, av = avail(id), k = av.n ? "n" : "f", have = a.items.find((x) => x.id === id && x.k === k);
        if (have) have.qty = Math.min(av[k], have.qty + 1); else a.items.push({ id, k, qty: 1, price: unitPrice(id, k) });

    const fail = (t) => { $("aMsg").textContent = t; $("aMsg").className = "small bad"; };
    async function doLoan() {
      const person = a.person.trim(); if (!person) return fail(Tx("Write who is borrowing."));
      const it = a.items[0], w = where(it.id), need = it.qty - w.binder[it.k];   // a loan leaves from the binder: bring the rest from home first
      $("aOk").disabled = true;

        if (need > 0) { bump(it.id, it.k, 0, -need, true); clearTimeout(pendingTimer); if (!(await flush(true))) throw new Error("move"); }
        const item = { card_id: it.id, qty: it.qty, foil: it.k === "f", ...(it.lang ? { lang: it.lang } : {}) };   // the copy lent keeps its language
        await CLOUD.api("loans", { method: "POST", prefer: "return=minimal", body: { direction: "lent", person, items: [item], due_on: a.due || null, note: a.note.trim().slice(0, 500) } });
        const m = it.k === "f" ? lentF : lentN; m.set(it.id, (m.get(it.id) || 0) + it.qty);
        (lentWho.get(it.id) || lentWho.set(it.id, []).get(it.id)).push({ who: person, qty: it.qty, foil: it.k === "f", lang: it.lang || null, due: a.due || null, friend: false });
        toast(Tx("Loan saved")); close();
      } catch { $("aOk").disabled = false; fail(Tx("Couldn't save. Try again.")); }
    }
    async function doSale() {
      const t = total();
      if (!a.items.length) return fail(Tx("Add at least one card."));
      if (!(t >= 0) || String(a.total ?? "0").trim() === "") return fail(Tx("Write the total of the sale."));
      for (const it of a.items) if (maxOf(it) < it.qty) return fail(Tx("You don't have that many to sell."));
      $("aOk").disabled = true;
      try {
        for (const it of a.items) { fitLang(it); const w = where(it.id), fromBinder = Math.min(it.qty, w.binder[it.k]); bump(it.id, it.k, -it.qty, -(it.qty - fromBinder), true, 0, it.lang || null); }
        clearTimeout(pendingTimer);
        if (!(await flush(true))) throw new Error("collection");
        const gave = a.items.map((it) => ({ card_id: it.id, qty: it.qty, foil: it.k === "f", ...(it.lang ? { lang: it.lang } : {}), price: Math.round(num(it.price) * 100) / 100 }));
        const d = Math.round((sum() - t) * 100) / 100;
        const note = [Tx(a.items.length > 1 || a.combo ? "Combo sale" : "Sale"), d > 0 ? Tx("discount {v}", { v: money(d) }) : d < 0 ? Tx("extra {v}", { v: money(-d) }) : ""].filter(Boolean).join(" · ");
        await CLOUD.api("trades", { method: "POST", prefer: "return=minimal", body: { person: (a.buyer.trim() || Tx("Sale")).slice(0, 60), traded_on: a.date || today(), gave, got: [], cash_brl: -Math.round(t * 100) / 100, note, collection: "applied" } });

  }
  // place: where the copies are added or removed ("binder" or "home"). Lent copies are changed in Trocas.
  // lng: the language of the copies added or removed (null: "sem idioma", or for a removal "whichever is certain")
  function change(id, kind, delta, quiet, place = "binder", lng = null) {
    const w = where(id), pl = ["home", "trade"].includes(place) ? place : "binder";
    if (delta < 0 && w[pl][kind] + delta < 0) return;
    bump(id, kind, delta, pl === "home" ? delta : 0, quiet, pl === "trade" ? delta : 0, lng);
  }
  // Move copies between the binder, home and the trade binder: what you own stays the same.
  function move(id, kind, qty, to, quiet, from) {
    const w = where(id); from = from || (to === "binder" ? "home" : "binder");
    if (qty <= 0 || from === to || w[from][kind] < qty) return;
    const d = (pl) => (to === pl ? qty : from === pl ? -qty : 0);
    bump(id, kind, 0, d("home"), quiet, d("trade"));
  }
  function bump(id, kind, dTotal, dHome, quiet, dTrade = 0, lng = null) {
    if (readOnly()) { toast(P("Esta coleção é só para ver.", "This collection is view only."), null, true); return; }
    const p = prof(); if (!p) { toast(Tx("Couldn't save. Try again."), null, true); if ($("scan").open) scanSay(Tx("Couldn't save. Try again."), true); return; }
    if (dTotal) {
      // the same rule as the server (supabase/card_langs.sql): a removal that could take either of two languages asks first
      let next;
      try { next = langApply(p.collection[id], kind, dTotal, lng); } catch { toast(langAskText(), null, true); return; }
      p.collection[id] = next;
      if (dTotal > 0) ADDED.set(`${p.profile}|${id}`, Date.now());
    }
    if (dHome) {
      const hk = `${p.profile}|${id}`, h = HOME.get(hk) || { n: 0, f: 0 };
      h[kind] = Math.max(0, h[kind] + dHome); HOME.set(hk, h);
    }
    if (dTrade) {
      const tk = `${p.profile}|${id}`, t = TRADE.get(tk) || { n: 0, f: 0 };
      t[kind] = Math.max(0, t[kind] + dTrade); TRADE.set(tk, t);
    }
    const key = `${id}:${kind}:${dTotal ? lng || "" : ""}`, cur = pending.get(key) || { t: 0, h: 0, x: 0 };
    pending.set(key, { t: cur.t + dTotal, h: cur.h + dHome, x: cur.x + dTrade });
    clearTimeout(pendingTimer);
    pendingTimer = setTimeout(() => flush(quiet), 600);
  }
  let queue = Promise.resolve(), burst = [];
  function flush(quiet) {
    const p = prof(); if (!p || !pending.size) return Promise.resolve(true);
    const items = [...pending].filter(([, d]) => d.t || d.h || d.x).map(([k, d]) => { const [card_id, kind, lg] = k.split(":"); return { card_id, foil: kind === "f", lang: lg || null, t: d.t, h: d.h, x: d.x || 0 }; });
    pending = new Map();
    if (!items.length) return Promise.resolve(true);
    const delta = items.filter((x) => x.t).map((x) => ({ card_id: x.card_id, qty: x.t, foil: x.foil, ...(x.lang ? { lang: x.lang } : {}) }));
    const home = items.filter((x) => x.h).map((x) => ({ card_id: x.card_id, qty: x.h, foil: x.foil }));
    const trade = items.filter((x) => x.x).map((x) => ({ card_id: x.card_id, qty: x.x, foil: x.foil }));
    const call = () => trade.length
      ? CLOUD.api("rpc/collection_move", { method: "POST", prefer: "return=minimal", body: { p_owner: p.shared ? p.owner : null, p_profile: p.shared ? p.pname : p.profile, p_delta: delta, p_home: home, p_trade: trade } })
      : p.shared
      ? CLOUD.api("rpc/shared_collection_change", { method: "POST", prefer: "return=minimal", body: { p_owner: p.owner, p_profile: p.pname, p_delta: delta, p_home: home } })
      : home.length
      ? CLOUD.api("rpc/collection_change", { method: "POST", prefer: "return=minimal", body: { p_profile: p.profile, p_delta: delta, p_home: home } })
      : CLOUD.api("rpc/apply_collection_delta", { method: "POST", prefer: "return=minimal", body: { p_profile: p.profile, p_delta: delta } });
    return (queue = queue.then(() => call())
      .then(() => {
        if (quiet) return;
        burst = ($("toast").hidden ? [] : burst).concat(items);   // "Desfazer" undoes every change since the notice appeared
        const undoAll = burst;
        toast(Tx((home.length || trade.length) && !delta.length ? "Moved" : "Collection updated"), () => { burst = []; for (const d of undoAll) bump(d.card_id, d.foil ? "f" : "n", -d.t, -d.h, true, -(d.x || 0), d.lang); clearTimeout(pendingTimer); flush(true); renderAll(); });
      })
      .then(() => true)
      .catch((err) => {
        for (const d of items) {
          const k = d.foil ? "f" : "n", e = p.collection[d.card_id], h = HOME.get(`${p.profile}|${d.card_id}`), t = TRADE.get(`${p.profile}|${d.card_id}`);
          if (e && d.t) { try { p.collection[d.card_id] = langApply(e, k, -d.t, d.lang); } catch { e[k] = Math.max(0, e[k] - d.t); } }
          if (h) h[k] = Math.max(0, h[k] - d.h); if (t) t[k] = Math.max(0, t[k] - d.x);
        }
        const why = String(err?.why || err?.message || ""), msg = /lang_required|lang_short/.test(why) ? langAskText() : Tx("Couldn't save. Try again.");
        toast(msg, null, true); if ($("scan").open) scanSay(msg, true); renderAll(); redrawSheet?.();
        if (/lang_/.test(why)) reloadColl().then(() => { renderAll(); redrawSheet?.(); }).catch(() => {});
        return false;
      }));
  }
  let toastTimer = null;
  function toast(text, undo, err) {
    const t = $("toast");

    t.innerHTML = `<i class="ic ${err ? "i-alert" : "i-check"}"></i><span>${esc(text)}</span>${undo ? `<button type="button" class="btn ghost small" id="undo"><i class="ic i-undo"></i>${Tx("Undo")}</button>` : ""}`;
    t.hidden = false;
    if (undo) $("undo").onclick = () => { t.hidden = true; undo(); };
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
  }
  function openSheet(sh, from) {
    if (!sh.open) sh.showModal();
    sh.querySelector("button:not([data-close]), input, a")?.focus();
    sh.addEventListener("close", () => from?.focus?.(), { once: true });
    sh.onclick = (e) => { if (e.target === sh) sh.close(); };
  }

  // ---------- idioma das cartas (supabase/card_langs.sql, src/site/cardlang.js) ----------
  // Each copy may say its printing language; copies from before have none ("sem idioma") and show as the default.
  // Until card_langs.sql runs, collection_lang_state fails and the page shows none of this.
  const CL = window.INKWELL_CARD_LANG;
  const LANGS = CL ? CL.LANGS : [];
  const LS = new Map();   // collection key -> { revision, prefs, last }
  let lastLang = null;    // the language last chosen to add, this visit
  const ownerOf = (p) => (p?.shared ? p.owner : null), pnameOf = (p) => (p?.shared ? p.pname : p?.profile);
  const lstate = () => LS.get(prof()?.profile) || null;
  const defLang = () => lstate()?.prefs?.card_lang || "en";
  const askLang = () => !!lstate()?.prefs?.card_lang_ask;
  const addLangNow = () => (lstate() ? lastLang || defLang() : null);   // scanner, binder check: no question there
  const langName = (lg) => (CL ? CL.name(lg, lang) : lg);
  const langApply = (e, k, q, lg) => {
    if (CL) return CL.apply(e || { n: 0, f: 0 }, k, q, lg || null);
    const o = { n: 0, f: 0, ...(e || {}) }; o[k] = Math.max(0, (+o[k] || 0) + q); return o;
  };
  const langAskText = () => P("Esta carta tem cópias em mais de um idioma: abra a carta e escolha de qual idioma tirar.", "This card has copies in more than one language: open the card and choose which one to take out.");
  const langErr = (e) => { const w = String(e?.why || e?.message || "");
    return /collection_changed/.test(w) ? P("A coleção mudou enquanto você conferia (talvez em outro aparelho). Conferimos de novo: veja abaixo.", "The collection changed while you were checking (maybe on another device). We checked again: see below.")
      : /lang_conflict/.test(w) ? P("Alguma carta não tem mais tantas cópias sem idioma. Conferimos de novo: veja abaixo.", "A card no longer has that many copies with no language. We checked again: see below.")
      : /undo_expired/.test(w) ? P("Passou de um dia: essa classificação não pode mais ser desfeita.", "Over a day ago: this can no longer be undone.")
      : Tx("Couldn't save. Try again."); };
  const newOpId = () => { if (crypto.randomUUID) return crypto.randomUUID();
    const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    const h = [...b].map((x) => x.toString(16).padStart(2, "0")).join(""); return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`; };
  const rpc = (fn, body) => CLOUD.api(`rpc/${fn}`, { method: "POST", body });
  async function loadLangState(p = prof(), force = false) {
    if (!CL || !p || p.friend || (p.shared && !p.canEdit)) return null;
    if (!force && LS.has(p.profile)) return LS.get(p.profile);
    try {
      const [st, last] = await Promise.all([rpc("collection_lang_state", { p_owner: ownerOf(p), p_profile: pnameOf(p) }),
        rpc("last_lang_op", { p_owner: ownerOf(p), p_profile: pnameOf(p) }).catch(() => null)]);
      if (!st || typeof st !== "object" || Array.isArray(st) || st.revision == null) return null;   // not card_langs.sql's answer
      const s = { revision: st.revision, prefs: st.prefs && typeof st.prefs === "object" && !Array.isArray(st.prefs) ? st.prefs : {}, last: last && last.op_id ? last : null };
      LS.set(p.profile, s); return s;
    } catch { return null; }
  }
  async function setLangPrefs(patch, p = prof()) {
    const r = await rpc("set_collection_prefs", { p_owner: ownerOf(p), p_profile: pnameOf(p), p_prefs: patch });

  // the collection as the server has it now (after a language operation, or when a check found it changed)
  async function reloadColl(p = prof()) {

    } else {
      const r = await CLOUD.collections("profile,updated_at,collection:data->collection"), x = (r || []).find((y) => y.profile === p.profile);

  async function undoLangOp(op, p = prof()) {

  }

        <span class="small muted">${esc(P("Agora o Inkwell guarda o idioma de cada carta (inglês, italiano, japonês…). As quantidades não mudam.", "Inkwell now keeps each card's language (English, Italian, Japanese…). Quantities don't change."))}</span></span>

  // ---------- the languages sheet: default language, "ask every time", mark old copies, undo ----------
  function openLangs(from, start = "home") {

          <div class="form-block" style="gap:0"><label class="switch"><span>${esc(P("Perguntar o idioma sempre que adicionar", "Ask the language every time I add"))}<small>${esc(P("Para quem tem cartas em vários idiomas.", "For collections in several languages."))}</small></span><input type="checkbox" role="switch" id="lAsk" ${s.prefs.card_lang_ask ? "checked" : ""}></label></div>
          <div class="form-block"><h3>${esc(P("Cartas já cadastradas", "Cards already in the collection"))}</h3>
            <p class="small" style="margin:0" data-testid="lang-sheet-progress">${esc(P(`${N(pg.known)} de ${N(pg.copies)} cópias com idioma (${pg.pct}%) · ${N(pg.unknown)} sem idioma`, `${N(pg.known)} of ${N(pg.copies)} copies with a language (${pg.pct}%) · ${N(pg.unknown)} with none`))}</p>

            ${s.last ? `<button type="button" class="btn ghost" id="lUndo" data-testid="lang-undo"><i class="ic i-undo"></i>${esc(P(`Desfazer a última classificação (${N(s.last.copies)} cópias, ${new Date(s.last.created_at).toLocaleString(LOC, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })})`, `Undo the last marking (${N(s.last.copies)} copies, ${new Date(s.last.created_at).toLocaleString(LOC, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })})`))}</button>` : ""}</div>`;

    const dd = (d) => new Date(d).toLocaleDateString(LOC, { day: "numeric", month: "short" });

      + (cur?.shared ? ` <span class="tag ${cur.canEdit ? "match" : "info"}" data-testid="src-mode">${esc(cur.canEdit ? P("compartilhada · pode alterar", "shared · can change") : P("compartilhada · só ver", "shared · view only"))}</span>` : "")

      if (focusId) (focusId === "moreSummary" ? more.querySelector("summary") : $(focusId))?.focus({ preventScroll: true });
      more.querySelectorAll(".menu-item").forEach((b) => b.addEventListener("click", () => { more.open = false; }));
      more.addEventListener("keydown", (e) => { if (e.key === "Escape" && more.open) { more.open = false; more.querySelector("summary").focus(); } });
      if (!window.__iwMoreOut) { window.__iwMoreOut = true; document.addEventListener("click", (e) => { const m = $("moreActions"); if (m?.open && !m.contains(e.target)) m.open = false; }); }
      $("collSrc")?.addEventListener("change", (e) => useSource(e.target.value));
      $("openShare").onclick = () => openShare($("openShare"));
      $("openExport").onclick = () => openExport($("openExport"));
      $("openLangs")?.addEventListener("click", () => openLangs($("openLangs"), "home"));
      $("openBinder").onclick = () => setBinder(true); $("openScan")?.addEventListener("click", () => openScanner($("openScan"))); $("openImport")?.addEventListener("click", () => openImport($("openImport"))); }

  // ---------- fichário de trocas: send every copy above N (default 4, a playset) from the binder to the trade binder ----------
  const KEEP_KEY = "inkwell-trade-keep";
  function openTradeFill(from) {
    window.INKWELL_TRACK?.("trade_fill");
    const sh = $("tradeSheet");
    let keep = 4, foilsStay = true, busy = false;
    try { keep = Math.max(1, Math.min(99, parseInt(localStorage.getItem(KEEP_KEY) || "4", 10))); if (!Number.isFinite(keep)) keep = 4; foilsStay = localStorage.getItem(KEEP_KEY + "-foil") !== "0"; } catch { /* */ }
    // by card NAME, like the deck rule: reprints and other printings of the same card count together.
    // A reprint plays as the same card, so which printing goes doesn't matter for decks: the one you have most of in the
    // binder goes first, Enchanted/Epic/Iconic last, normal before foil.
    const plan = () => {
      const out = [], seen = new Set(), col = coll(), special = new Set(["E", "EP", "I"]);
      for (const id of Object.keys(col)) {
        const c0 = BY.get(id); if (!c0) continue;
        const key = nkey(c0.name); if (seen.has(key)) continue; seen.add(key);
        const ids = (BYNAME.get(key) || [c0]).map((c) => c.id).filter((x) => col[x]);
        let total = 0, inTrade = 0;
        for (const x of ids) { const w = where(x); total += w.all.n + w.all.f; inTrade += w.trade.n + w.trade.f; }
        let left = total - keep - inTrade; if (left <= 0) continue;
        const rank = (x) => (special.has(BY.get(x)?.rarity) ? 1 : 0);
        const order = ids.slice().sort((a, b) => rank(a) - rank(b) || (where(b).binder.n + where(b).binder.f) - (where(a).binder.n + where(a).binder.f));
        const mv = new Map();
        for (const k of foilsStay ? ["n", "f"] : ["f", "n"]) for (const x of order) {
          if (left <= 0) break;
          const q = Math.min(left, where(x).binder[k]); if (!q) continue;
          const m = mv.get(x) || { id: x, n: 0, f: 0, name: key }; m[k] += q; mv.set(x, m); left -= q;
        }
        out.push(...mv.values());
      }
      return out.sort((a, b) => (BY.get(a.id)?.name || "").localeCompare(BY.get(b.id)?.name || "") || a.id.localeCompare(b.id));
    };
    const draw = (msg = "") => {
      const pl = plan(), copies = pl.reduce((t, x) => t + x.n + x.f, 0), names = new Set(pl.map((x) => x.name)).size;
      sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="tfT">${esc(P("Separar repetidas para trocas", "Set extras aside to trade"))}</h2><button type="button" class="btn ghost icon" data-close aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>
        <div class="sheet-body stack" style="gap:var(--sp-3)">
          <p class="small muted" style="margin:0">${esc(P("Conta pelo nome da carta, como no deck: reimpressões, normal e foil somam juntas. Fica esse número no fichário (ou em casa); o que passar vai para o fichário de trocas (as Encantadas por último).", "Counted by card name, like in a deck: reprints, normal and foil add up. That many stay in the binder (or at home); the rest goes to the trade binder (Enchanted last)."))}</p>
          <div class="row" style="gap:var(--sp-3);align-items:center;flex-wrap:wrap"><span>${esc(P("Manter", "Keep"))}</span>
            <div class="qty lg"><button type="button" data-k="-1" aria-label="${esc(P("Uma a menos", "One less"))}" ${keep <= 1 ? "disabled" : ""}>−</button><output id="tfKeep" data-testid="trade-keep">${keep}</output><button type="button" data-k="1" aria-label="${esc(P("Uma a mais", "One more"))}" ${keep >= 99 ? "disabled" : ""}>+</button></div>
            <span>${esc(P("de cada carta", "of each card"))}${keep === 4 ? ` <span class="tag info">${esc(P("play set", "playset"))}</span>` : ` <button type="button" class="btn ghost small" id="tf4">${esc(P("Voltar para 4", "Back to 4"))}</button>`}</span></div>
          <label class="switch"><span>${esc(P("Manter as foils no fichário", "Keep foils in the binder"))}<small>${esc(P("Vão primeiro as normais.", "Normal copies go first."))}</small></span><input type="checkbox" role="switch" id="tfFoil" ${foilsStay ? "checked" : ""}></label>
          <p style="margin:0" data-testid="trade-plan"><b>${esc(copies ? P(`${copies} ${copies === 1 ? "cópia" : "cópias"} de ${names} ${names === 1 ? "carta" : "cartas"} ${copies === 1 ? "vai" : "vão"} para o fichário de trocas.`, `${copies} ${copies === 1 ? "copy" : "copies"} of ${names} ${names === 1 ? "card" : "cards"} go to the trade binder.`) : P("Nada a separar: nenhuma carta passa desse número no fichário.", "Nothing to set aside: no card goes above that number in the binder."))}</b></p>
          ${pl.length ? `<div class="imp-list small">${pl.slice(0, 200).map((x) => { const c = BY.get(x.id); return `<div><span>${esc(c?.name || x.id)}</span><span class="muted">${esc(c ? setName(c.set) + " · nº " + c.num : "")}</span><b>${x.n ? x.n : ""}${x.n && x.f ? " + " : ""}${x.f ? `${x.f} foil` : ""}</b></div>`; }).join("")}${pl.length > 200 ? `<div class="muted">… ${esc(Tx("and {n} more", { n: pl.length - 200 }))}</div>` : ""}</div>` : ""}
          <p class="small" id="tfMsg" role="alert" style="margin:0">${esc(msg)}</p></div>
        <div class="sheet-foot"><button type="button" class="btn ghost" data-close>${Tx("Cancel")}</button><button type="button" class="btn primary" id="tfGo" data-testid="trade-go" ${copies && !busy ? "" : "disabled"}>${esc(copies ? P(`Mover ${copies} para Trocas`, `Move ${copies} to Trades`) : P("Mover", "Move"))}</button></div>`;
      sh.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => sh.close());
      const saveKeep = () => { try { localStorage.setItem(KEEP_KEY, String(keep)); localStorage.setItem(KEEP_KEY + "-foil", foilsStay ? "1" : "0"); } catch { /* */ } };
      sh.querySelectorAll("[data-k]").forEach((b) => b.onclick = () => { keep = Math.max(1, Math.min(99, keep + +b.dataset.k)); saveKeep(); draw(); sh.querySelector(`[data-k="${b.dataset.k}"]:not([disabled])`)?.focus(); });
      $("tf4")?.addEventListener("click", () => { keep = 4; saveKeep(); draw(); });
      $("tfFoil").onchange = (e) => { foilsStay = e.target.checked; saveKeep(); draw(); $("tfFoil").focus(); };
      $("tfGo").onclick = () => go(pl);
    };
    const send = async (p, items) => {
      for (let i = 0; i < items.length; i += 400) {   // the server takes 400 changes per call
        await CLOUD.api("rpc/collection_move", { method: "POST", prefer: "return=minimal", body: { p_owner: p.shared ? p.owner : null, p_profile: p.shared ? p.pname : p.profile, p_delta: [], p_home: [], p_trade: items.slice(i, i + 400) } });
      }
    };
    const applyLocal = (p, items, sign) => { for (const d of items) { const tk = `${p.profile}|${d.card_id}`, t = TRADE.get(tk) || { n: 0, f: 0 }, k = d.foil ? "f" : "n"; t[k] = Math.max(0, t[k] + sign * d.qty); TRADE.set(tk, t); } };
    async function go(pl) {
      const p = prof(); if (!p || busy) return;
      const items = pl.flatMap((x) => [x.n ? { card_id: x.id, qty: x.n, foil: false } : null, x.f ? { card_id: x.id, qty: x.f, foil: true } : null]).filter(Boolean);
      busy = true; $("tfGo").disabled = true; $("tfGo").textContent = P("Movendo…", "Moving…");
      try {
        await flush(true); await send(p, items); applyLocal(p, items, 1);
        sh.close(); v.place = "trade"; save(); renderAll();
        const n = items.reduce((t, d) => t + d.qty, 0);
        toast(P(`${n} ${n === 1 ? "cópia foi" : "cópias foram"} para o fichário de trocas`, `${n} ${n === 1 ? "copy" : "copies"} moved to the trade binder`), async () => {
          try { await send(p, items.map((d) => ({ ...d, qty: -d.qty }))); applyLocal(p, items, -1); renderAll(); } catch { toast(Tx("Couldn't save. Try again."), null, true); }
        });
      } catch { busy = false; draw(Tx("Couldn't save. Try again.")); }
    }
    draw(); openSheet(sh, from);
  }

  // ---------- the trade binder on the Mural: one "Troco" post per card (normal and foil apart), kept in step ----------
  async function openTradePost(from) {
    window.INKWELL_TRACK?.("trade_post");
    const sh = $("tradeSheet"), p = prof(); if (!p || p.shared || p.friend) return;
    const want = [];
    for (const id of Object.keys(coll())) { const t = where(id).trade; for (const k of ["n", "f"]) if (t[k] > 0 && BY.has(id)) want.push({ card_id: id, foil: k === "f", qty: Math.min(99, t[k]) }); }
    let mine = null, note = "", msg = "";
    const draw = () => {
      const copies = want.reduce((t, x) => t + x.qty, 0), gone = (mine || []).filter((l) => !want.some((w) => w.card_id === l.card_id && w.foil === !!l.foil));
      sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="tfT">${esc(P("Anunciar no Mural", "Post on the board"))}</h2><button type="button" class="btn ghost icon" data-close aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>
        <div class="sheet-body stack" style="gap:var(--sp-3)">
          <p style="margin:0" data-testid="trade-post-plan"><b>${esc(want.length ? P(`${want.length} ${want.length === 1 ? "anúncio" : "anúncios"} “Troco” (${copies} ${copies === 1 ? "cópia" : "cópias"}).`, `${want.length} “I trade” ${want.length === 1 ? "post" : "posts"} (${copies} ${copies === 1 ? "copy" : "copies"}).`) : P("Seu fichário de trocas está vazio.", "Your trade binder is empty."))}</b></p>
          <p class="small muted" style="margin:0">${esc(P("O Mural passa a mostrar o que está no seu fichário de trocas. Amigos podem propor uma troca direto do anúncio. Se você anunciar de novo depois de mudar o fichário, os anúncios acompanham.", "The board shows what is in your trade binder. Friends can propose a trade right from the post. Post again after changing the binder and the posts follow."))}${gone.length ? " " + esc(P(`${gone.length} ${gone.length === 1 ? "anúncio antigo sai" : "anúncios antigos saem"} (não estão mais no fichário).`, `${gone.length} old ${gone.length === 1 ? "post goes" : "posts go"} (no longer in the binder).`)) : ""}</p>
          <label class="field">${esc(P("Recado no anúncio (opcional)", "Note on the posts (optional)"))}<input type="text" id="tpNote" maxlength="200" value="${esc(note)}" placeholder="${esc(P("Ex.: troco por cartas do set 14", "E.g. swapping for set 14 cards"))}"></label>
          <p class="small" id="tpMsg" role="alert" style="margin:0">${esc(msg)}</p></div>
        <div class="sheet-foot"><button type="button" class="btn ghost" data-close>${Tx("Cancel")}</button><button type="button" class="btn primary" id="tpGo" data-testid="trade-post-go" ${mine !== null && (want.length || gone.length) ? "" : "disabled"}>${esc(P("Anunciar", "Post"))}</button></div>`;
      sh.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => sh.close());
      $("tpNote").oninput = (e) => { note = e.target.value; };
      $("tpGo").onclick = () => go(gone);
    };
    async function go(gone) {
      const b = $("tpGo"); b.disabled = true; b.textContent = P("Anunciando…", "Posting…");
      try {
        const n = note.trim().slice(0, 200), old = mine || [];
        if (gone.length) await CLOUD.api(`listings?id=in.(${gone.map((l) => l.id).join(",")})`, { method: "DELETE", prefer: "return=minimal" });
        for (const w of want) {
          const l = old.find((x) => x.card_id === w.card_id && !!x.foil === w.foil);
          if (l && (l.qty !== w.qty || (n && l.note !== n))) await CLOUD.api(`listings?id=eq.${l.id}`, { method: "PATCH", prefer: "return=minimal", body: { qty: w.qty, ...(n ? { note: n } : {}), updated_at: new Date().toISOString() } });
        }
        const add = want.filter((w) => !old.some((x) => x.card_id === w.card_id && !!x.foil === w.foil)).map((w) => ({ user_id: me.id, kind: "trade", card_id: w.card_id, foil: w.foil, qty: w.qty, note: n }));
        if (add.length) await CLOUD.api("listings", { method: "POST", prefer: "return=minimal", body: add });
        sh.close(); toast(want.length ? P(`Pronto: ${want.length} ${want.length === 1 ? "carta" : "cartas"} no Mural como “Troco”.`, `Done: ${want.length} ${want.length === 1 ? "card" : "cards"} on the board as “I trade”.`) : P("Anúncios retirados do Mural.", "Posts removed from the board."));
      } catch (e) {
        msg = /check|kind/.test(String(e?.why || "")) ? P("O Mural ainda não aceita “Troco”: falta rodar supabase/trade_binder_board.sql.", "The board doesn't take “I trade” yet: supabase/trade_binder_board.sql still needs to run.") : Tx("Couldn't save. Try again.");
        draw();
      }
    }
    draw(); openSheet(sh, from);
    mine = await CLOUD.api(`listings?user_id=eq.${me.id}&kind=eq.trade&select=id,card_id,foil,qty,note`).catch(() => []);
    if (sh.open) draw();
  }

  // ---------- compartilhar: your collections, people who share one, friends (see / borrow), shared with you ----------

  const why = (e) => String(e?.why || e?.message || "");
  function openShare(from) {
    window.INKWELL_TRACK?.("share_open");
    const sh = $("shareSheet"); let link = null, linkEdit = false, newOpen = false, renaming = null, sure = null, msg = "";
    const mine = () => (prof()?.shared || prof()?.friend ? ownBest() : prof());
    const reload = async () => { const p = await CLOUD.collections("profile,updated_at,collection:data->collection").catch(() => null);
      if (Array.isArray(p)) profiles = p.map((x) => ({ ...x, collection: x.collection && typeof x.collection === "object" ? x.collection : {} }));

    const cardsIn = (p) => Object.values(p.collection || {}).reduce((t, e) => t + (+e.n || 0) + (+e.f || 0), 0);

      }).join("");
      sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="shT">${esc(P("Compartilhar coleção", "Share collection"))}</h2><button type="button" class="btn ghost icon" data-close aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>
        <div class="sheet-body stack" style="gap:var(--sp-5)">
          <section class="stack" style="gap:var(--sp-2)" data-testid="share-own"><h3 style="margin:0">${esc(P("Minhas coleções", "My collections"))}</h3>
            <p class="small muted" style="margin:0">${esc(P("Você pode ter mais de uma: por exemplo, uma compartilhada com quem mora com você e outra só sua.", "You can keep more than one: say, one shared with someone you live with and one only yours."))}</p>
            <div class="list tight divided">${ownRows}</div>
            ${newOpen ? `<div class="row" style="gap:var(--sp-2);flex-wrap:nowrap"><input class="grow" id="newName" maxlength="40" placeholder="${esc(P("Nome (ex.: Só minha)", "Name (e.g. Only mine)"))}" aria-label="${esc(P("Nome da nova coleção", "New collection name"))}"><button type="button" class="btn primary" id="newOk">${esc(P("Criar", "Create"))}</button></div>`
              : `<button type="button" class="btn" id="newColl" style="justify-self:start"><i class="ic i-plus"></i>${esc(P("Nova coleção", "New collection"))}</button>`}</section>
          ${m ? `<section class="stack" style="gap:var(--sp-2)" data-testid="share-people"><h3 style="margin:0">${esc(P(`Dividir «${collName(m)}» com alguém`, `Share “${collName(m)}” with someone`))}</h3>

        catch { say(Tx("Couldn't save. Try again.")); }
      });

        const pv = { profile: $("pvProf")?.value || privacy.profile || m?.profile, view: $("pvView").checked, lend: $("pvLend").checked };
        try { await CLOUD.api("rpc/set_collection_privacy", { method: "POST", body: { p_profile: pv.profile, p_view: pv.view, p_lend: pv.lend } }); privacy = pv; say(P("Salvo.", "Saved.")); }

  // ---------- a share invite: ?compartilhar=CODE (kept through signing in) ----------
  const INV_KEY = "inkwell-share-invite";
  function inviteCode() {
    const q = new URLSearchParams(location.search).get("compartilhar");
    if (q) { try { localStorage.setItem(INV_KEY, q); } catch { /* */ } return q; }
    try { return localStorage.getItem(INV_KEY); } catch { return null; }
  }
  const dropInvite = () => { try { localStorage.removeItem(INV_KEY); } catch { /* */ } if (/[?&]compartilhar=/.test(location.search)) history.replaceState(null, "", location.pathname); };
  async function offerInvite(code) {
    const info = await CLOUD.api("rpc/share_invite_info", { method: "POST", body: { p_code: code }, anon: true }).catch(() => null);
    const sh = $("shareSheet"), who = firstName(info?.name);
    const body = !info || !info.valid ? P("Este convite já foi usado ou venceu. Peça um novo link.", "This invite was used or has expired. Ask for a new link.")
      : info.mine ? P("Este é o seu próprio convite. Mande o link para a outra pessoa.", "This is your own invite. Send the link to the other person.")
      : info.can_edit ? P(`${who} quer dividir a coleção com você: você vê tudo e também pode alterar.`, `${who} wants to share their collection with you: you see everything and can change it too.`)
      : P(`${who} quer mostrar a coleção para você: você vê tudo (sem alterar).`, `${who} wants to show you their collection: you see everything (no changes).`);
    const ok = info && info.valid && !info.mine;
    sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="shT">${esc(P("Coleção compartilhada", "Shared collection"))}</h2><button type="button" class="btn ghost icon" data-close aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>
      <div class="sheet-body stack" style="gap:var(--sp-3)"><p style="margin:0" data-testid="invite-text">${esc(body)}</p>${ok && !me ? `<p class="small muted" style="margin:0">${esc(P("Entre ou crie sua conta (só o e-mail) para aceitar.", "Sign in or create your account (just e-mail) to accept."))}</p>` : ""}<p class="small" id="invMsg" role="alert" style="margin:0"></p></div>
      <div class="sheet-foot"><button type="button" class="btn ghost" data-close>${esc(ok ? P("Agora não", "Not now") : Tx("Close"))}</button>${ok ? `<button type="button" class="btn primary" id="invOk" data-testid="accept-invite">${esc(me ? P("Aceitar", "Accept") : Tx("Sign in"))}</button>` : ""}</div>`;
    sh.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => { dropInvite(); sh.close(); });
    $("invOk")?.addEventListener("click", async () => {
      if (!me) { window.INKWELL_SIGNIN?.(); return; }
      try { const r = await CLOUD.api("rpc/accept_share_invite", { method: "POST", body: { p_code: code } });
        dropInvite(); sh.close(); await loadShares(); useSource(`share:${r.owner}:${r.profile}`); toast(P(`Pronto: coleção de ${who}.`, `Done: ${who}'s collection.`)); }
      catch { $("invMsg").textContent = P("Não deu para aceitar. O convite pode ter vencido.", "Couldn't accept. The invite may have expired."); }
    });
    openSheet(sh, null);
  }

  // ---------- exportar: a CSV file (opens in Excel / Google Sheets; Importar reads it back) ----------
  // In Portuguese: ";" between columns and "," in prices, like a Brazilian Excel expects; in English "," and ".".
  function collectionCsv(ids) {
    const sep = lang === "pt" ? ";" : ",", dec = (v) => (v == null ? "" : (Math.round(v * 100) / 100).toFixed(2).replace(".", lang === "pt" ? "," : "."));
    const cell = (v) => { const t = String(v ?? ""); return t.includes(sep) || /["\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
    // with languages (supabase/card_langs.sql): one line per card and language, the copies with none last; where the
    // copies are (binder, home…) is on the card's first line only, since those places don't keep the language
    const lon = langsOn();
    const head = ["card_id", "name", "set", "set_name", "number", "rarity", "ink", ...(lon ? ["language"] : []), "normal", "foil", "binder", "home", ...(tradeReady ? ["trades"] : []), ...(deckedReady ? ["decks"] : []), "lent", "price_normal_brl", "price_foil_brl", "value_brl", "price_source"];
    const rows = ids.flatMap((id) => {
      const c = BY.get(id), w = where(id), pn = priceOf(id), pf = priceOf(id, true), sp = lon ? CL.split(coll()[id]) : null;
      const parts = lon ? [...LANGS.filter((l2) => (sp.l[l2]?.n || 0) + (sp.l[l2]?.f || 0)).map((l2) => [l2, sp.l[l2].n || 0, sp.l[l2].f || 0]), ...(sp.unknown.n + sp.unknown.f ? [["", sp.unknown.n, sp.unknown.f]] : [])] : [[null, w.all.n, w.all.f]];
      return parts.map(([l2, n, f], i) => [id, c?.name || "", c?.set || "", c ? setName(c.set) : "", c?.num || "", c ? rarName(c.rarity) : "", c ? inksOf(c).join("/") : "", ...(lon ? [l2 ? l2.toUpperCase() : ""] : []), n, f,
        ...(i ? ["", "", ...(tradeReady ? [""] : []), ...(deckedReady ? [""] : []), ""] : [w.binder.n + w.binder.f, w.home.n + w.home.f, ...(tradeReady ? [w.trade.n + w.trade.f] : []), ...(deckedReady ? [w.decks.n + w.decks.f] : []), w.lent.n + w.lent.f]),
        dec(pn), dec(pf), dec((pn == null || !n) && (pf == null || !f) ? null : (pn ?? 0) * n + (pf ?? 0) * f), srcOf(id, false) + (pf != null && foilEst(id) ? " · " + P("foil estimado pelo preço normal", "foil estimated from the normal price") : "")]);
    });
    return "\ufeff" + [head, ...rows].map((r) => r.map(cell).join(sep)).join("\r\n") + "\r\n";   // BOM: Excel reads the accents right
  }
  // Liga Lorcana's collection import: one line per card and finish (Extras = Foil), set code and card number.
  // Condition NM and language EN unless you change them in the file; the Liga colour letters aren't filled in.
  function ligaCsv(ids) {
    const cell = (v) => { const t = String(v ?? ""); return /[",\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
    const head = "Edicao (PTBR),Edicao (EN),Edicao (Sigla),Card (PT),Card (EN),Quantidade,Qualidade (M NM SP MP HP D),Idioma (BR EN DE ES FR IT JP KO RU TW),Raridade,Cor (C D O E Y F R G L M P W),Extras,Card #,Comentario,# Cards na Edicao";
    const rows = [];
    for (const id of ids) {
      const c = BY.get(id), o = owned(id); if (!c) continue;
      const s = SETS.find((x) => x.code === c.set);
      const LIGA = { en: "EN", fr: "FR", de: "DE", it: "IT", ja: "JP", zh: "" }, sp = langsOn() ? CL.split(coll()[id]) : null, dl = langsOn() ? defLang() : "en";
      for (const [k, extra] of [["n", ""], ["f", "Foil"]]) {
        if (!(o[k] > 0)) continue;
        // the language split is of every copy; "o" may be one place only (binder…): then all go as the default language
        const parts = sp && o[k] === sp[k] ? [...LANGS.filter((l2) => sp.l[l2]?.[k]).map((l2) => [l2, sp.l[l2][k]]), ...(sp.unknown[k] ? [[dl, sp.unknown[k]]] : [])] : [[dl, o[k]]];
        for (const [l2, q] of parts) rows.push(["", s?.name_en || "", c.set, "", c.name, q, "NM", LIGA[l2] ?? "EN", c.rarity || "", "", extra, c.num, "", ""].map(cell).join(","));
      }
    }
    return [head, ...rows].join("\r\n") + "\r\n";
  }
  function openExport(from) {
    window.INKWELL_TRACK?.("export_csv");
    const sh = $("tradeSheet"), p = prof(); if (!p) return;
    const all = Object.keys(coll()).filter((id) => { const o = owned(id); return o.n + o.f > 0; }).sort((a, b) => (setOrder.get(BY.get(a)?.set) ?? 999) - (setOrder.get(BY.get(b)?.set) ?? 999) || numOf(BY.get(a) || {}) - numOf(BY.get(b) || {}) || a.localeCompare(b));
    const shownIds = filtered().filter((c) => { const q = inPlace(c.id); return q.n + q.f > 0; }).map((c) => c.id);
    const copies = (ids) => ids.reduce((t, id) => { const o = owned(id); return t + o.n + o.f; }, 0);
    const narrowed = shownIds.length && shownIds.length !== all.length;
    let pick = "all", fmt = "inkwell";

    const draw = () => {
      sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="tfT">${esc(P("Exportar coleção", "Export collection"))}</h2><button type="button" class="btn ghost icon" data-close aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>

            <label class="check"><input type="radio" name="exFmt" value="inkwell" ${fmt === "inkwell" ? "checked" : ""}> <span>${esc(P("Inkwell (planilha completa)", "Inkwell (full spreadsheet)"))}<small class="muted" style="display:block">${esc(P("Cada carta com normais e foil, onde estão (fichário, casa, trocas, emprestadas) e o preço. Abre no Excel e no Google Planilhas.", "Each card with normal and foil, where they are (binder, home, trades, lent) and the price. Opens in Excel and Google Sheets."))}</small></span></label>

          <p class="small muted" style="margin:0">${esc(P("O “Importar” daqui lê os dois formatos de volta.", "“Import” here reads both formats back."))}</p>
          ${narrowed ? `<fieldset class="stack" style="gap:6px;border:0;padding:0;margin:0"><legend class="small" style="font-weight:700;margin-bottom:4px">${esc(P("O que exportar", "What to export"))}</legend>
            <label class="check"><input type="radio" name="exPick" value="all" ${pick === "all" ? "checked" : ""}> <span>${esc(P(`A coleção inteira (${all.length} cartas, ${copies(all)} cópias)`, `The whole collection (${all.length} cards, ${copies(all)} copies)`))}</span></label>
            <label class="check"><input type="radio" name="exPick" value="shown" ${pick === "shown" ? "checked" : ""}> <span>${esc(P(`Só o que está na tela agora (${shownIds.length} cartas, com os filtros e o lugar escolhidos)`, `Only what is on screen now (${shownIds.length} cards, with the filters and place chosen)`))}</span></label></fieldset>`
          : `<p style="margin:0" data-testid="export-count"><b>${esc(P(`${all.length} ${all.length === 1 ? "carta" : "cartas"}, ${copies(all)} ${copies(all) === 1 ? "cópia" : "cópias"}.`, `${all.length} ${all.length === 1 ? "card" : "cards"}, ${copies(all)} ${copies(all) === 1 ? "copy" : "copies"}.`))}</b></p>`}
          <p class="small" id="exMsg" role="alert" style="margin:0"></p></div>
        <div class="sheet-foot"><button type="button" class="btn ghost" data-close>${Tx("Cancel")}</button><button type="button" class="btn primary" id="exGo" data-testid="export-go" ${all.length ? "" : "disabled"}><i class="ic i-export"></i>${esc(P("Baixar CSV", "Download CSV"))}</button></div>`;
      sh.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => sh.close());
      sh.querySelectorAll("[name=exPick]").forEach((r) => r.onchange = () => { pick = r.value; });
      sh.querySelectorAll("[name=exFmt]").forEach((r) => r.onchange = () => { fmt = r.value; try { localStorage.setItem("inkwell-export-format", fmt); } catch { /* */ } });
      $("exGo").onclick = () => {
        const ids = pick === "shown" ? shownIds : all;
        const name = `${fmt === "liga" ? "ligalorcana" : "inkwell"}-${(p.shared || profiles.length > 1 ? collName(p) : P("colecao", "collection")).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "")}-${new Date().toISOString().slice(0, 10)}.csv`;
        const url = URL.createObjectURL(new Blob([fmt === "liga" ? ligaCsv(ids) : collectionCsv(ids)], { type: "text/csv;charset=utf-8" }));

    const i = +ed.dataset.editPocket, p = pg.pockets[i], name = (id) => split(BY.get(id).name)[0];
    const use = (id) => { p.id = id; p.resolved = true; p.skip = false; if (p.qty < 1) p.qty = 1; window.INKWELL_TRACK?.("scan_page_fixed"); settleAndNext(pg, i, P(`Posição ${i + 1}: ${name(id)}.`, `Pocket ${i + 1}: ${name(id)}.`)); };
    $("pgsClose").onclick = () => { pg.sheet = null; pg.find = null; drawPage(); box.querySelector(`#pgPhoto [data-pk="${i}"]`)?.focus(); };
    $("pgsOk")?.addEventListener("click", () => use(p.id));
    $("pgsEmpty")?.addEventListener("click", () => { p.resolved = true; settleAndNext(pg, i, P(`Posição ${i + 1}: vazia.`, `Pocket ${i + 1}: empty.`)); });
    $("pgsSkip")?.addEventListener("click", () => {
      if (p.skip) { p.skip = false; p.resolved = !!p.id && p.resolved; if (p.qty < 1) p.qty = 1; drawPage(); return; }
      p.skip = true; p.resolved = true; settleAndNext(pg, i, P(`Posição ${i + 1}: fora da lista.`, `Pocket ${i + 1}: left out.`));
    });
    $("pgsFind").onclick = () => { pg.find = pg.find == null ? "" : null; drawPage(); $("pgFind")?.focus(); };
    $("pgsPrev").onclick = () => { const n = nextPending(pg, i, -1); if (n != null) { pg.sheet = n; pg.find = null; drawPage(); } };
    $("pgsNext").onclick = () => { const n = nextPending(pg, i, 1); if (n != null) { pg.sheet = n; pg.find = null; drawPage(); } };
    ed.querySelectorAll(".pgs-alts [data-use]").forEach((b) => b.onclick = () => use(b.dataset.use));
    const find = $("pgFind"), found = $("pgFound");
    if (find) {
      const search = () => {
        const q = norm(find.value); pg.find = find.value;
        const hits = q.length < 2 ? [] : CARDS.filter((c) => q.split(" ").every((w) => c.k.includes(w))).slice(0, 12);
        found.innerHTML = hits.map((c) => `<button type="button" data-use="${esc(c.id)}">${thumb(c, "", false)}</span><span>${esc(split(c.name)[0])}</span><span class="muted">${esc(setName(c.set))} · nº ${esc(c.num)}</span></button>`).join("") || (q.length >= 2 ? `<p class="small muted">${esc(P("Nada encontrado.", "Nothing found."))}</p>` : "");
        found.querySelectorAll("[data-use]").forEach((b) => b.onclick = () => use(b.dataset.use));
      };
      find.oninput = search; if (find.value) search();
    }
    $("pgFoil")?.addEventListener("change", (e) => { p.foil = e.target.checked; drawPage(); });
    ed.querySelectorAll("[data-pq]").forEach((b) => b.onclick = () => {
      const q = Math.max(0, (p.skip ? 0 : p.qty) + +b.dataset.pq);
      if (q === 0) { p.skip = true; p.resolved = true; } else { p.qty = q; p.skip = false; }
      drawPage();
    });
    if (pg.sheetFresh) ed.focus?.({ preventScroll: true });
  }
  function wireCorners(pg, box) {   // "Ajustar cantos": drag a corner of the page; then "Reconhecer de novo"
    const svg = box.querySelector("#pgPhoto svg"); if (!svg) return;
    svg.parentElement.prepend(pg.view.canvas);
    if (pg.busy || !pg.adjust) return;   // outside that mode a finger on the photo scrolls the screen (touch-action: pan-y)
    let k = -1; const V = pg.view;
    const at = (e) => { const r = svg.getBoundingClientRect(); return [V.x + (e.clientX - r.left) * V.w / r.width, V.y + (e.clientY - r.top) * V.h / r.height]; };
    svg.onpointerdown = (e) => { const t = e.target.closest("[data-corner]"); if (!t) return; k = +t.dataset.corner; svg.setPointerCapture(e.pointerId); e.preventDefault(); };
    svg.onpointermove = (e) => {
      if (k < 0) return; const q = pg.quad.map((p) => p.slice()); q[k] = at(e);
      if (!PS().validQuad(q)) return;
      pg.quad = q; pg.moved = true; const L = PS().LAYOUTS[scan.layout], quads = PS().cellQuads(L, q);
      svg.querySelectorAll("[data-pk] polygon").forEach((pl, i) => pl.setAttribute("points", quads[i].map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" ")));
      const c = svg.querySelector(`[data-corner="${k}"]`); c.setAttribute("cx", q[k][0].toFixed(1)); c.setAttribute("cy", q[k][1].toFixed(1));
    };
    svg.onpointerup = svg.onpointercancel = () => { if (k < 0) return; k = -1; pg.moved = true; };
  }
  window.__inkwellScanPageState = () => (scan.pg ? { busy: !!scan.pg.busy, sheet: scan.pg.sheet ?? null, adjust: !!scan.pg.adjust, quad: scan.pg.quad, pockets: scan.pg.pockets.map((p) => p && { status: p.status, id: p.id, resolved: !!p.resolved, skip: !!p.skip, qty: p.qty, foil: !!p.foil, group: p.group || [] }) } : null);   // used by the browser test

  async function openScanner(from) {
    window.INKWELL_TRACK?.("scan_open");
    const sh = $("scan"); scan.added = []; scan.last = null; scan.wait = false; scan.askOpen = false; scan.seen = null; scan.review = false; scan.saved = 0; scan.prev = null; scan.pg = null; scan.pageSig = null;
    drawScan(); sh.showModal(); scanSay(Tx("Starting the camera…"));
    sh.addEventListener("close", () => { clearInterval(scan.timer); scan.stream?.getTracks().forEach((t) => t.stop()); scan.stream = null; sh.innerHTML = ""; sh.oncancel = null; flush(true); renderAll(); from?.focus?.(); if (scan.saved) toast(Tx("{n} added", { n: scan.saved })); }, { once: true });
    sh.oncancel = (e) => {   // Esc / back: leave the page check first; with cards in the list, review first
      if (scan.pg?.sheet != null) { e.preventDefault(); scan.pg.sheet = null; scan.pg.find = null; drawPage(); return; }   // the pocket editor first
      if (scan.pg?.adjust) { e.preventDefault(); scan.pg.adjust = false; drawPage(); return; }
      if (scan.pg) { e.preventDefault(); closePage(); return; }
      if (scan.added.length && !scan.review) { e.preventDefault(); showReview(); } };
    try { await loadScan(); } catch { scanSay(Tx("Couldn't load the card scanner."), true); return; }
    try {
      scan.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 3840 }, height: { ideal: 2160 } } });
    } catch { scanSay(Tx("The camera didn't open. Allow camera access for this site and try again."), true); return; }
    if (!sh.open) { scan.stream.getTracks().forEach((t) => t.stop()); return; }
    const v = $("scanVideo"); v.srcObject = scan.stream; await v.play().catch(() => {});
    const track = scan.stream.getVideoTracks()[0], caps = track?.getCapabilities?.() || {};
    if ((caps.focusMode || []).includes("continuous")) track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }).catch(() => {});   // Android Chrome; iPhone focuses on its own
    if (caps.torch) { const b = $("scanTorch"); b.hidden = false; b.onclick = () => { scan.torch = !scan.torch; b.setAttribute("aria-pressed", String(scan.torch)); track.applyConstraints({ advanced: [{ torch: scan.torch }] }).catch(() => {}); }; }
    scanSay(scan.mode === "page" ? pageHint() : Tx("Point the camera at one card inside the frame."));
    scan.timer = setInterval(tick, 350);
    window.addEventListener("resize", () => sh.open && placeGuide(), { passive: true });
  }

  // ---------- boot ----------
  document.title = `${Tx("Collection")} · Inkwell`;
  $("title").textContent = Tx("Collection");
  document.documentElement.lang = LOC;
  const invite = inviteCode();
  if (!me) { render(); if (invite) offerInvite(invite); return; }
  const friendHandle = new URLSearchParams(location.search).get("amigo");
  $("app").innerHTML = `<div class="stats-row three"><span class="skel"></span><span class="skel"></span><span class="skel"></span></div><div class="cgrid">${"<span class=\"skel thumb\"></span>".repeat(8)}</div><p class="sr-only">${Tx("Loading…")}</p>`;
  const loadFriend = async () => {
    const r = await CLOUD.api("rpc/friend_collection", { method: "POST", body: { p_handle: friendHandle, p_full: true } }).catch(() => null);
    if (!r?.view) { $("title").textContent = Tx("Collection"); $("headActions").innerHTML = "";
      $("app").innerHTML = `<div class="empty"><img src="../ui/assets/empty/collection.svg" alt=""><b>${esc(P("Esta coleção não está aberta para você.", "This collection isn't open to you."))}</b><p>${esc(P("Só amigos veem, e só quando o dono deixa.", "Only friends see it, and only if the owner allows."))}</p><a class="btn" href="./">${esc(P("Ver a minha coleção", "See my collection"))}</a></div>`; return false; }
    friendView = { profile: `friend:${friendHandle}`, friend: true, ownerName: r.name || "", collection: r.collection || {}, lent: r.lent || {}, lend: !!r.lend };
    v.owned = true; return true;
  };
  const go = () => (friendHandle ? Promise.all([loadAll(), loadFriend()]).then(([, ok]) => { if (ok) { applySource(); renderAll(); } })
    : loadAll().then(() => { renderAll(); if (invite) offerInvite(invite); loadLangState().then((st) => { if (st) renderAll(); }); })).catch(() => {
    $("app").innerHTML = `<div class="empty"><img src="../ui/assets/empty/error.svg" alt=""><b>${Tx("Couldn't load your collection.")}</b><p>${Tx("Check your connection and try again.")}</p><button type="button" class="btn" id="retry"><i class="ic i-refresh"></i>${Tx("Try again")}</button></div>`;
    $("retry").onclick = go;
  });
  go();
})();
</script>
