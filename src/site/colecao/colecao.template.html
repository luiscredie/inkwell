  // ---------- state ----------

  async function loadAll() {

      <div class="row between" style="margin:-4px 0 var(--sp-4)">

        <select class="inline" id="sort" aria-label="${Tx("Sort")}">${[["value", "Most valuable"], ["recent", "Recently added"], ["name", "Name"], ["set", "Set and number"], ["cost", "Cost"], ["copies", "Copies"]].map(([k, l]) => `<option value="${k}" ${v.sort === k ? "selected" : ""}>${Tx(l)}</option>`).join("")}</select>
      </div>
      ${rows.length ? (v.view === "grid" ? `<div class="cgrid" id="grid">${rows.slice(0, shown).map(gridCard).join("")}</div>` : `<div class="list" id="grid">${rows.slice(0, shown).map(listRow).join("")}</div>`)
        + (rows.length > shown ? `<div class="load-more"><button type="button" class="btn" id="more">${Tx("Show more")}</button></div>` : "")
        : empty && v.owned ? `<div class="empty"><img src="../ui/assets/empty/collection.svg" alt=""><b>${Tx("Your collection is empty")}</b><p>${esc(Tx("Turn off \"Only cards I own\" to add cards with +, or import your collection in Inkwell."))}</p><button type="button" class="btn primary" id="allCards">${Tx("Only cards I own")} ✕</button></div>`
        : `<div class="empty"><img src="../ui/assets/empty/search.svg" alt=""><b>${Tx("No cards match these filters.")}</b><button type="button" class="btn" id="clearAll">${Tx("Clear filters")}</button></div>`}`;
    wire();
    if (keep && $(keep)) { const el = $(keep); el.focus(); try { if (caret != null) el.setSelectionRange(caret, caret); } catch { /* */ } }
  }
  const again = () => { shown = 120; save(); render(); };
  function wire() {
    $("q").addEventListener("input", (e) => { v.q = e.target.value; again(); });

      else if (k === "rar") v.rar = v.rar.filter((x) => x !== val); else if (k === "cost") v.cost = v.cost.filter((x) => String(x) !== val);

      $("fApply").onclick = () => { v = f; sh.close(); again(); };

  // MYP Cards: lowest listing in Brazil, next to the TCGplayer price (it does not separate normal and foil)
  const brLine = (id) => { const e = BR?.cards?.[id]; if (!e) return "";
    return `<a class="list-row on-field" data-testid="card-br" href="${esc(BR.product_url.replace("{path}", e[1]))}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;margin-bottom:var(--sp-3)">
      <span class="t"><span>${esc(Tx("In Brazil from {p}", { p: money(e[0]) }))}</span><span class="meta">${esc(Tx("Lowest listing on MYP Cards, {d}", { d: new Date(BR.retrieved_at).toLocaleDateString(LOC, { day: "numeric", month: "short" }) }))}</span></span><i class="ic i-external"></i></a>`; };
  // ---------- one card ----------
  let redrawSheet = null;   // the open card sheet redraws itself when a save fails and the counts go back
  let pendingTimer = null, pending = new Map();   // "id:kind" -> delta, sent after 600ms
  function openCard(id, from) {
    const c = BY.get(id), sh = $("cardSheet"); if (!c) return;
    let mv = null;   // {k, to, qty}: the "how many?" step before moving between Fichário and Casa
    let act = null;  // {kind: "loan" | "sale", ...}: Emprestar / Vender, drawn by actPanel() below
    const draw = () => {
      const o = owned(id), pn = priceOf(id), pf = priceOf(id, true), [a, b] = split(c.name);
      const value = (pn || 0) * o.n + (pf || 0) * o.f, lw = lentWho.get(id) || [];
      const w = where(id);
      // one stock: Normal and Foil with − / +, and a button that moves one copy to the other stock
      const stockRows = (place) => ["n", "f"].map((k) => {

        const mvBtn = (to) => `<button type="button" class="btn ghost small mv" data-mv="${k}:${to}${place === "trade" ? ":trade" : ""}" ${n <= 0 ? "disabled" : ""} aria-label="${esc(to === "trade" ? P(`Mover uma ${kl} para Trocas`, `Move one ${kl} to Trades`) : Tx(to === "home" ? "Move one {k} to Home" : "Move one {k} to the Binder", { k: kl }))}">${to === "trade" ? esc(P("→ Trocas", "→ Trades")) : to === "home" ? Tx("→ Home") : Tx("→ Binder")}</button>`;
        return `<div class="row between stock-row" style="min-height:56px">
          <div><b>${Tx(k === "f" ? "Foil" : "Normal")}</b>${place === "binder" && w.lent[k] ? `<div class="small muted">${esc(Tx("{n} lent", { n: w.lent[k] }))}</div>` : ""}</div>
          <div class="row" style="gap:6px;flex-wrap:nowrap">
            ${tos.map(mvBtn).join("")}
            <div class="qty lg"><button type="button" data-d="${k}:-1:${place}" aria-label="${esc(Tx("Remove one {k}", { k: kl }))}" ${n <= 0 ? "disabled" : ""}>−</button><output data-n="${place}-${k}">${n}</output><button type="button" data-d="${k}:1:${place}" aria-label="${esc(Tx("Add one {k}", { k: kl }))}">+</button></div></div></div>`;
      }).join("");
      const stocks = `<div class="card inset stack stocks" style="gap:0;padding:var(--sp-2) var(--sp-3)" data-testid="stocks">

        <div class="stock-h"><i class="ic i-home"></i>${Tx("Home")} <span class="muted">${w.home.n + w.home.f}</span></div>${stockRows("home")}
        ${tradeReady ? `<div class="stock-h" data-testid="stock-trade"><i class="ic i-trades"></i>${esc(P("Fichário de trocas", "Trade binder"))} <span class="muted">${w.trade.n + w.trade.f}</span></div>${stockRows("trade")}` : ""}
        ${w.lent.n + w.lent.f ? `<div class="stock-h"><i class="ic i-loan"></i>${Tx("Lent out")} <span class="muted">${w.lent.n + w.lent.f}</span></div>` : ""}</div>`;
      const moveBox = () => {
        const from = mv.from, max = w[from][mv.k], kl = Tx(mv.k === "f" ? "foil" : "normal");
        const oldWay = from !== "trade" && mv.to !== "trade";
        return `<div class="card inset stack movebox" data-testid="move-confirm" role="group" aria-labelledby="mvT">
          <b id="mvT">${esc(oldWay ? Tx(`Move ${mv.k === "f" ? "foil" : "normal"} cards to ${mv.to === "home" ? "Home" : "the Binder"}`) : P(`Mover cartas ${mv.k === "f" ? "foil" : "normais"} para ${mv.to === "trade" ? "o fichário de trocas" : "o Fichário"}`, `Move ${mv.k === "f" ? "foil" : "normal"} cards to ${mv.to === "trade" ? "the trade binder" : "the Binder"}`))}</b>
          <span class="small muted">${esc(from === "trade" ? P(`${max} no fichário de trocas`, `${max} in the trade binder`) : Tx(from === "home" ? "{n} at home" : "{n} in the binder", { n: max }))}</span>
          <div class="row" style="gap:var(--sp-3);justify-content:center;margin:var(--sp-2) 0">
            <div class="qty lg"><button type="button" data-mq="-1" aria-label="${Tx("One less")}" ${mv.qty <= 1 ? "disabled" : ""}>−</button><output id="mvQ">${mv.qty}</output><button type="button" data-mq="1" aria-label="${Tx("One more")}" ${mv.qty >= max ? "disabled" : ""}>+</button></div>
            <button type="button" class="btn small" data-mq="all" ${mv.qty >= max ? "disabled" : ""}>${esc(Tx("All ({n})", { n: max }))}</button></div>
          <div class="row" style="gap:var(--sp-2)"><button type="button" class="btn" id="mvCancel" style="flex:1">${Tx("Cancel")}</button>
            <button type="button" class="btn primary" id="mvOk" style="flex:2">${esc(mv.to === "trade" ? P(`Mover ${mv.qty} para Trocas`, `Move ${mv.qty} to Trades`) : Tx(mv.to === "home" ? "Move {n} to Home" : "Move {n} to the Binder", { n: mv.qty }))}</button></div></div>`;
      };
      const row = (k, label, n, ln) => `<div class="row between" style="min-height:60px${k === "f" ? ";border-top:1px solid var(--line)" : ""}"><div><b>${label}</b><div class="small muted">${esc([Tx("{n} free", { n: Math.max(0, n - ln) }), ln ? Tx("{n} lent", { n: ln }) : ""].filter(Boolean).join(" · "))}</div></div>
        <div class="qty lg"><button type="button" data-d="${k}:-1" aria-label="${esc(Tx("Remove one {k}", { k: Tx(k === "f" ? "foil" : "normal") }))}" ${n <= 0 ? "disabled" : ""}>−</button><output data-n="${k}">${n}</output><button type="button" data-d="${k}:1" aria-label="${esc(Tx("Add one {k}", { k: Tx(k === "f" ? "foil" : "normal") }))}">+</button></div></div>`;
      sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><div><h2 id="cT">${esc(a)}${b ? ` · ${esc(b)}` : ""}</h2><div class="sub">${esc(setName(c.set))} · nº ${esc(c.num)}</div></div><button type="button" class="btn ghost icon" data-close aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>
        <div class="sheet-body">${thumb(c, "big", o.f > 0)}</span>
          <div class="row" style="gap:var(--sp-2)">${inkDots(c)}<span class="small muted">${esc([inksOf(c).join("/"), c.cost != null ? Tx("cost {c}", { c: c.cost }) : "", rarName(c.rarity)].filter(Boolean).join(" · "))}</span></div>
          <p class="small" style="margin:var(--sp-2) 0 0" data-testid="card-format">${esc(formatLine(c))}</p>
          <div class="row between" style="align-items:flex-end;margin:var(--sp-4) 0">
            <div><div class="small muted">${esc(Tx("Value of your {n}", { n: o.n + o.f }))}</div><div class="hero-num" style="color:var(--money)" data-testid="card-value">${esc(money(value))}</div></div>
            <div class="small muted" style="text-align:right" data-testid="card-prices">${Tx("Normal")} ${pn != null ? esc(money(pn)) : "–"} <span class="faint">${esc(srcOf(id, false))}</span><br>${Tx("Foil")} ${pf != null ? esc(money(pf)) : "–"} <span class="faint">${esc(priceSrc)}</span></div></div>
          ${brLine(id)}
          ${act ? `<div id="actBox" data-testid="act-${act.kind}"></div>` : `${homeReady ? (mv ? moveBox() : stocks) : `<div class="card inset stack" style="gap:0;padding:var(--sp-2) var(--sp-3)">${row("n", Tx("Normal"), o.n, lentN.get(id) || 0)}${row("f", Tx("Foil"), o.f, lentF.get(id) || 0)}</div>`}
          ${avail(id).n + avail(id).f ? `<div class="row act-btns"><button type="button" class="btn" id="aLoan"><i class="ic i-loan"></i>${Tx("Lend")}</button><button type="button" class="btn" id="aSale"><i class="ic i-trades"></i>${Tx("Sell")}</button></div>` : ""}`}
          ${lw.length ? `<h3 style="margin:var(--sp-5) 0 var(--sp-2)">${Tx("Lent")}</h3>${lw.map((x) => `<div class="list-row on-field"><span class="av sm">${esc((x.who || "?")[0].toUpperCase())}</span><span class="t"><span>${esc(x.who)}</span><span class="meta">${esc([`${x.qty} ${Tx(x.foil ? "foil" : "normal")}`, x.due ? Tx("until {d}", { d: new Date(x.due + "T12:00:00").toLocaleDateString(LOC, { day: "numeric", month: "short" }) }) : ""].filter(Boolean).join(" · "))}</span></span><a class="btn ghost small" href="../trades/">${Tx("See")}</a></div>`).join("")}` : ""}
          <p class="small faint" style="margin:var(--sp-3) 0 0">${Tx("Changes save right away. You can undo from the notice at the bottom.")}</p></div>
        <div class="sheet-foot"><a class="btn" href="../trades/?tab=board&q=${encodeURIComponent(a)}"><i class="ic i-board"></i>${Tx("Post on the board")}</a></div>`;
      sh.querySelectorAll("[data-close]").forEach((x) => x.onclick = () => sh.close());
      sh.querySelectorAll("[data-d]").forEach((x) => x.onclick = () => { const [k, d, place] = x.dataset.d.split(":"); change(id, k, +d, false, place || "binder"); draw(); sh.querySelector(`[data-d="${x.dataset.d}"]`)?.focus(); });
      sh.querySelectorAll("[data-mv]").forEach((x) => x.onclick = () => { const [k, to, fr] = x.dataset.mv.split(":"); mv = { k, to, from: fr || (to === "binder" ? "home" : "binder"), qty: 1, key: x.dataset.mv }; draw(); $("mvOk")?.focus(); });
      sh.querySelectorAll("[data-mq]").forEach((x) => x.onclick = () => {
        const max = where(id)[mv.from][mv.k];
        mv.qty = x.dataset.mq === "all" ? max : Math.min(max, Math.max(1, mv.qty + +x.dataset.mq)); draw();
        (sh.querySelector(`[data-mq="${x.dataset.mq}"]:not([disabled])`) || $("mvOk"))?.focus();
      });
      $("aLoan")?.addEventListener("click", () => { const k = avail(id).n ? "n" : "f"; act = { kind: "loan", items: [{ id, k, qty: 1 }], person: "", due: "", note: "" }; draw(); });
      $("aSale")?.addEventListener("click", () => { const k = avail(id).n ? "n" : "f"; act = { kind: "sale", combo: false, items: [{ id, k, qty: 1, price: unitPrice(id, k) }], date: today(), buyer: "", total: null, q: "" }; draw(); });
      if (act) actPanel(sh, act, () => { act = null; draw(); });
      $("mvCancel")?.addEventListener("click", () => { const back = `[data-mv="${mv.key}"]`; mv = null; draw(); sh.querySelector(back)?.focus(); });
      $("mvOk")?.addEventListener("click", () => { const { k, to, from: fr, qty, key } = mv; mv = null; move(id, k, qty, to, false, fr); draw(); sh.querySelector(`[data-mv="${key}"]:not([disabled])`)?.focus(); });
    };
    draw(); redrawSheet = () => { if (sh.open) { mv = null; act = null; draw(); } };
    openSheet(sh, from);
    sh.addEventListener("close", () => { redrawSheet = null; renderAll(); }, { once: true });
  }
  // ---------- Emprestar / Vender / Venda combo (from the card sheet) ----------
  // A loan goes to Trocas → Empréstimos; a sale is a trade where you gave the cards and received money, each card
  // keeping its own price (trades.gave[].price) and the total allowing a discount. Sold cards leave the binder first, then home.
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const avail = (id) => { const w = where(id); return { n: w.binder.n + w.home.n, f: w.binder.f + w.home.f }; };   // what can leave (not lent)
  const unitPrice = (id, k) => { const v = priceOf(id, k === "f"); return v == null ? "" : (Math.round(v * 100) / 100).toFixed(2); };
  const num = (v) => { const x = parseFloat(String(v).replace(",", ".")); return Number.isFinite(x) ? x : 0; };
  function actPanel(sh, a, close) {
    const box = $("actBox"), sale = a.kind === "sale";
    const sum = () => Math.round(a.items.reduce((t, it) => t + num(it.price) * it.qty, 0) * 100) / 100;
    const total = () => (a.total == null || a.total === "" ? sum() : num(a.total));
    const draw = () => {
      const item = (it, i) => {
        const c = BY.get(it.id), [nm, ver] = split(c?.name || it.id), av = avail(it.id), both = av.n > 0 && av.f > 0, max = av[it.k];
        return `<div class="act-item" data-i="${i}">
          <div class="row between" style="gap:var(--sp-2)"><div style="min-width:0"><b>${esc(nm)}</b>${ver ? ` <span class="small muted">${esc(ver)}</span>` : ""}<div class="small muted">${esc(setName(c?.set))} · nº ${esc(c?.num || "")}${!both ? " · " + Tx(it.k === "f" ? "foil" : "normal") : ""}</div></div>
            ${a.items.length > 1 ? `<button type="button" class="btn ghost icon small" data-rm="${i}" aria-label="${esc(Tx("Remove {c}", { c: nm }))}"><i class="ic i-close"></i></button>` : ""}</div>
          <div class="row" style="gap:var(--sp-2);flex-wrap:wrap;margin-top:6px">
            ${both ? `<div class="seg" role="group" aria-label="${Tx("Finish")}">${["n", "f"].map((k) => `<button type="button" data-fin="${i}:${k}" aria-pressed="${it.k === k}">${Tx(k === "f" ? "Foil" : "Normal")}</button>`).join("")}</div>` : ""}
            <div class="qty"><button type="button" data-q="${i}:-1" aria-label="${Tx("One less")}" ${it.qty <= 1 ? "disabled" : ""}>−</button><output data-qn="${i}">${it.qty}</output><button type="button" data-q="${i}:1" aria-label="${Tx("One more")}" ${it.qty >= max ? "disabled" : ""}>+</button></div>
            ${sale ? `<label class="field inline-field">${Tx("Each")}<span class="prefix"><span>R$</span><input type="text" inputmode="decimal" data-price="${i}" value="${esc(it.price)}" aria-label="${esc(Tx("Price of {c}", { c: nm }))}"></span></label>` : ""}
          </div></div>`;
      };
      const results = () => {
        const words = norm(a.q).split(" ").filter(Boolean); if (!words.length) return "";
        const rows = CARDS.filter((x) => (avail(x.id).n + avail(x.id).f) > 0 && words.every((w) => x.k.includes(w))).slice(0, 8);
        return rows.length ? rows.map((x) => { const [nm, ver] = split(x.name); return `<button type="button" class="list-row flat" data-add="${esc(x.id)}">${thumb(x, "xs", false)}</span><span class="t"><span>${esc(nm)}${ver ? ` · ${esc(ver)}` : ""}</span><span class="meta">${esc(setName(x.set))} · nº ${esc(x.num)}</span></span><i class="ic i-plus"></i></button>`; }).join("")
          : `<p class="small muted">${Tx("None of your cards match.")}</p>`;

  // ---------- fichário de trocas: send every copy above N (default 4, a playset) from the binder to the trade binder ----------
  const KEEP_KEY = "inkwell-trade-keep";
  function openTradeFill(from) {
    const sh = $("tradeSheet");
    let keep = 4, foilsStay = true, busy = false;
    try { keep = Math.max(1, Math.min(99, parseInt(localStorage.getItem(KEEP_KEY) || "4", 10))); if (!Number.isFinite(keep)) keep = 4; foilsStay = localStorage.getItem(KEEP_KEY + "-foil") !== "0"; } catch { /* */ }
    // by card NAME, like the deck rule: reprints and other printings of the same card count together.
    // A reprint plays as the same card, so which printing goes doesn't matter for decks: the one you have most of in the
    // binder goes first, Enchanted/Epic/Iconic last, normal before foil.
    const plan = () => {
      const out = [], seen = new Set(), col = coll(), special = new Set(["E", "EP", "I"]);
      for (const id of Object.keys(col)) {
        const c0 = BY.get(id); if (!c0) continue;
        const key = nkey(c0.name); if (seen.has(key)) continue; seen.add(key);
        const ids = (BYNAME.get(key) || [c0]).map((c) => c.id).filter((x) => col[x]);
        let total = 0, inTrade = 0;
        for (const x of ids) { const w = where(x); total += w.all.n + w.all.f; inTrade += w.trade.n + w.trade.f; }
        let left = total - keep - inTrade; if (left <= 0) continue;
        const rank = (x) => (special.has(BY.get(x)?.rarity) ? 1 : 0);
        const order = ids.slice().sort((a, b) => rank(a) - rank(b) || (where(b).binder.n + where(b).binder.f) - (where(a).binder.n + where(a).binder.f));
        const mv = new Map();
        for (const k of foilsStay ? ["n", "f"] : ["f", "n"]) for (const x of order) {
          if (left <= 0) break;
          const q = Math.min(left, where(x).binder[k]); if (!q) continue;
          const m = mv.get(x) || { id: x, n: 0, f: 0, name: key }; m[k] += q; mv.set(x, m); left -= q;
        }
        out.push(...mv.values());
      }
      return out.sort((a, b) => (BY.get(a.id)?.name || "").localeCompare(BY.get(b.id)?.name || "") || a.id.localeCompare(b.id));
    };
    const draw = (msg = "") => {
      const pl = plan(), copies = pl.reduce((t, x) => t + x.n + x.f, 0), names = new Set(pl.map((x) => x.name)).size;
      sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="tfT">${esc(P("Separar repetidas para trocas", "Set extras aside to trade"))}</h2><button type="button" class="btn ghost icon" data-close aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>
        <div class="sheet-body stack" style="gap:var(--sp-3)">
          <p class="small muted" style="margin:0">${esc(P("Conta pelo nome da carta, como no deck: reimpressões, normal e foil somam juntas. Fica esse número no fichário (ou em casa); o que passar vai para o fichário de trocas (as Encantadas por último).", "Counted by card name, like in a deck: reprints, normal and foil add up. That many stay in the binder (or at home); the rest goes to the trade binder (Enchanted last)."))}</p>
          <div class="row" style="gap:var(--sp-3);align-items:center;flex-wrap:wrap"><span>${esc(P("Manter", "Keep"))}</span>
            <div class="qty lg"><button type="button" data-k="-1" aria-label="${esc(P("Uma a menos", "One less"))}" ${keep <= 1 ? "disabled" : ""}>−</button><output id="tfKeep" data-testid="trade-keep">${keep}</output><button type="button" data-k="1" aria-label="${esc(P("Uma a mais", "One more"))}" ${keep >= 99 ? "disabled" : ""}>+</button></div>
            <span>${esc(P("de cada carta", "of each card"))}${keep === 4 ? ` <span class="tag info">${esc(P("play set", "playset"))}</span>` : ` <button type="button" class="btn ghost small" id="tf4">${esc(P("Voltar para 4", "Back to 4"))}</button>`}</span></div>
          <label class="switch"><span>${esc(P("Manter as foils no fichário", "Keep foils in the binder"))}<small>${esc(P("Vão primeiro as normais.", "Normal copies go first."))}</small></span><input type="checkbox" role="switch" id="tfFoil" ${foilsStay ? "checked" : ""}></label>
          <p style="margin:0" data-testid="trade-plan"><b>${esc(copies ? P(`${copies} ${copies === 1 ? "cópia" : "cópias"} de ${names} ${names === 1 ? "carta" : "cartas"} ${copies === 1 ? "vai" : "vão"} para o fichário de trocas.`, `${copies} ${copies === 1 ? "copy" : "copies"} of ${names} ${names === 1 ? "card" : "cards"} go to the trade binder.`) : P("Nada a separar: nenhuma carta passa desse número no fichário.", "Nothing to set aside: no card goes above that number in the binder."))}</b></p>
          ${pl.length ? `<div class="imp-list small">${pl.slice(0, 200).map((x) => { const c = BY.get(x.id); return `<div><span>${esc(c?.name || x.id)}</span><span class="muted">${esc(c ? setName(c.set) + " · nº " + c.num : "")}</span><b>${x.n ? x.n : ""}${x.n && x.f ? " + " : ""}${x.f ? `${x.f} foil` : ""}</b></div>`; }).join("")}${pl.length > 200 ? `<div class="muted">… ${esc(Tx("and {n} more", { n: pl.length - 200 }))}</div>` : ""}</div>` : ""}
          <p class="small" id="tfMsg" role="alert" style="margin:0">${esc(msg)}</p></div>
        <div class="sheet-foot"><button type="button" class="btn ghost" data-close>${Tx("Cancel")}</button><button type="button" class="btn primary" id="tfGo" data-testid="trade-go" ${copies && !busy ? "" : "disabled"}>${esc(copies ? P(`Mover ${copies} para Trocas`, `Move ${copies} to Trades`) : P("Mover", "Move"))}</button></div>`;
      sh.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => sh.close());
      const saveKeep = () => { try { localStorage.setItem(KEEP_KEY, String(keep)); localStorage.setItem(KEEP_KEY + "-foil", foilsStay ? "1" : "0"); } catch { /* */ } };
      sh.querySelectorAll("[data-k]").forEach((b) => b.onclick = () => { keep = Math.max(1, Math.min(99, keep + +b.dataset.k)); saveKeep(); draw(); sh.querySelector(`[data-k="${b.dataset.k}"]:not([disabled])`)?.focus(); });
      $("tf4")?.addEventListener("click", () => { keep = 4; saveKeep(); draw(); });
      $("tfFoil").onchange = (e) => { foilsStay = e.target.checked; saveKeep(); draw(); $("tfFoil").focus(); };
      $("tfGo").onclick = () => go(pl);
    };
    const send = async (p, items) => {
      for (let i = 0; i < items.length; i += 400) {   // the server takes 400 changes per call
        await CLOUD.api("rpc/collection_move", { method: "POST", prefer: "return=minimal", body: { p_owner: p.shared ? p.owner : null, p_profile: p.shared ? p.pname : p.profile, p_delta: [], p_home: [], p_trade: items.slice(i, i + 400) } });
      }
    };
    const applyLocal = (p, items, sign) => { for (const d of items) { const tk = `${p.profile}|${d.card_id}`, t = TRADE.get(tk) || { n: 0, f: 0 }, k = d.foil ? "f" : "n"; t[k] = Math.max(0, t[k] + sign * d.qty); TRADE.set(tk, t); } };
    async function go(pl) {
      const p = prof(); if (!p || busy) return;
      const items = pl.flatMap((x) => [x.n ? { card_id: x.id, qty: x.n, foil: false } : null, x.f ? { card_id: x.id, qty: x.f, foil: true } : null]).filter(Boolean);
      busy = true; $("tfGo").disabled = true; $("tfGo").textContent = P("Movendo…", "Moving…");
      try {
        await flush(true); await send(p, items); applyLocal(p, items, 1);
        sh.close(); v.place = "trade"; save(); renderAll();
        const n = items.reduce((t, d) => t + d.qty, 0);
        toast(P(`${n} ${n === 1 ? "cópia foi" : "cópias foram"} para o fichário de trocas`, `${n} ${n === 1 ? "copy" : "copies"} moved to the trade binder`), async () => {
          try { await send(p, items.map((d) => ({ ...d, qty: -d.qty }))); applyLocal(p, items, -1); renderAll(); } catch { toast(Tx("Couldn't save. Try again."), null, true); }
        });
      } catch { busy = false; draw(Tx("Couldn't save. Try again.")); }
    }
    draw(); openSheet(sh, from);
  }

  // ---------- the trade binder on the Mural: one "Troco" post per card (normal and foil apart), kept in step ----------
  async function openTradePost(from) {
    const sh = $("tradeSheet"), p = prof(); if (!p || p.shared || p.friend) return;
    const want = [];
    for (const id of Object.keys(coll())) { const t = where(id).trade; for (const k of ["n", "f"]) if (t[k] > 0 && BY.has(id)) want.push({ card_id: id, foil: k === "f", qty: Math.min(99, t[k]) }); }
    let mine = null, note = "", msg = "";
    const draw = () => {
      const copies = want.reduce((t, x) => t + x.qty, 0), gone = (mine || []).filter((l) => !want.some((w) => w.card_id === l.card_id && w.foil === !!l.foil));
      sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="tfT">${esc(P("Anunciar no Mural", "Post on the board"))}</h2><button type="button" class="btn ghost icon" data-close aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>
        <div class="sheet-body stack" style="gap:var(--sp-3)">
          <p style="margin:0" data-testid="trade-post-plan"><b>${esc(want.length ? P(`${want.length} ${want.length === 1 ? "anúncio" : "anúncios"} “Troco” (${copies} ${copies === 1 ? "cópia" : "cópias"}).`, `${want.length} “I trade” ${want.length === 1 ? "post" : "posts"} (${copies} ${copies === 1 ? "copy" : "copies"}).`) : P("Seu fichário de trocas está vazio.", "Your trade binder is empty."))}</b></p>
          <p class="small muted" style="margin:0">${esc(P("O Mural passa a mostrar o que está no seu fichário de trocas. Amigos podem propor uma troca direto do anúncio. Se você anunciar de novo depois de mudar o fichário, os anúncios acompanham.", "The board shows what is in your trade binder. Friends can propose a trade right from the post. Post again after changing the binder and the posts follow."))}${gone.length ? " " + esc(P(`${gone.length} ${gone.length === 1 ? "anúncio antigo sai" : "anúncios antigos saem"} (não estão mais no fichário).`, `${gone.length} old ${gone.length === 1 ? "post goes" : "posts go"} (no longer in the binder).`)) : ""}</p>
          <label class="field">${esc(P("Recado no anúncio (opcional)", "Note on the posts (optional)"))}<input type="text" id="tpNote" maxlength="200" value="${esc(note)}" placeholder="${esc(P("Ex.: troco por cartas do set 14", "E.g. swapping for set 14 cards"))}"></label>
          <p class="small" id="tpMsg" role="alert" style="margin:0">${esc(msg)}</p></div>
        <div class="sheet-foot"><button type="button" class="btn ghost" data-close>${Tx("Cancel")}</button><button type="button" class="btn primary" id="tpGo" data-testid="trade-post-go" ${mine !== null && (want.length || gone.length) ? "" : "disabled"}>${esc(P("Anunciar", "Post"))}</button></div>`;
      sh.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => sh.close());
      $("tpNote").oninput = (e) => { note = e.target.value; };
      $("tpGo").onclick = () => go(gone);
    };
    async function go(gone) {
      const b = $("tpGo"); b.disabled = true; b.textContent = P("Anunciando…", "Posting…");
      try {
        const n = note.trim().slice(0, 200), old = mine || [];
        if (gone.length) await CLOUD.api(`listings?id=in.(${gone.map((l) => l.id).join(",")})`, { method: "DELETE", prefer: "return=minimal" });
        for (const w of want) {
          const l = old.find((x) => x.card_id === w.card_id && !!x.foil === w.foil);
          if (l && (l.qty !== w.qty || (n && l.note !== n))) await CLOUD.api(`listings?id=eq.${l.id}`, { method: "PATCH", prefer: "return=minimal", body: { qty: w.qty, ...(n ? { note: n } : {}), updated_at: new Date().toISOString() } });
        }
        const add = want.filter((w) => !old.some((x) => x.card_id === w.card_id && !!x.foil === w.foil)).map((w) => ({ user_id: me.id, kind: "trade", card_id: w.card_id, foil: w.foil, qty: w.qty, note: n }));
        if (add.length) await CLOUD.api("listings", { method: "POST", prefer: "return=minimal", body: add });
        sh.close(); toast(want.length ? P(`Pronto: ${want.length} ${want.length === 1 ? "carta" : "cartas"} no Mural como “Troco”.`, `Done: ${want.length} ${want.length === 1 ? "card" : "cards"} on the board as “I trade”.`) : P("Anúncios retirados do Mural.", "Posts removed from the board."));
      } catch (e) {
        msg = /check|kind/.test(String(e?.why || "")) ? P("O Mural ainda não aceita “Troco”: falta rodar supabase/trade_binder_board.sql.", "The board doesn't take “I trade” yet: supabase/trade_binder_board.sql still needs to run.") : Tx("Couldn't save. Try again.");
        draw();
      }
    }
    draw(); openSheet(sh, from);
    mine = await CLOUD.api(`listings?user_id=eq.${me.id}&kind=eq.trade&select=id,card_id,foil,qty,note`).catch(() => []);
    if (sh.open) draw();
  }

  // ---------- compartilhar: your collections, people who share one, friends (see / borrow), shared with you ----------
  const firstName = (n) => String(n || "").split(" ")[0] || P("alguém", "someone");
  const why = (e) => String(e?.why || e?.message || "");
  function openShare(from) {
    const sh = $("shareSheet"); let link = null, linkEdit = false, newOpen = false, renaming = null, sure = null, msg = "";
    const mine = () => (prof()?.shared || prof()?.friend ? ownBest() : prof());
    const reload = async () => { const p = await CLOUD.collections("profile,updated_at,collection:data->collection").catch(() => null);
      if (Array.isArray(p)) profiles = p.map((x) => ({ ...x, collection: x.collection && typeof x.collection === "object" ? x.collection : {} }));
      await loadShares(); renderAll(); };
    const say = (t) => { msg = t; draw(); };
    const cardsIn = (p) => Object.values(p.collection || {}).reduce((t, e) => t + (+e.n || 0) + (+e.f || 0), 0);
    function draw() {
      const m = mine(), people = shareInfo.given.filter((g) => g.profile === m?.profile);
      const ownRows = profiles.map((x) => {
        const on = prof() === x, k = esc(x.profile);
        if (renaming === x.profile) return `<div class="list-row flat"><input class="grow" id="rnName" maxlength="40" value="${k}" aria-label="${esc(P("Novo nome", "New name"))}"><button type="button" class="btn small primary" id="rnOk">${esc(P("Salvar", "Save"))}</button><button type="button" class="btn small ghost" id="rnNo">${esc(P("Cancelar", "Cancel"))}</button></div>`;
        return `<div class="list-row flat" data-own="${k}"><span class="t"><span>${esc(collName(x))}${on ? ` <span class="tag match">${esc(P("aberta", "open"))}</span>` : ""}</span><span class="meta">${esc(cardsIn(x) === 1 ? P("1 carta", "1 card") : P(`${cardsIn(x)} cartas`, `${cardsIn(x)} cards`))}${shareInfo.given.some((g) => g.profile === x.profile) ? " · " + esc(P("compartilhada", "shared")) : ""}</span></span>
          <span class="row" style="gap:4px;flex-wrap:nowrap">${on ? "" : `<button type="button" class="btn small" data-use="${k}">${esc(P("Abrir", "Open"))}</button>`}<button type="button" class="btn small ghost" data-rn="${k}" aria-label="${esc(P(`Renomear ${collName(x)}`, `Rename ${collName(x)}`))}"><i class="ic i-edit"></i></button>${profiles.length > 1 ? `<button type="button" class="btn small ghost${sure === "del:" + x.profile ? " danger" : ""}" data-del="${k}" aria-label="${esc(P(`Apagar ${collName(x)}`, `Delete ${collName(x)}`))}">${sure === "del:" + x.profile ? esc(P("Apagar mesmo?", "Really delete?")) : `<i class="ic i-trash"></i>`}</button>` : ""}</span></div>`;
      }).join("");
      sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="shT">${esc(P("Compartilhar coleção", "Share collection"))}</h2><button type="button" class="btn ghost icon" data-close aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>
        <div class="sheet-body stack" style="gap:var(--sp-5)">
          <section class="stack" style="gap:var(--sp-2)" data-testid="share-own"><h3 style="margin:0">${esc(P("Minhas coleções", "My collections"))}</h3>
            <p class="small muted" style="margin:0">${esc(P("Você pode ter mais de uma: por exemplo, uma compartilhada com quem mora com você e outra só sua.", "You can keep more than one: say, one shared with someone you live with and one only yours."))}</p>
            <div class="list tight divided">${ownRows}</div>
            ${newOpen ? `<div class="row" style="gap:var(--sp-2);flex-wrap:nowrap"><input class="grow" id="newName" maxlength="40" placeholder="${esc(P("Nome (ex.: Só minha)", "Name (e.g. Only mine)"))}" aria-label="${esc(P("Nome da nova coleção", "New collection name"))}"><button type="button" class="btn primary" id="newOk">${esc(P("Criar", "Create"))}</button></div>`
              : `<button type="button" class="btn" id="newColl" style="justify-self:start"><i class="ic i-plus"></i>${esc(P("Nova coleção", "New collection"))}</button>`}</section>
          ${m ? `<section class="stack" style="gap:var(--sp-2)" data-testid="share-people"><h3 style="margin:0">${esc(P(`Dividir «${collName(m)}» com alguém`, `Share “${collName(m)}” with someone`))}</h3>
            <p class="small muted" style="margin:0">${esc(P("Uma coleção só, para os dois: a pessoa vê tudo e, se você deixar, também altera. Dá para mudar ou tirar o acesso quando quiser.", "One collection for both of you: they see everything and, if you allow, change it too. You can change or remove access any time."))}</p>
            ${people.length ? `<div class="list tight divided">${people.map((g) => `<div class="stack" style="gap:0" data-member="${esc(g.member)}"><div class="list-row flat"><span class="av sm">${esc(firstName(g.name)[0].toUpperCase())}</span><span class="t"><span>${esc(g.name || P("Sem nome", "No name"))}</span></span>
              <button type="button" class="btn small ghost${sure === "rm:" + g.member ? " danger" : ""}" data-rm="${esc(g.member)}">${esc(sure === "rm:" + g.member ? P("Remover mesmo?", "Really remove?") : P("Remover", "Remove"))}</button></div>
              <label class="switch" style="border:0"><span>${esc(P("Pode alterar", "Can change"))}<small>${esc(g.can_edit ? P("Vê e altera.", "Sees and changes.") : P("Só vê.", "Only sees."))}</small></span><input type="checkbox" role="switch" data-edit="${esc(g.member)}" ${g.can_edit ? "checked" : ""}></label></div>`).join("")}</div>` : ""}
            ${link ? `<div class="card inset stack" style="gap:var(--sp-2)" data-testid="share-link"><span class="small">${esc(linkEdit ? P("Convite para ver e alterar. Vale para 1 pessoa, por 7 dias. Funciona mesmo se ela ainda não tiver conta.", "Invite to see and change. For 1 person, 7 days. Works even without an account yet.") : P("Convite só para ver. Vale para 1 pessoa, por 7 dias. Funciona mesmo se ela ainda não tiver conta.", "View-only invite. For 1 person, 7 days. Works even without an account yet."))}</span>
                <input readonly value="${esc(link)}" id="linkTxt" aria-label="${esc(P("Link do convite", "Invite link"))}" onclick="this.select()"><div class="row" style="gap:var(--sp-2)"><button type="button" class="btn primary" id="linkSend">${esc(P("Enviar", "Send"))}</button><button type="button" class="btn" id="linkCopy">${esc(P("Copiar", "Copy"))}</button></div></div>`
              : `<label class="switch"><span>${esc(P("A pessoa pode alterar", "They can change it"))}<small>${esc(P("Desligado: só vê.", "Off: view only."))}</small></span><input type="checkbox" role="switch" id="invEdit" ${linkEdit ? "checked" : ""}></label>
                <button type="button" class="btn primary" id="mkLink" style="justify-self:start" data-testid="make-invite">${esc(P("Criar link de convite", "Create invite link"))}</button>`}</section>` : ""}
          <section class="stack" style="gap:0" data-testid="share-friends"><h3 style="margin:0 0 var(--sp-2)">${esc(P("Amigos", "Friends"))}</h3>
            ${profiles.length > 1 ? `<label class="field small">${esc(P("Coleção que os amigos veem", "Collection friends see"))}<select id="pvProf">${profiles.map((x) => `<option value="${esc(x.profile)}" ${(privacy.profile || m?.profile) === x.profile ? "selected" : ""}>${esc(collName(x))}</option>`).join("")}</select></label>` : ""}
            <label class="switch"><span>${esc(P("Amigos podem ver minha coleção", "Friends can see my collection"))}<small>${esc(P("Só ver. Aparece um botão “Ver coleção” no seu perfil para quem é seu amigo.", "View only. Friends get a “See collection” button on your profile."))}</small></span><input type="checkbox" role="switch" id="pvView" ${privacy.view ? "checked" : ""}></label>
            <label class="switch"><span>${esc(P("Aceito pedidos de empréstimo", "I take borrow requests"))}<small>${esc(P("Ao montar um deck, seus amigos veem quais das cartas que faltam você tem livres e podem pedir emprestado. Você aceita ou recusa cada pedido.", "When building a deck, friends see which missing cards you have free and can ask to borrow them. You accept or decline each request."))}</small></span><input type="checkbox" role="switch" id="pvLend" ${privacy.lend ? "checked" : ""}></label></section>
          ${shared.length ? `<section class="stack" style="gap:var(--sp-2)" data-testid="share-received"><h3 style="margin:0">${esc(P("Compartilhadas comigo", "Shared with me"))}</h3><div class="list tight divided">${shared.map((x) => `<div class="list-row flat"><span class="t"><span>${esc(collName(x))}</span><span class="meta">${esc(x.canEdit ? P("pode alterar", "can change") : P("só ver", "view only"))}</span></span>
            <span class="row" style="gap:4px;flex-wrap:nowrap">${prof() === x ? `<span class="tag match">${esc(P("aberta", "open"))}</span>` : `<button type="button" class="btn small" data-use="${esc(x.profile)}">${esc(P("Abrir", "Open"))}</button>`}<button type="button" class="btn small ghost${sure === "leave:" + x.profile ? " danger" : ""}" data-leave="${esc(x.profile)}">${esc(sure === "leave:" + x.profile ? P("Sair mesmo?", "Really leave?") : P("Sair", "Leave"))}</button></span></div>`).join("")}</div></section>` : ""}
          <p class="small" id="shMsg" role="alert" style="margin:0">${esc(msg)}</p></div>`;
      sh.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => sh.close());
      sh.querySelectorAll("[data-use]").forEach((b) => b.onclick = () => { useSource(b.dataset.use); draw(); });
      sh.querySelectorAll("[data-rn]").forEach((b) => b.onclick = () => { renaming = b.dataset.rn; draw(); $("rnName")?.focus(); });
      $("rnNo")?.addEventListener("click", () => { renaming = null; draw(); });
      $("rnOk")?.addEventListener("click", async () => {
        const old = renaming, name = $("rnName").value.trim(); if (!name) return;
        try { await CLOUD.api("rpc/rename_collection", { method: "POST", body: { p_profile: old, p_name: name } });
          if (source === old) source = name; if (profileName === old) profileName = name; try { if (localStorage.getItem(SRC_KEY) === old) localStorage.setItem(SRC_KEY, name); } catch { /* */ }
          renaming = null; msg = ""; await reload(); draw(); }
        catch (e) { say(/name_taken/.test(why(e)) ? P("Você já tem uma coleção com esse nome.", "You already have a collection with that name.") : Tx("Couldn't save. Try again.")); }
      });
      sh.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
        const k = "del:" + b.dataset.del; if (sure !== k) { sure = k; draw(); return; }
        sure = null;
        try { await CLOUD.api("rpc/delete_collection", { method: "POST", body: { p_profile: b.dataset.del } }); if (source === b.dataset.del) useSource(null); await reload(); msg = P("Coleção apagada.", "Collection deleted."); draw(); }
        catch { say(Tx("Couldn't save. Try again.")); }
      });
      $("newColl")?.addEventListener("click", () => { newOpen = true; draw(); $("newName")?.focus(); });
      $("newOk")?.addEventListener("click", async () => {
        const name = $("newName").value.trim(); if (!name) { $("newName").focus(); return; }
        try { await CLOUD.api("rpc/create_collection", { method: "POST", body: { p_name: name } }); newOpen = false; await reload(); useSource(name); msg = P(`Coleção «${name}» criada e aberta.`, `“${name}” created and opened.`); draw(); }
        catch (e) { const w = why(e); say(/name_taken/.test(w) ? P("Você já tem uma coleção com esse nome.", "You already have a collection with that name.") : /too_many/.test(w) ? P("Limite de 10 coleções.", "10 collections at most.") : Tx("Couldn't save. Try again.")); }
      });
      $("invEdit")?.addEventListener("change", (e) => { linkEdit = e.target.checked; });
      $("mkLink")?.addEventListener("click", async () => {
        try { const code = await CLOUD.api("rpc/create_share_invite", { method: "POST", body: { p_profile: m.profile, p_can_edit: linkEdit } });
          link = new URL(`./?compartilhar=${encodeURIComponent(code)}`, location.href).href; msg = ""; draw(); $("linkSend")?.focus(); }
        catch (e) { say(/too_many/.test(why(e)) ? P("Muitos convites hoje. Tente amanhã.", "Too many invites today. Try tomorrow.") : Tx("Couldn't save. Try again.")); }
      });
      $("linkCopy")?.addEventListener("click", async () => { try { await navigator.clipboard.writeText(link); say(P("Link copiado.", "Link copied.")); } catch { $("linkTxt").select(); } });
      $("linkSend")?.addEventListener("click", async () => { const text = P("Vamos dividir a coleção de Lorcana no Inkwell?", "Shall we share our Lorcana collection on Inkwell?");
        try { if (navigator.share) { await navigator.share({ title: "Inkwell", text, url: link }); return; } } catch { return; }
        try { await navigator.clipboard.writeText(link); say(P("Link copiado.", "Link copied.")); } catch { $("linkTxt").select(); } });
      sh.querySelectorAll("[data-edit]").forEach((x) => x.onchange = async () => {
        try { await CLOUD.api("rpc/set_collection_share", { method: "POST", body: { p_owner: me.id, p_profile: m.profile, p_member: x.dataset.edit, p_can_edit: x.checked } });
          const g = shareInfo.given.find((y) => y.member === x.dataset.edit && y.profile === m.profile); if (g) g.can_edit = x.checked; say(x.checked ? P("Agora pode alterar.", "Can change now.") : P("Agora só vê.", "View only now.")); }
        catch { x.checked = !x.checked; say(Tx("Couldn't save. Try again.")); }
      });
      sh.querySelectorAll("[data-rm]").forEach((b) => b.onclick = async () => {
        const k = "rm:" + b.dataset.rm; if (sure !== k) { sure = k; draw(); return; }
        sure = null;
        try { await CLOUD.api("rpc/set_collection_share", { method: "POST", body: { p_owner: me.id, p_profile: m.profile, p_member: b.dataset.rm, p_can_edit: null } });
          shareInfo.given = shareInfo.given.filter((y) => !(y.member === b.dataset.rm && y.profile === m.profile)); say(P("Acesso removido.", "Access removed.")); }
        catch { say(Tx("Couldn't save. Try again.")); }
      });
      sh.querySelectorAll("[data-leave]").forEach((b) => b.onclick = async () => {
        const k = "leave:" + b.dataset.leave; if (sure !== k) { sure = k; draw(); return; }
        sure = null; const x = shared.find((y) => y.profile === b.dataset.leave); if (!x) return;
        try { await CLOUD.api("rpc/set_collection_share", { method: "POST", body: { p_owner: x.owner, p_profile: x.pname, p_member: me.id, p_can_edit: null } });
          if (source === x.profile) useSource(null); await reload(); say(P("Você saiu da coleção.", "You left the collection.")); }
        catch { say(Tx("Couldn't save. Try again.")); }
      });
      const savePv = async () => {
        const pv = { profile: $("pvProf")?.value || privacy.profile || m?.profile, view: $("pvView").checked, lend: $("pvLend").checked };
        try { await CLOUD.api("rpc/set_collection_privacy", { method: "POST", body: { p_profile: pv.profile, p_view: pv.view, p_lend: pv.lend } }); privacy = pv; say(P("Salvo.", "Saved.")); }
        catch { say(Tx("Couldn't save. Try again.")); }
      };
      ["pvView", "pvLend", "pvProf"].forEach((id) => $(id)?.addEventListener("change", savePv));
    }
    draw(); openSheet(sh, from);
  }

  // ---------- a share invite: ?compartilhar=CODE (kept through signing in) ----------
  const INV_KEY = "inkwell-share-invite";
  function inviteCode() {
    const q = new URLSearchParams(location.search).get("compartilhar");
    if (q) { try { localStorage.setItem(INV_KEY, q); } catch { /* */ } return q; }
    try { return localStorage.getItem(INV_KEY); } catch { return null; }
  }
  const dropInvite = () => { try { localStorage.removeItem(INV_KEY); } catch { /* */ } if (/[?&]compartilhar=/.test(location.search)) history.replaceState(null, "", location.pathname); };
  async function offerInvite(code) {
    const info = await CLOUD.api("rpc/share_invite_info", { method: "POST", body: { p_code: code }, anon: true }).catch(() => null);
    const sh = $("shareSheet"), who = firstName(info?.name);
    const body = !info || !info.valid ? P("Este convite já foi usado ou venceu. Peça um novo link.", "This invite was used or has expired. Ask for a new link.")
      : info.mine ? P("Este é o seu próprio convite. Mande o link para a outra pessoa.", "This is your own invite. Send the link to the other person.")
      : info.can_edit ? P(`${who} quer dividir a coleção com você: você vê tudo e também pode alterar.`, `${who} wants to share their collection with you: you see everything and can change it too.`)
      : P(`${who} quer mostrar a coleção para você: você vê tudo (sem alterar).`, `${who} wants to show you their collection: you see everything (no changes).`);
    const ok = info && info.valid && !info.mine;
    sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="shT">${esc(P("Coleção compartilhada", "Shared collection"))}</h2><button type="button" class="btn ghost icon" data-close aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>
      <div class="sheet-body stack" style="gap:var(--sp-3)"><p style="margin:0" data-testid="invite-text">${esc(body)}</p>${ok && !me ? `<p class="small muted" style="margin:0">${esc(P("Entre ou crie sua conta (só o e-mail) para aceitar.", "Sign in or create your account (just e-mail) to accept."))}</p>` : ""}<p class="small" id="invMsg" role="alert" style="margin:0"></p></div>
      <div class="sheet-foot"><button type="button" class="btn ghost" data-close>${esc(ok ? P("Agora não", "Not now") : Tx("Close"))}</button>${ok ? `<button type="button" class="btn primary" id="invOk" data-testid="accept-invite">${esc(me ? P("Aceitar", "Accept") : Tx("Sign in"))}</button>` : ""}</div>`;
    sh.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => { dropInvite(); sh.close(); });
    $("invOk")?.addEventListener("click", async () => {
      if (!me) { window.INKWELL_SIGNIN?.(); return; }
      try { const r = await CLOUD.api("rpc/accept_share_invite", { method: "POST", body: { p_code: code } });
        dropInvite(); sh.close(); await loadShares(); useSource(`share:${r.owner}:${r.profile}`); toast(P(`Pronto: coleção de ${who}.`, `Done: ${who}'s collection.`)); }
      catch { $("invMsg").textContent = P("Não deu para aceitar. O convite pode ter vencido.", "Couldn't accept. The invite may have expired."); }
    });
    openSheet(sh, null);
  }

  // ---------- importar: a file or a pasted list from another app (src/site/collimport.js works out which) ----------
  const FORMAT_NAME = { dreamborn: "Dreamborn", tcgplayer: "TCGplayer", "inkwell-csv": "Inkwell", "inkwell-json": "Inkwell", json: "JSON", table: "Planilha", list: "Lista" };
  function openImport(from) {
    const sh = $("impSheet"); let res = null, mode = "max", fileName = "";
    const close = () => sh.close();
    function step1(msg) {
      sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="impT">${Tx("Import collection")}</h2><button type="button" class="btn ghost icon" data-close aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>
        <div class="sheet-body stack" style="gap:var(--sp-3)">
          <p class="small muted" style="margin:0">${Tx("A file exported from Dreamborn, TCGplayer, a spreadsheet or another app — Inkwell works out the columns. Or paste a list, one card per line.")}</p>
          <label class="btn" style="justify-self:start"><i class="ic i-import"></i>${Tx("Choose file")}<input type="file" id="impFile" accept=".csv,.tsv,.txt,.json,text/csv,text/plain,application/json" hidden></label>
          <label class="field">${Tx("Or paste here")}<textarea id="impText" rows="6" placeholder="${esc(Tx("4 Elsa - Snow Queen\n2 Vixey - Forest Friend (foil)"))}"></textarea></label>
          <p class="small" id="impMsg" role="alert" style="margin:0">${esc(msg || "")}</p></div>
        <div class="sheet-foot"><button type="button" class="btn ghost" data-close>${Tx("Cancel")}</button><button type="button" class="btn primary" id="impRead">${Tx("Read the list")}</button></div>`;
      sh.querySelectorAll("[data-close]").forEach((b) => b.onclick = close);
      $("impFile").onchange = async (e) => { const f = e.target.files?.[0]; if (!f) return; if (f.size > 5e6) { step1(Tx("This file is too big (5 MB at most).")); return; } fileName = f.name; read(await f.text(), f.name); };
      $("impRead").onclick = () => { const t = $("impText").value; if (!t.trim()) { $("impText").focus(); return; } fileName = ""; read(t, "colado.txt"); };
    }
    function read(text, name) {
      res = window.INKWELL_COLL_IMPORT.parse(text, name, CARDS, SETS);
      if (!res.rows.length) { step1(res.rejects.length ? Tx("No line matched a card. Check that the file has the card name, or set and number.") : Tx("The file is empty.")); return; }
      step2();
    }
    function step2() {
      const tot = window.INKWELL_COLL_IMPORT.total(res.rows), n = tot.reduce((a, x) => a + x.n, 0), f = tot.reduce((a, x) => a + x.f, 0);
      const coll = prof()?.collection || {};
      const delta = (x, k) => mode === "sum" ? x[k] : Math.max(0, x[k] - (+coll[x.id]?.[k] || 0));
      const adds = tot.reduce((a, x) => a + delta(x, "n") + delta(x, "f"), 0);
      const by = new Map(CARDS.map((c) => [c.id, c]));
      sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="impT">${Tx("Check before importing")}</h2><button type="button" class="btn ghost icon" data-close aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>
        <div class="sheet-body stack" style="gap:var(--sp-3)">
          <p style="margin:0" data-testid="imp-summary"><span class="tag info">${esc(Tx("Recognised: {f}", { f: FORMAT_NAME[res.format] || res.format }))}</span> ${esc(Tx("{c} different cards · {n} normal · {f} foil", { c: tot.length, n, f }))}${fileName ? ` <span class="small muted">· ${esc(fileName)}</span>` : ""}</p>
          ${res.rejects.length ? `<details class="small" data-testid="imp-rejects"><summary>${esc(res.rejects.length === 1 ? Tx("1 line was not recognised") : Tx("{n} lines were not recognised", { n: res.rejects.length }))}</summary><ul style="margin:6px 0 0;padding-left:18px">${res.rejects.slice(0, 50).map((r) => `<li>${r.line ? esc(Tx("line {n}", { n: r.line })) + ": " : ""}${esc(r.raw)}</li>`).join("")}${res.rejects.length > 50 ? `<li>…</li>` : ""}</ul></details>` : ""}
          <fieldset class="stack" style="gap:6px;border:0;padding:0;margin:0"><legend class="small" style="font-weight:700;margin-bottom:4px">${Tx("How to add")}</legend>
            <label class="check"><input type="radio" name="impMode" value="max" ${mode === "max" ? "checked" : ""}> <span>${Tx("Keep the larger number")}<small class="muted" style="display:block">${Tx("Safe to import the same file again: nothing is counted twice.")}</small></span></label>
            <label class="check"><input type="radio" name="impMode" value="sum" ${mode === "sum" ? "checked" : ""}> <span>${Tx("Add to what I have")}<small class="muted" style="display:block">${Tx("For new cards you just got.")}</small></span></label></fieldset>
          <div class="imp-list small" data-testid="imp-list">${tot.slice(0, 200).map((x) => { const c = by.get(x.id); return `<div><span>${esc(c?.name || x.id)}</span><span class="muted">${esc(c ? setName(c.set) : "")}</span><b>${x.n ? `${x.n}` : ""}${x.n && x.f ? " + " : ""}${x.f ? `${x.f} foil` : ""}</b></div>`; }).join("")}${tot.length > 200 ? `<div class="muted">… ${esc(Tx("and {n} more", { n: tot.length - 200 }))}</div>` : ""}</div>
          <p class="small" id="impMsg" role="alert" style="margin:0"></p></div>
        <div class="sheet-foot"><button type="button" class="btn ghost" id="impBack">${Tx("Back")}</button><button type="button" class="btn primary" id="impGo" ${adds ? "" : "disabled"}>${esc(adds ? Tx("Add {n} cards to the collection", { n: adds }) : Tx("You already have all of them"))}</button></div>`;
      sh.querySelectorAll("[data-close]").forEach((b) => b.onclick = close);
      sh.querySelectorAll("[name=impMode]").forEach((r) => r.onchange = () => { mode = r.value; step2(); });
      $("impBack").onclick = () => step1();
      $("impGo").onclick = () => apply(tot, delta);
    }
    async function apply(tot, delta) {
      const p = prof(); if (!p) { $("impMsg").textContent = Tx("Couldn't save. Try again."); return; }
      const items = [];
      for (const x of tot) for (const k of ["n", "f"]) { const q = delta(x, k); if (q > 0) items.push({ card_id: x.id, qty: q, foil: k === "f" }); }
      const b = $("impGo"); b.disabled = true;
      let done = 0;
      try {
        for (let i = 0; i < items.length; i += 400) {   // the server takes 400 changes per call
          const part = items.slice(i, i + 400);

  function grab(rect, outW, outH) {
    const v = $("scanVideo"), cv = document.createElement("canvas"); cv.width = outW; cv.height = outH;
    const ctx = cv.getContext("2d", { willReadFrequently: true }); ctx.imageSmoothingQuality = "high";
    ctx.drawImage(v, rect.x, rect.y, rect.w, rect.h, 0, 0, outW, outH); return cv;
  }
  async function tick() {
    const v = $("scanVideo");
    if (scan.busy || scan.askOpen || scan.review || !v || !v.videoWidth || !SCAN) return;
    scan.busy = true;
    try {
      const r = videoRect(guideRect()), m = SG.M;
      const wide = { x: r.x - r.w * m, y: r.y - r.h * m, w: r.w * (1 + 2 * m), h: r.h * (1 + 2 * m) };
      const cv = grab(wide, Math.round(SG.W * (1 + 2 * m)), Math.round(SG.H * (1 + 2 * m)));
      // Only steady frames count: a frame taken while the phone moves (between two cards, or mid-blur)
      // can look like another card. Compare a tiny grey copy with the previous frame's.
      const th = document.createElement("canvas"); th.width = 24; th.height = 34;
      const tx = th.getContext("2d", { willReadFrequently: true }); tx.drawImage(cv, 0, 0, 24, 34);
      const td = tx.getImageData(0, 0, 24, 34).data, grey = new Float32Array(24 * 34);
      let gm = 0; for (let i = 0; i < grey.length; i++) { grey[i] = 0.299 * td[i * 4] + 0.587 * td[i * 4 + 1] + 0.114 * td[i * 4 + 2]; gm += grey[i]; }
      gm /= grey.length; for (let i = 0; i < grey.length; i++) grey[i] -= gm;   // brightness changes (screen, auto-exposure) don't count as movement
      let motion = 0; if (scan.prev) { for (let i = 0; i < grey.length; i++) motion += Math.abs(grey[i] - scan.prev[i]); motion /= grey.length; } else motion = 99;
      scan.prev = grey;
      const steady = motion < 30;   // hand tremor moves the picture ~1-4% between readings (diff 8-25); panning to the next card 10%+ (45+)
      const res = identify(cv.getContext("2d").getImageData(0, 0, cv.width, cv.height));
      if (scan.wait) {   // after adding, wait until the card leaves the frame
        if (!(res.confident && res.group.includes(scan.last?.id))) { scan.misses++; if (scan.misses >= 2) { scan.wait = false; scan.misses = 0; scanSay(Tx("Point the camera at one card inside the frame.")); } }
        else scan.misses = 0;
        return;
      }
      if (!steady) { scan.seen = null; scan.seenN = 0; return; }
      if (!res.confident) { scan.seen = null; scan.seenN = 0; if (res.score > 0.5) scanSay(Tx("Centre the card in the frame, with good light.")); return; }
      const key = res.group.slice().sort().join("|");
      if (scan.seen !== key) { scan.seen = key; scan.seenN = 1; scanSay(Tx("Recognising…")); return; }
      if (++scan.seenN < 3) return;   // the same answer on three steady frames in a row
      if (res.group.length === 1) return addScanned(res.id);
      scanSay(Tx("Hold still, reading the card number…"));
      const card = { x: wide.x + res.box.x * wide.w, y: wide.y + res.box.y * wide.h, w: res.box.w * wide.w, h: res.box.h * wide.h };
      const strip = { x: card.x + card.w * 0.01, y: card.y + card.h * 0.95, w: card.w * 0.32, h: card.h * 0.047 };
      let pick = null;
      for (const im of collectorImages(strip)) {
        let text = ""; try { text = await readCollector(im); } catch { text = ""; }
        scan.reads.push(text);
        pick = pickByCollector(scan.reads.join(" | "), res.group) || pickByCollector(text, res.group);
        if (pick) break;
      }
      if (pick) { scan.reads = []; scan.ocrTries = 0; return addScanned(pick); }
      if (++scan.ocrTries < 3) { scan.seenN = 1; scanSay(Tx("Bring the phone a little closer so the number is sharp.")); return; }   // try again on the next frames
      scan.reads = []; scan.ocrTries = 0; askWhich(res.group);
    } finally { scan.busy = false; }
  }
  async function openScanner(from) {
    const sh = $("scan"); scan.added = []; scan.last = null; scan.wait = false; scan.askOpen = false; scan.seen = null; scan.review = false; scan.saved = 0; scan.prev = null;
    drawScan(); sh.showModal(); scanSay(Tx("Starting the camera…"));
    sh.addEventListener("close", () => { clearInterval(scan.timer); scan.stream?.getTracks().forEach((t) => t.stop()); scan.stream = null; sh.innerHTML = ""; sh.oncancel = null; flush(true); renderAll(); from?.focus?.(); if (scan.saved) toast(Tx("{n} added", { n: scan.saved })); }, { once: true });
    sh.oncancel = (e) => { if (scan.added.length && !scan.review) { e.preventDefault(); showReview(); } };   // Esc / back with cards in the list: review first
    try { await loadScan(); } catch { scanSay(Tx("Couldn't load the card scanner."), true); return; }
    try {
      scan.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 3840 }, height: { ideal: 2160 } } });
    } catch { scanSay(Tx("The camera didn't open. Allow camera access for this site and try again."), true); return; }
    if (!sh.open) { scan.stream.getTracks().forEach((t) => t.stop()); return; }
    const v = $("scanVideo"); v.srcObject = scan.stream; await v.play().catch(() => {});
    const track = scan.stream.getVideoTracks()[0], caps = track?.getCapabilities?.() || {};
    if ((caps.focusMode || []).includes("continuous")) track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }).catch(() => {});   // Android Chrome; iPhone focuses on its own
    if (caps.torch) { const b = $("scanTorch"); b.hidden = false; b.onclick = () => { scan.torch = !scan.torch; b.setAttribute("aria-pressed", String(scan.torch)); track.applyConstraints({ advanced: [{ torch: scan.torch }] }).catch(() => {}); }; }
    scanSay(Tx("Point the camera at one card inside the frame."));
    scan.timer = setInterval(tick, 350);
    window.addEventListener("resize", () => sh.open && placeGuide(), { passive: true });
  }

  // ---------- boot ----------
  document.title = `${Tx("Collection")} · Inkwell`;
  $("title").textContent = Tx("Collection");
  document.documentElement.lang = LOC;
  const invite = inviteCode();
  if (!me) { render(); if (invite) offerInvite(invite); return; }
  const friendHandle = new URLSearchParams(location.search).get("amigo");
  $("app").innerHTML = `<div class="stats-row three"><span class="skel"></span><span class="skel"></span><span class="skel"></span></div><div class="cgrid">${"<span class=\"skel thumb\"></span>".repeat(8)}</div><p class="sr-only">${Tx("Loading…")}</p>`;
  const loadFriend = async () => {
    const r = await CLOUD.api("rpc/friend_collection", { method: "POST", body: { p_handle: friendHandle, p_full: true } }).catch(() => null);
    if (!r?.view) { $("title").textContent = Tx("Collection"); $("headActions").innerHTML = "";
      $("app").innerHTML = `<div class="empty"><img src="../ui/assets/empty/collection.svg" alt=""><b>${esc(P("Esta coleção não está aberta para você.", "This collection isn't open to you."))}</b><p>${esc(P("Só amigos veem, e só quando o dono deixa.", "Only friends see it, and only if the owner allows."))}</p><a class="btn" href="./">${esc(P("Ver a minha coleção", "See my collection"))}</a></div>`; return false; }
    friendView = { profile: `friend:${friendHandle}`, friend: true, ownerName: r.name || "", collection: r.collection || {}, lent: r.lent || {}, lend: !!r.lend };
    v.owned = true; return true;
  };
  const go = () => (friendHandle ? Promise.all([loadAll(), loadFriend()]).then(([, ok]) => { if (ok) { applySource(); renderAll(); } })
    : loadAll().then(() => { renderAll(); if (invite) offerInvite(invite); })).catch(() => {
    $("app").innerHTML = `<div class="empty"><img src="../ui/assets/empty/error.svg" alt=""><b>${Tx("Couldn't load your collection.")}</b><p>${Tx("Check your connection and try again.")}</p><button type="button" class="btn" id="retry"><i class="ic i-refresh"></i>${Tx("Try again")}</button></div>`;
    $("retry").onclick = go;
  });
  go();
})();
</script>
