    "See larger": "Ver maior", "Back to the results": "Voltar aos resultados", "You own this version": "Você tem esta versão", "You own another finish of this card": "Você tem esta carta em outro acabamento",
    "This card is no longer in the catalogue. Choose another.": "Esta carta não está mais no catálogo. Escolha outra.",
    "The card catalogue didn't load.": "O catálogo de cartas não carregou.", "Try again": "Tentar de novo",
    "Save to my profile": "Salvar no meu perfil", "You have an account. Your full profile is in My Inkwell.": "Você já tem uma conta. Seu perfil completo fica em Meu Inkwell.", "Open My Inkwell": "Abrir Meu Inkwell",
    "Your profile already has content. Review before applying.": "Seu perfil já tem conteúdo. Revise antes de aplicar.", "Now": "Agora", "After applying": "Depois de aplicar",
    "Name": "Nome", "Inks": "Tintas", "Favourite cards": "Cartas favoritas", "(unchanged)": "(sem mudança)", "none": "nenhuma",
    "See my profile": "Ver meu perfil", "Explore the community": "Explorar a comunidade", "Try saving again": "Tentar salvar novamente",
    "The foil finish was not kept: the server doesn't take it yet. The cards were saved as normal.": "O acabamento foil não foi guardado: o servidor ainda não aceita. As cartas foram salvas como normais.",
    "Start my Inkwell": "Começar meu Inkwell", "Saving…": "Salvando…", "Wait for the confirmation before leaving.": "Aguarde a confirmação para sair.",
    "Choose card for slot {n}": "Escolher carta para a posição {n}", "Replace card in slot {n}": "Trocar carta da posição {n}", "Remove card from slot {n}": "Remover carta da posição {n}",
    "Draft discarded.": "Rascunho descartado.", "Card {c}": "Carta {c}", "Example data is never copied to your draft.": "Dados de exemplo nunca entram no seu rascunho.",
  };
  const INKS = ["Amber", "Amethyst", "Emerald", "Ruby", "Sapphire", "Steel"];
  const INK_PT = { Amber: "Âmbar", Amethyst: "Ametista", Emerald: "Esmeralda", Ruby: "Rubi", Sapphire: "Safira", Steel: "Aço" };
  const INK_HEX = { Amber: "#efbd49", Amethyst: "#a784db", Emerald: "#54b78b", Ruby: "#e27683", Sapphire: "#7ca9df", Steel: "#c1c8d3" };
  const RAR = { C: ["Common", "Comum"], U: ["Uncommon", "Incomum"], R: ["Rare", "Rara"], SR: ["Super Rare", "Super-rara"], L: ["Legendary", "Lendária"], E: ["Enchanted", "Encantada"],
    EP: ["Epic", "Épica"], I: ["Iconic", "Icônica"], P: ["Promo", "Promo"], N: ["Special", "Especial"] };
  const fill = (s, v) => (v ? s.replace(/\{(\w+)\}/g, (m, k) => (k in v ? String(v[k]) : m)) : s);
  const Tx = (en, v) => fill(lang === "pt" && en in PT ? PT[en] : en, v);
  const inkName = (i) => (lang === "pt" ? INK_PT[i] || i : i);
  const rarName = (r) => (RAR[r] ? RAR[r][lang === "pt" ? 1 : 0] : r || "");
  const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const split = (name) => { const i = name.search(/\s[-–]\s/); return i > 0 ? [name.slice(0, i), name.slice(i + 3)] : [name, ""]; };

  // ---------- catalogue (read-only; card ids are printings, foil is a finish of a printing) ----------
  const setRank = (code, i) => { const m = /^LOR(\d+)$/.exec(code) || []; const q = /^Q(\d+)$/.exec(code) || []; return m[1] ? +m[1] : q[1] ? 100 + +q[1] : 200 + i; };
  const SETS = (CARD_INDEX?.sets || []).map((x, i) => ({ ...x, rank: setRank(x.code, i) })).sort((a, b) => a.rank - b.rank);
  const setName = (code) => { const s = SETS.find((x) => x.code === code); return s ? (lang === "pt" && s.name_pt) || s.name_en || code : code; };
  const numOf = (c) => parseInt(String(c.num).replace(/\D+/g, ""), 10) || 0;
  const CARDS = (CARD_INDEX?.cards || []).filter((r) => r[5] !== "T")   // tokens are not cards anyone collects
    .map(([id, name, cost, type, ink, rarity, set, num, img]) => ({ id, name: name || id, cost, type, ink, rarity, set, num, img, k: norm(name) }));
  const BY = new Map(CARDS.map((c) => [c.id, c]));
  const RANK = new Map(SETS.map((s) => [s.code, s.rank]));
  const NEWEST = SETS.filter((s) => /^LOR\d+$/.test(s.code) && CARDS.some((c) => c.set === s.code)).at(-1)?.code;
  // Enchanted, Epic and Iconic printings exist only in foil; everything else in normal and foil.
  const finishes = (c) => (["E", "EP", "I"].includes(c?.rarity) ? ["f"] : ["n", "f"]);
  const inksOf = (c) => String(c?.ink || "").split(/[,\/]\s*/).map((x) => x.trim()).filter(Boolean);
  const imgUrl = (c) => (c?.img ? `../lorcana-card-images/${encodeURI(c.img).replace(/'/g, "%27")}` : "");
  // A real card image with its true proportions; if it is missing or breaks, its name and printing stay readable.
  const cardFace = (c, foil, extra = "") => {
    const [a, b] = split(c?.name || ""), label = `${a}${b ? " · " + b : ""} — ${setName(c?.set)} nº ${c?.num || ""}`;
    return `<span class="iw-card" ${extra}>${c?.img ? `<img src="${imgUrl(c)}" alt="${esc(label)}" width="250" height="350" loading="lazy" decoding="async" onerror="this.nextElementSibling.setAttribute('aria-hidden','false');this.remove()">` : ""}
      <span class="iw-fallback" aria-hidden="${c?.img ? "true" : "false"}">${esc(a)}${b ? `<br><small>${esc(b)}</small>` : ""}<br><small>${esc(setName(c?.set))} · nº ${esc(c?.num || "")}</small></span>
      ${foil ? `<span class="iw-foil">${Tx("Foil")}</span>` : ""}</span>`;
  };

  // ---------- draft (spec/02: sessionStorage, versioned, never tokens; one key, never the rest of storage) ----------
  const DRAFT_KEY = "inkwell-guest-draft-v1", INTENT_KEY = "inkwell-guest-intent-v1";
  const blank = () => ({ schemaVersion: 1, draftId: (crypto.randomUUID?.() || String(Date.now()) + Math.random().toString(16).slice(2)), updatedAt: new Date().toISOString(), rev: 0,
    displayName: "", preferredInks: [], favorites: [] });
  let storageOk = true, memory = null, draftProblem = null;
  const ss = {
    get(k) { try { return sessionStorage.getItem(k); } catch { storageOk = false; return k === DRAFT_KEY ? memory : null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch { storageOk = false; if (k === DRAFT_KEY) memory = v; } },
    del(k) { try { sessionStorage.removeItem(k); } catch { if (k === DRAFT_KEY) memory = null; } },
  };
  // Read a draft and keep only what validates; anything broken is reported, never thrown.
  function readDraft() {
    const raw = ss.get(DRAFT_KEY);
    if (!raw) return null;
    let x; try { x = JSON.parse(raw); } catch { draftProblem = "invalid"; return blank(); }
    if (!x || typeof x !== "object") { draftProblem = "invalid"; return blank(); }
    const d = blank();
    if (x.schemaVersion !== 1) draftProblem = "invalid";
    if (typeof x.draftId === "string" && x.draftId.length <= 80) d.draftId = x.draftId;
    if (Number.isInteger(x.rev) && x.rev >= 0) d.rev = x.rev;
    if (typeof x.displayName === "string") d.displayName = x.displayName.slice(0, 40); else if (x.displayName != null) draftProblem = "invalid";
    if (Array.isArray(x.preferredInks)) d.preferredInks = [...new Set(x.preferredInks.filter((i) => INKS.includes(i)))].slice(0, 2);
    if (Array.isArray(x.favorites)) {
      const seen = new Set();
      for (const f of x.favorites.slice(0, 3)) {
        if (f === null) { d.favorites.push(null); continue; }   // an empty place between cards
        if (typeof f?.id !== "string" || f.id.length > 40) { draftProblem = "invalid"; continue; }
        const key = `${f.id}|${!!f.foil}`; if (seen.has(key)) { d.favorites.push(null); continue; } seen.add(key);
        d.favorites.push({ id: f.id, foil: !!f.foil });   // an id no longer in the catalogue stays, marked, so it can be replaced
      }
      trimFavs(d);
    }
    return d;
  }
  // favorites: up to 3 places, any of them can be empty (null) — a card stays where it was put
  function trimFavs(d) { while (d.favorites.length && !d.favorites.at(-1)) d.favorites.pop(); }
  const favs = () => draft.favorites.filter(Boolean);
  let draft = readDraft();
  const hadDraft = !!draft;
  if (!draft) draft = blank();
  const fields = (d) => JSON.stringify({ n: d.displayName.trim(), i: [...d.preferredInks].sort(), f: d.favorites.filter(Boolean).map((f) => `${f.id}|${f.foil}`) });
  const BASE = fields(blank());   // a guest starts from nothing; "dirty" = different from that
  const isDirty = () => fields(draft) !== BASE;
  function persist() {
    draft.updatedAt = new Date().toISOString(); draft.rev += 1;
    if (isDirty()) ss.set(DRAFT_KEY, JSON.stringify(draft)); else ss.del(DRAFT_KEY);   // back to the start = nothing to keep
  }
  // probe storage once, so the warning shows before any work is lost
  try { sessionStorage.setItem("inkwell-guest-probe", "1"); sessionStorage.removeItem("inkwell-guest-probe"); } catch { storageOk = false; }

  // ---------- session ----------
  const me = () => CLOUD?.user() || null;
  const signedIn = () => !!me()?.id;
  let status = "edit";   // edit | authenticating | saving | review | saved | error | identity | missing | otherTab
  let review = null, saveInfo = null, nameErr = "", inkMsg = "";
  const intent = () => { try { const v = JSON.parse(ss.get(INTENT_KEY) || "null"); return v && v.draftId === draft.draftId && Date.now() - v.at < 30 * 60e3 ? v : null; } catch { return null; } };

  // ---------- other tab: the e-mail link opens a new tab without this tab's draft ----------
  const bc = "BroadcastChannel" in window ? new BroadcastChannel("inkwell-guest") : null;
  bc?.addEventListener("message", (e) => { if (e.data?.type === "ping" && isDirty()) bc.postMessage({ type: "here" }); });
  // the original tab: the session arrives through shared storage when the link is opened elsewhere
  window.addEventListener("storage", (e) => { if (e.key === "inkwell-counter-auth" && e.newValue && intent() && status === "authenticating") location.reload(); });
  window.addEventListener("focus", () => { if (status === "authenticating" && signedIn()) location.reload(); });

  // ---------- leaving ----------
  let leavingInside = false;
  document.addEventListener("click", (e) => { const a = e.target.closest("a[href]"); if (a && a.origin === location.origin) leavingInside = true; }, true);
  // Same-tab navigation keeps the draft (sessionStorage), so it never asks. Closing the tab may lose it: the browser decides how to warn.
  window.addEventListener("beforeunload", (e) => { if (isDirty() && !leavingInside && status !== "saved") { e.preventDefault(); e.returnValue = ""; } setTimeout(() => { leavingInside = false; }, 0); });

  // ---------- rendering ----------
  const app = $("app");
  const locked = () => status === "saving";
  function inkDots(list) { return list.length ? `<span class="iw-inkdots" aria-hidden="true">${list.map((i) => `<i style="background:${INK_HEX[i]}"></i>`).join("")}</span>` : ""; }
  function preview() {
    const name = draft.displayName.trim();
    return `<section class="iw-profile" aria-labelledby="pvT" data-testid="preview">
      <div class="row between" style="margin-bottom:var(--sp-3)"><h2 class="iw-h3" id="pvT" style="margin:0">${Tx("Profile preview")}</h2>${signedIn() ? "" : `<span class="iw-sample-label">${Tx("Guest mode")}</span>`}</div>
      <div class="iw-profile-head"><span class="iw-avatar" aria-hidden="true">${(() => { const c = BY.get(favs()[0]?.id); return c?.img ? `<img src="${imgUrl(c)}" alt="" onerror="this.remove()">` : esc((name || "?")[0].toUpperCase()); })()}</span>
        <div style="min-width:0"><p class="iw-name ${name ? "" : "placeholder"}" data-testid="pv-name">${esc(name || Tx("Your name here"))}</p>
        <div class="iw-muted small" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap" data-testid="pv-inks">${draft.preferredInks.length ? inkDots(draft.preferredInks) + esc(draft.preferredInks.map(inkName).join(" · ")) : Tx("No inks yet")}</div></div></div>
      <div data-testid="pv-showcase"><p class="iw-muted small" style="margin:0 0 var(--sp-2)"><b>${Tx("Your three favourite cards")}</b> · <span data-testid="fav-progress">${esc(Tx("{n} of 3 chosen", { n: favs().length }))}</span></p>${slots()}</div>
      <p class="iw-muted small" style="margin:var(--sp-3) 0 0">${Tx("Your profile starts private. You decide when to publish it.")}</p></section>`;
  }
  function slots() {
    return `<div class="iw-slots" data-testid="slots">${[0, 1, 2].map((i) => {
      const f = draft.favorites[i], c = f && BY.get(f.id), n = i + 1;
      if (!f) return `<div class="iw-slot" data-slot="${i}"><button type="button" class="iw-card empty" data-pick="${i}" aria-label="${esc(Tx("Choose card for slot {n}", { n }))}" ${locked() ? "disabled" : ""}>${Tx("Choose favourite")}</button></div>`;
      return `<div class="iw-slot" data-slot="${i}">${c ? cardFace(c, f.foil) : `<span class="iw-card empty" role="img" aria-label="${esc(f.id)}"></span><span class="warn" data-testid="gone">${Tx("This card is no longer in the catalogue. Choose another.")}</span>`}
        <div class="iw-card-label">${c ? `${esc(split(c.name)[0])}<small>${esc(setName(c.set))} · nº ${esc(c.num)}${f.foil ? " · " + Tx("foil") : ""}</small>` : esc(f.id)}</div>
        <div class="iw-actions">
          <button type="button" class="iw-button small" data-pick="${i}" aria-label="${esc(Tx("Replace card in slot {n}", { n }))}" ${locked() ? "disabled" : ""}>${Tx("Replace card")}</button>
          <button type="button" class="iw-button small" data-move="${i}:-1" aria-label="${esc(Tx("Move left") + " · " + Tx("Slot {n}", { n }))}" ${locked() || i === 0 ? "disabled" : ""}>◀</button>
          <button type="button" class="iw-button small" data-move="${i}:1" aria-label="${esc(Tx("Move right") + " · " + Tx("Slot {n}", { n }))}" ${locked() || i >= 2 ? "disabled" : ""}>▶</button>
          <button type="button" class="iw-button small" data-remove="${i}" aria-label="${esc(Tx("Remove card from slot {n}", { n }))}" ${locked() ? "disabled" : ""}>✕</button>
        </div></div>`;
    }).join("")}</div>`;
  }
  function notices() {

      change(() => { while (draft.favorites.length < slot) draft.favorites.push(null); draft.favorites[slot] = { id: c.id, foil: f === "f" }; });
      d.close();
      (app.querySelector(`[data-slot="${slot}"] [data-pick]`) || from)?.focus();
    }));
  }
  $("picker").addEventListener("close", () => { const f = pk?.from; pk = null; if (f && document.contains(f)) f.focus(); });

  // ---------- save (spec/02 "Cadastro e transferência") ----------
  const profileHasContent = (p) => !!p && (!!(p.inks || []).length || !!(p.showcase || []).length || !!p.bio || !!p.motto || !!p.handle || !!p.avatar_card
    || (!!p.display_name && p.display_name !== "Jogador"));
  function payload(applyOnly) {
    const nm = draft.displayName.trim(), p = {};
    if (nm) p.display_name = nm;
    if (!applyOnly || draft.preferredInks.length) p.inks = draft.preferredInks;
    const fav = draft.favorites.filter((f) => f && BY.has(f.id)).map((f) => ({ id: f.id, k: "fav", ...(f.foil ? { foil: true } : {}) }));
    if (!applyOnly || fav.length) p.showcase = fav;
    return p;
  }
  function validate() {
    const nm = draft.displayName.trim();
    if (nm && nm.length < 2) { nameErr = Tx("Use at least 2 characters."); status = "edit"; render(); $("name")?.focus(); return false; }
    return true;
  }
  function startSave() {
    if (locked() || !validate()) return;
    ss.set(DRAFT_KEY, JSON.stringify(draft));   // the draft is written before anything else happens
    if (signedIn()) return runSave();
    ss.set(INTENT_KEY, JSON.stringify({ draftId: draft.draftId, at: Date.now() }));
    status = "authenticating";
    if (!window.INKWELL_SIGNIN) { status = "error"; render(); return; }
    window.INKWELL_SIGNIN();
    // closing the sign-in sheet (or a wrong code) leaves the draft as it is
    const sheet = document.querySelector("dialog.sheet");
    sheet?.addEventListener("close", () => { if (status === "authenticating" && !signedIn()) { status = "edit"; render(); } }, { once: true });
  }
  let saving = false;
  async function runSave(confirmed) {
    if (saving || !validate()) return;
    const who = me()?.id; if (!who) return startSave();
    saving = true; status = "saving"; render();
    const snap = { rev: draft.rev, draftId: draft.draftId };
    try {
      const cur = await CLOUD.api("rpc/my_profile", { method: "POST", body: {} });
      if (me()?.id !== who) { saving = false; status = "identity"; render(); return; }
      const existing = profileHasContent(cur);
      if (existing && !confirmed) { saving = false; review = { cur }; status = "review"; render(); $("apply")?.focus(); return; }
      const body = payload(existing);
      const res = await CLOUD.api("rpc/save_my_profile", { method: "POST", body: { p: body } });
      if (me()?.id !== who) { saving = false; status = "identity"; render(); return; }   // started for A: never clear or report B
      saveInfo = { lostFoil: (body.showcase || []).some((s) => s.foil) && !((res?.showcase) || []).some((s) => s.foil) };
      if (draft.rev === snap.rev && draft.draftId === snap.draftId) { ss.del(DRAFT_KEY); draft = blank(); }
      ss.del(INTENT_KEY);
      saving = false; status = "saved"; render();
      $("app").querySelector('[data-testid="saved"] a')?.focus();
    } catch {
      saving = false; status = "error"; render(); $("retry")?.focus();
    }
  }

  // ---------- start ----------
  const fromLink = !!window.INKWELL_FROM_LINK;
  if (fromLink && !hadDraft) {
    // opened by the e-mail link: ask the other tabs whether the draft is there
    status = "missing";
    let answered = false;
    bc?.addEventListener("message", (e) => { if (e.data?.type === "here" && !answered) { answered = true; status = "otherTab"; render(); } });
    bc?.postMessage({ type: "ping" });
  } else if (signedIn() && hadDraft && intent()) {
    render(); runSave();
  }
  render();
})();
</script>
<script>window.INKWELL_SHELL = {"page": "start"};
/*@SHELL_JS@*/</script>
