  }
  async function loadPosts(more = false) {
    const ids = [me.id, ...friendIds()];
    const q = `game_logs?user_id=in.(${ids.join(",")})&visibility=neq.private&select=user_id,game_id,source,played_at,summary,visibility,group_id&order=played_at.desc.nullslast&limit=${PAGE}${more && olderThan ? `&played_at=lt.${enc(olderThan)}` : ""}`;
    const rows = (await CLOUD.api(q)) || [];
    posts = more ? posts.concat(rows) : rows;
    moreAvailable = rows.length === PAGE;
    olderThan = posts.at(-1)?.played_at || null;
    const gids = rows.map((r) => r.game_id);
    for (let i = 0; i < gids.length; i += 60) {
      const part = (await CLOUD.api(`game_notes?game_id=in.(${gids.slice(i, i + 60).map((g) => `"${g}"`).join(",")})&select=id,owner_id,game_id,author,author_name,body,created_at&order=created_at`)) || [];
      for (const n of part) { const k = `${n.owner_id}|${n.game_id}`; if (!notes.has(k)) notes.set(k, []); if (!notes.get(k).some((x) => x.id === n.id)) notes.get(k).push(n); }
    }
    await loadNames([...rows.map((r) => r.user_id), ...[...notes.values()].flat().map((n) => n.author)]);
  }

      <span class="t"><span>${Tx("Friends and privacy")}${pending ? ` <span class="count">${pending}</span>` : ""}</span><span class="meta">${esc([fr.length ? (fr.length === 1 ? Tx("1 friend") : Tx("{n} friends", { n: fr.length })) : "", Tx("your games: {v}", { v: visLabel().toLowerCase() })].filter(Boolean).join(" · "))}</span></span>

  };

        await loadPeople(); renderSide(); renderFeed();

    }
    const incoming = friendships.filter((f) => f.status === "pending" && f.addressee === me.id);

    el.innerHTML = `<section class="panel stack" aria-labelledby="hFriends"><div class="row between"><h2 id="hFriends" style="margin:0">${Tx("Friends")}</h2><span class="small muted">${friends.length}</span></div>
        <span class="search"><i class="ic i-search"></i><input type="search" id="findPeople" placeholder="${Tx("Find people by name")}" aria-label="${Tx("Add a friend")}" autocomplete="off"></span>
        <div id="found">${searchRes ? (searchRes.length ? `<div class="list tight">${searchRes.map((p) => {
          const rel = friendships.find((f) => [f.requester, f.addressee].includes(p.user_id));

        ${outgoing.map((f) => `<div class="list-row flat">${av(f.addressee)}<span class="t"><span>${esc(nameOf(f.addressee))}</span><span class="meta">${esc(Tx("Waiting for {name}", { name: nameOf(f.addressee) }))}</span></span><button type="button" class="btn ghost small" data-decline="${f.requester}|${f.addressee}">${Tx("Cancel")}</button></div>`).join("")}

        ${vis !== "private" && myGameCount ? `<button type="button" class="btn small" id="applyOld">${esc(myGameCount === 1 ? Tx("Apply to my older game too") : Tx("Apply to my {n} older games too", { n: myGameCount }))}</button>` : ""}
        <p class="small muted" id="visMsg" style="margin:0">${Tx("Opponents' names are never shown to others. Coaches see the games shared with them. You can change it game by game in the review.")}</p></section>
      <section class="panel stack" aria-labelledby="hGroups"><h2 id="hGroups" style="margin:0">${Tx("Friend groups")}</h2>
        ${groups.length ? groups.map((g) => `<details class="card inset"><summary class="row between"><span>${esc(g.name)}</span><span class="small muted">${(g.friend_group_members || []).length} ${Tx("people")}</span></summary>
          <div class="stack" style="margin-top:var(--sp-2)">${friends.length ? friends.map((id) => `<label class="check"><input type="checkbox" data-gm="${g.id}|${id}" ${(g.friend_group_members || []).some((m) => m.member === id) ? "checked" : ""}>${esc(nameOf(id))}</label>`).join("") : `<p class="small muted">${Tx("Add friends first.")}</p>`}
          <button type="button" class="btn ghost small danger-text" data-delgroup="${g.id}">${Tx("Delete group")}</button></div></details>`).join("")
          : `<p class="small muted" style="margin:0">${Tx("No groups yet. A group lets you share games with only some friends.")}</p>`}
        <div class="cmtform"><input id="newGroup" maxlength="40" placeholder="${Tx("New group name")}" aria-label="${Tx("New group name")}"><button type="button" class="btn" id="addGroup">${Tx("Create")}</button></div></section>
      ${coachCols ? `<section class="panel stack" aria-labelledby="hCGroups"><h2 id="hCGroups" style="margin:0">${Tx("Coach groups")}</h2>
        ${coachGroups.length ? coachGroups.map((g) => `<details class="card inset"><summary class="row between"><span>${esc(g.name)}</span><span class="small muted">${(g.emails || []).length}</span></summary>
          <div class="stack" style="margin-top:var(--sp-2)">${myCoaches.length ? myCoaches.map((c) => `<label class="check"><input type="checkbox" data-cgm="${g.id}|${esc(c)}" ${(g.emails || []).includes(c) ? "checked" : ""}>${esc(coachName(c))}</label>`).join("") : `<p class="small muted">${Tx("Add coaches first, in Coach Review.")}</p>`}
          <button type="button" class="btn ghost small" data-delcgroup="${g.id}">${Tx("Delete group")}</button></div></details>`).join("")
          : `<p class="small muted" style="margin:0">${Tx("No coach groups yet. A coach group lets you share games with only some of your coaches.")}</p>`}
        <div class="cmtform"><input id="newCGroup" maxlength="40" placeholder="${Tx("New group name")}" aria-label="${Tx("New group name")}"><button type="button" class="btn" id="addCGroup">${Tx("Create")}</button></div></section>` : ""}`;
    let t;
    $("findPeople").addEventListener("input", (e) => {
      clearTimeout(t);
      const q = e.target.value.trim();

    el.querySelectorAll("[data-accept]").forEach((b) => b.onclick = () => act(() => CLOUD.api(`friendships?requester=eq.${b.dataset.accept}&addressee=eq.${me.id}`, { method: "PATCH", prefer: "return=minimal", body: { status: "accepted", accepted_at: new Date().toISOString() } })));
    el.querySelectorAll("[data-decline]").forEach((b) => b.onclick = () => { const [r, a] = b.dataset.decline.split("|"); act(() => CLOUD.api(`friendships?requester=eq.${r}&addressee=eq.${a}`, { method: "DELETE" })); });
    el.querySelectorAll("[data-unfriend]").forEach((b) => b.onclick = () => confirmBtn(b, "Confirm removal", () => {
      const f = friendships.find((x) => [x.requester, x.addressee].includes(b.dataset.unfriend));

    }));
    $("defVis").onchange = (e) => { const v = e.target.value; act(() => CLOUD.api(`profiles?user_id=eq.${me.id}`, { method: "PATCH", prefer: "return=minimal",
      body: { ...(v.startsWith("group:") ? { default_visibility: "group", default_group_id: v.slice(6) }
        : v.startsWith("coach:") ? { default_visibility: "coaches", default_group_id: null, default_coach_email: v.slice(6), default_coach_group_id: null }
        : v.startsWith("cgroup:") ? { default_visibility: "coaches", default_group_id: null, default_coach_email: null, default_coach_group_id: v.slice(7) }
        : { default_visibility: v, default_group_id: null }), ...(coachCols && !v.includes(":") ? { default_coach_email: null, default_coach_group_id: null } : {}) } })); };
    $("addCGroup")?.addEventListener("click", () => { const n = $("newCGroup").value.trim(); if (n) act(() => CLOUD.api("coach_groups", { method: "POST", prefer: "return=minimal", body: { name: n } })); });
    el.querySelectorAll("[data-cgm]").forEach((c) => c.onchange = () => { const [g, e] = [c.dataset.cgm.slice(0, 36), c.dataset.cgm.slice(37)];

      act(() => CLOUD.api(`coach_groups?id=eq.${g}`, { method: "PATCH", prefer: "return=minimal", body: { emails: [...emails] } })); });
    el.querySelectorAll("[data-delcgroup]").forEach((b) => b.onclick = () => confirmBtn(b, "Confirm delete", () => act(() => CLOUD.api(`coach_groups?id=eq.${b.dataset.delcgroup}`, { method: "DELETE" }))));
    $("addGroup").onclick = () => { const n = $("newGroup").value.trim(); if (n) act(() => CLOUD.api("friend_groups", { method: "POST", prefer: "return=minimal", body: { name: n } })); };
    el.querySelectorAll("[data-gm]").forEach((c) => c.onchange = () => { const [g, m] = c.dataset.gm.split("|");

  // ---------- feed ----------
  function audienceTag(r) {
    if (r.visibility === "group") { const own = groups.find((g) => g.id === r.group_id); return own ? Tx("Group: {name}", { name: own.name }) : otherGroups.has(r.group_id) ? Tx("Group: {name}", { name: otherGroups.get(r.group_id) }) : Tx("group"); }
    return Tx(r.visibility === "coaches" ? "coaches" : r.visibility);   // a coach-only game shows up here only for its owner
  }
  const inks2 = (s) => `<span class="inks">${String(s || "").split(/[\/,]\s*/).filter(Boolean).slice(0, 2).map((c) => `<i data-ink="${esc(c.trim().toLowerCase())}"></i>`).join("")}</span>`;
  function postHtml(r) {
    const s = r.summary || {}, win = s.result === "win", key = `${r.user_id}|${r.game_id}`, cm = notes.get(key) || [];
    const who = nameOf(r.user_id), first = s.went_first === true ? Tx("went first") : s.went_first === false ? Tx("went second") : "";
    const myDeck = s.my_deck && s.my_deck !== "Physical game" ? s.my_deck : "", opp = s.opp_deck && s.opp_deck !== "Unknown" ? s.opp_deck : "";
    const meta = [ago(r.played_at), s.turns ? Tx("{n} turns", { n: s.turns }) : "", first, Tx(r.source === "duels_ink" ? "duels.ink" : r.source === "lore_counter" ? "Lore Counter" : r.source), audienceTag(r)].filter(Boolean).join(" · ");
    return `<article class="card post" data-key="${esc(key)}">
      <div class="who"><span class="av">${esc(who[0]?.toUpperCase() || "?")}</span><div><b>${esc(who)}</b><div class="small">${esc(meta)}</div></div></div>
      <div class="res"><span class="word ${win ? "win" : "loss"}">${Tx(win ? "Won" : "Lost")}</span><span class="score">${esc(s.my_lore ?? 0)}–${esc(s.opp_lore ?? 0)}</span></div>
      ${myDeck || opp ? `<p class="match">${myDeck ? `${inks2(s.my_inks || myDeck)}<b>${esc(myDeck)}</b>` : ""}${opp ? ` ${Tx("against")} ${inks2(s.opp_inks || opp)}<b>${esc(opp)}</b>` : ""}</p>` : ""}
      ${cm.slice(-3).map((n) => { const a = nameOf(n.author) === Tx("A player") ? n.author_name || Tx("Someone") : nameOf(n.author); return `<div class="comment"><span class="av sm">${esc(a[0]?.toUpperCase() || "?")}</span><span class="muted"><b>${esc(a)}</b> <span data-body="${esc(n.id)}"></span></span></div>`; }).join("")}
      <div class="cmtform" data-form="${esc(key)}" hidden><input maxlength="1000" placeholder="${Tx("Write a comment")}" aria-label="${Tx("Write a comment")}"><button type="button" class="btn" data-send="${esc(key)}"><i class="ic i-send"></i>${Tx("Send")}</button></div>
      <div class="acts"><a class="btn ghost small" href="../coach/?player=${enc(r.user_id)}&game=${enc(r.game_id)}"><i class="ic i-eye"></i>${Tx("Open game")}</a><button type="button" class="btn ghost small" data-cmt="${esc(key)}"><i class="ic i-comment"></i>${Tx("Comment")}${cm.length ? ` · ${cm.length}` : ""}</button></div>
    </article>`;
  }
  function renderFeed() {
    const el = $("feed");
    if (!me || !myProfile) { if (me) el.innerHTML = ""; return; }
    el.innerHTML = posts.length ? posts.map(postHtml).join("") + (moreAvailable ? `<div class="older"><button type="button" class="btn" id="older">${Tx("Show older games")}</button></div>` : "")
      : `<div class="empty"><img src="../ui/assets/empty/feed.svg" alt=""><b>${Tx("Your timeline is empty")}</b><p>${Tx("Add friends to see their games here. Your games also show up for whoever you choose.")}</p>
          <button type="button" class="btn primary" id="addFriends"><i class="ic i-user-plus"></i>${Tx("Add friends")}</button></div>`;
    $("addFriends")?.addEventListener("click", () => { if (phone()) $("openFriends").click(); else $("findPeople")?.focus(); });
    const byId = new Map([...notes.values()].flat().map((n) => [n.id, n]));
    el.querySelectorAll("[data-body]").forEach((s) => { s.textContent = byId.get(s.dataset.body)?.body || ""; });   // other people's text: set as text
    el.querySelectorAll("[data-cmt]").forEach((b) => b.onclick = () => { const f = el.querySelector(`[data-form="${CSS.escape(b.dataset.cmt)}"]`); f.hidden = !f.hidden; f.querySelector("input").focus(); });
    el.querySelectorAll("[data-send]").forEach((b) => {
      const form = b.parentElement, input = form.querySelector("input");
      const send = async () => {
        const text = input.value.trim(); if (!text) return;
        const [owner, game] = b.dataset.send.split("|");
        b.disabled = true;
        try {
          await CLOUD.api("game_notes", { method: "POST", prefer: "return=minimal", body: { owner_id: owner, game_id: game, anchor: { kind: "game" }, body: text, author_name: (myProfile?.display_name || "").slice(0, 60) } });
          notes.delete(b.dataset.send); await loadPosts(); renderFeed();
        } catch { b.disabled = false; input.placeholder = Tx("Couldn't send. Try again."); }
      };
      b.onclick = send;
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); send(); } });
    });
    $("older")?.addEventListener("click", async () => { await loadPosts(true); renderFeed(); });
  }

  // ---------- public home (signed out): what Inkwell is, with example profiles marked as such ----------
  function publicHome() {
    document.body.classList.add("out");
    document.title = "Inkwell · " + Tx("Your corner of the Lorcana community");
    const IDX = new Map(((typeof CARD_INDEX !== "undefined" && CARD_INDEX?.cards) || []).map((c) => [c[0], c]));

    const thumbOf = (id) => { const c = IDX.get(id); return `<span class="thumb">${img(id) ? `<img src="${img(id)}" alt="${esc(c ? c[1] : "")}" loading="lazy" decoding="async">` : ""}</span>`; };
    const INKPT = { Amber: "Âmbar", Amethyst: "Ametista", Emerald: "Esmeralda", Ruby: "Rubi", Sapphire: "Safira", Steel: "Aço" };
    const MOCK_EN = { "Quinta é dia de liga.": "Thursday is league night.", "Uma Encantada de cada vez.": "One Enchanted at a time.", "Venho pelo jogo, fico pelas pessoas.": "I come for the game, I stay for the people.",
      "Rafa (exemplo)": "Rafa (example)", "Marina (exemplo)": "Marina (example)", "Bia (exemplo)": "Bia (example)" };
    const L = (t) => (lang === "en" && MOCK_EN[t]) || t || "";
    const feats = [
      ["cards", "../colecao/", "Your collection, by camera", "Scan cards with the phone, check your binder page by page and see what it's worth in reais."],
      ["decks", "../decks/", "Decks with a buying plan", "See what's missing for each deck, what it costs, and which cards serve several decks."],
      ["games", "../coach/", "Your games, with stats", "Games from duels.ink and the lore counter, with win rate by deck and matchup."],
      ["chart", "../precos/", "Prices in reais", "TCGplayer every day and Brazilian shop prices, with a wishlist that tells you when to buy."],
      ["trades", "../trades/", "Trades and loans", "Lend to friends, post what you want or offer, and keep track of who has what."],
      ["users", "../perfil/", "Your profile and your friends", "A page that is yours: favourite cards, your deck, your friends and the recados they leave."],
    ];
    // New public home (handoff v1.1), behind INKWELL_FLAGS.guestProfile. The demo uses real catalogue cards
    // and says it is a demonstration; nothing in it is copied to a visitor's draft.
    const GUEST = !!(window.INKWELL_FLAGS || {}).guestProfile;
    const INK_HEX = { Amber: "#efbd49", Amethyst: "#a784db", Emerald: "#54b78b", Ruby: "#e27683", Sapphire: "#7ca9df", Steel: "#c1c8d3" };
    const demoCard = (id) => { const c = IDX.get(id), src = img(id), nm = c ? c[1] : id, [a, b] = nm.split(" - ");
      return `<figure style="margin:0"><span class="iw-card">${src ? `<img src="${src}" alt="${esc(nm)}" width="250" height="350" loading="lazy" decoding="async" onerror="this.remove()">` : ""}<span class="iw-fallback">${esc(nm)}</span></span>
        <figcaption class="iw-card-label">${esc(a)}${b ? `<small>${esc(b)}</small>` : ""}</figcaption></figure>`; };
    const newHero = () => `<div class="iw-public" data-testid="new-hero"><section class="iw-hero" aria-labelledby="nhT">
        <div><h1 class="iw-h1" id="nhT">${Tx("Your place in the Lorcana community.")}</h1>
          <p class="iw-lead">${Tx("Your favourite cards and your people, in a profile that feels like you.")}</p>
          <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:var(--sp-5)"><a class="iw-button iw-button-primary" href="../comecar/" data-testid="start">${Tx("Start my Inkwell")}</a>
            <a class="iw-button" href="../comunidades/">${Tx("Explore the community")}</a></div>
          <p style="margin:var(--sp-4) 0 0"><button type="button" class="iw-link" id="signIn2">${Tx("Already have an account? Sign in")}</button></p></div>
        <div class="iw-profile" aria-label="${esc(Tx("Demo with fictional data"))}">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:var(--sp-3)"><span class="iw-sample-label">${Tx("Demo with fictional data")}</span></div>
          <div class="iw-profile-head"><span class="iw-avatar" aria-hidden="true">${img("LOR14-2") ? `<img src="${img("LOR14-2")}" alt="">` : "R"}</span>
            <div><p class="iw-name">${Tx("Rafa (example)")}</p><span class="iw-inkdots" aria-label="${esc(lang === "pt" ? "Âmbar · Ametista" : "Amber · Amethyst")}"><i style="background:${INK_HEX.Amber}"></i><i style="background:${INK_HEX.Amethyst}"></i></span></div></div>
          <div class="iw-showcase">${["LOR13-27", "LOR12-195", "LOR10-17"].map(demoCard).join("")}</div>
          <blockquote class="iw-quote"><span class="iw-sample-label" style="font-style:normal;margin-bottom:6px">${Tx("Example recado")}</span><br>“${Tx("Thursday is league night. Who's in?")}”</blockquote></div></section>
      <section class="iw-section" aria-labelledby="bpT"><h2 class="iw-h2" id="bpT">${Tx("Build your profile")}</h2>
        <div class="iw-grid3" style="margin-top:var(--sp-4)">${[["Your name", "How you want to appear. Your real name and e-mail never show."], ["Up to two inks", "The colours you play, from the six real inks."], ["Three favourite cards", "Any card from the whole catalogue, in the exact printing and finish."]]
          .map(([t, d], i) => `<div class="iw-tile"><span class="iw-eyebrow">${i + 1}</span><h3 class="iw-h3">${Tx(t)}</h3><p class="iw-muted" style="margin:0">${Tx(d)}</p></div>`).join("")}</div>
        <p style="margin:var(--sp-4) 0 0" class="iw-muted">${Tx("Try it without an account. Create one only when you want to keep it.")} <a class="iw-link" href="../comecar/">${Tx("Start my Inkwell")}</a></p></section>
      <section class="iw-section" aria-labelledby="dkT" style="padding-top:0"><div class="iw-tile" style="display:grid;gap:var(--sp-2)"><span class="iw-sample-label" style="justify-self:start">${Tx("Demo with fictional data")}</span>
        <h2 class="iw-h2" id="dkT">${Tx("An example deck")}</h2><p class="iw-muted" style="margin:0">${Tx("Illustrative deck from a fictional profile: the full list is on the profile page. Not a tournament list.")}</p>
        <a class="iw-button" style="justify-self:start" href="../perfil/?u=rafa_exemplo">${Tx("See the deck")}</a></div></section></div>`;
    $("feed").style.marginTop = "0";
    $("feed").innerHTML = `<div class="land" data-testid="public-home">
      ${new URLSearchParams(location.search).get("conta") === "excluida" ? `<div class="notice ok" data-testid="deleted"><i class="ic i-check"></i><div class="t">${Tx("Your account and its data were deleted.")}</div></div>` : ""}
      ${GUEST ? newHero() : ""}
      <section class="land-hero" id="landHero" ${GUEST ? "hidden" : ""}><h1>${Tx("Your corner of the Lorcana community")}</h1>
        <p>${Tx("Show your favourite cards and your deck, invite your friends, and keep your collection, games and trades in one place. Free, made by a fan.")}</p>
        <div class="land-cta"><button type="button" class="btn primary large" id="signIn">${Tx("Create my Inkwell")}</button><a class="btn large" href="../perfil/?u=rafa_exemplo">${Tx("See an example profile")}</a></div>
        <p class="small faint" style="margin:var(--sp-3) 0 0">${Tx("Use your e-mail. We e-mail you a code, no password.")}</p></section>
      <section id="landEx" hidden><div class="group-head"><h2>${Tx("Meet the people")}</h2><span class="tag accent">${Tx("Examples · fictional profiles")}</span></div><div class="land-ex" id="exList"></div></section>
      <section id="landComm" hidden><div class="group-head"><h2>${Tx("Communities")}</h2><a class="small" href="../comunidades/">${Tx("See all")}</a></div><div class="land-ex" id="commList"></div></section>
      <section><div class="group-head"><h2>${Tx("What you can do")}</h2></div>
        <div class="land-feats">${feats.map(([ic, href, t, d]) => `<a class="land-feat" href="${href}"><i class="ic i-${ic}"></i><b>${Tx(t)}</b><span>${Tx(d)}</span></a>`).join("")}</div></section>
      <section><div class="group-head"><h2>${Tx("How it works")}</h2></div>
        <ol class="land-steps" style="padding:0;margin:0" data-testid="how-it-works">${GUEST
          ? `<li><b>${Tx("Make it yours, no account")}</b>${Tx("Your name, two inks and three favourite cards.")}</li><li><b>${Tx("Create your account to save")}</b>${Tx("A code by e-mail, no password. What you did stays.")}</li><li><b>${Tx("Your profile, saved")}</b>${Tx("Private until you decide to make it public.")}</li>`
          : `<li><b>${Tx("Sign in with your e-mail")}</b>${Tx("A code by e-mail, no password.")}</li><li><b>${Tx("Make your profile")}</b>${Tx("Private until you decide to make it public.")}</li><li><b>${Tx("Invite your friends")}</b>${Tx("Whoever signs in through your link gets your friend request.")}</li>`}</ol></section>
      <p class="small faint">${Tx("Fan project, free, not affiliated with Disney or Ravensburger.")} · <a href="../privacidade/">${Tx("Terms and privacy")}</a></p></div>`;
    $("signIn").onclick = () => window.INKWELL_SIGNIN?.();
    $("signIn2")?.addEventListener("click", () => window.INKWELL_SIGNIN?.());
    const heroArt = img("LOR14-2"); if (heroArt) $("landHero").style.setProperty("--hero-art", `url('${heroArt}')`);
    const cfg = window.INKWELL_CLOUD_CONFIG;
    fetch(`${cfg.url}/rest/v1/rpc/example_profiles`, { method: "POST", headers: { apikey: cfg.key, "Content-Type": "application/json" }, body: "{}" })
      .then((r) => (r.ok ? r.json() : [])).then((list) => {
        list = (list || []).filter((p) => p && p.mock);
        if (!list.length) return;
        $("exList").innerHTML = list.map((p) => `<a class="ex-card" href="../perfil/?u=${encodeURIComponent(p.handle)}" data-testid="example-profile">
          <div class="ex-top"><span class="ex-av" style="${img(p.avatar) ? `background-image:url('${img(p.avatar)}')` : ""}"></span><div><b>${esc(L(p.name))}</b><div class="small muted">@${esc(p.handle)}${(p.inks || []).length ? " · " + (p.inks || []).map((i) => (lang === "pt" ? INKPT[i] || i : i)).join(" / ") : ""}</div></div></div>
          ${p.motto ? `<p class="ex-motto">“${esc(L(p.motto))}”</p>` : ""}
          <div class="ex-show">${(p.showcase || []).slice(0, 3).map((s) => thumbOf(s.id)).join("")}</div>
          <div class="ex-meta">${p.city ? `<span>${esc(p.city)}</span>` : ""}<span>${esc((p.friends_n ?? (p.friends || []).length) === 1 ? Tx("1 friend") : Tx("{n} friends", { n: p.friends_n ?? (p.friends || []).length }))}</span>${(p.recados || []).length ? `<span>${esc(p.recados.length === 1 ? Tx("1 recado") : Tx("{n} recados", { n: p.recados.length }))}</span>` : ""}</div>
          <span class="tag accent" style="width:max-content">${Tx("Example · fictional profile")}</span></a>`).join("");
        $("landEx").hidden = false;
      }).catch(() => {});
    const CM_EN = { "Taverna da Tinta (exemplo)": "Taverna da Tinta (example)", "Encantadas & Cia (exemplo)": "Encantadas & Co. (example)",
      "Loja fictícia de exemplo. Liga às quintas, torneio casual às sextas e mesa livre no sábado à tarde.": "A fictional example store. League on Thursdays, casual tournament on Fridays and open tables on Saturday afternoon.",
      "Comunidade fictícia de exemplo para quem coleciona Encantadas: trocas, fotos de fichário e dicas de conservação.": "A fictional example community for Enchanted collectors: trades, binder photos and care tips." };
    const CL = (c, t) => (c.mock && lang === "en" && CM_EN[t]) || t || "";
    fetch(`${cfg.url}/rest/v1/rpc/communities_list`, { method: "POST", headers: { apikey: cfg.key, "Content-Type": "application/json" }, body: JSON.stringify({ p_q: "", p_mine: false }) })
      .then((r) => (r.ok ? r.json() : [])).then((list) => {
        list = (list || []).slice(0, 4); if (!list.length) return;
        $("commList").innerHTML = list.map((c) => `<a class="ex-card" href="../comunidades/?c=${encodeURIComponent(c.slug)}" data-testid="example-community">
          <div class="ex-top"><span class="ex-av" style="border-radius:14px;${img(c.avatar) ? `background-image:url('${img(c.avatar)}')` : ""}"></span><div><b>${esc(CL(c, c.name))}</b><div class="small muted">${esc([Tx(c.kind === "city" ? "City" : c.kind === "interest" ? "Interest" : "Store"), c.city].filter(Boolean).join(" · "))}</div></div></div>
          ${c.description ? `<p class="small muted" style="margin:0">${esc(CL(c, c.description))}</p>` : ""}
          <div class="ex-meta"><span>${esc(c.members === 1 ? Tx("1 member") : Tx("{n} members", { n: c.members }))}</span></div>
          ${c.mock ? `<span class="tag accent" style="width:max-content">${Tx("Example · fictional community")}</span>` : ""}</a>`).join("");
        $("landComm").hidden = false;
      }).catch(() => {});
  }

  // ---------- boot ----------
  if (!me) { publicHome(); return; }
  if (location.hash === "#amigos") setTimeout(() => { if (phone()) $("openFriends").click(); else $("findPeople")?.focus(); }, 0);
  $("feed").innerHTML = `<span class="skel" style="height:150px;border-radius:var(--r-lg)"></span><span class="skel" style="height:150px;border-radius:var(--r-lg)"></span><p class="sr-only">${Tx("Loading…")}</p>`;
  // ---------- "Para você": what is waiting, and what your communities are saying (supabase/my_account.sql my_home) ----------
  async function renderForYou() {
    let h = null; try { h = await CLOUD.api("rpc/my_home", { method: "POST", body: {} }); } catch { h = null; }
    const box = $("forYou"); if (!box) return;
    if (!h) { box.innerHTML = ""; return; }
    const IDX = new Map(((typeof CARD_INDEX !== "undefined" && CARD_INDEX?.cards) || []).map((c) => [c[0], c]));
    const art = (id) => { const c = IDX.get(id); return c && c[8] ? `background-image:url('../lorcana-card-images/${encodeURI(c[8]).replace(/'/g, "%27")}')` : ""; };
    const when = (d) => { const m = (Date.now() - Date.parse(d)) / 60000; if (!(m >= 0)) return ""; if (m < 60) return Tx("{n} min ago", { n: Math.max(1, Math.round(m)) }); if (m < 1440) return Tx("{n} h ago", { n: Math.round(m / 60) }); const dd = Math.round(m / 1440); return dd === 1 ? Tx("yesterday") : Tx("{n} days ago", { n: dd }); };
    const reqs = (h.friend_requests || []).filter(Boolean), waiting = h.recados_waiting || 0, comms = h.communities || [], posts = (h.community_posts || []).filter((p) => !p.mine);
    const tiles = [];
    if (reqs.length) tiles.push(`<a class="fy-tile hot" href="#amigos" id="fyReqs" data-testid="fy-requests"><i class="ic i-user-plus"></i><span><b>${esc(reqs.length === 1 ? Tx("{name} wants to be your friend", { name: reqs[0].name || Tx("Someone") }) : Tx("{n} friend requests", { n: reqs.length }))}</b><span class="small muted" style="display:block">${Tx("Answer in Friends")}</span></span><span class="n">${reqs.length}</span></a>`);
    if (waiting) tiles.push(`<a class="fy-tile hot" href="../perfil/?editar=1#recados" data-testid="fy-recados"><i class="ic i-comment"></i><span><b>${esc(waiting === 1 ? Tx("A recado is waiting for you") : Tx("{n} recados are waiting for you", { n: waiting }))}</b><span class="small muted" style="display:block">${Tx("Approve it to show on your profile")}</span></span><span class="n">${waiting}</span></a>`);
    if (!h.profile?.handle || !h.profile?.is_public) tiles.push(`<a class="fy-tile" href="../perfil/?editar=1" data-testid="fy-profile"><span class="fy-av" style="${art(h.profile?.avatar)}"></span><span><b>${Tx("Set up My Inkwell")}</b><span class="small muted" style="display:block">${Tx("Your cards, your deck, your friends. Private until you say so.")}</span></span><i class="ic i-chevron-right"></i></a>`);
    if (!comms.length) tiles.push(`<a class="fy-tile" href="../comunidades/" data-testid="fy-communities"><i class="ic i-board"></i><span><b>${Tx("Find your people")}</b><span class="small muted" style="display:block">${Tx("Join your store's or your city's community.")}</span></span><i class="ic i-chevron-right"></i></a>`);
    box.innerHTML = `<section class="fy"><div class="group-head" style="margin:0"><h2 style="margin:0">${Tx("For you")}</h2>${comms.length ? `<a class="small" href="../comunidades/">${Tx("My communities")}</a>` : ""}</div>
      ${tiles.length ? `<div class="fy-row">${tiles.join("")}</div>` : ""}
      ${(h.recados_new || []).filter(Boolean).length ? `<div class="fy-posts">${h.recados_new.filter(Boolean).map((r) => `<a class="fy-post" href="../perfil/?editar=1"><span class="fy-av" style="${art(r.avatar)}"></span><span><span class="small"><b>${esc(r.name || Tx("Someone"))}</b> <span class="faint">${Tx("left you a recado")} · ${esc(when(r.at))}</span></span><p>${esc(r.body)}</p></span></a>`).join("")}</div>` : ""}
      ${posts.length ? `<div class="fy-posts" data-testid="fy-posts">${posts.slice(0, 4).map((p) => `<a class="fy-post" href="../comunidades/?c=${encodeURIComponent(p.slug)}"><span class="fy-av" style="${art(p.avatar)}"></span><span><span class="small"><b>${esc(p.name || Tx("Someone"))}</b> <span class="faint">${Tx("in")} ${esc(p.community)} · ${esc(when(p.at))}</span></span><p>${esc(p.body)}</p></span></a>`).join("")}</div>` : ""}
      ${!tiles.length && !posts.length && !(h.recados_new || []).length ? `<p class="small muted" style="margin:0">${Tx("All caught up.")}</p>` : ""}</section>`;
    window.INKWELL_MARK_SEEN?.();   // the community messages are on screen now
    $("fyReqs")?.addEventListener("click", (e) => { e.preventDefault(); if (phone()) $("openFriends").click(); else { $("findPeople")?.scrollIntoView({ block: "center" }); $("findPeople")?.focus(); } });
  }

  const go = async () => {
    renderForYou();
    try { await loadPeople(); await loadPosts(); renderSide(); renderFeed(); if (location.hash === "#amigos") { if (phone()) $("openFriends").click(); else $("findPeople")?.focus(); } }
    catch { $("feed").innerHTML = `<div class="empty"><img src="../ui/assets/empty/error.svg" alt=""><b>${Tx("Couldn't load the timeline.")}</b><p>${Tx("Check your connection and try again.")}</p><button type="button" class="btn" id="retry"><i class="ic i-refresh"></i>${Tx("Try again")}</button></div>`; $("retry").onclick = go; }
  };
  go();
  document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible" && myProfile && !$("friendsSheet").open) { try { await loadPeople(); await loadPosts(); renderSide(); renderFeed(); } catch { /* keep what's shown */ } } });
})();
</script>

<script>window.INKWELL_SHELL = {"page": "feed"};
/*@SHELL_JS@*/</script>
</body>
