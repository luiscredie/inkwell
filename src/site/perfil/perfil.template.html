  async function acceptPendingInvite() {
    let code = null; try { code = localStorage.getItem(INVITE_KEY); } catch { /* */ }

    try { localStorage.removeItem(INVITE_KEY); } catch { /* */ }

      try {
        if (yes) await CLOUD.api(`friendships?requester=eq.${r.requester}&addressee=eq.${me.id}`, { method: "PATCH", prefer: "return=minimal", body: { status: "accepted", accepted_at: new Date().toISOString() } });

          <div class="row" style="gap:var(--sp-3)">${e.avatar_card ? `<span class="mi-av sm" style="${artStyle(e.avatar_card)}"></span><span class="small">${esc(BY.get(e.avatar_card)?.name || "")}</span>` : ""}</div>
          <div class="picker"><input id="qAv" type="search" value="${esc(qAv)}" placeholder="${Tx("Search a card")}" aria-label="${Tx("Search a card")}" autocomplete="off"></div>${qAv ? cardSearch("avRes", qAv) : ""}</div>
        <div class="form-block"><h3>${Tx("Showcase")}</h3><p class="small muted" style="margin:0">${Tx("Up to 3 cards. Mark \"I own it\" only for cards in your collection.")}</p>
          <div class="ed-show">${e.showcase.map((s, i) => { const c = BY.get(s.id); if (!c) return ""; const owns = ownsCard(e, s.id);
            return `<div class="list-row on-field">${thumb(c, "sm")}<span class="t"><span>${esc(split(c.name).join(" · ").replace(/ · $/, ""))}</span><span class="meta">${esc(setName(c.set))} · nº ${esc(c.num)}</span></span>
              <span class="trail" style="gap:var(--sp-2)"><span class="seg" role="group"><button type="button" data-sk="${i}:own" aria-pressed="${s.k === "own"}" ${owns ? "" : "disabled"}>${Tx("I own it")}</button><button type="button" data-sk="${i}:fav" aria-pressed="${s.k !== "own"}">${Tx("Favourite")}</button></span>
              <button type="button" class="btn ghost icon small" data-sdel="${i}" aria-label="${Tx("Remove")}"><i class="ic i-close"></i></button></span></div>`; }).join("")}</div>
          ${e.showcase.length < 3 ? `<div class="picker"><input id="qShow" type="search" value="${esc(qShow)}" placeholder="${Tx("Add a card")}" aria-label="${Tx("Add a card")}" autocomplete="off"></div>${qShow ? cardSearch("showRes", qShow, (id) => e.showcase.some((s) => s.id === id)) : ""}` : ""}</div>
        <div class="form-block"><h3>${Tx("Featured deck")}</h3>
          ${decksBy.length > 1 ? `<label class="field">${Tx("Which Inkwell collection")}<select id="fProf">${decksBy.map((x) => `<option value="${esc(x.profile)}" ${x.profile === prof.profile ? "selected" : ""}>${esc(x.profile)}</option>`).join("")}</select><span class="hint">${Tx("Used for \"I own it\" and the featured deck.")}</span></label>` : ""}
          <label class="field">${Tx("Which of your decks people see.")}<select id="fDeck"><option value="">${Tx("No deck")}</option>${prof.decks.map((d) => `<option value="${esc(d.id)}" ${d.id === e.featured_deck ? "selected" : ""}>${esc(d.name || d.id)}</option>`).join("")}</select></label></div>
        <div class="form-block"><h3>${Tx("Privacy")}</h3>
          <label class="switch"><span>${Tx("I am 18 or older")}<small>${Tx("Required for a public profile.")}</small></span><input type="checkbox" role="switch" id="fAdult" ${e.adult ? "checked" : ""}></label>
          <label class="switch"><span>${Tx("Public profile")}<small>${Tx("Needs a profile address and the 18+ confirmation.")}</small></span><input type="checkbox" role="switch" id="fPublic" ${e.is_public && canPublic ? "checked" : ""} ${canPublic && !mine.hidden ? "" : "disabled"}></label>
          <label class="switch"><span>${Tx("Show my wins and losses")}<small>${Tx("Totals only, never the games.")}</small></span><input type="checkbox" role="switch" id="fRec" ${e.show_record ? "checked" : ""}></label>
          <label class="switch"><span>${Tx("Show what I look for and offer")}<small>${Tx("Your wishlist and your board posts.")}</small></span><input type="checkbox" role="switch" id="fTrade" ${e.show_trade ? "checked" : ""}></label>
          <p class="small faint" style="margin:0">${Tx("Your collection is never shown.")}</p></div>
        <p class="small" id="edMsg" role="alert" style="margin:0"></p>
        <div class="ed-foot">${mine.handle && mine.is_public ? `<a class="btn ghost" href="?u=${esc(mine.handle)}">${Tx("See as others see it")}</a>` : ""}<button type="submit" class="btn primary" id="edSave">${Tx("Save")}</button></div>
      </form>
      <section class="card" style="margin-top:var(--sp-6)" data-testid="my-recados"><h3 style="margin-top:0">${Tx("Recados")}</h3><div id="myRecs">${recadosBox()}</div></section>
      <div class="grid2" style="margin-top:var(--sp-6);gap:var(--sp-5)">
        <section class="card"><h3 style="margin-top:0">${Tx("Player card")}</h3><p class="small muted">${Tx("An image to send in your groups.")}</p><div id="pcBox"></div>
          <button type="button" class="btn" id="pcMake"><i class="ic i-sparkle"></i>${Tx("Make the card")}</button></section>
        <section class="card" data-testid="invite-box"><h3 style="margin-top:0">${Tx("Invite friends")}</h3><p class="small muted">${Tx("Whoever signs in through your link becomes your friend.")}</p>
          ${mine.invite_code ? `<div class="invite-box"><input id="invLink" readonly value="${esc(inviteUrl())}" aria-label="${Tx("Invite friends")}"><button type="button" class="btn" id="invCopy">${Tx("Copy link")}</button></div>
          <a class="btn" style="margin-top:var(--sp-3)" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(Tx("Come see my Inkwell and play Lorcana with me:") + " " + inviteUrl())}">${Tx("Send on WhatsApp")}</a>` : `<p class="small faint">${Tx("Save")}…</p>`}</section>
      </div>`;
    wire();
    if (keep && $(keep)) { $(keep).focus(); try { if (caret != null) $(keep).setSelectionRange(caret, caret); } catch { /* */ } }
  }
  let myRecs = null;
  function recadosBox() {
    if (!myRecs) return `<p class="small faint">${Tx("Loading…")}</p>`;
    const pend = myRecs.filter((r) => r.status === "pending"), shown = myRecs.filter((r) => r.status === "shown"), hid = myRecs.filter((r) => r.status === "hidden");
    const row = (r, acts) => `<article class="mi-rec1" data-rec="${esc(r.id)}">${miniAv(r.author_avatar, r.author_name)}<div><div class="small"><b>${esc(r.author_name || "")}</b> <span class="faint">· ${esc(ago(r.created_at))}</span></div><p>${esc(r.body)}</p>
      <div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap">${acts.map(([k, l, cls]) => `<button type="button" class="btn small ${cls || ""}" data-ra="${k}">${Tx(l)}</button>`).join("")}</div></div></article>`;
    return `${pend.length ? `<div class="mi-label">${Tx("Recados waiting for you")}</div><p class="small faint" style="margin:4px 0 var(--sp-2)">${Tx("Only you see them until you approve.")}</p><div class="mi-reclist">${pend.map((r) => row(r, [["shown", "Approve", "primary"], ["hidden", "Hide"], ["del", "Delete", "ghost"]])).join("")}</div>` : ""}
      ${shown.length ? `<div class="mi-label" style="margin-top:var(--sp-4)">${Tx("On your profile")}</div><div class="mi-reclist" style="margin-top:var(--sp-2)">${shown.map((r) => row(r, [["hidden", "Hide"], ["del", "Delete", "ghost"]])).join("")}</div>` : ""}
      ${hid.length ? `<div class="mi-label" style="margin-top:var(--sp-4)">${Tx("Hidden")}</div><div class="mi-reclist" style="margin-top:var(--sp-2)">${hid.map((r) => row(r, [["shown", "Show again"], ["del", "Delete", "ghost"]])).join("")}</div>` : ""}
      ${myRecs.length ? "" : `<p class="mi-empty">${Tx("No recados yet.")}</p>`}`;
  }
  function wireRecados() {
    if (!myRecs) rpc("my_recados").then((r) => { myRecs = r || []; const b = $("myRecs"); if (b) { b.innerHTML = recadosBox(); wireRecados(); } }).catch(() => { myRecs = []; const b = $("myRecs"); if (b) b.innerHTML = recadosBox(); });
    document.querySelectorAll("[data-ra]").forEach((b) => b.onclick = async () => {
      const id = b.closest("[data-rec]").dataset.rec, a = b.dataset.ra; b.disabled = true;
      try {
        if (a === "del") await CLOUD.api(`recados?id=eq.${id}`, { method: "DELETE", prefer: "return=minimal" });
        else await CLOUD.api(`recados?id=eq.${id}`, { method: "PATCH", prefer: "return=minimal", body: { status: a, decided_at: new Date().toISOString() } });
        myRecs = a === "del" ? myRecs.filter((r) => r.id !== id) : myRecs.map((r) => (r.id === id ? { ...r, status: a } : r));
        $("myRecs").innerHTML = recadosBox(); wireRecados(); toast(Tx("Saved"));
      } catch { b.disabled = false; toast(Tx("Couldn't save. Try again."), true); }
    });
  }
  const inviteUrl = () => `${base()}?convite=${encodeURIComponent(mine.invite_code)}${mine.handle && mine.is_public ? `&u=${encodeURIComponent(mine.handle)}` : ""}`;
  function wire() {
    const e = editing, set = (k, val, redraw = true) => { e[k] = val; dirty = true; if (redraw) drawEditor(); };
    $("ed").addEventListener("submit", (ev) => { ev.preventDefault(); save(); });
    // text fields refresh only the preview and the public switch, so the form keeps focus and what is typed
    const live = () => { const ok = e.adult && /^[a-z0-9_]{3,20}$/.test(e.handle || ""); $("prev").innerHTML = profileView(asPublic(e), { preview: true });
      $("fPublic").disabled = !ok || !!mine.hidden; if (!ok) $("fPublic").checked = false; };
    $("fName").oninput = (ev) => { set("display_name", ev.target.value, false); live(); };
    $("fHandle").oninput = (ev) => { const v = ev.target.value.toLowerCase().replace(/[^a-z0-9_]/g, "").slice(0, 20); if (v !== ev.target.value) ev.target.value = v; set("handle", v, false); ev.target.removeAttribute("aria-invalid"); live(); };
    $("fBio").oninput = (ev) => { set("bio", ev.target.value.slice(0, 160), false); $("hBio").textContent = `${Tx("One or two lines: how you play, what you collect.")} ${e.bio.length}/160`; live(); };
    $("fCity").oninput = (ev) => { set("city", ev.target.value.slice(0, 40), false); live(); };
    $("fMotto").oninput = (ev) => { set("motto", ev.target.value.slice(0, 60), false); live(); };
    wireRecados();
    document.querySelectorAll("[data-ink]").forEach((b) => b.onclick = () => { if (!b.closest(".ed-inks")) return; const i = b.dataset.ink; set("inks", e.inks.includes(i) ? e.inks.filter((x) => x !== i) : [...e.inks, i].slice(-2)); });
    $("qAv").oninput = (ev) => { qAv = ev.target.value; drawEditor(); };
    document.querySelectorAll("#avRes [data-pick]").forEach((b) => b.onclick = () => { qAv = ""; set("avatar_card", b.dataset.pick); });
    if ($("qShow")) $("qShow").oninput = (ev) => { qShow = ev.target.value; drawEditor(); };
    document.querySelectorAll("#showRes [data-pick]").forEach((b) => b.onclick = () => { qShow = ""; const id = b.dataset.pick; set("showcase", [...e.showcase, { id, k: ownsCard(e, id) ? "own" : "fav" }].slice(0, 3)); });
    document.querySelectorAll("[data-sk]").forEach((b) => b.onclick = () => { const [i, k] = b.dataset.sk.split(":"); const s = e.showcase.slice(); s[+i] = { ...s[+i], k }; set("showcase", s); });
    document.querySelectorAll("[data-sdel]").forEach((b) => b.onclick = () => set("showcase", e.showcase.filter((_, i) => i !== +b.dataset.sdel)));
    if ($("fProf")) $("fProf").onchange = (ev) => { e.inkwell_profile = ev.target.value; e.featured_deck = ""; dirty = true; drawEditor(); };
    $("fDeck").onchange = (ev) => set("featured_deck", ev.target.value);
    $("fAdult").onchange = (ev) => { e.adult = ev.target.checked; if (!e.adult) { e.is_public = false; } dirty = true; drawEditor(); };
    $("fPublic").onchange = (ev) => set("is_public", ev.target.checked);
    $("fRec").onchange = (ev) => set("show_record", ev.target.checked);
    $("fTrade").onchange = (ev) => set("show_trade", ev.target.checked);
    $("pcMake").onclick = () => makeCard(asPublic(e));
    $("invCopy")?.addEventListener("click", async () => { try { await navigator.clipboard.writeText(inviteUrl()); toast(Tx("Link copied")); } catch { $("invLink").select(); } });
    $("toEdit")?.remove();
  }
  async function save() {
    const e = editing, msg = $("edMsg"), b = $("edSave");
    if (e.handle && !/^[a-z0-9_]{3,20}$/.test(e.handle)) { msg.textContent = Tx("Use 3 to 20 lowercase letters, numbers or _."); $("fHandle").setAttribute("aria-invalid", "true"); $("fHandle").focus(); return; }
    b.setAttribute("aria-busy", "true"); b.disabled = true; msg.textContent = "";
    const body = { ...e, city: e.adult ? e.city : "", is_public: e.is_public && e.adult && !!e.handle };
    try {
      const r = await rpc("save_my_profile", { p: body });
      mine = r || mine; editing = null; dirty = false; await editor(); toast(Tx("Saved"));
    } catch (err) {
      b.removeAttribute("aria-busy"); b.disabled = false;
      msg.textContent = /handle_taken/.test(String(err?.message || err)) ? Tx("That address is taken. Try another.") : Tx("Couldn't save. Try again.");
    }
  }
  window.addEventListener("beforeunload", (ev) => { if (dirty) { ev.preventDefault(); ev.returnValue = ""; } });

  // ---------- player card (an image, so it travels well in WhatsApp groups) ----------
  const loadImg = (src) => new Promise((ok) => { if (!src) return ok(null); const im = new Image(); im.onload = () => ok(im); im.onerror = () => ok(null); im.src = src; });
  async function makeCard(p) {
    const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d");
    const css = getComputedStyle(document.documentElement), col = (v, d) => (css.getPropertyValue(v).trim() || d);
    const font = css.getPropertyValue("--font").trim() || "system-ui, sans-serif";
    x.fillStyle = "#13102a"; x.fillRect(0, 0, W, H);
    const av = await loadImg(imgUrl(BY.get(p.avatar)));
    if (av) {   // the art band: the top half of the card, cropped to cover
      const sx = av.width * 0.16, sy = av.height * 0.09, sw = av.width * 0.8, sh = av.height * 0.41, k = Math.max(W / sw, 560 / sh);
      x.save(); x.beginPath(); x.rect(0, 0, W, 560); x.clip();
      x.drawImage(av, sx, sy, sw, sh, (W - sw * k) / 2, (560 - sh * k) / 2, sw * k, sh * k); x.restore();
    }
    const g = x.createLinearGradient(0, 260, 0, 562); g.addColorStop(0, "rgba(19,16,42,0)"); g.addColorStop(1, "#13102a"); x.fillStyle = g; x.fillRect(0, 0, W, 600);
    if (av) {   // round avatar with a gold ring
      x.save(); x.beginPath(); x.arc(W / 2, 560, 118, 0, Math.PI * 2); x.fillStyle = col("--gold", "#e9b949"); x.fill();
      x.beginPath(); x.arc(W / 2, 560, 108, 0, Math.PI * 2); x.clip();
      const sw = av.width * 0.55, sx = (av.width - sw) / 2, sy = av.height * 0.07; x.drawImage(av, sx, sy, sw, sw, W / 2 - 108, 452, 216, 216); x.restore();
    }
    x.textAlign = "center"; x.fillStyle = "#f4f1ff";
    x.font = `800 64px ${font}`; x.fillText(String(L(p, p.name) || "").slice(0, 28), W / 2, 744);
    if (p.motto) { x.fillStyle = col("--gold", "#e9b949"); x.font = `italic 700 34px ${font}`; x.fillText(`“${String(L(p, p.motto)).slice(0, 60)}”`, W / 2, 852); }
    x.fillStyle = "#aaa3cc"; x.font = `600 36px ${font}`;
    x.fillText([p.handle ? "@" + p.handle : "", (p.inks || []).map(inkName).join(" / "), p.city].filter(Boolean).join("  ·  "), W / 2, 798);
    const show = (p.showcase || []).filter((s) => BY.has(s.id)).slice(0, 3);
    const imgs = await Promise.all(show.map((s) => loadImg(imgUrl(BY.get(s.id)))));
    const cw = 220, ch = 308, gap = 40, n = show.length, x0 = (W - (n * cw + (n - 1) * gap)) / 2;
    show.forEach((s, i) => { const im = imgs[i], cx = x0 + i * (cw + gap), cy = 884;
      x.save(); x.beginPath(); x.roundRect ? x.roundRect(cx, cy, cw, ch, 16) : x.rect(cx, cy, cw, ch); x.clip(); if (im) x.drawImage(im, cx, cy, cw, ch); else { x.fillStyle = "#2a2550"; x.fillRect(cx, cy, cw, ch); } x.restore();
      x.fillStyle = s.own ? "#7fe0a8" : col("--gold", "#e9b949"); x.font = `700 28px ${font}`; x.fillText(Tx(s.own ? "owns it" : "favourite"), cx + cw / 2, cy + ch + 36); });
    if (p.mock) { x.fillStyle = "rgba(233,185,73,.95)"; x.font = `800 34px ${font}`; x.fillText(Tx("Example · fictional profile").toUpperCase(), W / 2, 60); }
    x.strokeStyle = "rgba(255,255,255,.12)"; x.beginPath(); x.moveTo(140, H - 100); x.lineTo(W - 140, H - 100); x.stroke();
    x.fillStyle = "#f4f1ff"; x.font = `800 34px ${font}`; x.fillText("Inkwell", W / 2, H - 66);
    x.fillStyle = "#7d77a8"; x.font = `500 24px ${font}`; x.fillText(Tx("Fan project, not affiliated with Disney or Ravensburger."), W / 2, H - 28);
    const blob = await new Promise((ok) => c.toBlob(ok, "image/png"));
    const url = URL.createObjectURL(blob), file = new File([blob], `inkwell-${p.handle || "card"}.png`, { type: "image/png" });
    $("pcBox").innerHTML = `<img class="pc-prev" src="${url}" alt="${esc(Tx("Player card"))}" data-testid="player-card"><div class="row" style="gap:var(--sp-2);margin:var(--sp-3) 0">
      ${navigator.canShare && navigator.canShare({ files: [file] }) ? `<button type="button" class="btn primary" id="pcShare"><i class="ic i-send"></i>${Tx("Send the image")}</button>` : ""}
      <a class="btn" download="${esc(file.name)}" href="${url}">${Tx("Download")}</a></div>`;
    $("pcShare")?.addEventListener("click", () => navigator.share({ files: [file], title: "Inkwell" }).catch(() => {}));
  }

  // ---------- report ----------
  function openReport(h) {
    const sh = $("sheet");
    sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="shT">${Tx("Report profile")}</h2><button type="button" class="btn ghost icon" data-close aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>
      <div class="sheet-body"><label class="field">${Tx("Why are you reporting this profile?")}<textarea id="rpWhy" maxlength="500" rows="4"></textarea></label><p class="small" id="rpMsg" role="alert"></p></div>
      <div class="sheet-foot"><button type="button" class="btn ghost" data-close>${Tx("Cancel")}</button><button type="button" class="btn primary" id="rpSend">${Tx("Send report")}</button></div>`;
    sh.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => sh.close());
    $("rpSend").onclick = async () => {
      const why = $("rpWhy").value.trim(); if (why.length < 3) { $("rpWhy").focus(); return; }
      try { await rpc("report_profile", { p_handle: h, p_reason: why }); sh.close(); toast(Tx("Report sent. Thank you.")); } catch { $("rpMsg").textContent = Tx("Couldn't send. Try again."); }
    };
    sh.showModal(); setTimeout(() => $("rpWhy").focus(), 30);
  }

  // ---------- helpers ----------
  function emptyBox(img, title, text, extra = "") { return `<div class="empty"><img src="../ui/assets/empty/${img}.svg" alt=""><b>${esc(title)}</b><p>${esc(text)}</p>${extra}</div>`; }
  let toastTimer = null;
  function toast(text, err) {
    const t = $("toast"); t.className = `toast${err ? " err" : ""}`;
    t.innerHTML = `<i class="ic ${err ? "i-alert" : "i-check"}"></i><span>${esc(text)}</span>`; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
  }

  // ---------- boot ----------
  document.documentElement.lang = LOC;
  $("title").textContent = Tx("My Inkwell");
  $("app").innerHTML = `<div class="skel" style="height:260px;border-radius:20px"></div><p class="sr-only">${Tx("Loading…")}</p>`;
  (async () => {
    if (me) { try { await loadMine(); } catch { mine = null; } await acceptPendingInvite(); }
    if (handleQ) return showPublic(handleQ);
    if (!me) {
      if (inviteQ) { $("app").innerHTML = await inviteBanner(); wireInvite(); return; }
      return welcome();
    }
    document.title = `${Tx("My Inkwell")} · Inkwell`;
    if (mine && mine.handle && mine.is_public && !qs.has("editar")) return showPublic(mine.handle);
    return editor();
  })();
})();
</script>

<script>window.INKWELL_SHELL = {"page": "profile"};
/*@SHELL_JS@*/</script>
</body>
