  const INK_PT = { Amber: "Âmbar", Amethyst: "Ametista", Emerald: "Esmeralda", Ruby: "Rubi", Sapphire: "Safira", Steel: "Aço" };
  const INKS = ["Amber", "Amethyst", "Emerald", "Ruby", "Sapphire", "Steel"];
  const fill = (s, v) => (v ? s.replace(/\{(\w+)\}/g, (m, k) => (k in v ? String(v[k]) : m)) : s);
  const Tx = (en, v) => fill(lang === "pt" && en in PT ? PT[en] : en, v);
  const inkName = (i) => (lang === "pt" ? INK_PT[i] || i : i);
  const LOC = lang === "pt" ? "pt-BR" : "en";
  const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const split = (name) => { const i = name.indexOf(" - "); return i > 0 ? [name.slice(0, i), name.slice(i + 3)] : [name, ""]; };
  const inksOf = (c) => String(c.ink || "").split(/[,\/]\s*/).map((x) => x.trim()).filter(Boolean);

  // ---------- catalog ----------
  // Main sets by number (1, 2 … 14), then Illumineer's Quest, then the rest as the catalog has them
  const setRank = (code, i) => { const m = /^LOR(\d+)$/.exec(code) || []; const q = /^Q(\d+)$/.exec(code) || []; return m[1] ? +m[1] : q[1] ? 100 + +q[1] : 200 + i; };
  const SETS = (CARD_INDEX?.sets || []).map((x, i) => ({ ...x, rank: setRank(x.code, i) })).sort((a, b) => a.rank - b.rank);
  const setName = (code) => { const s = SETS.find((x) => x.code === code); return s ? (lang === "pt" && s.name_pt) || s.name_en || code : code; };
  const CARDS = (CARD_INDEX?.cards || []).map(([id, name, cost, type, ink, rarity, set, num, img, inkable, song]) => ({ id, name: name || id, cost: +cost || 0, type, ink, rarity, set, num, img, inkable: !!inkable, song: !!song, k: norm(`${name} ${set} ${num}`) }));
  const BY = new Map(CARDS.map((c) => [c.id, c]));
  const picker = window.INKWELL_CARD_PICKER({ dialog: $("cardPicker"), cards: CARDS, sets: CARD_INDEX?.sets || [], lang,
    signedIn: () => !!CLOUD?.user()?.id, loadCollection: async () => (editing ? pickProfile(editing).collection : null) });
  const imgUrl = (c) => (c?.img ? `../lorcana-card-images/${encodeURI(c.img).replace(/'/g, "%27")}` : "");
  const thumb = (c, cls = "") => `<span class="thumb ${cls}" data-ink="${(inksOf(c || {})[0] || "steel").toLowerCase()}">${c?.img ? `<img src="${imgUrl(c)}" alt="${esc(c.name)}" loading="lazy" decoding="async" onerror="this.remove()">` : ""}</span>`;
  // a deck as cards: the same rules and grid as Decks > Visão geral (src/site/deckview.js)
  const nameKey = (n) => String(n || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s*\(.*?\)\s*/g, " ").replace(/[^a-z0-9]+/g, " ").trim();
  const setNo = (code) => +(/^LOR(\d+)$/.exec(code || "") || [])[1] || 0;
  const DV = window.INKWELL_DECKVIEW({ esc, Tx, split, inksOf, imgUrl, setNo, nameKey, LOC });
  const artStyle = (id) => { const c = BY.get(id); return c?.img ? `background-image:url('${imgUrl(c)}')` : ""; };
  const inkChip = (i) => `<span class="mi-ink"><i data-ink="${i.toLowerCase()}" style="background:var(--ink-${i.toLowerCase()})"></i>${esc(inkName(i))}</span>`;

  // ---------- state ----------
  const CLOUD = window.INKWELL_CLOUD;
  const me = CLOUD?.user();
  const qs = new URLSearchParams(location.search);
  const handleQ = (qs.get("u") || "").toLowerCase().replace(/[^a-z0-9_]/g, "").slice(0, 20);
  const inviteQ = (qs.get("convite") || "").replace(/[^a-z0-9]/gi, "").slice(0, 20);
  const INVITE_KEY = "inkwell-invite";
  let mine = null, decksBy = [], editing = null, dirty = false;

  async function rpc(name, body = {}) { return CLOUD.api(`rpc/${name}`, { method: "POST", body }); }
  // ---------- Avisos: this device (push, from shell.js) and new events near my saved place (event_places.sql) ----------
  async function drawNotices(tries = 0) {
    const box = $("ntBox"); if (!box) return;
    if (!window.INKWELL_PUSH && tries < 25) { setTimeout(() => drawNotices(tries + 1), 120); return; }   // the shell loads after this page's script
    const P = window.INKWELL_PUSH;
    const [st, place] = await Promise.all([P ? P.state().catch(() => "unsupported") : "unsupported", rpc("my_place").catch(() => undefined)]);
    const pl = place && place.lat != null ? place : null;
    const devText = { on: Tx("On: likes, comments, invites, tables and event notices arrive on this device."), off: Tx("Off: notices only show in the bell."),
      ios: Tx("On iPhone: Share → Add to Home Screen, open Inkwell from there and turn them on here."), denied: Tx("Blocked in this browser's settings for this site."), unsupported: Tx("This browser can't receive notices.") }[st];
    box.innerHTML = `<div class="nt-row" data-testid="nt-device"><div><b>${Tx("On this device")}</b><small>${esc(devText)}</small></div>
        ${st === "on" ? `<button type="button" class="btn small" id="ntPush" data-on="0">${Tx("Turn off")}</button>` : st === "off" ? `<button type="button" class="btn small primary" id="ntPush" data-on="1"><i class="ic i-bell"></i>${Tx("Turn on")}</button>` : ""}</div>
      <div class="nt-row" data-testid="nt-near"><div><b>${Tx("New events near you")}</b>
        <small>${pl ? esc(Tx("Around {place}. Checked every morning on the Play Hub.", { place: pl.label || Tx("your place") })) : Tx("Off. On Eventos, choose your place and tick “Keep this place in my account”.")}</small></div>
        ${pl ? `<div class="row" style="gap:6px;flex-wrap:wrap;align-items:center"><label class="small">${Tx("Up to")} <select id="ntKm" class="inline">${[5, 10, 25, 50, 100, 200, 300].map((k) => `<option value="${k}" ${k === +pl.km ? "selected" : ""}>${k} km</option>`).join("")}</select></label>
          <label class="switch small" style="margin:0"><span>${Tx("Notify")}</span><input type="checkbox" role="switch" id="ntOn" ${pl.notify ? "checked" : ""}></label>
          <a class="btn small ghost" href="../eventos/">${Tx("Change place")}</a><button type="button" class="btn small ghost danger-text" id="ntDel">${Tx("Remove place")}</button></div>`
        : `<a class="btn small" href="../eventos/">${Tx("Open Eventos")}</a>`}</div>
      <p class="small muted" style="margin:var(--sp-3) 0 0">${Tx("Reminders the day before events and tables you marked “Going”, and likes, comments, invites and new tables in your communities always arrive in the bell.")}</p>
      <p class="small" id="ntMsg" role="status" style="margin:0"></p>`;
    const msg = (t) => { $("ntMsg").textContent = t; };
    $("ntPush")?.addEventListener("click", async (ev) => {
      const b = ev.currentTarget; b.disabled = true;
      try { if (b.dataset.on === "1") await P.on(); else await P.off(); drawNotices(); } catch { b.disabled = false; msg(Tx("That didn't work. Try again.")); }
    });
    const savePl = async (patch) => {
      try { await rpc("set_my_place", { p_lat: +pl.lat, p_lng: +pl.lng, p_label: pl.label || null, p_km: +pl.km, p_notify: !!pl.notify, ...patch }); msg(Tx("Saved.")); drawNotices(); }
      catch { msg(Tx("Couldn't save. Try again.")); }
    };
    $("ntKm")?.addEventListener("change", (ev) => savePl({ p_km: +ev.target.value }));
    $("ntOn")?.addEventListener("change", (ev) => savePl({ p_notify: ev.target.checked }));
    $("ntDel")?.addEventListener("click", async (ev) => {
      const b = ev.currentTarget;
      if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = Tx("Tap again to remove"); return; }
      try { await rpc("delete_my_place"); msg(Tx("Removed from your account.")); drawNotices(); } catch { msg(Tx("Couldn't save. Try again.")); }
    });
  }
  async function anonRpc(name, body) {   // public reads work signed out too
    if (me) return rpc(name, body);
    const cfg = window.INKWELL_CLOUD_CONFIG;
    const r = await fetch(`${cfg.url}/rest/v1/rpc/${name}`, { method: "POST", headers: { apikey: cfg.key, "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(String(r.status));
    return r.json();
  }

  };
  const L = (p, t) => (p?.mock && lang === "en" && MOCK_EN[t]) || t || "";
  const ago = (d) => { const m = (Date.now() - Date.parse(d)) / 60000; if (!(m >= 0)) return ""; if (m < 60) return Tx("{n} min ago", { n: Math.max(1, Math.round(m)) }); if (m < 1440) return Tx("{n} h ago", { n: Math.round(m / 60) }); const dd = Math.round(m / 1440); return dd === 1 ? Tx("yesterday") : Tx("{n} days ago", { n: dd }); };
  const miniAv = (avatar, name, cls = "sm") => `<span class="mi-av ${cls}" style="${artStyle(avatar)}" role="img" aria-label="${esc(name || "")}"></span>`;
  function deckView(p, deck, label = "Featured deck", tid = "featured-deck") {
    const cards = Object.entries(deck.cards || {}).filter(([id, n]) => BY.has(id) && n > 0).map(([id, n]) => ({ c: BY.get(id), n }));
    const total = cards.reduce((s, x) => s + x.n, 0), curve = Array(8).fill(0);
    for (const x of cards) curve[Math.min(7, +x.c.cost || 0)] += x.n;
    const max = Math.max(1, ...curve.slice(1));
    const key = cards.slice().sort((a, b) => b.n - a.n || (+b.c.cost || 0) - (+a.c.cost || 0)).slice(0, 6);
    const list = cards.slice().sort((a, b) => (+a.c.cost || 0) - (+b.c.cost || 0) || a.c.name.localeCompare(b.c.name));
    return `<section class="card mi-sec mi-deck" data-testid="${tid}"><div class="mi-label">${Tx(label)}</div>
      <div class="row between" style="margin:var(--sp-2) 0 var(--sp-3);gap:var(--sp-2);flex-wrap:wrap"><b style="font-size:var(--fs-h3)">${esc(L(p, deck.name))}</b>
        <span class="small muted">${(deck.colors || []).map((i) => inkName(i)).join(" / ")} · ${esc(deck.format === "infinity" ? "Infinity" : "Core")} · ${Tx("{n} cards", { n: total })}</span></div>
      <div class="mi-key">${key.map((x) => `<figure>${thumb(x.c)}<figcaption>${x.n}× ${esc(split(x.c.name)[0])}</figcaption></figure>`).join("")}</div>
      <div class="mi-curve" aria-label="${Tx("Ink curve")}">${curve.slice(1).map((n, i) => `<span><i style="height:${Math.round((n / max) * 100)}%"></i><b>${i + 1}${i === 6 ? "+" : ""}</b></span>`).join("")}</div>

  // a photo: at most 1600 px, re-encoded as JPEG on this device (the re-encoding also drops the location and camera data)
  async function shrinkPhoto(file) {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height)), w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);

  }

  function wireInvite() { document.querySelectorAll("[data-signin]").forEach((b) => b.onclick = () => window.INKWELL_SIGNIN?.()); }
  async function acceptPendingInvite() {
    let code = null; try { code = localStorage.getItem(INVITE_KEY); } catch { /* */ }
    if (!me || !code) return;
    try { localStorage.removeItem(INVITE_KEY); } catch { /* */ }
    let r = null; try { r = await rpc("accept_invite", { p_code: code }); } catch { return; }
    if (!r?.ok) { if (r?.reason === "unknown") toast(Tx("This invite link is no longer valid."), true); return; }
    if (r.status === "accepted") { toast(Tx("You and {name} are friends already.", { name: r.name })); return; }
    // the invite became a friend request from the inviter: the person decides
    const sh = $("sheet");
    sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="shT">${esc(Tx("{name} wants to be your friend", { name: r.name }))}</h2></div>
      <div class="sheet-body"><p class="muted" style="margin:0">${Tx("You came through their invite. Accept?")}</p></div>
      <div class="sheet-foot" data-testid="invite-ask"><button type="button" class="btn ghost" id="invNo">${Tx("Not now")}</button><button type="button" class="btn primary" id="invYes">${Tx("Accept")}</button></div>`;
    const decide = async (yes) => {
      try {
        if (yes) await CLOUD.api(`friendships?requester=eq.${r.requester}&addressee=eq.${me.id}`, { method: "PATCH", prefer: "return=minimal", body: { status: "accepted", accepted_at: new Date().toISOString() } });
        else await CLOUD.api(`friendships?requester=eq.${r.requester}&addressee=eq.${me.id}`, { method: "DELETE", prefer: "return=minimal" });
        sh.close(); if (yes) toast(Tx("You and {name} are now friends.", { name: r.name }));
      } catch { toast(Tx("Couldn't send. Try again."), true); }
    };
    $("invYes").onclick = () => decide(true); $("invNo").onclick = () => decide(false);
    sh.showModal();
  }

    const url = URL.createObjectURL(blob), file = new File([blob], `inkwell-${p.handle || "card"}.png`, { type: "image/png" });
    $("pcBox").innerHTML = `<img class="pc-prev" src="${url}" alt="${esc(Tx("Player card"))}" data-testid="player-card"><div class="row" style="gap:var(--sp-2);margin:var(--sp-3) 0">
      ${navigator.canShare && navigator.canShare({ files: [file] }) ? `<button type="button" class="btn primary" id="pcShare"><i class="ic i-send"></i>${Tx("Send the image")}</button>` : ""}
      <a class="btn" download="${esc(file.name)}" href="${url}">${Tx("Download")}</a></div>`;
    $("pcShare")?.addEventListener("click", () => navigator.share({ files: [file], title: "Inkwell" }).catch(() => {}));
  }

  // ---------- delete my account ----------
  function openDelete() {
    const sh = $("sheet"), word = lang === "pt" ? "EXCLUIR" : "DELETE";
    sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="shT">${Tx("Delete my account")}</h2><button type="button" class="btn ghost icon" data-close aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>
      <div class="sheet-body"><p>${Tx("This deletes your account and everything linked to it: collection, decks, games, profile, friends, recados, posts and trades. It cannot be undone.")}</p>
        <p class="small muted">${Tx("Communities you created pass to their longest-standing member, or are deleted if nobody else is in them. Download your data first if you want a copy.")}</p>
        <label class="field">${esc(Tx("Type {w} to confirm", { w: word }))}<input id="delWord" autocomplete="off" autocapitalize="characters"></label><p class="small" id="delMsg" role="alert"></p></div>
      <div class="sheet-foot"><button type="button" class="btn ghost" data-close>${Tx("Cancel")}</button><button type="button" class="btn danger" id="delGo" disabled>${Tx("Delete my account")}</button></div>`;
    sh.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => sh.close());
    $("delWord").oninput = (e) => { $("delGo").disabled = e.target.value.trim().toUpperCase() !== word; };
    $("delGo").onclick = async () => {
      $("delGo").disabled = true;
      try { const mineA = await anonRpc("achievements_of", { p_handle: null }).catch(() => []); const imgs = (mineA || []).map((x) => x.image).filter(Boolean); if (imgs.length) await CLOUD.removeFiles("achievements", imgs).catch(() => {});   // the photos go first (storage files are removed through the storage API)
        await rpc("delete_my_account", { p_confirm: word }); dirty = false; CLOUD.signOut?.(); location.href = "../feed/?conta=excluida"; }
      catch (e) { $("delMsg").textContent = /last_admin/.test(String(e?.message || e)) ? Tx("You are the only admin. Add another admin before deleting this account.") : Tx("Couldn't delete. Try again."); $("delGo").disabled = false; }
    };
    sh.showModal(); setTimeout(() => $("delWord").focus(), 30);
  }

  // ---------- report ----------
  function openReport(h) {
    const sh = $("sheet");
    sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="shT">${Tx("Report profile")}</h2><button type="button" class="btn ghost icon" data-close aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>
      <div class="sheet-body"><label class="field">${Tx("Why are you reporting this profile?")}<textarea id="rpWhy" maxlength="500" rows="4"></textarea></label><p class="small" id="rpMsg" role="alert"></p></div>
      <div class="sheet-foot"><button type="button" class="btn ghost" data-close>${Tx("Cancel")}</button><button type="button" class="btn primary" id="rpSend">${Tx("Send report")}</button></div>`;
    sh.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => sh.close());
    $("rpSend").onclick = async () => {
      const why = $("rpWhy").value.trim(); if (why.length < 3) { $("rpWhy").focus(); return; }
      try { await rpc("report_profile", { p_handle: h, p_reason: why }); sh.close(); toast(Tx("Report sent. Thank you.")); } catch { $("rpMsg").textContent = Tx("Couldn't send. Try again."); }
    };
    sh.showModal(); setTimeout(() => $("rpWhy").focus(), 30);
  }

  // ---------- helpers ----------
  // passkeys (supabase passkeys, experimental): list, add, delete — cloud.js does the WebAuthn part
  async function drawPasskeys(msg = "") {
    const el = document.getElementById("pkBox"); if (!el) return;
    let list = null; try { list = await CLOUD.passkeys(); } catch { list = null; }
    if (!document.getElementById("pkBox")) return;
    const rows = Array.isArray(list) ? list : [];
    el.innerHTML = `${list === null ? `<p class="small muted">${Tx("Couldn't load your passkeys.")}</p>` : rows.length ? `<div class="list tight divided">${rows.map((k) => `<div class="list-row flat two"><span class="t"><span>${esc(k.friendly_name || Tx("Passkey"))}</span><span class="meta">${esc([k.created_at ? Tx("created {d}", { d: new Date(k.created_at).toLocaleDateString(LOC) }) : "", k.last_used_at ? Tx("last used {d}", { d: new Date(k.last_used_at).toLocaleDateString(LOC) }) : ""].filter(Boolean).join(" · "))}</span></span><button type="button" class="btn small ghost" data-pkdel="${esc(k.id)}">${Tx("Delete")}</button></div>`).join("")}</div>` : `<p class="small faint">${Tx("No passkey yet.")}</p>`}
      <p class="small" role="alert" style="margin:var(--sp-2) 0">${esc(msg)}</p>
      <button type="button" class="btn" id="pkAdd" data-testid="passkey-add"><i class="ic i-shield"></i>${Tx(rows.length ? "Add a passkey on this device" : "Create a passkey")}</button>`;
    $("pkAdd").onclick = async (ev) => {
      const b = ev.currentTarget; b.setAttribute("aria-busy", "true"); b.disabled = true;
      try { await CLOUD.passkeyRegister(); window.INKWELL_TRACK?.("passkey_created"); try { localStorage.setItem("inkwell-passkey-offer", "yes"); } catch { /* */ } drawPasskeys(Tx("Passkey created. Next time, tap “Sign in with a passkey”.")); }
      catch (err) { b.removeAttribute("aria-busy"); b.disabled = false; drawPasskeys(err?.name === "NotAllowedError" ? Tx("Cancelled.") : err?.name === "InvalidStateError" ? Tx("This device already has a passkey for your account.") : Tx("Couldn't create it now. Try again.")); }
    };
    el.querySelectorAll("[data-pkdel]").forEach((b) => b.onclick = async () => {
      if (b.dataset.c !== "1") { b.dataset.c = "1"; b.textContent = Tx("Tap again to delete"); return; }
      b.disabled = true;
      try { await CLOUD.passkeyDelete(b.dataset.pkdel); drawPasskeys(Tx("Passkey deleted. Also remove it from the device's passwords if you want.")); }
      catch { b.disabled = false; drawPasskeys(Tx("Couldn't delete. Try again.")); }
    });
  }
  function emptyBox(img, title, text, extra = "") { return `<div class="empty"><img src="../ui/assets/empty/${img}.svg" alt=""><b>${esc(title)}</b><p>${esc(text)}</p>${extra}</div>`; }
  let toastTimer = null;
  function toast(text, err) {
    const t = $("toast"); t.className = `toast${err ? " err" : ""}`;
    t.innerHTML = `<i class="ic ${err ? "i-alert" : "i-check"}"></i><span>${esc(text)}</span>`; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
  }

  // ---------- boot ----------
  document.documentElement.lang = LOC;
  $("title").textContent = Tx("My Inkwell");
  // a shared deck (/perfil/?u=<handle>#deck-<id>, the QR code of a deck image) is its own view: only the deck.
  // Decided before anything is drawn, so the profile never shows, not even for a moment.
  const deckQ = () => { let h = ""; try { h = decodeURIComponent(location.hash.slice(1)); } catch { return ""; } return h.startsWith("deck-") ? h.slice(5) : null; };
  if (handleQ && deckQ() !== null) $("title").textContent = Tx("Shared deck");
  $("app").innerHTML = `<div class="skel" style="height:260px;border-radius:20px"></div><p class="sr-only">${Tx("Loading…")}</p>`;
  const showHandle = (h) => (deckQ() !== null ? showDeck(h, deckQ()) : showPublic(h));
  // another deck, or none, with the page open (a link, Back, Forward): hashchange, and popstate too (WebKit does
  // not always send hashchange when going back through a page restored from its cache); once per address
  let routed = location.hash;
  const reroute = () => { if (location.hash === routed) return; routed = location.hash; window.scrollTo(0, 0); $("app").innerHTML = `<div class="skel" style="height:260px;border-radius:20px"></div>`; showHandle(handleQ); };
  if (handleQ) { window.addEventListener("hashchange", reroute); window.addEventListener("popstate", reroute); window.addEventListener("pageshow", (e) => { if (e.persisted) reroute(); }); }
  (async () => {
    if (me) { try { await loadMine(); } catch { mine = null; } await acceptPendingInvite(); }
    if (me && qs.has("recados")) setTimeout(() => openRecadosSheet(), 0);   // the notice "Recados para aprovar"
    if (handleQ) return showHandle(handleQ);
    if (!me) {
      if (inviteQ) { $("app").innerHTML = await inviteBanner(); wireInvite(); return; }
      return welcome();
    }
    document.title = `${Tx("My Inkwell")} · Inkwell`;
    if (mine && mine.handle && mine.is_public && !qs.has("editar")) return showPublic(mine.handle);
    return editor();
  })();
})();
</script>

<script>window.INKWELL_SHELL = {"page": "profile"};
/*@SHELL_JS@*/</script>
</body>
