/*@CLOUD_JS@*/</script>
<style>
/* layout only — components come from ../ui/tokens.css (design v2) */
.fr-list { display: grid; gap: var(--sp-3); }
.fr { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: var(--sp-3); align-items: start; }
.fr .av { width: 52px; height: 52px; border-radius: 50%; background: var(--surface-3) 50% 20% / 210% auto no-repeat; box-shadow: 0 0 0 2px var(--accent);
  display: grid; place-items: center; font: 800 1.2rem var(--display); color: var(--text); text-decoration: none; }
.fr .t { display: grid; gap: 4px; min-width: 0; }
.fr .t b { font-size: var(--fs-h3); overflow-wrap: anywhere; }
.fr .facts { display: flex; flex-wrap: wrap; gap: 4px var(--sp-3); color: var(--text-2); font-size: var(--fs-small); }
.fr .facts span { display: inline-flex; align-items: center; gap: 5px; }
.fr .facts .ic { width: 15px; height: 15px; }
.fr .acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.fr .acts .btn { min-height: 40px; }
.fr-top { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--sp-4); }
@media (max-width: 420px) { .fr .acts .btn { flex: 1 1 calc(50% - var(--sp-2)); justify-content: center; } }
/* Amigos 2.0: Descobrir · Meus amigos · Pedidos */
.fr-tools { display: grid; gap: var(--sp-3); margin-bottom: var(--sp-4); }
.fr-tools input[type="search"] { width: 100%; min-height: var(--tap); font-size: 16px; }
.fr-tools .chips .chipbtn { min-height: 40px; }
.fr-row { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2) var(--sp-3); }
.fr-row .t { display: grid; gap: 2px; flex: 1 1 160px; min-width: 0; overflow-wrap: anywhere; }
.fr-row .av { width: 40px; height: 40px; border-radius: 50%; flex: none; background: var(--surface-3) 50% 20% / 210% auto no-repeat;
  display: grid; place-items: center; font: 800 1rem var(--display); color: var(--text); }
.fr-row .acts { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.fr-row .acts .btn { min-height: 40px; }
.fr-group { display: grid; gap: var(--sp-2); margin-bottom: var(--sp-4); }
.fr-group h2 { font-size: var(--fs-h3); margin: 0; }
.fr-list .fr[hidden], .fr-panel[hidden], .fr-wcard[hidden], #frListWrap[hidden], #frWish[hidden] { display: none !important; }
/* Etapa C: Cartas que procuro — one card, the friends who have it, and what each one allows */
.fr-wish { display: grid; gap: var(--sp-3); }
.fr-wcard { display: grid; gap: var(--sp-2); }
.fr-wcard .thumb { width: 44px; height: 61px; border-radius: 6px; flex: none; background: var(--surface-3) center / cover no-repeat; }
.fr-who { display: grid; gap: var(--sp-2); margin: 0; padding: 0; list-style: none; }
.fr-who > li { border-top: 1px solid var(--line); padding-top: var(--sp-2); }
.fr-who .badges { display: flex; flex-wrap: wrap; gap: 4px; }
@media (max-width: 420px) { .fr-row .acts { width: 100%; } .fr-row .acts .btn { flex: 1 1 auto; justify-content: center; } }
</style>

<main class="page" id="page">
  <div class="page-head"><div><h1 id="title">Amigos</h1><p class="sub" id="sub"></p></div></div>
  <div class="tabs fill" role="tablist" id="frTabs" hidden></div>
  <section class="fr-panel" id="pFriends" role="tabpanel" aria-labelledby="tab-friends">
    <div class="fr-tools" id="frTools" hidden></div>
    <div id="app"><div class="skel" style="height:160px;border-radius:20px"></div></div>
  </section>
  <section class="fr-panel" id="pDiscover" role="tabpanel" aria-labelledby="tab-discover" hidden></section>
  <section class="fr-panel" id="pRequests" role="tabpanel" aria-labelledby="tab-requests" hidden></section>
</main>
<div class="toast-host"><div class="toast" id="toast" role="status" hidden></div></div>

<script>
const CARD_INDEX = /*@CARD_INDEX@*/;
(() => {
  "use strict";
  // Amigos: my friends, each with what is already shared with me. Reads only what the other pages read:
  // rpc/my_friends (name always; address and avatar only for public profiles), rpc/shared_collections (collections
  // a friend opened to me), rpc/friends_lending (friends who have cards of my wishlist, from collections opened to
  // friends) and the friends' latest game I can already see in the Feed (visibility not private). Nothing new.
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let lang = "pt"; try { lang = localStorage.getItem("inkwell-lang") || "pt"; } catch { /* */ }
  const T = (pt, en) => (lang === "en" ? en : pt);
  const LOC = lang === "en" ? "en" : "pt-BR";
  const CLOUD = window.INKWELL_CLOUD, me = CLOUD?.user();
  const rpc = (name, body = {}) => CLOUD.api(`rpc/${name}`, { method: "POST", body });
  const IMG = new Map((CARD_INDEX?.cards || []).map((c) => [c[0], c[8]]));
  const art = (id) => { const f = IMG.get(id); return f ? `../lorcana-card-images/${encodeURI(f).replace(/'/g, "%27")}` : ""; };
  const ago = (iso) => {
    const d = Date.parse(iso); if (!d) return "";
    const m = Math.round((Date.now() - d) / 60000), h = m / 60, dd = h / 24;
    if (m < 60) return T("agora há pouco", "just now"); if (h < 24) return T(`há ${Math.round(h)} h`, `${Math.round(h)} h ago`);
    if (dd < 2) return T("ontem", "yesterday"); if (dd < 30) return T(`há ${Math.round(dd)} dias`, `${Math.round(dd)} days ago`);
    return new Date(d).toLocaleDateString(LOC, { day: "numeric", month: "short", year: "numeric" });
  };
  const num = (n) => Number(n || 0).toLocaleString(LOC);
  document.title = T("Amigos · Inkwell", "Friends · Inkwell");
  $("title").textContent = T("Amigos", "Friends");
  $("sub").textContent = me ? T("Encontre jogadores, veja o que seus amigos compartilham com você e responda pedidos de amizade.", "Find players, see what your friends share with you and answer friend requests.")
    : T("Perfis, coleções que abriram para você, cartas que podem emprestar e o último jogo compartilhado.", "Profiles, collections opened to you, cards they can lend and their latest shared game.");
  const manage = `<a class="btn" href="../feed/#amigos"><i class="ic i-user-plus"></i>${T("Adicionar e gerenciar amigos", "Add and manage friends")}</a>`;
  const invite = `<button type="button" class="btn ghost" data-invite><i class="ic i-send"></i>${T("Convidar para o Inkwell", "Invite to Inkwell")}</button>`;
  const wire = () => document.querySelectorAll("[data-invite]").forEach((b) => b.onclick = () => window.INKWELL_INVITE?.(b));
  const toast = (t) => { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 3500); };
  const avatarHtml = (face) => { const src = face?.avatar ? art(face.avatar) : "";
    return `<span class="av" aria-hidden="true" style="${src ? `background-image:url('${src}')` : ""}">${src ? "" : esc((String(face?.name || "?").trim()[0] || "?").toUpperCase())}</span>`; };
  const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  const names = new Map();

  // ---------- Amigos 2.0: Descobrir · Meus amigos · Pedidos (WAI-ARIA tabs: arrows, Home, End; #descobrir, #pedidos) ----------
  // Every read and write here is one the site already makes, under the same rules:
  //   rpc/search_all (search_privacy.sql): adults with a public profile, or my friends; never e-mails; city only of
  //     public profiles; communities that are not hidden. Results are a search, not suggestions: nothing is inferred.
  //   rpc/request_friend (my_inkwell_2.sql): public adult profiles only, the profile page's "Adicionar amigo".
  //   friendships rows (friends.sql RLS, hardening.sql limits): the Início "Amigos e privacidade" sheet's accept,
  //     decline and cancel. Removing friends, groups and privacy stay there.
  // Future filters (favourite inks, interests) need a field the player chooses to make public: not offered until then.
  const TABS = [["discover", T("Descobrir", "Discover"), "descobrir"], ["friends", T("Meus amigos", "My friends"), "amigos"], ["requests", T("Pedidos", "Requests"), "pedidos"]];
  const PANEL = { discover: "pDiscover", friends: "pFriends", requests: "pRequests" };
  let tab = "friends", autoTab = false, rel = [], relState = "loading", results = null, seq = 0, timer = 0, discoverBuilt = false, fq = "", ff = "all";
  function select(k, focus = false) {
    tab = k;
    for (const [key] of TABS) {
      const b = $(`tab-${key}`), on = key === k;
      b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1;
      $(PANEL[key]).hidden = !on;
      if (on && focus) b.focus();
    }
    const h = TABS.find(([key]) => key === k)[2];
    try { history.replaceState(null, "", k === "friends" ? location.pathname + location.search : `#${h}`); } catch { /* */ }
    if (k === "discover") renderDiscover();
    if (k === "requests") renderRequests();
  }
  function initTabs() {
    const bar = $("frTabs"); bar.hidden = false; bar.setAttribute("aria-label", T("Seções de Amigos", "Friends sections"));
    bar.innerHTML = TABS.map(([k, l]) => `<button type="button" class="tab" role="tab" id="tab-${k}" aria-controls="${PANEL[k]}" aria-selected="false" tabindex="-1" data-testid="fr-tab-${k}">${l}${k === "requests" ? ' <span class="count" id="frReqN" hidden></span>' : ""}</button>`).join("");
    bar.addEventListener("click", (e) => { const b = e.target.closest("[role=tab]"); if (b) select(b.id.slice(4)); });
    bar.addEventListener("keydown", (e) => {
      const i = TABS.findIndex(([k]) => k === tab), n = TABS.length;
      const j = e.key === "ArrowRight" ? (i + 1) % n : e.key === "ArrowLeft" ? (i - 1 + n) % n : e.key === "Home" ? 0 : e.key === "End" ? n - 1 : -1;
      if (j < 0) return; e.preventDefault(); select(TABS[j][0], true);
    });
    const fromHash = () => { const h = location.hash.slice(1); return TABS.find(([, , hh]) => hh === h)?.[0] || "friends"; };
    addEventListener("hashchange", () => select(fromHash()));   // a link to #pedidos while the page is open
    autoTab = !location.hash;   // no #hash: the first load picks Descobrir for players with no friends yet
    select(fromHash());
    loadRequests();   // the count on the Pedidos tab, and who already has a request in Descobrir
  }

  // ----- Descobrir -----
  function renderDiscover() {
    if (discoverBuilt) return; discoverBuilt = true;
    $("pDiscover").innerHTML = `<div class="fr-tools">
        <label for="frQuery"><b>${T("Encontre jogadores e comunidades", "Find players and communities")}</b></label>
        <span class="search"><i class="ic i-search"></i><input id="frQuery" type="search" maxlength="60" autocomplete="off" enterkeyhint="search" placeholder="${T("Nome ou @usuário", "Name or @handle")}" aria-describedby="frQueryHelp" data-testid="fr-query"></span>
        <p class="small muted" id="frQueryHelp" style="margin:0">${T("Aparecem perfis públicos, seus amigos e comunidades. E-mails nunca aparecem; a cidade só aparece quando o perfil é público.", "Shows public profiles, your friends and communities. E-mails never show; a city shows only on public profiles.")}</p>
        <label class="fr-row" id="frCityWrap" hidden><span class="small">${T("Cidade", "City")}</span><select id="frCity" class="inline" data-testid="fr-city"></select></label>
      </div>
      <div id="frResults" aria-live="polite" data-testid="fr-results"></div>
      <div class="row" style="flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-4)"><a class="btn ghost" href="../comunidades/"><i class="ic i-users"></i>${T("Explorar comunidades", "Explore communities")}</a>${invite}</div>`;
    const q = $("frQuery");
    q.addEventListener("input", () => {
      clearTimeout(timer); const cur = ++seq, term = q.value.trim().replace(/^@/, "");
      if (term.length < 2) { results = null; showResults(); return; }
      $("frResults").innerHTML = `<p class="small muted">${T("Buscando…", "Searching…")}</p>`;
      timer = setTimeout(async () => {
        let r = null;
        try { r = await rpc("search_all", { p_q: term }); } catch { if (cur === seq) { results = { error: true }; showResults(); } return; }
        if (cur !== seq) return;   // typed more meanwhile: the newer search shows instead
        results = { people: Array.isArray(r?.people) ? r.people : [], communities: Array.isArray(r?.communities) ? r.communities : [] };
        fillCities(); showResults();
      }, 300);
    });
    $("frCity").addEventListener("change", showResults);
    wire(); showResults();
  }
  // the cities already in the results (public profiles and communities only): narrows what was found, never a new search
  function fillCities() {
    const sel = $("frCity"), prev = sel.value;
    const cities = [...new Set([...results.people, ...results.communities].map((x) => String(x.city || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, LOC));
    sel.innerHTML = `<option value="">${T("Todas", "All")}</option>${cities.map((c) => `<option${c === prev ? " selected" : ""}>${esc(c)}</option>`).join("")}`;
    $("frCityWrap").hidden = !cities.length;
  }
  const pending = (uid) => { const f = rel.find((x) => x.requester === uid || x.addressee === uid); return f ? (f.requester === me.id ? "sent" : "received") : null; };
  function showResults() {
    const out = $("frResults"); if (!out) return;
    if (!results) { out.innerHTML = `<p class="small muted">${T("Digite pelo menos 2 letras do nome ou do @usuário.", "Type at least 2 letters of the name or @handle.")}</p>`; return; }
    if (results.error) {
      out.innerHTML = `<div class="empty"><img src="../ui/assets/empty/error.svg" alt=""><b>${T("Não foi possível buscar agora", "Search is unavailable right now")}</b><p>${T("Verifique a conexão e tente de novo.", "Check your connection and try again.")}</p><button type="button" class="btn" id="frRetry">${T("Tentar de novo", "Try again")}</button></div>`;
      $("frRetry").onclick = () => $("frQuery").dispatchEvent(new Event("input"));
      return;
    }
    const city = $("frCity").value, inCity = (x) => !city || String(x.city || "").trim() === city;
    const people = results.people.filter(inCity), comms = results.communities.filter(inCity);
    if (!people.length && !comms.length) {
      out.innerHTML = `<p class="small muted" data-testid="fr-none">${city ? T("Nenhum resultado nesta cidade.", "No results in this city.") : T("Nenhum resultado. Tente outro nome ou convide a pessoa para o Inkwell.", "No results. Try another name or invite them to Inkwell.")}</p>`;
      return;
    }
    const person = (p) => {
      const nm = p.name || T("Jogador", "Player"), r = p.friend ? "friend" : pending(p.uid), prof = p.handle ? `../perfil/?u=${encodeURIComponent(p.handle)}` : "";
      const state = r === "friend" ? `<span class="tag">${T("Amigo", "Friend")}</span>`
        : r === "sent" ? `<span class="tag" data-testid="fr-sent">${T("Pedido enviado", "Request sent")}</span>`
        : r === "received" ? `<button type="button" class="btn small" data-goreq>${T("Responder pedido", "Answer request")}</button>`
        : p.handle ? `<button type="button" class="btn small primary" data-ask="${esc(p.handle)}" aria-label="${esc(T(`Adicionar ${nm} como amigo`, `Add ${nm} as a friend`))}"><i class="ic i-user-plus"></i>${T("Adicionar amigo", "Add friend")}</button>` : "";
      return `<div class="card fr-row" data-testid="fr-person">${avatarHtml(p)}<div class="t"><b>${esc(nm)}</b><span class="small muted">${esc([p.handle ? `@${p.handle}` : T("Perfil privado", "Private profile"), p.city || ""].filter(Boolean).join(" · "))}</span></div>
        <div class="acts">${prof ? `<a class="btn small" href="${prof}" aria-label="${esc(T(`Ver perfil de ${nm}`, `View ${nm}'s profile`))}"><i class="ic i-eye"></i>${T("Ver perfil", "View profile")}</a>` : ""}${state}</div></div>`;
    };
    const comm = (c) => `<div class="card fr-row" data-testid="fr-community">${avatarHtml(c)}<div class="t"><b>${esc(c.name || "")}</b><span class="small muted">${esc([c.city || "", c.mine ? T("Você participa", "You're a member") : ""].filter(Boolean).join(" · "))}</span></div>
        <div class="acts"><a class="btn small" href="../comunidades/?c=${encodeURIComponent(c.slug || "")}">${T("Ver comunidade", "View community")}</a></div></div>`;
    out.innerHTML = `${people.length ? `<div class="fr-group"><h2>${T("Pessoas", "People")}</h2>${people.map(person).join("")}</div>` : ""}${comms.length ? `<div class="fr-group"><h2>${T("Comunidades", "Communities")}</h2>${comms.map(comm).join("")}</div>` : ""}`;
    out.querySelectorAll("[data-ask]").forEach((b) => b.onclick = () => ask(b));
    out.querySelectorAll("[data-goreq]").forEach((b) => b.onclick = () => select("requests", true));
  }
  async function ask(b) {
    b.disabled = true;
    try { await rpc("request_friend", { p_handle: b.dataset.ask }); toast(T("Pedido de amizade enviado.", "Friend request sent.")); }
    catch (e) { b.disabled = false; toast(/too_many/.test(e?.why || "") ? T("Você enviou muitos pedidos hoje. Tente de novo amanhã.", "You sent too many requests today. Try again tomorrow.") : T("Não foi possível enviar o pedido. Tente de novo.", "Couldn't send the request. Try again.")); return; }
    await loadRequests(); showResults();
  }

  // ----- Pedidos: the friendships rows only the two people see (RLS) -----
  async function loadRequests() {
    try {
      const rows = await CLOUD.api("friendships?status=eq.pending&select=requester,addressee,created_at&order=created_at.desc");
      rel = (Array.isArray(rows) ? rows : []).filter((f) => UUID.test(f.requester) && UUID.test(f.addressee)); relState = "ok";
      const ids = [...new Set(rel.map((f) => (f.requester === me.id ? f.addressee : f.requester)))].filter((id) => !names.has(id));
      for (let i = 0; i < ids.length; i += 80) for (const p of (await CLOUD.api(`profiles?user_id=in.(${ids.slice(i, i + 80).join(",")})&select=user_id,display_name`).catch(() => [])) || []) names.set(p.user_id, p.display_name);
    } catch { relState = "error"; }
    const n = rel.filter((f) => f.addressee === me.id).length, c = $("frReqN");
    if (c) { c.hidden = !n; c.textContent = n > 9 ? "9+" : String(n); }
    $("tab-requests")?.setAttribute("aria-label", n ? T(`Pedidos, ${n} recebidos`, `Requests, ${n} received`) : T("Pedidos", "Requests"));
    if (tab === "requests") renderRequests();
  }
  function renderRequests() {
    const el = $("pRequests");
    if (relState === "loading") { el.innerHTML = `<div class="skel" style="height:120px;border-radius:20px"></div>`; return; }
    if (relState === "error") {
      el.innerHTML = `<div class="empty"><img src="../ui/assets/empty/error.svg" alt=""><b>${T("Não deu para carregar os pedidos", "Couldn't load your requests")}</b><p>${T("Tente de novo em instantes.", "Try again in a moment.")}</p><button type="button" class="btn" id="reqAgain">${T("Tentar de novo", "Try again")}</button></div>`;
      $("reqAgain").onclick = () => { relState = "loading"; renderRequests(); loadRequests(); };
      return;
    }
    const inc = rel.filter((f) => f.addressee === me.id), sent = rel.filter((f) => f.requester === me.id);
    const row = (id, sub, acts) => { const nm = names.get(id) || T("Jogador", "Player");
      return `<div class="card fr-row" data-testid="fr-req">${avatarHtml({ name: nm })}<div class="t"><b>${esc(nm)}</b><span class="small muted">${esc(sub)}</span></div><div class="acts">${acts(nm)}</div></div>`; };
    el.innerHTML = `<div class="fr-group" data-testid="fr-req-in"><h2>${T("Recebidos", "Received")} <span class="count quiet">${inc.length}</span></h2>
        ${inc.length ? inc.map((f) => row(f.requester, `${T("Quer ser seu amigo", "Wants to be your friend")} · ${ago(f.created_at)}`, (nm) =>
          `<button type="button" class="btn small ghost" data-decline="${f.requester}|${f.addressee}" aria-label="${esc(T(`Recusar pedido de ${nm}`, `Decline ${nm}'s request`))}">${T("Recusar", "Decline")}</button><button type="button" class="btn small primary" data-accept="${f.requester}" aria-label="${esc(T(`Aceitar pedido de ${nm}`, `Accept ${nm}'s request`))}">${T("Aceitar", "Accept")}</button>`)).join("")
          : `<p class="small muted" style="margin:0">${T("Nenhum pedido recebido.", "No requests received.")}</p>`}</div>
      <div class="fr-group" data-testid="fr-req-out"><h2>${T("Enviados", "Sent")} <span class="count quiet">${sent.length}</span></h2>
        ${sent.length ? sent.map((f) => row(f.addressee, `${T("Aguardando resposta", "Waiting for an answer")} · ${ago(f.created_at)}`, (nm) =>
          `<button type="button" class="btn small ghost" data-decline="${f.requester}|${f.addressee}" aria-label="${esc(T(`Cancelar pedido para ${nm}`, `Cancel request to ${nm}`))}">${T("Cancelar", "Cancel")}</button>`)).join("")
          : `<p class="small muted" style="margin:0">${T("Nenhum pedido enviado. Encontre jogadores em Descobrir.", "No requests sent. Find players in Discover.")}</p>`}</div>
      <p class="small muted">${T("Para remover amigos, criar grupos e escolher quem vê seus jogos:", "To remove friends, make groups and choose who sees your games:")} <a href="../feed/#amigos">${T("Amigos e privacidade", "Friends and privacy")}</a></p>`;
    el.querySelectorAll("[data-accept]").forEach((b) => b.onclick = () => act(b, () => CLOUD.api(`friendships?requester=eq.${b.dataset.accept}&addressee=eq.${me.id}`, { method: "PATCH", prefer: "return=minimal", body: { status: "accepted", accepted_at: new Date().toISOString() } }), T("Agora vocês são amigos.", "You're friends now."), true));
    el.querySelectorAll("[data-decline]").forEach((b) => b.onclick = () => { const [r, a] = b.dataset.decline.split("|");
      act(b, () => CLOUD.api(`friendships?requester=eq.${r}&addressee=eq.${a}`, { method: "DELETE" }), r === me.id ? T("Pedido cancelado.", "Request cancelled.") : T("Pedido recusado.", "Request declined.")); });
  }
  async function act(b, fn, msg, friendsChanged = false) {

  // ----- Meus amigos: search and filters over the cards already on the page (no new reads) -----

  function applyFilter() {
    const q = fq.trim().replace(/^@/, "").toLocaleLowerCase(LOC), cards = [...document.querySelectorAll("#app .fr[data-friend]")];

      const ws = [...document.querySelectorAll("#frWish .fr-wcard")]; let k = 0;

  // ----- Etapa C: Cartas que procuro. Owning is not lending or trading: three labels, each with its own consent -----
  //   Possui   friends_lending row without lend: the friend opened the collection to friends. No quantity, no action.
  //   Empresta friends_lending row with lend: the friend marked "empresta"; free = owned − already lent (> 0).
  //   Troca    an active Mural post "Troco" of that card (public to signed-in players), with its quantity.
  const NAME = new Map((CARD_INDEX?.cards || []).map((c) => [c[0], c[1]]));
  // C5.4: another set's printing (or the Enchanted one) is the same card to play — Decks' printings() rule, the same
  // name key — but not the same to collect: each friend line names the printing that friend has ("Edição exata" or
  // "Outra edição · LOR3-17"), and a loan always asks for that printing. Foil only when a Mural post says so.
  const nameKey = (n) => String(n || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s*\(.*?\)\s*/g, " ").replace(/[^a-z0-9]+/g, " ").trim();
  const KEY = new Map((CARD_INDEX?.cards || []).map((c) => [c[0], nameKey(c[1])]));
  const BYKEY = new Map(); for (const [id, k] of KEY) (BYKEY.get(k) || BYKEY.set(k, []).get(k)).push(id);
  const keyOf = (id) => KEY.get(id) || id;
  // what to ask about: the wished printings first, then their other printings, never more than 400 in all
  const askIds = (want) => [...new Set([...want, ...want.flatMap((id) => BYKEY.get(keyOf(id)) || [])])].slice(0, 400);
  function wishView(friends, lending, ads, want) {
    const byId = new Map(friends.map((f) => [f.id, f])), wanted = new Set(want), groups = new Map();
    for (const id of want) { const k = keyOf(id); if (!groups.has(k)) groups.set(k, { wished: [], rows: new Map() }); groups.get(k).wished.push(id); }
    const slot = (cid, fid) => { const g = byId.has(fid) && groups.get(keyOf(cid)); if (!g) return null; const k = `${fid}|${cid}`;
      if (!g.rows.has(k)) g.rows.set(k, { fid, cid, exact: wanted.has(cid), own: false, free: 0, ad: null }); return g.rows.get(k); };
    for (const l of Array.isArray(lending) ? lending : []) { const x = slot(l.card_id, l.user); if (!x) continue; x.own = true; if (l.lend && +l.free > 0) x.free = Math.max(x.free, +l.free); }
    for (const a of Array.isArray(ads) ? ads : []) { const x = slot(a.card_id, a.user_id); if (x && !x.ad) x.ad = a; }
    const rank = (x) => (x.free ? 0 : x.ad ? 2 : 4) + (x.exact ? 0 : 1);
    const fname = (x) => String(byId.get(x.fid).name || "");
    const list = [...groups.values()].filter((g) => g.rows.size).map((g) => ({ ...g, rows: [...g.rows.values()].sort((a, b) => rank(a) - rank(b) || fname(a).localeCompare(fname(b)) || a.cid.localeCompare(b.cid)) }))
      .sort((a, b) => rank(a.rows[0]) - rank(b.rows[0]) || String(NAME.get(a.wished[0]) || "").localeCompare(String(NAME.get(b.wished[0]) || "")));
    const who = (x) => { const nm = byId.get(x.fid).name || T("Amigo", "Friend");
      const ed = x.exact ? `<span class="tag" data-testid="fr-ed-exact">${esc(T(`Edição exata · ${x.cid}`, `Exact printing · ${x.cid}`))}</span>`
        : `<span class="tag" data-testid="fr-ed-other" title="${esc(T("Mesma carta para jogar; edição diferente para colecionar", "Same card to play; a different printing to collect"))}">${esc(T(`Outra edição · ${x.cid}`, `Other printing · ${x.cid}`))}</span>`;
      const badges = [ed, x.free ? `<span class="tag" data-testid="fr-badge-lend">${esc(T(`Empresta · ${x.free} ${x.free === 1 ? "livre" : "livres"}`, `Lends · ${x.free} free`))}</span>` : "",
        x.ad ? `<span class="tag" data-testid="fr-badge-trade">${esc(T(`Troca · ${x.ad.qty}${x.ad.foil ? " foil" : ""}`, `Trades · ${x.ad.qty}${x.ad.foil ? " foil" : ""}`))}</span>` : "",
        !x.free && !x.ad ? `<span class="tag" data-testid="fr-badge-own">${T("Possui", "Owns")}</span>` : ""].join("");
      const acts = [x.free ? lendAction(x.cid, x.fid, x.free, nm) : "",
        x.ad ? `<a class="btn small" href="../trades/?tab=trades&anuncio=${encodeURIComponent(x.ad.id)}" data-testid="fr-trade" aria-label="${esc(T(`Propor troca a ${nm}`, `Propose a trade to ${nm}`))}"><i class="ic i-trades"></i>${T("Propor troca", "Propose a trade")}</a>` : ""].join("");
      return `<li class="fr-row" data-wfriend="${esc(x.fid)}" data-wprint="${esc(x.cid)}"><div class="t"><b>${esc(nm)}</b><span class="badges">${badges}</span></div>${acts ? `<div class="acts">${acts}</div>` : ""}</li>`; };
    return `<div id="frWish" class="fr-wish" data-testid="fr-wish" hidden>${list.map((g) => { const w = g.wished[0], nm = NAME.get(w) || w, src = art(w);
        return `<section class="card fr-wcard" data-wcard="${esc(w)}" data-q="${esc([nm, ...g.rows.map(fname)].join(" ").toLocaleLowerCase(LOC))}">
          <div class="fr-row"><span class="thumb" aria-hidden="true" style="${src ? `background-image:url('${src}')` : ""}"></span><div class="t"><b>${esc(nm)}</b><span class="small muted">${esc(T(`Na sua lista: ${g.wished.join(", ")}`, `On your wishlist: ${g.wished.join(", ")}`))}</span></div></div>
          <ul class="fr-who" aria-label="${esc(T(`Amigos com ${nm}`, `Friends with ${nm}`))}">${g.rows.map(who).join("")}</ul></section>`; }).join("")}
      <p class="small muted" id="frWishNone" data-testid="fr-wish-none" hidden>${list.length ? T("Nenhuma carta com essa busca.", "No cards match this search.") : T("Nenhum amigo tem cartas da sua lista de desejos agora.", "No friend has cards from your wishlist right now.")}</p></div>`;
  }
  // ----- Etapa C2: "Pedir emprestado" — the loan request Decks already sends (user_loans: friends only by RLS, the
  // friend is notified, at most 40 requests a day). Only when the friend lends and has free copies; an open request
  // or loan of that card with that friend shows its status instead of a second button.
  const loanState = new Map();   // "friend|card" -> requested | accepted | delivered
  const LOAN_TXT = { requested: T("Pedido enviado", "Request sent"), accepted: T("Empréstimo aceito", "Loan accepted"), delivered: T("Emprestada para você", "Lent to you") };
  const lendAction = (cid, fid, free, nm) => { const st = loanState.get(`${fid}|${cid}`);
    return st ? `<span class="tag" data-testid="fr-loan-state">${LOAN_TXT[st] || LOAN_TXT.requested}</span>`
      : `<button type="button" class="btn small primary" data-borrow="${esc(fid)}" data-bcard="${esc(cid)}" data-bfree="${free}" data-bname="${esc(nm)}" data-testid="fr-borrow" aria-label="${esc(T(`Pedir ${NAME.get(cid) || cid} emprestada a ${nm}`, `Ask ${nm} to lend ${NAME.get(cid) || cid}`))}"><i class="ic i-loan"></i>${T("Pedir emprestado", "Ask to borrow")}</button>`; };
  function borrowSheet(b) {
    let d = $("frBorrow");
    if (!d) { d = document.createElement("dialog"); d.className = "sheet"; d.id = "frBorrow"; d.setAttribute("aria-labelledby", "frBorrowT"); document.body.append(d); }
    const cid = b.dataset.bcard, fid = b.dataset.borrow, free = Math.min(99, Math.max(1, +b.dataset.bfree || 1)), nm = b.dataset.bname;
    d.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="frBorrowT">${T("Pedir emprestado", "Ask to borrow")}</h2>
        <button type="button" class="btn ghost icon" data-close aria-label="${T("Fechar", "Close")}"><i class="ic i-close"></i></button></div>
      <div class="sheet-body stack">
        <p style="margin:0"><b>${esc(NAME.get(cid) || cid)}</b> · <span data-testid="fr-borrow-print">${esc(T(`edição ${cid}`, `printing ${cid}`))}</span> · ${esc(T(`com ${nm}`, `from ${nm}`))} · ${esc(T(`${free} ${free === 1 ? "livre" : "livres"}`, `${free} free`))}</p>
        <label class="field">${T("Quantidade", "Quantity")}<select id="frBQty">${Array.from({ length: free }, (_, i) => `<option>${i + 1}</option>`).join("")}</select></label>
        <label class="field">${T("Mensagem (opcional)", "Message (optional)")}<textarea id="frBNote" maxlength="500" rows="2"></textarea></label>
        <p class="small muted" style="margin:0">${esc(T(`${nm} recebe o pedido e precisa aceitar. Você acompanha em Trocas.`, `${nm} gets the request and needs to accept. Follow it in Trades.`))}</p>
        <p class="small" id="frBMsg" role="alert"></p>
        <div class="row" style="justify-content:flex-end;gap:var(--sp-2)"><button type="button" class="btn ghost" data-close>${T("Cancelar", "Cancel")}</button><button type="button" class="btn primary" id="frBSend" data-testid="fr-borrow-send">${T("Enviar pedido", "Send request")}</button></div></div>`;
    d.querySelectorAll("[data-close]").forEach((x) => x.onclick = () => d.close());
    $("frBSend").onclick = async () => {
      const s = $("frBSend"); s.disabled = true;
      try {
        await CLOUD.api("user_loans", { method: "POST", prefer: "return=minimal", body: { lender: fid, borrower: me.id, created_by: me.id,
          items: [{ card_id: cid, qty: Math.min(free, Math.max(1, +$("frBQty").value || 1)), foil: false }], note: $("frBNote").value.trim().slice(0, 500) } });
      } catch (e) { s.disabled = false; $("frBMsg").textContent = /too_many/.test(String(e?.why || "")) ? T("Você fez muitos pedidos hoje. Tente amanhã.", "Too many requests today. Try tomorrow.") : T("Não foi possível enviar. Tente de novo.", "Couldn't send. Try again."); return; }
      loanState.set(`${fid}|${cid}`, "requested"); d.close();
      b.outerHTML = `<span class="tag" data-testid="fr-loan-state">${LOAN_TXT.requested}</span>`;
      toast(T("Pedido enviado. Acompanhe em Trocas.", "Request sent. Follow it in Trades."));
    };

  }

  async function load() {
    $("frTools").hidden = true;
    if (!me || !CLOUD) {
      $("app").innerHTML = `<div class="empty"><img src="../ui/assets/empty/signedout.svg" alt=""><b>${T("Entre para ver seus amigos", "Sign in to see your friends")}</b>
        <p>${T("Seus amigos, as coleções que abriram para você e o que podem emprestar ficam aqui.", "Your friends, the collections they opened to you and what they can lend show up here.")}</p>
        <button type="button" class="btn primary" id="signin">${T("Entrar", "Sign in")}</button></div>`;
      $("signin").onclick = () => window.INKWELL_SIGNIN?.();
      return;
    }
    let friends = null;
    try { friends = await rpc("my_friends"); } catch { friends = null; }
    if (!Array.isArray(friends)) {
      $("app").innerHTML = `<div class="empty"><img src="../ui/assets/empty/error.svg" alt=""><b>${T("Não deu para carregar seus amigos", "Couldn't load your friends")}</b><p>${T("Tente de novo em instantes.", "Try again in a moment.")}</p><button type="button" class="btn" id="again">${T("Tentar de novo", "Try again")}</button></div>`;
      $("again").onclick = () => { $("app").innerHTML = `<div class="skel" style="height:160px;border-radius:20px"></div>`; load(); };
      return;
    }
    friends = friends.filter((f) => f && f.id);
    if (autoTab) { autoTab = false; if (!friends.length) select("discover"); }
    if (!friends.length) {
      $("app").innerHTML = `<div class="empty" data-testid="fr-empty"><img src="../ui/assets/empty/feed.svg" alt=""><b>${T("Você ainda não tem amigos no Inkwell", "You have no friends on Inkwell yet")}</b>
        <p>${T("Com amigos, você vê os jogos deles no Início, as coleções que abrirem para você e quem pode emprestar as cartas que você procura.", "With friends you see their games on Home, the collections they open to you and who can lend the cards you want.")}</p>
        <div class="row" style="justify-content:center;gap:var(--sp-2);flex-wrap:wrap"><button type="button" class="btn primary" data-godiscover><i class="ic i-search"></i>${T("Encontrar jogadores", "Find players")}</button>${manage}${invite}</div></div>`;
      document.querySelector("[data-godiscover]").onclick = () => select("discover", true);
      wire();
      return;
    }
    const ids = friends.map((f) => f.id);
    // one read each, in parallel; any of them missing just leaves its line out
    const [shared, games, mine, openLoans, openTrades] = await Promise.all([
      rpc("shared_collections").catch(() => []),
      CLOUD.api(`game_logs?user_id=in.(${ids.join(",")})&visibility=neq.private&select=user_id,played_at&order=played_at.desc.nullslast&limit=${Math.min(1000, ids.length * 20)}`).catch(() => []),
      CLOUD.api("inkwell_profiles?select=profile,wishlist:data->wishlist").catch(() => []),
      // C5.3: loans and trades still open with each friend (RLS: only rows I am part of); managed in Trocas
      CLOUD.api(`user_loans?select=lender,borrower,status&or=(lender.eq.${me.id},borrower.eq.${me.id})&status=in.(requested,accepted,delivered)&limit=500`).catch(() => []),
      CLOUD.api(`user_trades?select=proposer,partner,status&or=(proposer.eq.${me.id},partner.eq.${me.id})&status=in.(proposed,accepted)&limit=500`).catch(() => []),
    ]);
    const wished = [...new Set((mine || []).flatMap((p) => Object.keys(p.wishlist && typeof p.wishlist === "object" ? p.wishlist : {})))].slice(0, 400);
    const want = askIds(wished);   // C5.4: what to ask about — the wished printings first, then the others (≤ 400)
    // a collection a friend opened to all friends (Coleção > Compartilhar): one read for every friend
    // (supabase/my_friends_summary.sql, issue #164: id, cards, lend; friends with a public address, no limit).
    // A failure just leaves the line out (C5.2: the old per-friend friend_collection reads are gone; Coleção still uses it).
    // Etapa C: "Troca" comes only from active Mural posts (listings kind 'trade', already readable by every signed-in
    // player); the private Fichário de trocas is never read. Only my friends' posts, only cards on my wishlist.
    const wantSet = new Set(want);
    const tradeAds = async () => { const out = [];
      for (let i = 0; want.length && i < ids.length; i += 80) out.push(...((await CLOUD.api(`listings?kind=eq.trade&user_id=in.(${ids.slice(i, i + 80).join(",")})&select=id,user_id,card_id,qty,foil,updated_at&order=updated_at.desc&limit=1000`).catch(() => [])) || []));
      return out.filter((l) => l && wantSet.has(l.card_id)); };
    const [lending, opened, ads, myLoans] = await Promise.all([
      want.length ? rpc("friends_lending", { p_cards: want }).catch(() => []) : [],
      rpc("my_friends_summary").then((r) => (Array.isArray(r) ? r : []), () => []),
      tradeAds().catch(() => []),
      want.length ? CLOUD.api(`user_loans?select=lender,items,status&borrower=eq.${me.id}&status=in.(requested,accepted,delivered)&limit=500`).catch(() => []) : [],
    ]);
    loanState.clear();
    for (const l of Array.isArray(myLoans) ? myLoans : []) for (const it of Array.isArray(l.items) ? l.items : []) if (it?.card_id) loanState.set(`${l.lender}|${it.card_id}`, l.status);
    const open = new Map(opened.filter((r) => r?.view && r.id).map((r) => [r.id, r]));
    const coll = new Map(), last = new Map(), lend = new Map();
    for (const s of Array.isArray(shared) ? shared : []) {
      const n = Object.values(s.collection || {}).reduce((t, e) => t + (+e?.n || 0) + (+e?.f || 0), 0);

      const x = lend.get(l.user) || { cards: new Set(), lends: false }; x.cards.add(keyOf(l.card_id)); x.lends ||= !!l.lend; lend.set(l.user, x);
    }
    const going = new Map(), addGoing = (fid, k, st) => { if (!fid || fid === me.id) return; const g = going.get(fid) || { loans: [], trades: [] }; g[k].push(st); going.set(fid, g); };
    for (const l of Array.isArray(openLoans) ? openLoans : []) addGoing(l.lender === me.id ? l.borrower : l.lender, "loans", l.status);
    for (const t of Array.isArray(openTrades) ? openTrades : []) addGoing(t.proposer === me.id ? t.partner : t.proposer, "trades", t.status);
    const ONE = { loans: { requested: T("Empréstimo pedido", "Loan requested"), accepted: T("Empréstimo aceito", "Loan accepted"), delivered: T("Empréstimo em andamento", "Loan in progress") },
      trades: { proposed: T("Troca proposta", "Trade proposed"), accepted: T("Troca aceita", "Trade accepted") } };
    const goingHtml = (fid) => { const g = going.get(fid); if (!g) return "";
      const part = (k, tab) => { const a = g[k]; if (!a.length) return "";
        const txt = a.length === 1 ? ONE[k][a[0]] || "" : k === "loans" ? T(`${a.length} empréstimos em andamento`, `${a.length} loans in progress`) : T(`${a.length} trocas em andamento`, `${a.length} trades in progress`);
        return txt ? `<a href="../trades/?tab=${tab}" data-testid="fr-going-${tab}">${esc(txt)}</a>` : ""; };
      const links = [part("loans", "loans"), part("trades", "trades")].filter(Boolean).join(" · ");
      return links ? `<span data-testid="fr-going"><i class="ic i-trades"></i>${links}</span>` : ""; };
    const order = (f) => last.get(f.id) || "";
    friends.sort((a, b) => String(order(b)).localeCompare(String(order(a))) || String(a.name || "").localeCompare(String(b.name || "")));
    const card = (f) => {
      const src = f.avatar ? art(f.avatar) : "", name = f.name || T("Amigo", "Friend"), prof = f.handle ? `../perfil/?u=${encodeURIComponent(f.handle)}` : "";
      const cs = coll.get(f.id) || [], ld = lend.get(f.id), at = last.get(f.id), op = !cs.length && open.get(f.id);
      const avatar = `<${prof ? `a href="${prof}"` : "span"} class="av" style="${src ? `background-image:url('${src}')` : ""}" aria-hidden="true" tabindex="-1">${src ? "" : esc(name[0].toUpperCase())}</${prof ? "a" : "span"}>`;
      const facts = [
        op ? `<span data-testid="fr-coll"><i class="ic i-cards"></i>${esc(T(`Coleção aberta aos amigos · ${num(op.cards)} cartas${op.lend ? " · empresta" : ""}`, `Collection open to friends · ${num(op.cards)} cards${op.lend ? " · lends" : ""}`))}</span>` : "",
        cs.length ? `<span data-testid="fr-coll"><i class="ic i-cards"></i>${esc(T(`Coleção aberta para você · ${num(cs.reduce((t, c) => t + c.n, 0))} cartas`, `Collection open to you · ${num(cs.reduce((t, c) => t + c.n, 0))} cards`))}</span>` : "",
        ld ? `<span data-testid="fr-lend"><i class="ic i-loan"></i>${esc(T(`Tem ${ld.cards.size} da sua lista de desejos${ld.lends ? " · empresta" : ""}`, `Has ${ld.cards.size} of your wishlist${ld.lends ? " · lends" : ""}`))}</span>` : "",
        at ? `<span data-testid="fr-last"><i class="ic i-games"></i>${esc(T(`Último jogo ${ago(at)}`, `Last game ${ago(at)}`))}</span>` : "",
        goingHtml(f.id),
      ].filter(Boolean).join("");
      // what the filters of "Meus amigos" look at: only what this card already shows
      const has = [cs.length || op ? "coll" : "", ld ? "wish" : "", at && Date.now() - Date.parse(at) < 30 * 864e5 ? "recent" : ""].filter(Boolean).join(" ");
      return `<article class="card fr" data-friend="${esc(f.id)}" data-has="${has}" data-q="${esc(`${name} ${f.handle || ""}`.toLocaleLowerCase(LOC))}">${avatar}
        <div class="t"><b>${esc(name)}</b>${f.handle ? `<span class="small muted">@${esc(f.handle)}</span>` : `<span class="small muted">${T("Perfil privado", "Private profile")}</span>`}
          ${facts ? `<div class="facts">${facts}</div>` : `<div class="facts"><span>${T("Nada compartilhado com você ainda.", "Nothing shared with you yet.")}</span></div>`}</div>
        <div class="acts">${prof ? `<a class="btn small" href="${prof}" data-testid="fr-profile"><i class="ic i-eye"></i>${T("Ver perfil", "View profile")}</a>` : ""}
          ${cs.map((c) => `<a class="btn small" href="../colecao/" data-coll="share:${esc(f.id)}:${esc(c.profile)}" data-testid="fr-open-coll"><i class="ic i-cards"></i>${cs.length > 1 ? esc(T(`Coleção “${c.profile}”`, `Collection “${c.profile}”`)) : T("Ver coleção", "See collection")}</a>`).join("")}
          ${op ? `<a class="btn small" href="../colecao/?amigo=${encodeURIComponent(f.handle)}" data-testid="fr-open-coll"><i class="ic i-cards"></i>${T("Ver coleção", "See collection")}</a>` : ""}
          ${ld ? `<a class="btn small ghost" href="../precos/"><i class="ic i-loan"></i>${T("Minha lista de desejos", "My wishlist")}</a>` : ""}</div></article>`;
    };
    $("app").innerHTML = `<div class="fr-top">${manage}${invite}</div>
      <div id="frListWrap"><div class="fr-list" data-testid="fr-list">${friends.map(card).join("")}</div>
      <p class="small muted" id="frNone" data-testid="fr-filter-none" hidden>${T("Nenhum amigo com essa busca ou filtro.", "No friends match this search or filter.")}</p></div>
      ${want.length ? wishView(friends, lending, ads, wished) : ""}
      ${!want.length ? `<p class="small muted" style="margin-top:var(--sp-4)" data-testid="fr-wish-hint">${T("Dica: com cartas na sua lista de desejos, aparece aqui quem tem cada uma.", "Tip: with cards on your wishlist, this shows who has each one.")}</p>` : ""}`;
    // the shared collection opens in Coleção (the same choice Coleção remembers)
    document.querySelectorAll("[data-coll]").forEach((a) => a.addEventListener("click", () => { try { localStorage.setItem("inkwell-coll-source", a.dataset.coll); } catch { /* */ } }));
    wire();
    document.querySelectorAll("[data-borrow]").forEach((b) => b.onclick = () => borrowSheet(b));
    renderTools(!!want.length);
  }
  if (me && CLOUD) initTabs();
  load();
})();
</script>

<script>window.INKWELL_SHELL = {"page": "friends"};
/*@SHELL_JS@*/</script>
</body>
</html>
