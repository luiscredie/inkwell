name: Deploy Inkwell to GitHub Pages

# O deploy espera "Inkwell release checks" concluir com sucesso em main.
# O gatilho de push direto foi removido de proposito: com ele, o deploy corria
# em paralelo com os checks e podia publicar uma arvore que falhava.
on:
  workflow_run:
    workflows: ["Inkwell release checks"]
    types: [completed]
    branches: [main]
  # Deploy manual (quando o automático falha por problema do GitHub). Só a partir da main; publica exatamente o
  # commit informado, e só se uma execução oficial de "Inkwell release checks" (push na main) desse commit concluiu
  # com sucesso, com js, python, smoke e journeys-webkit. Um commit que não é o topo da main é um rollback: exige
  # autorização escrita, o SHA redigitado e a aprovação de outra pessoa no ambiente protegido "rollback".
  # Regras em tools/verify-deploy-sha.sh e tools/verify-rollback-approval.sh.
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit a publicar (SHA completo). Deve ser o topo da main, salvo rollback autorizado."
        required: true
      rollback_authorization:
        description: "Só para rollback: quem autorizou e quando (ex.: Conselho, 25/11, mensagem X)"
        required: false
        default: ""
      rollback_confirm:
        description: "Só para rollback: redigite o SHA completo"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write
  checks: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Manual run: which commit, on main, approved by the official release run; is it a rollback?
  guard:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      rollback: ${{ steps.verify.outputs.rollback }}
    steps:
      # the guard scripts come from main's own tree, never from the commit being published
      - uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: |
            tools/verify-deploy-sha.sh
            tools/verify-rollback-approval.sh
          sparse-checkout-cone-mode: false
      - name: Verify the commit asked for
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ inputs.sha }}
          ROLLBACK_AUTH: ${{ inputs.rollback_authorization }}
          ROLLBACK_CONFIRM: ${{ inputs.rollback_confirm }}
        run: bash tools/verify-deploy-sha.sh

  # A rollback waits here for an independent approval: the environment "rollback" must require reviewers with
  # self-review blocked (Settings → Environments). The script also checks that the approver is not who started the run.
  rollback-approval:
    needs: guard
    if: needs.guard.outputs.rollback == 'true'
    environment: rollback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: tools/verify-rollback-approval.sh
          sparse-checkout-cone-mode: false
      - name: Verify the approval was independent
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.triggering_actor }}
        run: bash tools/verify-rollback-approval.sh

  deploy:
    needs: [guard, rollback-approval]
    # automatic: the release checks of that commit passed. Manual: the guard passed and, for a rollback, the
    # independent approval too. Never when anything before it failed or was cancelled.
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.guard.result == 'success' &&
          (needs.guard.outputs.rollback != 'true' || needs.rollback-approval.result == 'success'))
      )
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision
        uses: actions/checkout@v5
        with:
          # Sem isto, o workflow_run publicaria o HEAD de main no momento do
          # deploy — que pode ja ser um commit posterior, ainda nao testado.
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check -r tools/requirements-pages.txt

      - name: Build minimal Pages artifact
        run: python tools/build_pages_artifact.py --source site --output _site --optimize-images

      # Nao e suite de teste — e a guarda contra publicar uma raiz quebrada.
      # A raiz e so um redirecionamento para feed/; o app antigo foi aposentado
      # (o codigo dele fica em legacy/, fora do site publicado).
      - name: Verify deploy root
        shell: bash
        run: |
          for f in index.html sw.js inkwell.webmanifest feed/index.html colecao/index.html decks/index.html entrar/index.html push/sw.js sim/index.html sim/sw.js data/cards.json; do
            test -f "_site/$f" || { echo "faltando: _site/$f"; exit 1; }
          done
          grep -q "feed" _site/index.html
          grep -q "unregister" _site/sw.js
          grep -q "unregister" _site/sim/sw.js
          for f in support.js match-center-engine.js manifest.webmanifest data-manifest.json users sim/game.js data/ligalorcana-prices.json card-catalog-master.json; do
            test ! -e "_site/$f" || { echo "nao devia publicar: _site/$f"; exit 1; }
          done
          test ! -f index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
