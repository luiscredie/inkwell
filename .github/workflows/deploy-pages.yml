name: Deploy Inkwell to GitHub Pages

# Deploys on every push to main, without waiting for "Inkwell release checks".
# The checks workflow still runs and still reports — it just no longer gates.
# To put the gate back, restore the workflow_run trigger and the conclusion
# condition (see the block commented out below).
on:
  push:
    branches: [main]
  workflow_dispatch:

# on:
#   workflow_run:
#     workflows: ["Inkwell release checks"]
#     types: [completed]
#     branches: [main]
#   workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # if: >-
    #   github.event_name == 'workflow_dispatch' ||
    #   github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision
        uses: actions/checkout@v4

      # Kept deliberately. This is not a test suite — it is the guard against
      # publishing a structurally broken root, and it costs nothing.
      - name: Verify deploy root
        shell: bash
        run: |
          test -f site/index.html
          test -f site/support.js
          test -f site/data-manifest.json
          test ! -f index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
