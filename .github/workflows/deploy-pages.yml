name: Deploy Inkwell to GitHub Pages

# O deploy espera "Inkwell release checks" concluir com sucesso em main.
# O gatilho de push direto foi removido de proposito: com ele, o deploy corria
# em paralelo com os checks e podia publicar uma arvore que falhava.
on:
  workflow_run:
    workflows: ["Inkwell release checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision
        uses: actions/checkout@v5
        with:
          # Sem isto, o workflow_run publicaria o HEAD de main no momento do
          # deploy — que pode ja ser um commit posterior, ainda nao testado.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check -r tools/requirements-pages.txt

      - name: Build minimal Pages artifact
        run: python tools/build_pages_artifact.py --source site --output _site --optimize-images

      # Nao e suite de teste — e a guarda contra publicar uma raiz quebrada.
      # A raiz e so um redirecionamento para feed/; o app antigo foi aposentado
      # (o codigo dele fica em legacy/, fora do site publicado).
      - name: Verify deploy root
        shell: bash
        run: |
          for f in index.html sw.js inkwell.webmanifest feed/index.html colecao/index.html decks/index.html entrar/index.html push/sw.js sim/index.html sim/sw.js data/cards.json; do
            test -f "_site/$f" || { echo "faltando: _site/$f"; exit 1; }
          done
          grep -q "feed" _site/index.html
          grep -q "unregister" _site/sw.js
          grep -q "unregister" _site/sim/sw.js
          for f in support.js match-center-engine.js manifest.webmanifest data-manifest.json users sim/game.js data/ligalorcana-prices.json card-catalog-master.json; do
            test ! -e "_site/$f" || { echo "nao devia publicar: _site/$f"; exit 1; }
          done
          test ! -f index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
