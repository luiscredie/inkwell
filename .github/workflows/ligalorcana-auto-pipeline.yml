name: LigaLorcana - preparar checkpoints incrementais
on:
  push:
    branches: [feature/ligalorcana-review-pipeline]
    paths:
      - 'coletas/ligalorcana/coleta/coleta_*.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ligalorcana-incremental
  cancel-in-progress: false
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ligalorcana-review-pipeline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes de integridade
        run: python -m unittest tools/test_ligalorcana_release_candidate.py tools/test_ligalorcana_generate_map.py -v
      - name: Preparar mapa conservador
        run: |
          mkdir -p /tmp/ligalorcana
          python tools/ligalorcana_generate_map.py --source coletas/ligalorcana/coleta --cards site/data/cards.json --output /tmp/ligalorcana/map.json
      - name: Preparar proposta por edicao concluida
        run: |
          python tools/ligalorcana_incremental.py --source coletas/ligalorcana/coleta --cards site/data/cards.json --prices site/data/prices.json --map /tmp/ligalorcana/map.json --output /tmp/ligalorcana/proposta
      - uses: actions/upload-artifact@v4
        with:
          name: ligalorcana-incremental-proposta
          path: /tmp/ligalorcana/proposta/
          retention-days: 30
