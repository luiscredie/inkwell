name: Inkwell release checks
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Data-contract fixtures
        run: node tools/validate.test.mjs
      - name: Image-fallback identity regression
        run: node tools/imgfallback.test.mjs
      - name: UI contract
        run: node tools/ui-contract.test.mjs
      - name: Price movers
        run: node tools/price-movers.test.mjs
      - name: Deck allocation optimizer
        run: node tools/deck-allocation.test.mjs
      - name: Deck portfolio advisor
        run: node tools/deck-portfolio-v4.test.mjs
      - name: Match center
        run: node tools/match-center.test.mjs
      - name: Match center V5
        run: node tools/match-center-v5.test.mjs
      - name: Match center R3 integration
        run: node tools/match-center-r3.test.mjs
      - name: Match center legacy core
        run: node tools/match-center-legacy-core.test.cjs
      - name: Legality engine
        run: node tools/legality.test.mjs
      - name: Translation contract
        run: node tools/i18n-contract.test.mjs
      - name: Visual replay
        run: node tools/visual-replay.test.mjs
      - name: Visual and foundation contract
        run: node tools/visual-contract.test.mjs
      - name: Sync and safe-import contract
        run: node tools/sync-import-contract.test.mjs
      - name: Import audit and data health contract
        run: node tools/data-health-contract.test.mjs
      - name: Shared cards and portfolio contract
        run: node tools/shared-cards-contract.test.mjs
      - name: Meta advisor contract
        run: node tools/meta-advisor-contract.test.mjs
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Release validator fixtures
        run: python -m unittest tools/test_validate_release.py
      - name: Card-art validator fixtures
        run: python -m unittest tools/test_card_art_validator.py
      - name: Image-agent recovery suite
        run: python -m unittest tools/test_lorcana_image_agent.py
      - name: Price-agent recovery suite
        run: python -m unittest tools/test_ligalorcana_price_agent_daily_v4.py
      - name: Price-agent v5 safety suite
        run: python -m unittest tools/test_ligalorcana_price_agent_daily_v5.py
      - name: PT-BR translation suite
        run: python -m unittest tools/test_refine_cards_pt.py
      - name: Manifest refresh suite
        run: python -m unittest tools/test_refresh_data_manifest.py
      - name: Release validator against site/
        run: python tools/validate_release.py --root site --quick
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm ci && npx playwright install --with-deps chromium
      - name: Serve site
        run: (cd site && python3 -m http.server 8080 &) && sleep 2
      - name: Browser smoke
        run: INKWELL_URL=http://localhost:8080/index.html npx playwright test tools/smoke.spec.mjs
