name: Inkwell Mobile native builds
# Compiles the experimental apps and runs them: Android on an emulator, iOS on the simulator.
# Evidence (APK, screenshots, UI text) is uploaded as artifacts and summarised in the job log.
# Emulator and simulator runs are not real devices.
on:
  pull_request:
    paths: [ 'mobile/**', '.github/workflows/mobile-native.yml' ]
permissions:
  contents: read
concurrency:
  group: mobile-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: android (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [dev, release]
    env:
      INKWELL_TARGET: ${{ matrix.target }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Release web bundle (release target only)
        if: matrix.target == 'release'
        run: node build-release.mjs
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug && ls -la app/build/outputs/apk/debug/
      - name: Name the APK (integrated test build)
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          N="Inkwell-Android-Teste-Integrado-${SHA::7}-${{ matrix.target }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$N"
          echo "APK_NAME=$N" >> "$GITHUB_ENV"
          echo "APK $N  commit $SHA  branch ${{ github.head_ref || github.ref_name }}"
          sha256sum "$N"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: mobile/${{ env.APK_NAME }}
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install and run on an Android emulator (API 34)
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: mobile
          script: bash native-run-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-evidence-${{ matrix.target }}
          path: mobile/evidence/

  ios:
    name: ios (${{ matrix.target }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [dev, release]
    env:
      INKWELL_TARGET: ${{ matrix.target }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Release web bundle (release target only)
        if: matrix.target == 'release'
        run: node build-release.mjs
      - run: npx cap sync ios
      - name: Build for the iOS simulator (no signing)
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 30
          ls build/Build/Products/Debug-iphonesimulator/
      - name: Install and run on the iOS simulator
        timeout-minutes: 12
        run: bash native-run-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-evidence-${{ matrix.target }}
          path: mobile/evidence/
