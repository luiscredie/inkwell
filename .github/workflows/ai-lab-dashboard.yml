name: AI Lab dashboard checks
on:
  pull_request:
    paths:
      - "site/ai-lab/**"
      - "tools/ai_lab_metrics.py"
      - "tools/test_ai_lab_metrics.py"
      - "tools/ai_lab_plateau_guard.py"
      - "tools/test_ai_lab_plateau.py"
      - "tools/ai_lab_simulator_live.py"
      - "tools/test_ai_lab_simulator_live.py"
      - ".github/workflows/ai-lab-dashboard.yml"
permissions:
  contents: read
jobs:
  privacy-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Test metrics exporter
        run: python -m unittest discover -s tools -p 'test_ai_lab_*.py' -v
      - name: Static dashboard checks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("site/ai-lab/index.html")
          s = p.read_text(encoding="utf-8")
          assert "<!doctype html>" in s.lower()
          assert "ai-lab-metrics/data/latest.json" in s
          assert "Não é taxa de vitória" in s
          assert "simulator_latest.json" in s
          assert "setInterval(refreshDashboard,60000)" in s
          assert "duels.token" not in s
          assert "service_role" not in s
          print("Dashboard static checks OK")
          PY
