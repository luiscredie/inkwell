name: Daily TCGplayer prices

# Todo dia: precos do TCGplayer (API do Lorcast) convertidos pela cotacao do dolar do dia, mais um dia no
# historico (data/price-history-tcg/). A main so aceita PR com js, python, smoke e journeys-webkit verdes vindos
# de pull_request (checks disparados por workflow_dispatch nao contam). Por isso este workflow so prepara o PR:
#   1. parte da main e traz os dias de historico de um PR automatico ainda aberto (nenhuma data se perde);
#   2. grava numa unica branch, auto/daily-prices, e abre ou atualiza um unico PR.
#   3. com o app "Inkwell bot" configurado (vars.INKWELL_APP_ID + secrets.INKWELL_APP_PRIVATE_KEY), o PR e aberto
#      pelo app: os checks de pull_request rodam sozinhos e o auto-merge faz o merge quando os 4 passam; o merge
#      dispara os release checks e o deploy da main. Nada de bypass: a ruleset decide o merge.
# Sem o app, o PR e aberto pelo GITHUB_TOKEN e os checks esperam "Approve workflows to run" + merge manual.
on:
  schedule:
    - cron: "23 10 * * *"   # 07:23 em Sao Paulo
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

env:
  BRANCH: auto/daily-prices

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_APP: ${{ secrets.INKWELL_APP_PRIVATE_KEY != '' && vars.INKWELL_APP_ID != '' }}
    steps:
      # Inkwell bot (GitHub App): with it, the PR's pull_request checks run without "Approve workflows to run" and the
      # merge it asks for fires the release checks and the deploy on main. Without it, the GITHUB_TOKEN is used.
      - name: App token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.INKWELL_APP_ID }}
          private-key: ${{ secrets.INKWELL_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ steps.app.outputs.token || github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Carry the history days of a pending automatic PR
        run: |
          if git fetch --depth=1 origin "$BRANCH" 2>/dev/null; then
            mkdir -p site/data/price-history-tcg
            # recursive listing: full paths of the day files, never the directory itself
            git ls-tree -r --name-only FETCH_HEAD -- site/data/price-history-tcg/ | grep -E '/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' | while read -r f; do
              [ -e "$f" ] || { git show "FETCH_HEAD:$f" > "$f"; echo "kept $f"; }
            done
          fi

      - name: Prices and history
        run: python tools/prices_from_lorcast.py --rate auto --history

      - name: Manifest and release checks
        run: |
          python tools/refresh_data_manifest.py --root site
          python tools/validate_release.py --root site
          python tools/build_site_pages.py --check

      - name: Commit to the automatic branch
        id: commit
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard site/data)" ]; then
            echo "No price changes."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "inkwell-prices[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add site/data site/data-manifest.json
          git commit -m "Daily prices $(TZ=America/Sao_Paulo date +%F) (TCGplayer via Lorcast)"
          git push --force origin "$BRANCH"   # one branch, rebuilt from main every day (history carried above)
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$BRANCH" --title "Preços diários (automático)" \
              --body "Preços do TCGplayer via Lorcast e um dia a mais no histórico. Atualizado pelo workflow *Daily TCGplayer prices*; com o app Inkwell bot, mesclado sozinho quando os checks obrigatórios passam." \
              || { echo "::error::Could not open the PR. Enable Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests'."; exit 1; }
          fi
          if [ "$HAS_APP" = "true" ]; then
            gh pr merge "$BRANCH" --auto --merge   # GitHub merges when the ruleset is satisfied (4 checks green)
          else
            echo "::notice::No Inkwell bot app: approve the workflows on the PR and merge it."
          fi
