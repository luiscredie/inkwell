name: Daily TCGplayer prices

# Todo dia: precos do TCGplayer (API do Lorcast) convertidos pela cotacao do dolar do dia,
# mais um dia no historico (data/price-history-tcg/). Valida, publica em main e dispara o deploy.
# Um push feito com o GITHUB_TOKEN nao dispara outros workflows, por isso os checks rodam aqui
# e o deploy e chamado no fim.
on:
  schedule:
    - cron: "23 10 * * *"   # 07:23 em Sao Paulo
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Prices and history
        run: python tools/prices_from_lorcast.py --rate auto --history

      - name: Manifest and release checks
        run: |
          python tools/refresh_data_manifest.py --root site
          python tools/validate_release.py --root site
          python tools/build_site_pages.py --check

      - name: Publish
        id: publish
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard site/data)" ]; then
            echo "No price changes."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "inkwell-prices[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/data-manifest.json
          git commit -m "Daily prices $(TZ=America/Sao_Paulo date +%F) (TCGplayer via Lorcast)"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
