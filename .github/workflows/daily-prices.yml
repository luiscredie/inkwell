name: Daily TCGplayer prices

# Todo dia: precos do TCGplayer (API do Lorcast) convertidos pela cotacao do dolar do dia, mais um dia no
# historico (data/price-history-tcg/). A main e protegida (so por PR, com js, python, smoke e journeys-webkit
# verdes, sem bypass), entao este workflow:
#   1. parte da main e traz os dias de historico de um PR automatico ainda aberto (nenhuma data se perde);
#   2. grava numa unica branch, auto/daily-prices, e abre ou atualiza um unico PR;
#   3. dispara os checks obrigatorios nessa branch (eventos do GITHUB_TOKEN nao disparam pull_request, mas
#      workflow_dispatch sim) e espera o resultado;
#   4. com tudo verde, faz o merge do PR (as regras da main valem igual) e dispara o deploy.
# Se um check falhar, o PR fica aberto e o job falha; no dia seguinte o PR e refeito com os dois dias.
# Requer em Settings > Actions > General: "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: "23 10 * * *"   # 07:23 em Sao Paulo
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

env:
  BRANCH: auto/daily-prices

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Carry the history days of a pending automatic PR
        run: |
          if git fetch --depth=1 origin "$BRANCH" 2>/dev/null; then
            mkdir -p site/data/price-history-tcg
            # recursive listing: full paths of the day files, never the directory itself
            git ls-tree -r --name-only FETCH_HEAD -- site/data/price-history-tcg/ | grep -E '/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' | while read -r f; do
              [ -e "$f" ] || { git show "FETCH_HEAD:$f" > "$f"; echo "kept $f"; }
            done
          fi

      - name: Prices and history
        run: python tools/prices_from_lorcast.py --rate auto --history

      - name: Manifest and release checks
        run: |
          python tools/refresh_data_manifest.py --root site
          python tools/validate_release.py --root site
          python tools/build_site_pages.py --check

      - name: Commit to the automatic branch
        id: commit
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard site/data)" ]; then
            echo "No price changes."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "inkwell-prices[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add site/data site/data-manifest.json
          git commit -m "Daily prices $(TZ=America/Sao_Paulo date +%F) (TCGplayer via Lorcast)"
          git push --force origin "$BRANCH"   # one branch, rebuilt from main every day (history carried above)
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.commit.outputs.changed == 'true'
        run: |
          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$BRANCH" --title "Preços diários (automático)" \
              --body "Preços do TCGplayer via Lorcast e um dia a mais no histórico. Aberto e mesclado pelo workflow *Daily TCGplayer prices* quando os checks obrigatórios passam." \
              || { echo "::error::Could not open the PR. Enable Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests'."; exit 1; }
          fi

      - name: Required checks on the branch
        if: steps.commit.outputs.changed == 'true'
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run validate.yml --ref "$BRANCH"
          id=""
          for i in $(seq 1 30); do
            id=$(gh run list --workflow validate.yml --branch "$BRANCH" --event workflow_dispatch --limit 10 --json databaseId,headSha --jq "[.[] | select(.headSha == \"$SHA\")][0].databaseId // empty")
            [ -n "$id" ] && break; sleep 10
          done
          [ -n "$id" ] || { echo "::error::The checks did not start."; exit 1; }
          gh run watch "$id" --exit-status --interval 30

      - name: Merge and deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          # GitHub applies the main ruleset to this merge: it is refused unless the 4 required checks passed on $SHA
          gh pr merge "$BRANCH" --merge --match-head-commit "$SHA"
          gh workflow run deploy-pages.yml --ref main   # a merge made with the GITHUB_TOKEN fires no push workflows
          git push origin --delete "$BRANCH" || true    # tidy up; the next day starts again from main
