# One-off: download a card image the build sandbox can't reach, and commit it to this branch.
name: Fetch card image
on:
  push:
    branches: [tb-image]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download
        run: |
          f="site/lorcana-card-images/images/Tinker_Bell_-_Insistent_Fairy_(Disney_Lorcana_Challenge)__DLPC1-18-C2.jpg"
          curl -fsSL -A "Mozilla/5.0" "https://www.pokeboxusa.com/cdn/shop/files/712027.jpg?v=1788317029&width=1225" -o "$f"
          file "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "Card image: DLPC1-18-C2 (Tinker Bell - Insistent Fairy promo)"
          git push
