name: Add missing cards (Lorcast)

# Adds the printings of one Lorcast set that the catalog doesn't have yet (site/data/cards.json + pictures),
# rebuilds the pages and validates. main is protected (PR only, required checks, no bypass): the result goes to
# the branch auto/add-cards-<SET> and one PR per set (a new run for the same set updates it). The required checks
# are started on that branch (GITHUB_TOKEN events do not fire pull_request). A person reviews and merges; that
# merge runs the release checks on main and deploys, as for any PR. Existing cards are never changed.
# Requires Settings > Actions > General: "Allow GitHub Actions to create and approve pull requests".
#   gh workflow run add-cards.yml -f set=D23 -f prefix=D23C -f name="D23 Collection"
on:
  workflow_dispatch:
    inputs:
      set:
        description: "Lorcast set code (e.g. D23)"
        required: true
      prefix:
        description: "Our id prefix (e.g. D23C)"
        required: true
      name:
        description: "Set name"
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Add the cards
        env:
          SET: ${{ inputs.set }}
          PREFIX: ${{ inputs.prefix }}
          NAME: ${{ inputs.name }}
        run: |
          [[ "$SET" =~ ^[A-Za-z0-9]{1,8}$ && "$PREFIX" =~ ^[A-Z0-9]{2,8}$ ]] || { echo "bad input"; exit 1; }
          python tools/add_lorcast_cards.py --set "$SET" --prefix "$PREFIX" ${NAME:+--name "$NAME"}

      - name: Prices, pages and checks
        run: |
          python tools/prices_from_lorcast.py --rate auto
          python tools/build_site_pages.py
          python tools/build_site_decks.py
          python tools/refresh_data_manifest.py --root site
          python tools/validate_release.py --root site
          python tools/build_site_pages.py --check

      - name: Commit to the set's branch
        id: commit
        env:
          SET: ${{ inputs.set }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard site)" ]; then
            echo "Nothing new."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          branch="auto/add-cards-$(echo "$SET" | tr 'A-Z' 'a-z')"
          git config user.name "inkwell-catalog[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add site
          git commit -m "Catalog: cards from Lorcast set $SET"
          git push --force origin "$branch"   # same set again: the PR is updated, never duplicated
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request and start the required checks
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SET: ${{ inputs.set }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$BRANCH" --title "Catálogo: cartas do set $SET (Lorcast)" \
              --body "Cartas novas do set $SET, imagens, preços e páginas regeneradas pelo workflow *Add missing cards*. Revisar e fazer merge quando os checks obrigatórios passarem." \
              || { echo "::error::Could not open the PR. Enable Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests'."; exit 1; }
          fi
          gh workflow run validate.yml --ref "$BRANCH"
