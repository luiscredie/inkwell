<script>window.INKWELL_CLOUD_CONFIG = {"url": "https://sorefaetiaebmjploanp.supabase.co", "key": "sb_publishable_RkAWW-ENz70CXA6_QV7aHw_MpfD7Gn2", "redirect": "https://luiscredie.github.io/inkwell/feed/"};
/* Inkwell Lore Counter: cloud adapter for the offline app.
 *
 * Talks to the Inkwell Supabase project with plain fetch (no library to cache):
 *   sign-in   email one-time code (or the magic link, when opened in the same browser)
 *   storage   public.game_logs, one row per game, upserted on (user_id, game_id),
 *             so a retry after a dropped connection never creates a duplicate
 * The counter keeps every match locally until send() resolves true.
 * Only the public URL and publishable key are here; row-level security limits each user to their own rows.
 */
window.INKWELL_CLOUD = (() => {
  const cfg = window.INKWELL_CLOUD_CONFIG || {};
  if (!cfg.url || !cfg.key) return null;
  // One sign-in for the whole site: the counter, Coach Review, Início, Trocas and the Inkwell app itself
  // (its supabase-js client uses this same storage key), so signing in or out on one page does it on all.
  const KEY = "inkwell-counter-auth";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch { return null; } };
  let sess = load();
  const store = (x) => { sess = x; try { if (x) localStorage.setItem(KEY, JSON.stringify(x)); else localStorage.removeItem(KEY); } catch { /* private mode */ } };
  const headers = (tok) => ({ apikey: cfg.key, "Content-Type": "application/json", ...(tok ? { Authorization: `Bearer ${tok}` } : {}) });
  const claims = (jwt) => { try { return JSON.parse(atob(jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); } catch { return {}; } };
  const session = (r) => {   // the same shape supabase-js keeps, so both read each other's session
    const c = claims(r.access_token);
    const expires_at = r.expires_at || c.exp || Math.floor(Date.now() / 1000) + (r.expires_in || 3600);
    return { access_token: r.access_token, refresh_token: r.refresh_token, token_type: "bearer",
      expires_in: r.expires_in || Math.max(0, expires_at - Math.floor(Date.now() / 1000)), expires_at,
      user: { ...(r.user || {}), id: r.user?.id || c.sub, email: r.user?.email || c.email } };
  };

  // Magic link opened in this same browser: tokens arrive in the URL fragment.
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("access_token") && h.get("refresh_token")) {
    store(session({ access_token: h.get("access_token"), refresh_token: h.get("refresh_token"), expires_in: +h.get("expires_in") || 3600 }));
    history.replaceState(null, "", location.pathname + location.search);
  }

  async function token() {
    sess = load();   // another page (or the Inkwell app) may have signed in, out, or refreshed the tokens meanwhile
    if (!sess) return null;
    if (sess.expires_at - 60 > Date.now() / 1000) return sess.access_token;
    const used = sess.refresh_token;
    const r = await fetch(`${cfg.url}/auth/v1/token?grant_type=refresh_token`, { method: "POST", headers: headers(), body: JSON.stringify({ refresh_token: used }) });
    if (r.status === 400 || r.status === 401) {
      const now = load();   // a page that refreshed at the same moment already saved newer tokens: keep them
      if (now && now.refresh_token !== used && now.expires_at - 60 > Date.now() / 1000) { sess = now; return sess.access_token; }
      store(null); return null;   // signed out elsewhere
    }
    if (!r.ok) throw new Error(`refresh ${r.status}`);
    store(session(await r.json()));
    return sess.access_token;
  }

  // Authenticated call to the database's REST API (used by Coach Review). Errors carry a short code.
  async function api(path, { method = "GET", body, prefer } = {}) {
    const tok = await token();
    if (!tok) throw Object.assign(new Error("signed out"), { code: "auth" });
    const r = await fetch(`${cfg.url}/rest/v1/${path}`, {
      method, headers: { ...headers(tok), ...(prefer ? { Prefer: prefer } : {}) }, body: body === undefined ? undefined : JSON.stringify(body) });
    if (r.status === 401) store({ ...sess, expires_at: 0 });
    if (!r.ok) {
      const code = r.status === 401 || r.status === 403 ? "permission" : r.status === 400 || r.status === 409 || r.status === 413 ? "invalid_argument" : "unavailable";
      throw Object.assign(new Error(`${method} ${path.split("?")[0]} ${r.status}`), { code, status: r.status });
    }
    const text = await r.text();
    return text ? JSON.parse(text) : null;
  }

  return {
    api,
    user: () => { sess = load(); return sess ? { id: sess.user?.id, email: sess.user?.email } : null; },
    status: () => { sess = load(); return sess ? { signedIn: true, email: sess.user?.email || "" } : { signedIn: false }; },
    async requestCode(email) {
      const redirect = cfg.redirect || location.href.split("#")[0];
      const r = await fetch(`${cfg.url}/auth/v1/otp?redirect_to=${encodeURIComponent(redirect)}`, { method: "POST", headers: headers(), body: JSON.stringify({ email, create_user: true }) });
      if (!r.ok) throw new Error(`otp ${r.status}`);
    },
    async verify(email, code) {
      const r = await fetch(`${cfg.url}/auth/v1/verify`, { method: "POST", headers: headers(), body: JSON.stringify({ type: "email", email, token: String(code).replace(/\s/g, "") }) });
      if (!r.ok) throw new Error(`verify ${r.status}`);
      store(session(await r.json()));
    },
    signOut() {
      const old = sess; store(null);
      if (old) fetch(`${cfg.url}/auth/v1/logout`, { method: "POST", headers: headers(old.access_token) }).catch(() => {});
    },
    async send(logs) {
      const tok = await token();   // also reloads sess
      if (!tok) return false;
      const rows = logs.map((l) => ({ user_id: sess.user.id, game_id: l.game_id, source: l.source, played_at: l.played_at, log: l }));
      const r = await fetch(`${cfg.url}/rest/v1/game_logs?on_conflict=user_id,game_id`, {
        method: "POST", headers: { ...headers(tok), Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(rows) });
      if (r.status === 401) store({ ...sess, expires_at: 0 });   // force a refresh on the next try
      return r.ok;
    },
  };
})();
</script>

    "just now": "agora", "{n} min ago": "há {n} min", "{n} h ago": "há {n} h", "yesterday": "ontem",

    "Your friends' games, newest first.": "Os jogos dos seus amigos, do mais recente ao mais antigo.", "Friends and privacy": "Amigos e privacidade", "Privacy": "Privacidade",
    "{n} friends": "{n} amigos", "1 friend": "1 amigo", "your games: {v}": "seus jogos: {v}", "Close": "Fechar", "Requests": "Pedidos", "Add a friend": "Adicionar amigo",
    "Your timeline is empty": "Sua linha do tempo está vazia", "Add friends to see their games here. Your games also show up for whoever you choose.": "Adicione amigos para ver os jogos deles aqui. Os seus jogos também aparecem para quem você escolher.",
    "Add friends": "Adicionar amigos", "Sign in to see your friends' games": "Entre para ver os jogos dos amigos", "Use your e-mail. We send a 6-digit code, no password.": "Use seu e-mail. Mandamos um código de 6 dígitos, sem senha.",
    "Couldn't load the timeline.": "Não foi possível carregar a linha do tempo.", "Check your connection and try again.": "Confira a internet e tente de novo.", "Try again": "Tentar de novo",
    "Won": "Venceu", "Lost": "Perdeu", "against": "contra", "went first": "começou jogando", "went second": "começou comprando", "Confirm removal": "Confirmar remoção", "Confirm delete": "Confirmar exclusão",
    "Invite": "Convidar", "people": "pessoas", "Opponents' names are never shown to others. Coaches see the games shared with them. You can change it game by game in the review.": "O nome dos adversários nunca aparece para os outros. Coaches veem os jogos compartilhados com eles. Dá para mudar jogo a jogo na revisão.",
  };
  const fill = (s, v) => (v ? s.replace(/\{(\w+)\}/g, (m, k) => (k in v ? String(v[k]) : m)) : s);
  const Tx = (en, v) => fill(lang === "pt" && en in PT ? PT[en] : en.trimEnd(), v);
  const LOC = lang === "pt" ? "pt-BR" : "en";
  const INK = { Amber: "--amber", Amethyst: "--amethyst", Emerald: "--emerald", Ruby: "--ruby", Sapphire: "--sapphire", Steel: "--steel" };
  const inkDots = (s) => `<span class="inks">${String(s || "").split(/[\/,]\s*/).filter(Boolean).slice(0, 2).map((c) => `<i style="background:var(${INK[c.trim()] || "--steel"})"></i>`).join("")}</span>`;
  const ago = (iso) => {
    const d = Date.parse(iso); if (!d) return "";
    const m = Math.round((Date.now() - d) / 60000);
    if (m < 1) return Tx("just now"); if (m < 60) return Tx("{n} min ago", { n: m });
    if (m < 60 * 20) return Tx("{n} h ago", { n: Math.round(m / 60) }); if (m < 60 * 40) return Tx("yesterday");
    return new Date(d).toLocaleDateString(LOC, { day: "numeric", month: "short", year: new Date(d).getFullYear() === new Date().getFullYear() ? undefined : "numeric" });
  };

  const CLOUD = window.INKWELL_CLOUD;
  const me = CLOUD?.user();
  const enc = encodeURIComponent;
  let groups = [], coachGroups = [], myCoaches = [], coachCols = true, otherGroups = new Map(), myProfile = null, names = new Map(), friendships = [], posts = [], notes = new Map(), olderThan = null, moreAvailable = false, searchRes = null, myGameCount = 0;
  const PAGE = 25;
  const friendIds = () => friendships.filter((f) => f.status === "accepted").map((f) => (f.requester === me.id ? f.addressee : f.requester));
  const nameOf = (id) => (id === me.id ? Tx("You") : names.get(id) || Tx("A player"));

  $("title").textContent = Tx("Home"); document.title = `${Tx("Home")} · Inkwell`; document.documentElement.lang = LOC;
  $("sub").textContent = Tx("Your friends' games, newest first.");
  $("fpT").textContent = Tx("Friends and privacy"); $("fpClose").setAttribute("aria-label", Tx("Close"));
  const phone = () => matchMedia("(max-width: 760px)").matches;
  const sideEl = () => (phone() && $("friendsSheet").open ? $("sheetBody") : $("side"));

  // ---------- data ----------
  async function loadNames(ids) {
    const want = [...new Set(ids)].filter((id) => id && !names.has(id));
    for (let i = 0; i < want.length; i += 80) {
      for (const p of (await CLOUD.api(`profiles?user_id=in.(${want.slice(i, i + 80).join(",")})&select=user_id,display_name`)) || []) names.set(p.user_id, p.display_name);
    }
  }
  async function loadPeople() {
    const profSel = "user_id,display_name,default_visibility,default_group_id";
    const [prof, fr, cnt, grp, cl, cg] = await Promise.all([
      CLOUD.api(`profiles?user_id=eq.${me.id}&select=${profSel},default_coach_email,default_coach_group_id`)
        .catch(() => { coachCols = false; return CLOUD.api(`profiles?user_id=eq.${me.id}&select=${profSel}`); }),   // database without the coach columns yet
      CLOUD.api("friendships?select=*&order=created_at.desc"),
      CLOUD.api(`game_logs?user_id=eq.${me.id}&visibility=eq.private&select=game_id&limit=5000`),
      CLOUD.api(`friend_groups?select=id,name,owner_id,friend_group_members(member)&order=name`).catch(() => []),
      CLOUD.api(`coach_links?owner_id=eq.${me.id}&select=coach_email&order=created_at`).catch(() => []),
      CLOUD.api(`coach_groups?owner_id=eq.${me.id}&select=id,name,emails&order=name`).catch(() => null),
    ]);
    myCoaches = [...new Set((cl || []).map((c) => c.coach_email))];
    coachGroups = cg || [];
    if (cg === null) coachCols = false;
    groups = (grp || []).filter((g) => g.owner_id === me.id);
    otherGroups = new Map((grp || []).filter((g) => g.owner_id !== me.id).map((g) => [g.id, g.name]));
    myProfile = prof?.[0] || null;
    if (myProfile) names.set(me.id, myProfile.display_name);
    friendships = fr || [];
    myGameCount = (cnt || []).length;
    await loadNames(friendships.flatMap((f) => [f.requester, f.addressee]));
  }
  async function loadPosts(more = false) {
    const ids = [me.id, ...friendIds()];
    const q = `game_logs?user_id=in.(${ids.join(",")})&visibility=neq.private&select=user_id,game_id,source,played_at,summary,visibility,group_id&order=played_at.desc.nullslast&limit=${PAGE}${more && olderThan ? `&played_at=lt.${enc(olderThan)}` : ""}`;
    const rows = (await CLOUD.api(q)) || [];
    posts = more ? posts.concat(rows) : rows;
    moreAvailable = rows.length === PAGE;
    olderThan = posts.at(-1)?.played_at || null;
    const gids = rows.map((r) => r.game_id);
    for (let i = 0; i < gids.length; i += 60) {
      const part = (await CLOUD.api(`game_notes?game_id=in.(${gids.slice(i, i + 60).map((g) => `"${g}"`).join(",")})&select=id,owner_id,game_id,author,author_name,body,created_at&order=created_at`)) || [];
      for (const n of part) { const k = `${n.owner_id}|${n.game_id}`; if (!notes.has(k)) notes.set(k, []); if (!notes.get(k).some((x) => x.id === n.id)) notes.get(k).push(n); }
    }
    await loadNames([...rows.map((r) => r.user_id), ...[...notes.values()].flat().map((n) => n.author)]);
  }

  // ---------- friends and privacy (aside on a computer, a sheet on a phone) ----------
  const visLabel = () => {
    const v = myProfile?.default_visibility || "private";
    return ({ private: Tx("Only me"), friends: Tx("Friends "), public: Tx("Everyone"), coaches: Tx("All my coaches"), group: Tx("a group") })[v] || v;
  };
  function renderEntry() {
    const b = $("openFriends");
    if (!me || !myProfile) { b.hidden = true; return; }
    const fr = friendIds(), pending = friendships.filter((f) => f.status === "pending" && f.addressee === me.id).length;

      <span class="t"><span>${Tx("Friends and privacy")}${pending ? ` <span class="count">${pending}</span>` : ""}</span><span class="meta">${esc([fr.length ? (fr.length === 1 ? Tx("1 friend") : Tx("{n} friends", { n: fr.length })) : "", Tx("your games: {v}", { v: visLabel().toLowerCase() })].filter(Boolean).join(" · "))}</span></span>
      <i class="ic i-chevron-right chev"></i>`;
  }
  $("openFriends").onclick = () => { const d = $("friendsSheet"); d.showModal(); renderSide(); d.querySelector("input, button:not(#fpClose)")?.focus(); };
  $("fpClose").onclick = () => $("friendsSheet").close();
  $("friendsSheet").addEventListener("close", () => { $("sheetBody").innerHTML = ""; renderSide(); $("openFriends").focus(); });
  $("friendsSheet").addEventListener("click", (e) => { if (e.target === $("friendsSheet")) $("friendsSheet").close(); });
  const confirmBtn = (b, label, go) => {
    if (b.dataset.c !== "1") { b.dataset.c = "1"; const old = b.textContent; b.textContent = Tx(label); setTimeout(() => { if (b.isConnected && b.dataset.c === "1") { b.dataset.c = ""; b.textContent = old; } }, 4000); return; }
    go();
  };
  function renderSide() {
    renderEntry();
    $("side").innerHTML = ""; $("sheetBody").innerHTML = "";
    const el = sideEl();
    if (!me) return;
    if (!myProfile) {
      el.innerHTML = `<section class="panel"><h2>${Tx("Choose your name")}</h2><p class="small muted">${Tx("Your friends find you by this name.")}</p>
        <div class="cmtform"><input id="myName" maxlength="40" aria-label="${Tx("Choose your name")}"><button type="button" class="btn primary" id="myNameSave">${Tx("Save")}</button></div></section>`;
      $("myNameSave").onclick = async () => {
        const v = $("myName").value.trim(); if (v.length < 2) return;
        await CLOUD.api("profiles?on_conflict=user_id", { method: "POST", prefer: "resolution=merge-duplicates,return=minimal", body: [{ user_id: me.id, display_name: v, updated_at: new Date().toISOString() }] });
        await loadPeople(); renderSide(); renderFeed();
      };
      return;
    }
    const incoming = friendships.filter((f) => f.status === "pending" && f.addressee === me.id);
    const outgoing = friendships.filter((f) => f.status === "pending" && f.requester === me.id);
    const friends = friendIds().sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
    const vis = myProfile.default_visibility || "private";
    const visKey = vis === "group" && myProfile.default_group_id ? `group:${myProfile.default_group_id}`
      : vis === "coaches" && myProfile.default_coach_group_id ? `cgroup:${myProfile.default_coach_group_id}`
      : vis === "coaches" && myProfile.default_coach_email ? `coach:${myProfile.default_coach_email}` : vis;
    const coachName = (e) => (e || "").split("@")[0];
    const av = (id) => `<span class="av">${esc(nameOf(id)[0]?.toUpperCase() || "?")}</span>`;
    el.innerHTML = `<section class="panel stack" aria-labelledby="hFriends"><div class="row between"><h2 id="hFriends" style="margin:0">${Tx("Friends")}</h2><span class="small muted">${friends.length}</span></div>
        <span class="search"><i class="ic i-search"></i><input type="search" id="findPeople" placeholder="${Tx("Find people by name")}" aria-label="${Tx("Add a friend")}" autocomplete="off"></span>
        <div id="found">${searchRes ? (searchRes.length ? `<div class="list tight">${searchRes.map((p) => {
          const rel = friendships.find((f) => [f.requester, f.addressee].includes(p.user_id));
          return `<div class="list-row flat"><span class="av sm">${esc(p.display_name[0]?.toUpperCase() || "?")}</span><span class="t"><span>${esc(p.display_name)}</span></span>${rel ? `<span class="small muted">${Tx(rel.status === "accepted" ? "Friends" : "Requested")}</span>` : `<button type="button" class="btn small" data-ask="${p.user_id}"><i class="ic i-user-plus"></i>${Tx("Invite")}</button>`}</div>`;
        }).join("")}</div>` : `<p class="small muted">${Tx("No one found with that name.")}</p>`) : ""}</div>
        ${incoming.length ? `<h3>${Tx("Requests")} <span class="count">${incoming.length}</span></h3>${incoming.map((f) => `<div class="list-row on-field">${av(f.requester)}<span class="t"><span>${esc(nameOf(f.requester))}</span><span class="meta">${Tx("Wants to be your friend")}</span></span>
          <span class="row"><button type="button" class="btn ghost small" data-decline="${f.requester}|${f.addressee}">${Tx("Decline")}</button><button type="button" class="btn small" data-accept="${f.requester}">${Tx("Accept")}</button></span></div>`).join("")}` : ""}
        ${outgoing.map((f) => `<div class="list-row flat">${av(f.addressee)}<span class="t"><span>${esc(nameOf(f.addressee))}</span><span class="meta">${esc(Tx("Waiting for {name}", { name: nameOf(f.addressee) }))}</span></span><button type="button" class="btn ghost small" data-decline="${f.requester}|${f.addressee}">${Tx("Cancel")}</button></div>`).join("")}
        ${friends.length ? `<div class="list tight divided">${friends.map((id) => `<div class="list-row flat">${av(id)}<span class="t"><span>${esc(nameOf(id))}</span></span><button type="button" class="btn ghost small" data-unfriend="${id}">${Tx("Remove")}</button></div>`).join("")}</div>`
          : !incoming.length && !outgoing.length ? `<p class="small muted" style="margin:0">${Tx("No friends yet. Search for people above.")}</p>` : ""}
      </section>
      <section class="panel stack" aria-labelledby="hPriv"><h2 id="hPriv" style="margin:0">${Tx("Privacy")}</h2>
        <label class="field">${Tx("Who sees my new games")}<select id="defVis">${[["private", Tx("Only me")], ["coaches", Tx("All my coaches")],
            ...(coachCols && myCoaches.length > 1 ? myCoaches.map((c) => [`coach:${c}`, Tx("Coach: {name}", { name: coachName(c) })]) : []),
            ...(coachCols ? coachGroups.map((g) => [`cgroup:${g.id}`, Tx("Coach group: {name}", { name: g.name })]) : []),
            ["friends", Tx("Friends ")], ...groups.map((g) => [`group:${g.id}`, Tx("Group: {name}", { name: g.name })]), ["public", Tx("Everyone")]]
          .map(([k, l]) => `<option value="${esc(k)}" ${k === visKey ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></label>
        ${vis !== "private" && myGameCount ? `<button type="button" class="btn small" id="applyOld">${esc(myGameCount === 1 ? Tx("Apply to my older game too") : Tx("Apply to my {n} older games too", { n: myGameCount }))}</button>` : ""}
        <p class="small muted" id="visMsg" style="margin:0">${Tx("Opponents' names are never shown to others. Coaches see the games shared with them. You can change it game by game in the review.")}</p></section>
      <section class="panel stack" aria-labelledby="hGroups"><h2 id="hGroups" style="margin:0">${Tx("Friend groups")}</h2>
        ${groups.length ? groups.map((g) => `<details class="card inset"><summary class="row between"><span>${esc(g.name)}</span><span class="small muted">${(g.friend_group_members || []).length} ${Tx("people")}</span></summary>
          <div class="stack" style="margin-top:var(--sp-2)">${friends.length ? friends.map((id) => `<label class="check"><input type="checkbox" data-gm="${g.id}|${id}" ${(g.friend_group_members || []).some((m) => m.member === id) ? "checked" : ""}>${esc(nameOf(id))}</label>`).join("") : `<p class="small muted">${Tx("Add friends first.")}</p>`}
          <button type="button" class="btn ghost small danger-text" data-delgroup="${g.id}">${Tx("Delete group")}</button></div></details>`).join("")
          : `<p class="small muted" style="margin:0">${Tx("No groups yet. A group lets you share games with only some friends.")}</p>`}
        <div class="cmtform"><input id="newGroup" maxlength="40" placeholder="${Tx("New group name")}" aria-label="${Tx("New group name")}"><button type="button" class="btn" id="addGroup">${Tx("Create")}</button></div></section>
      ${coachCols ? `<section class="panel stack" aria-labelledby="hCGroups"><h2 id="hCGroups" style="margin:0">${Tx("Coach groups")}</h2>
        ${coachGroups.length ? coachGroups.map((g) => `<details class="card inset"><summary class="row between"><span>${esc(g.name)}</span><span class="small muted">${(g.emails || []).length}</span></summary>
          <div class="stack" style="margin-top:var(--sp-2)">${myCoaches.length ? myCoaches.map((c) => `<label class="check"><input type="checkbox" data-cgm="${g.id}|${esc(c)}" ${(g.emails || []).includes(c) ? "checked" : ""}>${esc(coachName(c))}</label>`).join("") : `<p class="small muted">${Tx("Add coaches first, in Coach Review.")}</p>`}
          <button type="button" class="btn ghost small" data-delcgroup="${g.id}">${Tx("Delete group")}</button></div></details>`).join("")
          : `<p class="small muted" style="margin:0">${Tx("No coach groups yet. A coach group lets you share games with only some of your coaches.")}</p>`}
        <div class="cmtform"><input id="newCGroup" maxlength="40" placeholder="${Tx("New group name")}" aria-label="${Tx("New group name")}"><button type="button" class="btn" id="addCGroup">${Tx("Create")}</button></div></section>` : ""}`;
    let t;
    $("findPeople").addEventListener("input", (e) => {
      clearTimeout(t);
      const q = e.target.value.trim();
      t = setTimeout(async () => {
        if (q.length < 2) { searchRes = null; renderSide(); return; }
        const res = await CLOUD.api(`profiles?display_name=ilike.*${enc(q.replace(/[*%,()]/g, " "))}*&user_id=neq.${me.id}&select=user_id,display_name&limit=10`).catch(() => []);
        searchRes = res || []; renderSide();
        const inp = $("findPeople"); inp.value = q; inp.focus();
      }, 300);
    });
    const act = async (fn) => { try { await fn(); } finally { await loadPeople(); await loadPosts(); renderSide(); renderFeed(); } };
    el.querySelectorAll("[data-ask]").forEach((b) => b.onclick = () => act(() => CLOUD.api("friendships", { method: "POST", prefer: "return=minimal", body: { addressee: b.dataset.ask } })));
    el.querySelectorAll("[data-accept]").forEach((b) => b.onclick = () => act(() => CLOUD.api(`friendships?requester=eq.${b.dataset.accept}&addressee=eq.${me.id}`, { method: "PATCH", prefer: "return=minimal", body: { status: "accepted", accepted_at: new Date().toISOString() } })));
    el.querySelectorAll("[data-decline]").forEach((b) => b.onclick = () => { const [r, a] = b.dataset.decline.split("|"); act(() => CLOUD.api(`friendships?requester=eq.${r}&addressee=eq.${a}`, { method: "DELETE" })); });
    el.querySelectorAll("[data-unfriend]").forEach((b) => b.onclick = () => confirmBtn(b, "Confirm removal", () => {
      const f = friendships.find((x) => [x.requester, x.addressee].includes(b.dataset.unfriend));
      act(() => CLOUD.api(`friendships?requester=eq.${f.requester}&addressee=eq.${f.addressee}`, { method: "DELETE" }));
    }));
    $("defVis").onchange = (e) => { const v = e.target.value; act(() => CLOUD.api(`profiles?user_id=eq.${me.id}`, { method: "PATCH", prefer: "return=minimal",
      body: { ...(v.startsWith("group:") ? { default_visibility: "group", default_group_id: v.slice(6) }
        : v.startsWith("coach:") ? { default_visibility: "coaches", default_group_id: null, default_coach_email: v.slice(6), default_coach_group_id: null }
        : v.startsWith("cgroup:") ? { default_visibility: "coaches", default_group_id: null, default_coach_email: null, default_coach_group_id: v.slice(7) }
        : { default_visibility: v, default_group_id: null }), ...(coachCols && !v.includes(":") ? { default_coach_email: null, default_coach_group_id: null } : {}) } })); };
    $("addCGroup")?.addEventListener("click", () => { const n = $("newCGroup").value.trim(); if (n) act(() => CLOUD.api("coach_groups", { method: "POST", prefer: "return=minimal", body: { name: n } })); });
    el.querySelectorAll("[data-cgm]").forEach((c) => c.onchange = () => { const [g, e] = [c.dataset.cgm.slice(0, 36), c.dataset.cgm.slice(37)];
      const grp = coachGroups.find((x) => x.id === g); const emails = new Set(grp?.emails || []); c.checked ? emails.add(e) : emails.delete(e);
      act(() => CLOUD.api(`coach_groups?id=eq.${g}`, { method: "PATCH", prefer: "return=minimal", body: { emails: [...emails] } })); });
    el.querySelectorAll("[data-delcgroup]").forEach((b) => b.onclick = () => confirmBtn(b, "Confirm delete", () => act(() => CLOUD.api(`coach_groups?id=eq.${b.dataset.delcgroup}`, { method: "DELETE" }))));
    $("addGroup").onclick = () => { const n = $("newGroup").value.trim(); if (n) act(() => CLOUD.api("friend_groups", { method: "POST", prefer: "return=minimal", body: { name: n } })); };
    el.querySelectorAll("[data-gm]").forEach((c) => c.onchange = () => { const [g, m] = c.dataset.gm.split("|");
      act(() => (c.checked ? CLOUD.api("friend_group_members", { method: "POST", prefer: "return=minimal", body: { group_id: g, member: m } })
        : CLOUD.api(`friend_group_members?group_id=eq.${g}&member=eq.${m}`, { method: "DELETE" }))); });
    el.querySelectorAll("[data-delgroup]").forEach((b) => b.onclick = () => confirmBtn(b, "Confirm delete", () => act(() => CLOUD.api(`friend_groups?id=eq.${b.dataset.delgroup}`, { method: "DELETE" }))));
    $("applyOld")?.addEventListener("click", async () => {
      $("visMsg").textContent = Tx("Applying…");
      await act(() => CLOUD.api(`game_logs?user_id=eq.${me.id}&visibility=eq.private`, { method: "PATCH", prefer: "return=minimal", body: vis === "group" ? { visibility: "group", group_id: myProfile.default_group_id }
        : vis === "coaches" && coachCols ? { visibility: "coaches", coach_email: myProfile.default_coach_email || null, coach_group_id: myProfile.default_coach_group_id || null } : { visibility: vis } }));
      $("visMsg").textContent = Tx("Done.");
    });
  }

  // ---------- feed ----------
  function audienceTag(r) {
    if (r.visibility === "group") { const own = groups.find((g) => g.id === r.group_id); return own ? Tx("Group: {name}", { name: own.name }) : otherGroups.has(r.group_id) ? Tx("Group: {name}", { name: otherGroups.get(r.group_id) }) : Tx("group"); }
    return Tx(r.visibility === "coaches" ? "coaches" : r.visibility);   // a coach-only game shows up here only for its owner
  }
  const inks2 = (s) => `<span class="inks">${String(s || "").split(/[\/,]\s*/).filter(Boolean).slice(0, 2).map((c) => `<i data-ink="${esc(c.trim().toLowerCase())}"></i>`).join("")}</span>`;
  function postHtml(r) {
    const s = r.summary || {}, win = s.result === "win", key = `${r.user_id}|${r.game_id}`, cm = notes.get(key) || [];
    const who = nameOf(r.user_id), first = s.went_first === true ? Tx("went first") : s.went_first === false ? Tx("went second") : "";
    const myDeck = s.my_deck && s.my_deck !== "Physical game" ? s.my_deck : "", opp = s.opp_deck && s.opp_deck !== "Unknown" ? s.opp_deck : "";
    const meta = [ago(r.played_at), s.turns ? Tx("{n} turns", { n: s.turns }) : "", first, Tx(r.source === "duels_ink" ? "duels.ink" : r.source === "lore_counter" ? "Lore Counter" : r.source), audienceTag(r)].filter(Boolean).join(" · ");
    return `<article class="card post" data-key="${esc(key)}">
      <div class="who"><span class="av">${esc(who[0]?.toUpperCase() || "?")}</span><div><b>${esc(who)}</b><div class="small">${esc(meta)}</div></div></div>
      <div class="res"><span class="word ${win ? "win" : "loss"}">${Tx(win ? "Won" : "Lost")}</span><span class="score">${esc(s.my_lore ?? 0)}–${esc(s.opp_lore ?? 0)}</span></div>
      ${myDeck || opp ? `<p class="match">${myDeck ? `${inks2(s.my_inks || myDeck)}<b>${esc(myDeck)}</b>` : ""}${opp ? ` ${Tx("against")} ${inks2(s.opp_inks || opp)}<b>${esc(opp)}</b>` : ""}</p>` : ""}
      ${cm.slice(-3).map((n) => { const a = nameOf(n.author) === Tx("A player") ? n.author_name || Tx("Someone") : nameOf(n.author); return `<div class="comment"><span class="av sm">${esc(a[0]?.toUpperCase() || "?")}</span><span class="muted"><b>${esc(a)}</b> <span data-body="${esc(n.id)}"></span></span></div>`; }).join("")}
      <div class="cmtform" data-form="${esc(key)}" hidden><input maxlength="1000" placeholder="${Tx("Write a comment")}" aria-label="${Tx("Write a comment")}"><button type="button" class="btn" data-send="${esc(key)}"><i class="ic i-send"></i>${Tx("Send")}</button></div>
      <div class="acts"><a class="btn ghost small" href="../coach/?player=${enc(r.user_id)}&game=${enc(r.game_id)}"><i class="ic i-eye"></i>${Tx("Open game")}</a><button type="button" class="btn ghost small" data-cmt="${esc(key)}"><i class="ic i-comment"></i>${Tx("Comment")}${cm.length ? ` · ${cm.length}` : ""}</button></div>
    </article>`;
  }
  function renderFeed() {
    const el = $("feed");
    if (!me || !myProfile) { if (me) el.innerHTML = ""; return; }
    el.innerHTML = posts.length ? posts.map(postHtml).join("") + (moreAvailable ? `<div class="older"><button type="button" class="btn" id="older">${Tx("Show older games")}</button></div>` : "")
      : `<div class="empty"><img src="../ui/assets/empty/feed.svg" alt=""><b>${Tx("Your timeline is empty")}</b><p>${Tx("Add friends to see their games here. Your games also show up for whoever you choose.")}</p>
          <button type="button" class="btn primary" id="addFriends"><i class="ic i-user-plus"></i>${Tx("Add friends")}</button></div>`;
    $("addFriends")?.addEventListener("click", () => { if (phone()) $("openFriends").click(); else $("findPeople")?.focus(); });
    const byId = new Map([...notes.values()].flat().map((n) => [n.id, n]));
    el.querySelectorAll("[data-body]").forEach((s) => { s.textContent = byId.get(s.dataset.body)?.body || ""; });   // other people's text: set as text
    el.querySelectorAll("[data-cmt]").forEach((b) => b.onclick = () => { const f = el.querySelector(`[data-form="${CSS.escape(b.dataset.cmt)}"]`); f.hidden = !f.hidden; f.querySelector("input").focus(); });
    el.querySelectorAll("[data-send]").forEach((b) => {
      const form = b.parentElement, input = form.querySelector("input");
      const send = async () => {
        const text = input.value.trim(); if (!text) return;
        const [owner, game] = b.dataset.send.split("|");
        b.disabled = true;
        try {
          await CLOUD.api("game_notes", { method: "POST", prefer: "return=minimal", body: { owner_id: owner, game_id: game, anchor: { kind: "game" }, body: text, author_name: (myProfile?.display_name || "").slice(0, 60) } });
          notes.delete(b.dataset.send); await loadPosts(); renderFeed();
        } catch { b.disabled = false; input.placeholder = Tx("Couldn't send. Try again."); }
      };
      b.onclick = send;
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); send(); } });
    });
    $("older")?.addEventListener("click", async () => { await loadPosts(true); renderFeed(); });
  }

  // ---------- boot ----------
  if (!me) {
    $("feed").innerHTML = `<div class="empty"><img src="../ui/assets/empty/signedout.svg" alt=""><b>${Tx("Sign in to see your friends' games")}</b><p>${Tx("Use your e-mail. We send a 6-digit code, no password.")}</p><button type="button" class="btn primary" id="signIn">${Tx("Sign in")}</button></div>`;
    $("signIn").onclick = () => window.INKWELL_SIGNIN?.();
    return;
  }
  if (location.hash === "#amigos") setTimeout(() => { if (phone()) $("openFriends").click(); else $("findPeople")?.focus(); }, 0);
  $("feed").innerHTML = `<span class="skel" style="height:150px;border-radius:var(--r-lg)"></span><span class="skel" style="height:150px;border-radius:var(--r-lg)"></span><p class="sr-only">${Tx("Loading…")}</p>`;
  const go = async () => {
    try { await loadPeople(); await loadPosts(); renderSide(); renderFeed(); if (location.hash === "#amigos") { if (phone()) $("openFriends").click(); else $("findPeople")?.focus(); } }
    catch { $("feed").innerHTML = `<div class="empty"><img src="../ui/assets/empty/error.svg" alt=""><b>${Tx("Couldn't load the timeline.")}</b><p>${Tx("Check your connection and try again.")}</p><button type="button" class="btn" id="retry"><i class="ic i-refresh"></i>${Tx("Try again")}</button></div>`; $("retry").onclick = go; }
  };
  go();
  document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible" && myProfile && !$("friendsSheet").open) { try { await loadPeople(); await loadPosts(); renderSide(); renderFeed(); } catch { /* keep what's shown */ } } });
})();
</script>

<script>window.INKWELL_SHELL = {"page": "feed"};
/* Inkwell site shell (design v2, Noite): app bar, phone tab bar, account menu and the one sign-in sheet.
   Markup and classes follow packages/ui/tokens.css (§4 Shell, §11 Sheet); see DESIGN-CHANGES.md.
   Pages set window.INKWELL_SHELL = { page: "feed" | "cards" | "decks" | "coach" | "trades" } and may call:
     window.INKWELL_SIGNIN()            open the sign-in sheet
     window.INKWELL_SHELL_BADGE(n)      set the Trocas count (requests waiting for me)
   Sign-in uses window.INKWELL_CLOUD (cloud.js): one session for the whole site. */
(() => {
  "use strict";
  let lang = "pt";
  try { lang = localStorage.getItem("inkwell-lang") || ((navigator.language || "pt").toLowerCase().startsWith("en") ? "en" : "pt"); } catch { /* */ }
  const pt = lang === "pt";
  const T = (p, e) => (pt ? p : e);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const page = (window.INKWELL_SHELL || {}).page || "";
  const UI = "../ui/";
  const CLOUD = window.INKWELL_CLOUD;
  const me = CLOUD?.user();
  const NAV = [
    ["feed", "../feed/", T("Início", "Home"), "home"],
    ["cards", "../colecao/", T("Coleção", "Collection"), "cards"],
    ["decks", "../decks/", "Decks", "decks"],
    ["coach", "../coach/", T("Jogos", "Games"), "games"],
    ["trades", "../trades/", T("Trocas", "Trades"), "trades"],
  ];
  const cur = (k) => (k === page ? ' aria-current="page"' : "");

  const bar = document.createElement("header");
  bar.className = "appbar";
  bar.innerHTML = `<div class="appbar-in"><a class="brand" href="../feed/"><img src="${UI}assets/logo-mark.svg" alt="">Inkwell</a>
    <nav class="sections" aria-label="${T("Seções", "Sections")}">${NAV.map(([k, href, label, ic]) => `<a href="${href}"${cur(k)} data-iw="${k}"><i class="ic i-${ic}"></i>${label}</a>`).join("")}</nav>
    <div class="end">
      <a class="btn ghost counter-btn" href="../counter/" aria-label="${T("Abrir o Contador", "Open the Counter")}"><i class="ic i-counter"></i><span>${T("Contador", "Counter")}</span></a>
      ${me ? `<button type="button" class="av-btn" id="iwAcct" aria-label="${T("Sua conta", "Your account")}" aria-haspopup="menu" aria-expanded="false"><span class="av" id="iwAv">${esc((me.email || "?")[0].toUpperCase())}</span></button>`
        : `<button type="button" class="btn ghost icon" id="iwLangBtn" aria-label="${T("Aparência e idioma", "Appearance and language")}" aria-haspopup="menu" aria-expanded="false"><i class="ic i-globe"></i></button>
           <button type="button" class="btn small" id="iwSignIn">${T("Entrar", "Sign in")}</button>`}
    </div></div>`;
  document.body.prepend(bar);
  const tabs = document.createElement("nav");
  tabs.className = "tabbar";
  tabs.setAttribute("aria-label", T("Seções", "Sections"));
  tabs.innerHTML = NAV.map(([k, href, label, ic]) => `<a href="${href}"${cur(k)} data-iw="${k}"><i class="pip"><i class="ic i-${ic}"></i></i>${label}${k === "trades" ? '<span class="count" id="iwTradesCount" hidden></span>' : ""}</a>`).join("");
  document.body.append(tabs);
  document.body.classList.add("iw-has-shell");

  // ---------- menus ----------
  const end = bar.querySelector(".end");
  let menu = null, opener = null;
  const closeMenu = () => { if (!menu) return; menu.remove(); menu = null; opener?.setAttribute("aria-expanded", "false"); opener?.focus(); opener = null; };
  function openMenu(btn, html, cls = "") {
    if (menu) { const same = opener === btn; closeMenu(); if (same) return; }
    opener = btn; btn.setAttribute("aria-expanded", "true");
    menu = document.createElement("div");
    menu.className = `menu ${cls}`; menu.setAttribute("role", "menu");
    menu.innerHTML = html;
    end.append(menu);
    menu.querySelector("[role^=menuitem], button")?.focus();
    menu.querySelectorAll("[data-lang-pick]").forEach((b) => b.addEventListener("click", () => {
      if (b.dataset.langPick !== lang) { try { localStorage.setItem("inkwell-lang", b.dataset.langPick); } catch { /* */ } location.reload(); }
    }));
    menu.querySelector("[data-signout]")?.addEventListener("click", () => { CLOUD?.signOut(); location.reload(); });
  }
  document.addEventListener("click", (e) => { if (menu && !menu.contains(e.target) && !opener?.contains(e.target)) closeMenu(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeMenu();
    if (menu && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
      const items = [...menu.querySelectorAll("[role^=menuitem], .seg button")];
      const i = items.indexOf(document.activeElement);
      items[(i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length]?.focus(); e.preventDefault();
    }
  });
  const langSeg = () => `<div class="menu-label">${T("Idioma", "Language")}</div>
    <div class="seg block" role="group" aria-label="${T("Idioma", "Language")}">${[["pt", "Português"], ["en", "English"]].map(([k, l]) => `<button type="button" data-lang-pick="${k}" aria-pressed="${k === lang}">${l}</button>`).join("")}</div>`;
  let profileName = "", syncAgo = "";
  $("iwAcct")?.addEventListener("click", (e) => openMenu(e.currentTarget, `
    <div class="menu-head"><span class="av lg">${esc((profileName || me.email || "?")[0].toUpperCase())}</span><div class="t"><b>${esc(profileName || T("Sua conta", "Your account"))}</b><div class="small">${esc(me.email || "")}</div></div></div>
    <div class="menu-sep"></div>
    <a class="menu-item" role="menuitem" href="../feed/#amigos"><i class="ic i-shield"></i>${T("Privacidade e amigos", "Privacy and friends")}</a>
    <a class="menu-item" role="menuitem" href="../coach/"><i class="ic i-refresh"></i>${T("Jogos do duels.ink", "duels.ink games")}${syncAgo ? `<span class="trail">${esc(syncAgo)}</span>` : ""}</a>
    ${langSeg()}
    <div class="menu-sep"></div>
    <button type="button" class="menu-item" role="menuitem" data-signout><i class="ic i-logout"></i>${T("Sair", "Sign out")}</button>`));
  $("iwLangBtn")?.addEventListener("click", (e) => openMenu(e.currentTarget, `<div class="menu-label">${T("Idioma", "Language")}</div>
    ${[["pt", "Português"], ["en", "English"]].map(([k, l]) => `<button type="button" class="menu-item" role="menuitemradio" aria-checked="${k === lang}" data-lang-pick="${k}">${l}${k === lang ? '<i class="ic i-check" style="margin-left:auto;color:var(--text)"></i>' : ""}</button>`).join("")}
    <div class="menu-sep"></div><div class="menu-label">${T("Tema: Noite", "Theme: Night")}</div>`, "sm"));
  function $(id) { return document.getElementById(id); }

  // ---------- sign-in sheet: e-mail → 6-digit code (or the link in the e-mail) ----------
  const sheet = document.createElement("dialog");
  sheet.className = "sheet"; sheet.id = "iwSignSheet"; sheet.setAttribute("aria-labelledby", "iwSiT");
  document.body.append(sheet);
  let email = "", trigger = null;
  function stepEmail(msg = "") {
    sheet.innerHTML = `<div class="grab"></div>
      <div class="sheet-head"><div><h2 id="iwSiT">${T("Entrar no Inkwell", "Sign in to Inkwell")}</h2><div class="sub">${T("Sem senha. Mandamos um código.", "No password. We e-mail you a code.")}</div></div>
        <button type="button" class="btn ghost icon" data-close aria-label="${T("Fechar", "Close")}"><i class="ic i-close"></i></button></div>
      <div class="sheet-body"><form class="form" id="iwSiForm" novalidate>
        <label class="field">${T("E-mail", "E-mail")}<input id="iwSiEmail" type="email" inputmode="email" autocomplete="email" placeholder="voce@exemplo.com" value="${esc(email)}" required></label>
        <p class="small muted">${T("Se for a primeira vez, sua conta é criada agora. Seus jogos ficam salvos e só você decide quem vê.", "If it's your first time, your account is created now. Your games are saved and only you decide who sees them.")}</p>
        <p class="small" id="iwSiMsg" role="alert">${esc(msg)}</p>
      </form></div>
      <div class="sheet-foot"><button type="button" class="btn ghost" data-close>${T("Cancelar", "Cancel")}</button><button type="submit" form="iwSiForm" class="btn primary" id="iwSiSend">${T("Enviar código", "Send code")}</button></div>`;
    wireClose();
    $("iwSiForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      email = $("iwSiEmail").value.trim();
      if (!/^\S+@\S+\.\S+$/.test(email)) { $("iwSiMsg").textContent = T("Digite seu e-mail.", "Enter your e-mail."); return; }
      const b = $("iwSiSend"); b.setAttribute("aria-busy", "true"); b.disabled = true;
      try { await CLOUD.requestCode(email); stepCode(); }
      catch { b.removeAttribute("aria-busy"); b.disabled = false; $("iwSiMsg").textContent = T("Não foi possível enviar o e-mail. Confira o endereço e a internet.", "Couldn't send the e-mail. Check the address and your connection."); }
    });
    setTimeout(() => $("iwSiEmail")?.focus(), 30);
  }
  function stepCode(msg = "") {
    sheet.innerHTML = `<div class="grab"></div>
      <div class="sheet-head"><div><h2 id="iwSiT">${T("Digite o código", "Enter the code")}</h2><div class="sub">${esc(T("Enviado para ", "Sent to ") + email)}</div></div>
        <button type="button" class="btn ghost icon" data-close aria-label="${T("Fechar", "Close")}"><i class="ic i-close"></i></button></div>
      <div class="sheet-body"><form class="form" id="iwSiForm" novalidate>
        <fieldset class="field"><legend>${T("Código de 6 dígitos", "6-digit code")}</legend>
          <div class="otp">${[1, 2, 3, 4, 5, 6].map((i) => `<input inputmode="numeric" autocomplete="${i === 1 ? "one-time-code" : "off"}" aria-label="${T("Dígito", "Digit")} ${i}">`).join("")}</div>
          <span class="hint">${T("Também pode abrir o link do e-mail neste aparelho. Confira o spam.", "You can also open the link in the e-mail on this device. Check spam too.")}</span>
        </fieldset>
        <p class="small" id="iwSiMsg" role="alert">${esc(msg)}</p>
        <div class="row between small"><button type="button" class="linkbtn" id="iwSiBack">${T("Trocar e-mail", "Change e-mail")}</button></div>
      </form></div>
      <div class="sheet-foot"><button type="button" class="btn ghost" id="iwSiBack2">${T("Voltar", "Back")}</button><button type="submit" form="iwSiForm" class="btn primary" id="iwSiIn" disabled>${T("Entrar", "Sign in")}</button></div>`;
    wireClose();
    const boxes = [...sheet.querySelectorAll(".otp input")];
    const code = () => boxes.map((b) => b.value).join("");
    const sync = () => { boxes.forEach((b) => b.classList.toggle("filled", !!b.value)); $("iwSiIn").disabled = code().length !== 6; };
    boxes.forEach((b, i) => {
      b.addEventListener("input", () => {
        const d = b.value.replace(/\D/g, "");
        if (d.length > 1) { d.slice(0, 6).split("").forEach((c, j) => { if (boxes[j]) boxes[j].value = c; }); boxes[Math.min(5, d.length - 1)].focus(); }
        else { b.value = d; if (d && boxes[i + 1]) boxes[i + 1].focus(); }
        sync();
        if (code().length === 6) $("iwSiForm").requestSubmit();
      });
      b.addEventListener("keydown", (e) => { if (e.key === "Backspace" && !b.value && boxes[i - 1]) boxes[i - 1].focus(); });
    });
    const back = () => stepEmail();
    $("iwSiBack").onclick = back; $("iwSiBack2").onclick = back;
    $("iwSiForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const b = $("iwSiIn"); b.setAttribute("aria-busy", "true"); b.disabled = true;
      try { await CLOUD.verify(email, code()); location.reload(); }
      catch { boxes.forEach((x) => { x.value = ""; x.classList.add("err"); }); boxes[0].focus(); b.removeAttribute("aria-busy"); sync(); $("iwSiMsg").textContent = T("Código errado ou expirado. Tente de novo.", "Wrong or expired code. Try again."); }
    });
    setTimeout(() => boxes[0].focus(), 30);
  }
  function wireClose() { sheet.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => sheet.close())); }
  sheet.addEventListener("close", () => { trigger?.focus?.(); trigger = null; });
  sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.close(); });   // tap on the backdrop
  window.INKWELL_SIGNIN = () => {
    if (!CLOUD) return;
    trigger = document.activeElement;
    stepEmail();
    if (!sheet.open) sheet.showModal();
  };
  $("iwSignIn")?.addEventListener("click", () => window.INKWELL_SIGNIN());

  // ---------- Trocas count, name, last duels.ink sync (best effort) ----------
  window.INKWELL_SHELL_BADGE = (n) => {
    const c = $("iwTradesCount"); if (!c) return;
    c.hidden = !n; c.textContent = n > 9 ? "9+" : String(n || "");
    const a = c.closest("a"); if (a) a.setAttribute("aria-label", `${T("Trocas", "Trades")}${n ? ` · ${n} ${T("aguardando você", "waiting for you")}` : ""}`);
  };
  if (me && CLOUD) {
    CLOUD.api(`profiles?user_id=eq.${me.id}&select=display_name`).then((r) => {
      profileName = r?.[0]?.display_name || "";
      if (profileName) $("iwAv").textContent = profileName.trim()[0].toUpperCase();
    }).catch(() => {});
    Promise.all([
      CLOUD.api(`user_loans?select=id&status=eq.requested&created_by=neq.${me.id}`).catch(() => []),
      CLOUD.api(`user_trades?select=id&status=eq.proposed&partner=eq.${me.id}`).catch(() => []),
    ]).then(([a, b]) => { if (page !== "trades") window.INKWELL_SHELL_BADGE((a || []).length + (b || []).length); });
    CLOUD.api("rpc/my_duels_sync", { method: "POST", body: {} }).then((r) => {
      const t = Date.parse(r?.[0]?.last_run_at); if (!t) return;
      const m = Math.max(0, Math.round((Date.now() - t) / 60000));
      syncAgo = m < 1 ? T("agora", "now") : m < 60 ? T(`há ${m} min`, `${m} min ago`) : T(`há ${Math.round(m / 60)} h`, `${Math.round(m / 60)} h ago`);
    }).catch(() => {});
  }
})();
</script>
</body>
</html>
