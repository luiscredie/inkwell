   Pages keep using --night, --panel, --raised, --line, --text, --muted, --faint, --gold, --gold-ink,
   --win, --loss, --opp, --font; a theme only redefines them. */

/* ---------- 1. Noite: the Inkwell night, refined ---------- */
html[data-theme="noite"] {
  --night: #13102a; --panel: #1e1a3b; --raised: #2a2552; --line: #352f60;
  --text: #f5f1fb; --muted: #aaa3cc; --faint: #7f78a8;
  --gold: #ecc061; --gold-ink: #241a04; --win: #6fd3a3; --loss: #f38b8b; --opp: #9aaeff;
  --font: "Bricolage Grotesque", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --display: "Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --radius: 16px; --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 8px 24px rgba(5,3,20,.35);
  --bar: rgba(19,16,42,.82); --bg-art: radial-gradient(1200px 500px at 85% -10%, rgba(236,192,97,.10), transparent 60%), radial-gradient(900px 500px at -10% 10%, rgba(155,106,209,.16), transparent 60%);
  color-scheme: dark;
}
/* ---------- 2. Pergaminho: light, Disney-minimal storybook ---------- */
html[data-theme="pergaminho"] {
  --night: #f6f1e6; --panel: #fffdf8; --raised: #f0e8d8; --line: #e3d8c3;
  --text: #1d2042; --muted: #5f6080; --faint: #8b8aa3;
  --gold: #8a5f12; --gold-ink: #ffffff; --win: #1f7a50; --loss: #b23a3a; --opp: #3552b5;
  --font: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --radius: 18px; --shadow: 0 1px 2px rgba(60,45,20,.06), 0 10px 28px rgba(60,45,20,.08);
  --bar: rgba(246,241,230,.86); --bg-art: radial-gradient(1000px 420px at 100% -10%, rgba(201,154,58,.14), transparent 60%), radial-gradient(800px 400px at -10% 0%, rgba(53,82,181,.07), transparent 60%);
  color-scheme: light;
}
/* ---------- 3. Tinta: high-contrast ink, vivid colours ---------- */
html[data-theme="tinta"] {
  --night: #0b0d12; --panel: #141821; --raised: #1c2230; --line: #262e3f;
  --text: #eef3fb; --muted: #9aa6bb; --faint: #6c7890;
  --gold: #5fd4ff; --gold-ink: #031822; --win: #4fe0a0; --loss: #ff7a8a; --opp: #c79bff;
  --font: "Outfit", "Segoe UI", system-ui, sans-serif;
  --display: "Outfit", system-ui, sans-serif;
  --radius: 12px; --shadow: 0 0 0 1px rgba(95,212,255,.04), 0 12px 30px rgba(0,0,0,.45);
  --bar: rgba(11,13,18,.85); --bg-art: linear-gradient(180deg, rgba(95,212,255,.06), transparent 320px);
  color-scheme: dark;
}

/* ---------- shared polish (all themes) ---------- */
html[data-theme] { background: var(--night); }
html[data-theme] body { background: var(--night) var(--bg-art) no-repeat fixed; color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
html[data-theme] h1, html[data-theme] h2 { font-family: var(--display); letter-spacing: -0.01em; }
html[data-theme="pergaminho"] h1 { font-weight: 600; }
html[data-theme] .panel, html[data-theme] .post, html[data-theme] .card { border-radius: var(--radius); box-shadow: var(--shadow); }
html[data-theme="pergaminho"] .panel, html[data-theme="pergaminho"] .post, html[data-theme="pergaminho"] .card { border: 1px solid var(--line); }
html[data-theme] .btn { border-radius: calc(var(--radius) - 6px); transition: transform .08s ease, filter .15s ease; }
html[data-theme] .btn:active { transform: translateY(1px); }
html[data-theme] .btn.primary:hover { filter: brightness(1.06); }
html[data-theme] input, html[data-theme] select, html[data-theme] textarea { border-radius: calc(var(--radius) - 6px); }
html[data-theme="pergaminho"] input, html[data-theme="pergaminho"] select, html[data-theme="pergaminho"] textarea { background: #fff; }
html[data-theme] :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------- app bar ---------- */
.iw-bar { position: sticky; top: 0; z-index: 40; backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);

.iw-theme > button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px; padding: 6px 10px; cursor: pointer; font: 600 0.85rem var(--font); }

.iw-pop { position: absolute; right: 0; top: calc(100% + 8px); width: 270px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 40px rgba(0,0,0,.3); padding: 8px; display: grid; gap: 6px; z-index: 60; }
.iw-pop[hidden] { display: none; }
.iw-pop p { margin: 4px 6px; font-size: 0.78rem; color: var(--muted); }

.iw-opt:hover { background: var(--raised); }
.iw-opt[aria-pressed="true"] { border-color: var(--gold); }
.iw-opt b { display: block; font-size: 0.9rem; } .iw-opt small { color: var(--muted); font-size: 0.75rem; line-height: 1.3; }
.iw-sw { height: 38px; border-radius: 8px; border: 1px solid rgba(128,128,128,.3); position: relative; overflow: hidden; }
.iw-sw::after { content: ""; position: absolute; left: 7px; right: 18px; bottom: 7px; height: 8px; border-radius: 4px; background: var(--sw-acc); }
.iw-sw[data-t="noite"] { background: #1e1a3b; --sw-acc: #ecc061; }
.iw-sw[data-t="pergaminho"] { background: #fffdf8; --sw-acc: #8a5f12; }
.iw-sw[data-t="tinta"] { background: #141821; --sw-acc: #5fd4ff; }

/* the shell replaces each page's own "← Home" links */
.iw-has-shell #homeLink, .iw-has-shell #nav, .iw-has-shell #langBtn { display: none !important; }
.iw-lang { display: flex; gap: 6px; margin: 2px 6px 4px; }

.iw-lang button[aria-pressed="true"] { color: var(--text); background: var(--raised); border-color: var(--gold); }

/* phones: tabs at the bottom, thumb-reachable (a separate element: the blurred bar would trap a fixed child) */

@media (max-width: 760px) {

    backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-top: 1px solid var(--line);

  .iw-tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.68rem; font-weight: 600; padding: 6px 2px; border-radius: 10px; flex: 1; min-width: 0;
    color: var(--muted); text-decoration: none; white-space: nowrap; }
  .iw-tabs a[aria-current="page"] { color: var(--gold); }

@media print { .iw-bar, .iw-tabs { display: none !important; } }

<script>window.INKWELL_CLOUD_CONFIG = {"url": "https://sorefaetiaebmjploanp.supabase.co", "key": "sb_publishable_RkAWW-ENz70CXA6_QV7aHw_MpfD7Gn2", "redirect": "https://luiscredie.github.io/inkwell/feed/"};
/* Inkwell Lore Counter: cloud adapter for the offline app.
 *
 * Talks to the Inkwell Supabase project with plain fetch (no library to cache):
 *   sign-in   email one-time code (or the magic link, when opened in the same browser)
 *   storage   public.game_logs, one row per game, upserted on (user_id, game_id),
 *             so a retry after a dropped connection never creates a duplicate
 * The counter keeps every match locally until send() resolves true.
 * Only the public URL and publishable key are here; row-level security limits each user to their own rows.
 */
window.INKWELL_CLOUD = (() => {
  const cfg = window.INKWELL_CLOUD_CONFIG || {};
  if (!cfg.url || !cfg.key) return null;
  const KEY = "inkwell-counter-auth";   // shared by the counter and Coach Review (same site, one sign-in)
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch { return null; } };
  let sess = load();
  const store = (x) => { sess = x; try { if (x) localStorage.setItem(KEY, JSON.stringify(x)); else localStorage.removeItem(KEY); } catch { /* private mode */ } };
  const headers = (tok) => ({ apikey: cfg.key, "Content-Type": "application/json", ...(tok ? { Authorization: `Bearer ${tok}` } : {}) });
  const claims = (jwt) => { try { return JSON.parse(atob(jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); } catch { return {}; } };
  const session = (r) => {
    const c = claims(r.access_token);
    return { access_token: r.access_token, refresh_token: r.refresh_token,
      expires_at: r.expires_at || c.exp || Math.floor(Date.now() / 1000) + (r.expires_in || 3600),
      user: { id: r.user?.id || c.sub, email: r.user?.email || c.email } };
  };

  // Magic link opened in this same browser: tokens arrive in the URL fragment.
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("access_token") && h.get("refresh_token")) {
    store(session({ access_token: h.get("access_token"), refresh_token: h.get("refresh_token"), expires_in: +h.get("expires_in") || 3600 }));
    history.replaceState(null, "", location.pathname + location.search);
  }

  async function token() {
    if (!sess) return null;
    if (sess.expires_at - 60 > Date.now() / 1000) return sess.access_token;
    const r = await fetch(`${cfg.url}/auth/v1/token?grant_type=refresh_token`, { method: "POST", headers: headers(), body: JSON.stringify({ refresh_token: sess.refresh_token }) });
    if (r.status === 400 || r.status === 401) { store(null); return null; }   // signed out elsewhere or refresh token reused
    if (!r.ok) throw new Error(`refresh ${r.status}`);
    store(session(await r.json()));
    return sess.access_token;
  }

  // Authenticated call to the database's REST API (used by Coach Review). Errors carry a short code.
  async function api(path, { method = "GET", body, prefer } = {}) {
    const tok = await token();
    if (!tok) throw Object.assign(new Error("signed out"), { code: "auth" });
    const r = await fetch(`${cfg.url}/rest/v1/${path}`, {
      method, headers: { ...headers(tok), ...(prefer ? { Prefer: prefer } : {}) }, body: body === undefined ? undefined : JSON.stringify(body) });
    if (r.status === 401) store({ ...sess, expires_at: 0 });
    if (!r.ok) {
      const code = r.status === 401 || r.status === 403 ? "permission" : r.status === 400 || r.status === 409 || r.status === 413 ? "invalid_argument" : "unavailable";
      throw Object.assign(new Error(`${method} ${path.split("?")[0]} ${r.status}`), { code, status: r.status });
    }
    const text = await r.text();
    return text ? JSON.parse(text) : null;
  }

  return {
    api,
    user: () => (sess ? { ...sess.user } : null),
    status: () => (sess ? { signedIn: true, email: sess.user?.email || "" } : { signedIn: false }),
    async requestCode(email) {
      const redirect = cfg.redirect || location.href.split("#")[0];
      const r = await fetch(`${cfg.url}/auth/v1/otp?redirect_to=${encodeURIComponent(redirect)}`, { method: "POST", headers: headers(), body: JSON.stringify({ email, create_user: true }) });
      if (!r.ok) throw new Error(`otp ${r.status}`);
    },
    async verify(email, code) {
      const r = await fetch(`${cfg.url}/auth/v1/verify`, { method: "POST", headers: headers(), body: JSON.stringify({ type: "email", email, token: String(code).replace(/\s/g, "") }) });
      if (!r.ok) throw new Error(`verify ${r.status}`);
      store(session(await r.json()));
    },
    signOut() {
      const old = sess; store(null);
      if (old) fetch(`${cfg.url}/auth/v1/logout`, { method: "POST", headers: headers(old.access_token) }).catch(() => {});
    },
    async send(logs) {
      const tok = await token();
      if (!tok) return false;
      const rows = logs.map((l) => ({ user_id: sess.user.id, game_id: l.game_id, source: l.source, played_at: l.played_at, log: l }));
      const r = await fetch(`${cfg.url}/rest/v1/game_logs?on_conflict=user_id,game_id`, {
        method: "POST", headers: { ...headers(tok), Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(rows) });
      if (r.status === 401) store({ ...sess, expires_at: 0 });   // force a refresh on the next try
      return r.ok;
    },
  };
})();
</script>

  const fill = (s, v) => (v ? s.replace(/\{(\w+)\}/g, (m, k) => (k in v ? String(v[k]) : m)) : s);
  const Tx = (en, v) => fill(lang === "pt" && en in PT ? PT[en] : en.trimEnd(), v);
  const LOC = lang === "pt" ? "pt-BR" : "en";
  const INK = { Amber: "--amber", Amethyst: "--amethyst", Emerald: "--emerald", Ruby: "--ruby", Sapphire: "--sapphire", Steel: "--steel" };
  const inkDots = (s) => `<span class="inks">${String(s || "").split(/[\/,]\s*/).filter(Boolean).slice(0, 2).map((c) => `<i style="background:var(${INK[c.trim()] || "--steel"})"></i>`).join("")}</span>`;
  const ago = (iso) => {
    const d = Date.parse(iso); if (!d) return "";
    const m = Math.round((Date.now() - d) / 60000);
    if (m < 1) return Tx("just now"); if (m < 60) return Tx("{n} min ago", { n: m });
    if (m < 60 * 20) return Tx("{n} h ago", { n: Math.round(m / 60) }); if (m < 60 * 40) return Tx("yesterday");
    return new Date(d).toLocaleDateString(LOC, { day: "numeric", month: "short", year: new Date(d).getFullYear() === new Date().getFullYear() ? undefined : "numeric" });
  };

  const CLOUD = window.INKWELL_CLOUD;
  const me = CLOUD?.user();
  const enc = encodeURIComponent;
  let groups = [], coachGroups = [], myCoaches = [], coachCols = true, otherGroups = new Map(), myProfile = null, names = new Map(), friendships = [], posts = [], notes = new Map(), olderThan = null, moreAvailable = false, searchRes = null, myGameCount = 0;
  const PAGE = 25;
  const friendIds = () => friendships.filter((f) => f.status === "accepted").map((f) => (f.requester === me.id ? f.addressee : f.requester));
  const nameOf = (id) => (id === me.id ? Tx("You") : names.get(id) || Tx("A player"));

  // ---------- nav + language ----------
  const here = "home";
  $("nav").innerHTML = [["home", "Home", "../feed/"], ["coach", "Coach Review", "../coach/"], ["trades", "Loans and trades", "../trades/"], ["counter", "Lore Counter", "../counter/"], ["site", "Inkwell", "../"]]
    .map(([k, l, href]) => `<a href="${href}" ${k === here ? 'aria-current="page"' : ""}>${Tx(l)}</a>`).join("");
  $("title").textContent = Tx("Home"); document.title = `${Tx("Home")} · Inkwell`; document.documentElement.lang = LOC;
  $("langBtn").textContent = lang === "pt" ? "English" : "Português";
  $("langBtn").onclick = () => { try { localStorage.setItem("inkwell-lang", lang === "pt" ? "en" : "pt"); } catch { /* */ } location.reload(); };

  // ---------- data ----------
  async function loadNames(ids) {
    const want = [...new Set(ids)].filter((id) => id && !names.has(id));
    for (let i = 0; i < want.length; i += 80) {
      for (const p of (await CLOUD.api(`profiles?user_id=in.(${want.slice(i, i + 80).join(",")})&select=user_id,display_name`)) || []) names.set(p.user_id, p.display_name);
    }
  }
  async function loadPeople() {
    const profSel = "user_id,display_name,default_visibility,default_group_id";
    const [prof, fr, cnt, grp, cl, cg] = await Promise.all([
      CLOUD.api(`profiles?user_id=eq.${me.id}&select=${profSel},default_coach_email,default_coach_group_id`)
        .catch(() => { coachCols = false; return CLOUD.api(`profiles?user_id=eq.${me.id}&select=${profSel}`); }),   // database without the coach columns yet
      CLOUD.api("friendships?select=*&order=created_at.desc"),
      CLOUD.api(`game_logs?user_id=eq.${me.id}&visibility=eq.private&select=game_id&limit=5000`),
      CLOUD.api(`friend_groups?select=id,name,owner_id,friend_group_members(member)&order=name`).catch(() => []),
      CLOUD.api(`coach_links?owner_id=eq.${me.id}&select=coach_email&order=created_at`).catch(() => []),
      CLOUD.api(`coach_groups?owner_id=eq.${me.id}&select=id,name,emails&order=name`).catch(() => null),
    ]);
    myCoaches = [...new Set((cl || []).map((c) => c.coach_email))];
    coachGroups = cg || [];
    if (cg === null) coachCols = false;
    groups = (grp || []).filter((g) => g.owner_id === me.id);
    otherGroups = new Map((grp || []).filter((g) => g.owner_id !== me.id).map((g) => [g.id, g.name]));
    myProfile = prof?.[0] || null;
    if (myProfile) names.set(me.id, myProfile.display_name);
    friendships = fr || [];
    myGameCount = (cnt || []).length;
    await loadNames(friendships.flatMap((f) => [f.requester, f.addressee]));
  }
  async function loadPosts(more = false) {
    const ids = [me.id, ...friendIds()];
    const q = `game_logs?user_id=in.(${ids.join(",")})&visibility=neq.private&select=user_id,game_id,source,played_at,summary,visibility,group_id&order=played_at.desc.nullslast&limit=${PAGE}${more && olderThan ? `&played_at=lt.${enc(olderThan)}` : ""}`;
    const rows = (await CLOUD.api(q)) || [];
    posts = more ? posts.concat(rows) : rows;
    moreAvailable = rows.length === PAGE;
    olderThan = posts.at(-1)?.played_at || null;
    const gids = rows.map((r) => r.game_id);
    for (let i = 0; i < gids.length; i += 60) {
      const part = (await CLOUD.api(`game_notes?game_id=in.(${gids.slice(i, i + 60).map((g) => `"${g}"`).join(",")})&select=id,owner_id,game_id,author,author_name,body,created_at&order=created_at`)) || [];
      for (const n of part) { const k = `${n.owner_id}|${n.game_id}`; if (!notes.has(k)) notes.set(k, []); if (!notes.get(k).some((x) => x.id === n.id)) notes.get(k).push(n); }
    }
    await loadNames([...rows.map((r) => r.user_id), ...[...notes.values()].flat().map((n) => n.author)]);
  }

  // ---------- side: profile, friends, visibility ----------
  function renderSide() {
    const el = $("side");
    if (!me) { el.innerHTML = ""; return; }
    if (!myProfile) {
      el.innerHTML = `<div class="panel"><h2>${Tx("Choose your name")}</h2><p class="small muted">${Tx("Your friends find you by this name.")}</p>
        <div class="cmtform"><input id="myName" maxlength="40"><button type="button" class="btn primary small" id="myNameSave">${Tx("Save")}</button></div></div>`;
      $("myNameSave").onclick = async () => {
        const v = $("myName").value.trim(); if (v.length < 2) return;
        await CLOUD.api("profiles?on_conflict=user_id", { method: "POST", prefer: "resolution=merge-duplicates,return=minimal", body: [{ user_id: me.id, display_name: v, updated_at: new Date().toISOString() }] });
        await loadPeople(); renderSide(); renderFeed();
      };
      return;
    }
    const incoming = friendships.filter((f) => f.status === "pending" && f.addressee === me.id);
    const outgoing = friendships.filter((f) => f.status === "pending" && f.requester === me.id);
    const friends = friendIds().sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
    const vis = myProfile.default_visibility || "private";
    const visKey = vis === "group" && myProfile.default_group_id ? `group:${myProfile.default_group_id}`
      : vis === "coaches" && myProfile.default_coach_group_id ? `cgroup:${myProfile.default_coach_group_id}`
      : vis === "coaches" && myProfile.default_coach_email ? `coach:${myProfile.default_coach_email}` : vis;
    const coachName = (e) => (e || "").split("@")[0];
    el.innerHTML = `<div class="panel"><div class="who"><span class="av">${esc(myProfile.display_name[0].toUpperCase())}</span><div><b>${esc(myProfile.display_name)}</b><span class="small muted">${esc(me.email)} · <button type="button" class="linkbtn" id="siOut">${Tx("Sign out")}</button></span></div></div></div>
      <div class="panel"><h2>${Tx("Friends")}</h2>
        <input id="findPeople" placeholder="${Tx("Find people by name")}" autocomplete="off">
        <div id="found">${searchRes ? (searchRes.length ? searchRes.map((p) => {
          const rel = friendships.find((f) => [f.requester, f.addressee].includes(p.user_id));
          return `<div class="person"><span>${esc(p.display_name)}</span>${rel ? `<span class="small muted">${Tx(rel.status === "accepted" ? "Friends" : "Requested")}</span>` : `<button type="button" class="btn small" data-ask="${p.user_id}">${Tx("Add friend")}</button>`}</div>`;
        }).join("") : `<p class="small muted">${Tx("No one found with that name.")}</p>`) : ""}</div>
        ${incoming.map((f) => `<div class="person"><span><b>${esc(nameOf(f.requester))}</b><br><span class="small muted">${Tx("Wants to be your friend")}</span></span>
          <span><button type="button" class="btn primary small" data-accept="${f.requester}">${Tx("Accept")}</button> <button type="button" class="btn small" data-decline="${f.requester}|${f.addressee}">${Tx("Decline")}</button></span></div>`).join("")}
        ${outgoing.map((f) => `<div class="person"><span class="small muted">${esc(Tx("Waiting for {name}", { name: nameOf(f.addressee) }))}</span><button type="button" class="linkbtn small" data-decline="${f.requester}|${f.addressee}">${Tx("Cancel")}</button></div>`).join("")}
        ${friends.length ? friends.map((id) => `<div class="person"><span>${esc(nameOf(id))}</span><button type="button" class="linkbtn small" data-unfriend="${id}">${Tx("Remove")}</button></div>`).join("")
          : !incoming.length && !outgoing.length ? `<p class="small muted">${Tx("No friends yet. Search for people above.")}</p>` : ""}
      </div>
      <div class="panel"><h2>${Tx("Who sees my new games")}</h2>
        <select id="defVis">${[["private", Tx("Only me")], ["coaches", Tx("All my coaches")],
            ...(coachCols && myCoaches.length > 1 ? myCoaches.map((c) => [`coach:${c}`, Tx("Coach: {name}", { name: coachName(c) })]) : []),
            ...(coachCols ? coachGroups.map((g) => [`cgroup:${g.id}`, Tx("Coach group: {name}", { name: g.name })]) : []),
            ["friends", Tx("Friends ")], ...groups.map((g) => [`group:${g.id}`, Tx("Group: {name}", { name: g.name })]), ["public", Tx("Everyone")]]
          .map(([k, l]) => `<option value="${esc(k)}" ${k === visKey ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>
        ${vis !== "private" && myGameCount ? `<p><button type="button" class="linkbtn small" id="applyOld">${esc(myGameCount === 1 ? Tx("Apply to my older game too") : Tx("Apply to my {n} older games too", { n: myGameCount }))}</button></p>` : ""}
        <p class="small muted" id="visMsg">${Tx("Opponents' names are never shown to others.")}</p>
        <p class="small muted">${Tx("Coaches only see the games you share with them, and games for everyone.")}</p></div>
      <div class="panel"><h2>${Tx("Friend groups")}</h2>
        ${groups.length ? groups.map((g) => `<details class="grp"><summary>${esc(g.name)} <span class="small muted">(${(g.friend_group_members || []).length})</span></summary>
          ${friends.length ? friends.map((id) => `<label class="person small"><span>${esc(nameOf(id))}</span><input type="checkbox" style="width:auto" data-gm="${g.id}|${id}" ${(g.friend_group_members || []).some((m) => m.member === id) ? "checked" : ""}></label>`).join("") : `<p class="small muted">${Tx("Add friends first.")}</p>`}
          <button type="button" class="linkbtn small" data-delgroup="${g.id}">${Tx("Delete group")}</button></details>`).join("")
          : `<p class="small muted">${Tx("No groups yet. A group lets you share games with only some friends.")}</p>`}
        <div class="cmtform"><input id="newGroup" maxlength="40" placeholder="${Tx("New group name")}"><button type="button" class="btn small" id="addGroup">${Tx("Create")}</button></div></div>
      ${coachCols ? `<div class="panel"><h2>${Tx("Coach groups")}</h2>
        ${coachGroups.length ? coachGroups.map((g) => `<details class="grp"><summary>${esc(g.name)} <span class="small muted">(${(g.emails || []).length})</span></summary>
          ${myCoaches.length ? myCoaches.map((c) => `<label class="person small"><span>${esc(coachName(c))}</span><input type="checkbox" style="width:auto" data-cgm="${g.id}|${esc(c)}" ${(g.emails || []).includes(c) ? "checked" : ""}></label>`).join("") : `<p class="small muted">${Tx("Add coaches first, in Coach Review.")}</p>`}
          <button type="button" class="linkbtn small" data-delcgroup="${g.id}">${Tx("Delete group")}</button></details>`).join("")
          : `<p class="small muted">${Tx("No coach groups yet. A coach group lets you share games with only some of your coaches.")}</p>`}
        <div class="cmtform"><input id="newCGroup" maxlength="40" placeholder="${Tx("New group name")}"><button type="button" class="btn small" id="addCGroup">${Tx("Create")}</button></div></div>` : ""}`;
    $("siOut").onclick = () => { CLOUD.signOut(); location.reload(); };
    let t;
    $("findPeople").addEventListener("input", (e) => {
      clearTimeout(t);
      const q = e.target.value.trim();
      t = setTimeout(async () => {
        if (q.length < 2) { searchRes = null; renderSide(); return; }
        const res = await CLOUD.api(`profiles?display_name=ilike.*${enc(q.replace(/[*%,()]/g, " "))}*&user_id=neq.${me.id}&select=user_id,display_name&limit=10`).catch(() => []);
        searchRes = res || []; renderSide();
        const inp = $("findPeople"); inp.value = q; inp.focus();
      }, 300);
    });
    const act = async (fn) => { try { await fn(); } finally { await loadPeople(); await loadPosts(); renderSide(); renderFeed(); } };
    el.querySelectorAll("[data-ask]").forEach((b) => b.onclick = () => act(() => CLOUD.api("friendships", { method: "POST", prefer: "return=minimal", body: { addressee: b.dataset.ask } })));
    el.querySelectorAll("[data-accept]").forEach((b) => b.onclick = () => act(() => CLOUD.api(`friendships?requester=eq.${b.dataset.accept}&addressee=eq.${me.id}`, { method: "PATCH", prefer: "return=minimal", body: { status: "accepted", accepted_at: new Date().toISOString() } })));
    el.querySelectorAll("[data-decline]").forEach((b) => b.onclick = () => { const [r, a] = b.dataset.decline.split("|"); act(() => CLOUD.api(`friendships?requester=eq.${r}&addressee=eq.${a}`, { method: "DELETE" })); });
    el.querySelectorAll("[data-unfriend]").forEach((b) => b.onclick = () => {
      if (b.dataset.c !== "1") { b.dataset.c = "1"; b.textContent = Tx("Confirm"); return; }
      const f = friendships.find((x) => [x.requester, x.addressee].includes(b.dataset.unfriend));
      act(() => CLOUD.api(`friendships?requester=eq.${f.requester}&addressee=eq.${f.addressee}`, { method: "DELETE" }));
    });
    $("defVis").onchange = (e) => { const v = e.target.value; act(() => CLOUD.api(`profiles?user_id=eq.${me.id}`, { method: "PATCH", prefer: "return=minimal",
      body: { ...(v.startsWith("group:") ? { default_visibility: "group", default_group_id: v.slice(6) }
        : v.startsWith("coach:") ? { default_visibility: "coaches", default_group_id: null, default_coach_email: v.slice(6), default_coach_group_id: null }
        : v.startsWith("cgroup:") ? { default_visibility: "coaches", default_group_id: null, default_coach_email: null, default_coach_group_id: v.slice(7) }
        : { default_visibility: v, default_group_id: null }), ...(coachCols && !v.includes(":") ? { default_coach_email: null, default_coach_group_id: null } : {}) } })); };
    $("addCGroup")?.addEventListener("click", () => { const n = $("newCGroup").value.trim(); if (n) act(() => CLOUD.api("coach_groups", { method: "POST", prefer: "return=minimal", body: { name: n } })); });
    el.querySelectorAll("[data-cgm]").forEach((c) => c.onchange = () => { const [g, e] = [c.dataset.cgm.slice(0, 36), c.dataset.cgm.slice(37)];

    el.querySelectorAll("[data-delcgroup]").forEach((b) => b.onclick = () => {
      if (b.dataset.c !== "1") { b.dataset.c = "1"; b.textContent = Tx("Confirm"); return; }

    el.querySelectorAll("[data-gm]").forEach((c) => c.onchange = () => { const [g, m] = c.dataset.gm.split("|");

        : CLOUD.api(`friend_group_members?group_id=eq.${g}&member=eq.${m}`, { method: "DELETE" }))); });
    el.querySelectorAll("[data-delgroup]").forEach((b) => b.onclick = () => {
      if (b.dataset.c !== "1") { b.dataset.c = "1"; b.textContent = Tx("Confirm"); return; }

        : vis === "coaches" && coachCols ? { visibility: "coaches", coach_email: myProfile.default_coach_email || null, coach_group_id: myProfile.default_coach_group_id || null } : { visibility: vis } }));
      $("visMsg").textContent = Tx("Done.");
    });
  }

  // ---------- feed ----------
  function audienceTag(r) {
    if (r.visibility === "group") { const own = groups.find((g) => g.id === r.group_id); return own ? Tx("Group: {name}", { name: own.name }) : otherGroups.has(r.group_id) ? Tx("Group: {name}", { name: otherGroups.get(r.group_id) }) : Tx("group"); }
    return Tx(r.visibility === "coaches" ? "coaches" : r.visibility);   // a coach-only game shows up here only for its owner
  }
  function postHtml(r) {
    const s = r.summary || {}, win = s.result === "win", key = `${r.user_id}|${r.game_id}`, cm = notes.get(key) || [];
    const who = nameOf(r.user_id), first = s.went_first === true ? Tx("going first") : s.went_first === false ? Tx("going second") : "";
    const myDeck = s.my_deck && s.my_deck !== "Physical game" ? s.my_deck : "", opp = s.opp_deck && s.opp_deck !== "Unknown" ? s.opp_deck : "";
    return `<article class="post" data-key="${esc(key)}">
      <div class="who"><span class="av">${esc(who[0]?.toUpperCase() || "?")}</span><div><b>${esc(who)}</b><span class="small muted">${esc(ago(r.played_at))} · ${esc(Tx(r.source === "duels_ink" ? "duels.ink" : r.source === "lore_counter" ? "Lore Counter" : r.source))} · ${esc(audienceTag(r))}</span></div></div>
      <div class="res"><span class="${win ? "w" : "l"}">${Tx(win ? "won" : "lost")}</span>${myDeck ? ` ${inkDots(s.my_inks || myDeck)}${esc(Tx("with {deck}", { deck: myDeck }))}` : ""}${opp ? ` ${inkDots(s.opp_inks || opp)}${esc(Tx("against {deck}", { deck: opp }))}` : ""}</div>
      <div class="meta"><span class="score">${esc(s.my_lore ?? 0)}–${esc(s.opp_lore ?? 0)}</span>${first ? `<span class="tag">${first}</span>` : ""}${s.turns ? `<span class="tag">${esc(Tx("{n} turns", { n: s.turns }))}</span>` : ""}</div>
      ${cm.length ? `<div class="cmts">${cm.slice(-3).map((n) => `<div class="cmt"><b>${esc(nameOf(n.author) === Tx("A player") ? n.author_name || Tx("Someone") : nameOf(n.author))}</b><span data-body="${esc(n.id)}"></span></div>`).join("")}</div>` : ""}
      <div class="acts"><a href="../coach/?player=${enc(r.user_id)}&game=${enc(r.game_id)}">${Tx("Open game")}</a><button type="button" data-cmt="${esc(key)}">${cm.length ? esc(cm.length === 1 ? Tx("1 comment") : Tx("{n} comments", { n: cm.length })) : Tx("Comment")}</button></div>
      <div class="cmtform" data-form="${esc(key)}" hidden><input maxlength="1000" placeholder="${Tx("Write a comment")}"><button type="button" class="btn small" data-send="${esc(key)}">${Tx("Send")}</button></div>
    </article>`;
  }
  function renderFeed() {
    const el = $("feed");
    if (!me || !myProfile) { el.innerHTML = me ? "" : el.innerHTML; return; }
    el.innerHTML = posts.length ? posts.map(postHtml).join("") + (moreAvailable ? `<button type="button" class="btn" id="older">${Tx("Show older games")}</button>` : "")
      : `<div class="panel"><p class="empty">${Tx("Your timeline is empty. Add friends, and choose who sees your games.")}</p></div>`;
    const byId = new Map([...notes.values()].flat().map((n) => [n.id, n]));
    el.querySelectorAll("[data-body]").forEach((s) => { s.textContent = byId.get(s.dataset.body)?.body || ""; });   // other people's text: set as text
    el.querySelectorAll("[data-cmt]").forEach((b) => b.onclick = () => { const f = el.querySelector(`[data-form="${CSS.escape(b.dataset.cmt)}"]`); f.hidden = !f.hidden; f.querySelector("input").focus(); });
    el.querySelectorAll("[data-send]").forEach((b) => {
      const form = b.parentElement, input = form.querySelector("input");
      const send = async () => {
        const text = input.value.trim(); if (!text) return;
        const [owner, game] = b.dataset.send.split("|");
        b.disabled = true;
        try {
          await CLOUD.api("game_notes", { method: "POST", prefer: "return=minimal", body: { owner_id: owner, game_id: game, anchor: { kind: "game" }, body: text, author_name: (myProfile?.display_name || "").slice(0, 60) } });
          notes.delete(b.dataset.send); await loadPosts(); renderFeed();
        } catch { b.disabled = false; input.placeholder = Tx("Couldn't send. Try again."); }
      };
      b.onclick = send;
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); send(); } });
    });
    $("older")?.addEventListener("click", async () => { await loadPosts(true); renderFeed(); });
  }

  // ---------- sign-in ----------
  function signIn() {
    $("feed").innerHTML = `<div class="panel"><h2>${Tx("Sign in")}</h2><p class="muted small">${Tx("Use your Inkwell account email.")}</p>
      <div class="cmtform"><input id="siEmail" type="email" autocomplete="email" placeholder="${Tx("Email")}"><button type="button" class="btn primary small" id="siSend">${Tx("Send code")}</button></div>
      <div class="cmtform" id="siCodeRow" hidden><input id="siCode" inputmode="numeric" autocomplete="one-time-code" placeholder="${Tx("Code from the email")}"><button type="button" class="btn primary small" id="siIn">${Tx("Sign in")}</button></div>
      <p class="small" id="siMsg" aria-live="polite"></p></div>`;
    const msg = (t) => { $("siMsg").textContent = t; };
    $("siSend").onclick = async () => {
      const e = $("siEmail").value.trim();
      if (!/^\S+@\S+\.\S+$/.test(e)) { msg(Tx("Enter your email.")); return; }
      msg(Tx("Sending…"));
      try { await CLOUD.requestCode(e); $("siCodeRow").hidden = false; msg(Tx("Check {email}: type the code, or open the link on this device.", { email: e })); }
      catch { msg(Tx("Couldn't send the email. Check the address and your connection.")); }
    };
    $("siIn").onclick = async () => { try { await CLOUD.verify($("siEmail").value.trim(), $("siCode").value); location.reload(); } catch { msg(Tx("Wrong or expired code.")); } };
  }

  // ---------- boot ----------
  if (!me) { signIn(); return; }
  $("feed").innerHTML = `<p class="empty">${Tx("Loading…")}</p>`;
  (async () => {
    try { await loadPeople(); await loadPosts(); renderSide(); renderFeed(); }
    catch { $("feed").innerHTML = `<p class="empty">${Tx("Couldn't load the feed. Reload the page to try again.")}</p>`; }
  })();
  document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible" && myProfile) { try { await loadPeople(); await loadPosts(); renderSide(); renderFeed(); } catch { /* keep what's shown */ } } });
})();
</script>

<script>window.INKWELL_SHELL = {"page": "feed"};
/* Inkwell site shell: app bar + phone tab bar + appearance (theme) picker.
   Include shell-boot (in <head>) to set the theme before paint, then this script at the end of <body>.
   window.INKWELL_SHELL = { page: "feed" | "coach" | "trades" } */
(() => {
  "use strict";
  const KEY = "inkwell-theme";
  const THEMES = [
    ["noite", "Noite", "Night", "O roxo-noite e o dourado do Inkwell, refinados.", "Inkwell's night purple and gold, refined."],
    ["pergaminho", "Pergaminho", "Parchment", "Claro e leve, tipografia de livro de histórias.", "Light and airy, storybook type."],
    ["tinta", "Tinta", "Ink", "Alto contraste, cores vivas das tintas.", "High contrast, vivid ink colours."],
  ];
  let lang = "pt";
  try { lang = localStorage.getItem("inkwell-lang") || ((navigator.language || "pt").toLowerCase().startsWith("en") ? "en" : "pt"); } catch { /* */ }
  const pt = lang === "pt";
  const page = (window.INKWELL_SHELL || {}).page || "";
  const I = {
    feed: '<path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
    coach: '<path d="M4 5h16v11H8l-4 4z"/><path d="M8 9h8M8 12h5"/>',
    trades: '<path d="M7 4 3 8l4 4"/><path d="M3 8h13"/><path d="m17 12 4 4-4 4"/><path d="M21 16H8"/>',
    counter: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
    cards: '<rect x="3" y="5" width="12" height="16" rx="2"/><path d="M8 3h10a2 2 0 0 1 2 2v13"/>',
  };
  const icon = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`;
  const LINKS = [
    ["feed", "../feed/", pt ? "Início" : "Home"],
    ["coach", "../coach/", "Coach"],
    ["trades", "../trades/", pt ? "Trocas" : "Trades"],
    ["counter", "../counter/", pt ? "Contador" : "Counter"],
    ["cards", "../", pt ? "Coleção" : "Collection"],
  ];
  const links = LINKS.map(([k, href, label]) => `<a href="${href}" ${k === page ? 'aria-current="page"' : ""} data-iw="${k}">${icon(k)}<span>${label}</span></a>`).join("");
  const current = () => document.documentElement.dataset.theme || "noite";
  const logo = `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2c5 6 9 10.5 9 16a9 9 0 0 1-18 0C7 12.5 11 8 16 2z" fill="var(--gold)"/><path d="M16 9c2.6 3.4 4.4 5.9 4.4 8.8a4.4 4.4 0 0 1-8.8 0c0-2.9 1.8-5.4 4.4-8.8z" fill="var(--night)" opacity=".55"/></svg>`;

  const bar = document.createElement("header");
  bar.className = "iw-bar";
  bar.innerHTML = `<div class="in"><a class="iw-logo" href="../feed/">${logo}Inkwell</a><nav class="iw-nav" aria-label="${pt ? "Seções" : "Sections"}">${links}</nav>
    <div class="iw-theme"><button type="button" id="iwThemeBtn" aria-haspopup="true" aria-expanded="false"><i></i>${pt ? "Aparência" : "Appearance"}</button>
      <div class="iw-pop" id="iwThemePop" hidden role="group" aria-label="${pt ? "Aparência" : "Appearance"}">
        <p>${pt ? "Idioma" : "Language"}</p><div class="iw-lang">${[["pt", "Português"], ["en", "English"]].map(([k, l]) => `<button type="button" data-lang-pick="${k}" aria-pressed="${k === lang}">${l}</button>`).join("")}</div>
        <p>${pt ? "Visual" : "Look"}</p>
        ${THEMES.map(([k, ptN, enN, ptD, enD]) => `<button type="button" class="iw-opt" data-theme-pick="${k}" aria-pressed="${k === current()}"><span class="iw-sw" data-t="${k}"></span><span><b>${pt ? ptN : enN}</b><small>${pt ? ptD : enD}</small></span></button>`).join("")}
      </div></div></div>`;
  document.body.prepend(bar);
  const tabs = document.createElement("nav");
  tabs.className = "iw-tabs";
  tabs.setAttribute("aria-label", pt ? "Seções" : "Sections");
  tabs.innerHTML = links;
  document.body.append(tabs);
  document.body.classList.add("iw-has-shell");

  const btn = document.getElementById("iwThemeBtn"), pop = document.getElementById("iwThemePop");
  const setOpen = (o) => { pop.hidden = !o; btn.setAttribute("aria-expanded", String(o)); };
  btn.addEventListener("click", (e) => { e.stopPropagation(); setOpen(pop.hidden); });
  document.addEventListener("click", (e) => { if (!pop.hidden && !pop.contains(e.target)) setOpen(false); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") setOpen(false); });
  pop.querySelectorAll("[data-theme-pick]").forEach((b) => b.addEventListener("click", () => {
    const t = b.dataset.themePick;
    window.INKWELL_SET_THEME(t);
    pop.querySelectorAll("[data-theme-pick]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    setOpen(false);
  }));
  pop.querySelectorAll("[data-lang-pick]").forEach((b) => b.addEventListener("click", () => {
    if (b.dataset.langPick === lang) return;
    try { localStorage.setItem("inkwell-lang", b.dataset.langPick); } catch { /* */ }
    location.reload();
  }));
  window.INKWELL_SET_THEME = window.INKWELL_SET_THEME || ((t) => { document.documentElement.dataset.theme = t; try { localStorage.setItem(KEY, t); } catch { /* */ } });
})();
</script>
