<script>window.INKWELL_CLOUD_CONFIG = {"url": "https://sorefaetiaebmjploanp.supabase.co", "key": "sb_publishable_RkAWW-ENz70CXA6_QV7aHw_MpfD7Gn2", "redirect": "https://luiscredie.github.io/inkwell/eventos/"};
/* Inkwell Lore Counter: cloud adapter for the offline app.
 *
 * Talks to the Inkwell Supabase project with plain fetch (no library to cache):
 *   sign-in   email one-time code (or the magic link, when opened in the same browser)
 *   storage   public.game_logs, one row per game, upserted on (user_id, game_id),
 *             so a retry after a dropped connection never creates a duplicate
 * The counter keeps every match locally until send() resolves true.
 * Only the public URL and publishable key are here; row-level security limits each user to their own rows.
 */
// Feature flags. The guest experience (Começar meu Inkwell, new Início) is on for everyone since 26/10/2026.
// ?preview=off shows the previous experience in this tab (sessionStorage); ?preview=visitante turns it back on.
// Rollback: set GUEST_DEFAULT to false (nothing in the database changes).
window.INKWELL_FLAGS = (() => {
  const GUEST_DEFAULT = true;
  const f = { guestProfile: GUEST_DEFAULT };
  try {
    const q = new URLSearchParams(location.search).get("preview");
    if (q === "visitante") sessionStorage.setItem("inkwell-preview", "visitante");
    if (q === "off") sessionStorage.setItem("inkwell-preview", "off");
    const v = sessionStorage.getItem("inkwell-preview");
    if (v === "visitante") f.guestProfile = true;
    if (v === "off") f.guestProfile = false;
  } catch { /* storage off: the default stays */ }
  return f;
})();
window.INKWELL_CLOUD = (() => {
  const cfg = window.INKWELL_CLOUD_CONFIG || {};
  if (!cfg.url || !cfg.key) return null;
  // One sign-in for the whole site: the counter, Coach Review, Início, Trocas and the Inkwell app itself
  // (its supabase-js client uses this same storage key), so signing in or out on one page does it on all.
  const KEY = "inkwell-counter-auth";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch { return null; } };
  let sess = load();
  const store = (x) => { sess = x; try { if (x) localStorage.setItem(KEY, JSON.stringify(x)); else localStorage.removeItem(KEY); } catch { /* private mode */ } };
  const headers = (tok) => ({ apikey: cfg.key, "Content-Type": "application/json", ...(tok ? { Authorization: `Bearer ${tok}` } : {}) });
  const claims = (jwt) => { try { return JSON.parse(atob(jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); } catch { return {}; } };
  const session = (r) => {   // the same shape supabase-js keeps, so both read each other's session
    const c = claims(r.access_token);
    const expires_at = r.expires_at || c.exp || Math.floor(Date.now() / 1000) + (r.expires_in || 3600);
    return { access_token: r.access_token, refresh_token: r.refresh_token, token_type: "bearer",
      expires_in: r.expires_in || Math.max(0, expires_at - Math.floor(Date.now() / 1000)), expires_at,
      user: { ...(r.user || {}), id: r.user?.id || c.sub, email: r.user?.email || c.email } };
  };

  // Magic link opened in this same browser: tokens arrive in the URL fragment.
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("access_token") && h.get("refresh_token")) {
    store(session({ access_token: h.get("access_token"), refresh_token: h.get("refresh_token"), expires_in: +h.get("expires_in") || 3600 }));
    history.replaceState(null, "", location.pathname + location.search);
    window.INKWELL_FROM_LINK = true;   // this tab was opened by the e-mail link (the guest editor tells the original tab apart)
  } else if (h.get("error_code") || h.get("error")) {
    // The e-mail link didn't work (already used or expired): Supabase sends back #error=…&error_code=otp_expired.
    // Some mail services (Outlook/Hotmail) open links by themselves to scan them, which uses the link up.
    history.replaceState(null, "", location.pathname + location.search);
    window.INKWELL_LINK_FAILED = h.get("error_code") || h.get("error");
  }

  async function token() {
    sess = load();   // another page (or the Inkwell app) may have signed in, out, or refreshed the tokens meanwhile
    if (!sess) return null;
    if (sess.expires_at - 60 > Date.now() / 1000) return sess.access_token;
    const used = sess.refresh_token;
    const r = await fetch(`${cfg.url}/auth/v1/token?grant_type=refresh_token`, { method: "POST", headers: headers(), body: JSON.stringify({ refresh_token: used }) });
    if (r.status === 400 || r.status === 401) {
      const now = load();   // a page that refreshed at the same moment already saved newer tokens: keep them
      if (now && now.refresh_token !== used && now.expires_at - 60 > Date.now() / 1000) { sess = now; return sess.access_token; }
      store(null); return null;   // signed out elsewhere
    }
    if (!r.ok) throw new Error(`refresh ${r.status}`);
    store(session(await r.json()));
    return sess.access_token;
  }

  // Authenticated call to the database's REST API (used by Coach Review). Errors carry a short code.
  async function api(path, { method = "GET", body, prefer } = {}) {
    const tok = await token();
    if (!tok) throw Object.assign(new Error("signed out"), { code: "auth" });
    const r = await fetch(`${cfg.url}/rest/v1/${path}`, {
      method, headers: { ...headers(tok), ...(prefer ? { Prefer: prefer } : {}) }, body: body === undefined ? undefined : JSON.stringify(body) });
    if (r.status === 401) store({ ...sess, expires_at: 0 });
    if (!r.ok) {
      const code = r.status === 401 || r.status === 403 ? "permission" : r.status === 400 || r.status === 409 || r.status === 413 ? "invalid_argument" : "unavailable";
      throw Object.assign(new Error(`${method} ${path.split("?")[0]} ${r.status}`), { code, status: r.status });
    }
    const text = await r.text();
    return text ? JSON.parse(text) : null;
  }

  // The player's collections (public.inkwell_profiles). A new account has none yet, and every collection, deck
  // and wishlist save needs one, so the first visit creates an empty "principal" collection, then reads again.
  async function collections(select) {
    const q = `inkwell_profiles?select=${select}&order=updated_at.desc`;
    const r = await api(q);
    if (Array.isArray(r) && r.length) return r;
    const id = load()?.user?.id;
    if (!id) return r;
    await api("inkwell_profiles?on_conflict=user_id,profile", { method: "POST", prefer: "resolution=ignore-duplicates,return=minimal",
      body: { user_id: id, profile: "principal", schema: 2, data: { _schema: 2, collection: {}, decks: [], wishlist: {} } } });
    return api(q);
  }

  // an Edge Function by GET (signed in or not: the publishable key is enough for public ones)
  async function fn(name, params = {}) {
    const tok = sess ? await token().catch(() => null) : null;
    const r = await fetch(`${cfg.url}/functions/v1/${name}?${new URLSearchParams(params)}`, { headers: headers(tok) });
    if (!r.ok) throw Object.assign(new Error(`${name} ${r.status}`), { status: r.status });
    return r.json();
  }

  return {
    api, collections, fn,
    user: () => { sess = load(); return sess ? { id: sess.user?.id, email: sess.user?.email } : null; },
    status: () => { sess = load(); return sess ? { signedIn: true, email: sess.user?.email || "" } : { signedIn: false }; },
    async requestCode(email) {
      const redirect = cfg.redirect || location.href.split("#")[0];
      // where to come back after the confirmation page (/entrar/), same site only
      try { localStorage.setItem("inkwell-return", JSON.stringify({ path: location.pathname + location.search, at: Date.now() })); } catch { /* private mode */ }
      const r = await fetch(`${cfg.url}/auth/v1/otp?redirect_to=${encodeURIComponent(redirect)}`, { method: "POST", headers: headers(), body: JSON.stringify({ email, create_user: true }) });
      if (!r.ok) throw Object.assign(new Error(`otp ${r.status}`), { status: r.status });
    },
    async verify(email, code) {
      const r = await fetch(`${cfg.url}/auth/v1/verify`, { method: "POST", headers: headers(), body: JSON.stringify({ type: "email", email, token: String(code).replace(/\s/g, "") }) });
      if (!r.ok) throw Object.assign(new Error(`verify ${r.status}`), { status: r.status });
      store(session(await r.json()));
    },
    // The e-mail's own link to /entrar/?h=<token hash>: signs in only when the person presses the button there,
    // so a mail scanner that just opens the link doesn't use it up.
    async verifyHash(tokenHash, type = "email") {
      const r = await fetch(`${cfg.url}/auth/v1/verify`, { method: "POST", headers: headers(), body: JSON.stringify({ type, token_hash: String(tokenHash) }) });
      if (!r.ok) throw Object.assign(new Error(`verify ${r.status}`), { status: r.status });
      store(session(await r.json()));
    },
    signOut() {
      const old = sess; store(null);
      if (old) fetch(`${cfg.url}/auth/v1/logout`, { method: "POST", headers: headers(old.access_token) }).catch(() => {});
    },
    async send(logs) {
      const tok = await token();   // also reloads sess
      if (!tok) return false;
      const rows = logs.map((l) => ({ user_id: sess.user.id, game_id: l.game_id, source: l.source, played_at: l.played_at, log: l }));
      const r = await fetch(`${cfg.url}/rest/v1/game_logs?on_conflict=user_id,game_id`, {
        method: "POST", headers: { ...headers(tok), Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(rows) });
      if (r.status === 401) store({ ...sess, expires_at: 0 });   // force a refresh on the next try
      return r.ok;
    },
  };
})();
</script>

  <div class="page-head"><div><h1 id="title">Eventos</h1><p class="sub" id="sub"></p></div></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let lang = "pt"; try { lang = localStorage.getItem("inkwell-lang") || "pt"; } catch { /* */ }
  const T = (pt, en) => (lang === "en" ? en : pt);
  const LOC = lang === "en" ? "en" : "pt-BR";
  const CLOUD = window.INKWELL_CLOUD, me = CLOUD?.user();
  const rpc = (name, body = {}) => CLOUD.api(`rpc/${name}`, { method: "POST", body });
  const toast = (t, bad) => { const el = $("toast"); el.textContent = t; el.classList.toggle("bad", !!bad); el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 3500); };
  $("sub").textContent = T("Eventos oficiais do Play Hub perto de você e as mesas das suas comunidades.", "Official Play Hub events near you and your communities' tables.");
  document.title = T("Eventos · Inkwell", "Events · Inkwell");

  // ---------- state ----------
  const LOC_KEY = "inkwell-events-where";
  let where = null; try { where = JSON.parse(localStorage.getItem(LOC_KEY) || "null"); } catch { where = null; }
  let km = where?.km || 100, view = "list", day = null, month = null, onlyMine = false, onlyFree = false, fmt = "", order = "date", horizon = 14;
  try { order = localStorage.getItem("inkwell-events-order") === "km" ? "km" : "date"; } catch { /* */ }
  let events = [], marks = new Map(), friends = {}, tables = [], loading = false, failed = false;
  const save = () => { try { localStorage.setItem(LOC_KEY, JSON.stringify({ ...where, km })); } catch { /* */ } };
  const dkey = (iso) => { const d = new Date(iso); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const dayShort = (iso) => new Date(iso).toLocaleDateString(LOC, { weekday: "short", day: "numeric", month: "short" });
  const hhmm = (iso) => new Date(iso).toLocaleTimeString(LOC, { hour: "2-digit", minute: "2-digit" });
  const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
  const dayTitle = (k) => cap(new Date(k + "T12:00:00").toLocaleDateString(LOC, { weekday: "long", day: "numeric", month: "long" }));
  const money = (cents, cur) => (cents ? (cents / 100).toLocaleString(LOC, { style: "currency", currency: cur || "BRL" }) : T("Grátis", "Free"));

  // A typed place -> a point. Addresses, CEPs and districts: OpenStreetMap (Nominatim), called from this browser,
  // light use only. Plain city names also work through our own function (Open-Meteo). The point is rounded to
  // ~1 km and stays on this device. undefined = couldn't search; null = not found.
  async function findPlace(q) {
    const cep = q.replace(/\D/g, "").length === 8 && /^\s*\d{5}-?\d{3}\s*$/.test(q) ? q.replace(/\D/g, "").replace(/^(\d{5})(\d{3})$/, "$1-$2") : null;
    const nominatim = async (params) => {
      const u = new URL("https://nominatim.openstreetmap.org/search");
      u.search = new URLSearchParams({ format: "jsonv2", limit: "1", addressdetails: "1", countrycodes: "br", "accept-language": "pt-BR", ...params });
      const r = await fetch(u); if (!r.ok) throw new Error(r.status);
      return (await r.json())?.[0] || null;
    };
    let osm = null, failed = 0;
    try {
      osm = await nominatim(cep ? { postalcode: cep } : { q });
      if (!osm && cep) {   // many CEPs aren't in OpenStreetMap: ViaCEP names the district, then look that up
        const v = await (await fetch(`https://viacep.com.br/ws/${cep.replace("-", "")}/json/`)).json().catch(() => null);
        if (v && !v.erro) { q = [v.bairro, v.localidade, v.uf].filter(Boolean).join(", "); osm = await nominatim({ q }); }
      }
    } catch { failed++; }
    if (osm) {
      const a = osm.address || {}, area = a.suburb || a.neighbourhood || a.city_district || a.quarter || "", city = a.city || a.town || a.village || a.municipality || "";
      return { lat: +(+osm.lat).toFixed(2), lng: +(+osm.lon).toFixed(2), label: [area, city].filter(Boolean).join(", ") || osm.name || q };
    }
    try { const g = await CLOUD.fn("rph-events", { geocode: q }); return g ? { ...g, lat: +(+g.lat).toFixed(2), lng: +(+g.lng).toFixed(2) } : null; } catch { failed++; }
    return failed === 2 ? undefined : null;
  }
  async function load() {
    if (!where) return;
    loading = true; failed = false; draw();
    try {
      const d = await CLOUD.fn("rph-events", { lat: where.lat.toFixed(4), lng: where.lng.toFixed(4), km });
      events = (d.events || []).map((e) => ({ ...e, kind: "rph", key: "rph:" + e.id }));
    } catch { failed = true; events = []; }
    if (me) {
      try { marks = new Map(((await rpc("my_event_marks")) || []).map((m) => [String(m.rph_id), m])); } catch { marks = new Map(); }
      try { tables = ((await rpc("my_events")) || []).map((t) => ({ kind: "table", key: "tb:" + t.id, id: t.id, name: t.title, start: t.starts_at, address: t.place, store: { name: t.community }, slug: t.slug, me: t.me, going: t.going, capacity: t.capacity })); } catch { tables = []; }
      const ids = events.map((e) => e.id).concat([...marks.keys()].map(Number)).slice(0, 300);
      try { friends = ids.length ? (await rpc("friends_on_events", { p_ids: ids })) || {} : {}; } catch { friends = {}; }
    }
    loading = false; draw();
  }
  // marked events that are no longer in the search (farther, or a filter) still show in "Meus"
  const markedOnly = () => [...marks.values()].filter((m) => !events.some((e) => String(e.id) === String(m.rph_id)) && m.snap?.start).map((m) => ({ ...m.snap, id: +m.rph_id, kind: "rph", key: "rph:" + m.rph_id, gone: true }));
  const statusOf = (e) => (e.kind === "table" ? e.me : marks.get(String(e.id))?.status) || null;
  function all() {
    let list = [...events, ...markedOnly(), ...tables];
    if (onlyMine) list = list.filter((e) => statusOf(e));
    if (onlyFree) list = list.filter((e) => e.kind === "table" || !e.cost_cents);
    if (fmt) list = list.filter((e) => e.format === fmt);
    return list.sort((a, b) => String(a.start).localeCompare(String(b.start)));
  }
  // two or more "going" on the same day
  function conflicts() {
    const byDay = new Map();
    for (const e of [...events, ...markedOnly(), ...tables]) if (statusOf(e) === "going") { const k = dkey(e.start); byDay.set(k, (byDay.get(k) || []).concat(e)); }
    return [...byDay.entries()].filter(([, l]) => l.length > 1);
  }

  // ---------- actions ----------
  async function mark(e, patch) {
    if (!me) { window.INKWELL_SIGNIN?.(); return; }
    if (e.kind === "table") {
      try {
        await rpc("rsvp_event", { p_event: e.id, p_status: patch.status });
        const t = tables.find((x) => x.id === e.id);
        if (t) { t.going = (t.going || 0) + (patch.status === "going") - (t.me === "going"); t.me = patch.status; }
        draw();
      } catch (err) { toast(/event_full/.test(String(err?.message || err)) ? T("Esta mesa está lotada.", "This table is full.") : T("Não foi possível salvar.", "Couldn't save."), true); }
      return;
    }
    const cur = marks.get(String(e.id)) || { status: null, registered: false, paid: false };
    const next = { ...cur, ...patch };
    const snap = e.gone ? {} : { name: e.name, start: e.start, end: e.end, store: e.store?.name || null, address: e.address, url: e.url, format: e.format, cost_cents: e.cost_cents, currency: e.currency };
    try {
      await rpc("mark_event", { p_rph_id: e.id, p_status: next.status, p_registered: !!next.registered, p_paid: !!next.paid, p_snap: snap });
      if (next.status) marks.set(String(e.id), { ...next, rph_id: e.id, snap: e.gone ? cur.snap : snap }); else marks.delete(String(e.id));
      draw();
      const c = conflicts().find(([k]) => k === dkey(e.start));
      if (next.status === "going" && c) toast(T(`Atenção: você marcou ${c[1].length} eventos no mesmo dia.`, `Heads up: ${c[1].length} events on the same day.`), true);
    } catch { toast(T("Não foi possível salvar. Rode o SQL de eventos?", "Couldn't save."), true); }
  }
  function ics(e) {
    const z = (d) => new Date(d).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
    const end = e.end || new Date(new Date(e.start).getTime() + 4 * 3600e3).toISOString();
    const t = (s) => String(s || "").replace(/[\\,;]/g, (m) => "\\" + m).replace(/\n/g, "\\n");
    const body = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Inkwell//Eventos//PT", "BEGIN:VEVENT", `UID:${e.key}@inkwell`, `DTSTAMP:${z(Date.now())}`, `DTSTART:${z(e.start)}`, `DTEND:${z(end)}`,
      `SUMMARY:${t(e.name)}`, `LOCATION:${t([e.store?.name, e.address].filter(Boolean).join(" · "))}`, `DESCRIPTION:${t([e.format, e.url].filter(Boolean).join("\n"))}`, e.url ? `URL:${e.url}` : "",
      "BEGIN:VALARM", "TRIGGER:-PT3H", "ACTION:DISPLAY", `DESCRIPTION:${t(e.name)}`, "END:VALARM", "END:VEVENT", "END:VCALENDAR"].filter(Boolean).join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([body], { type: "text/calendar" })); a.download = `${String(e.name).replace(/[^\w\- ]+/g, "").slice(0, 40) || "evento"}.ics`;
    document.body.append(a); a.click(); a.remove();
  }
  async function share(e) {
    const link = e.kind === "table" ? new URL(`../comunidades/?c=${encodeURIComponent(e.slug)}#mesas`, location.href).href : e.url;
    const text = `${e.name} · ${new Date(e.start).toLocaleString(LOC, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}${e.store?.name ? " · " + e.store.name : ""}`;
    try { if (navigator.share) { await navigator.share({ title: e.name, text, url: link }); return; } } catch { return; }
    try { await navigator.clipboard.writeText(`${text}\n${link}`); toast(T("Link copiado.", "Link copied.")); } catch { prompt("", link); }
  }

  // ---------- drawing ----------
  function evHtml(e, clash) {
    const st = statusOf(e), m = marks.get(String(e.id)), fr = e.kind === "rph" ? friends[e.id] || [] : [];
    const going = fr.filter((f) => f.status === "going"), maybe = fr.filter((f) => f.status === "maybe");
    const spots = e.capacity ? `${e.registered ?? e.going ?? 0}/${e.capacity} ${T("inscritos", "registered")}` : "";
    return `<article class="ev${st ? " mine" : ""}${clash ? " conflict" : ""}" data-ev="${esc(e.key)}">
      <div class="top"><span class="time">${esc(hhmm(e.start))}</span><span class="name">${esc(e.name)}</span>${e.kind === "table" ? `<span class="tag info">${T("Mesa da comunidade", "Community table")}</span>` : ""}${clash ? `<span class="tag late">${T("Mesmo dia", "Same day")}</span>` : ""}${e.kind === "rph" && !e.gone ? `<span class="price${e.cost_cents ? "" : " free"}" data-testid="price">${esc(money(e.cost_cents, e.currency))}</span>` : ""}</div>
      ${order === "km" && view === "list" ? `<div class="when">${esc(dayShort(e.start))}</div>` : ""}
      <div class="where1">${e.store?.name ? `<span class="store">${esc(e.store.name)}</span>` : ""}${e.format ? `<span class="muted">${esc(e.format)}</span>` : ""}</div>
      ${e.address || spots || e.km != null ? `<div class="meta sub">${e.km != null ? `<span>${e.km} km</span>` : ""}${e.address ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.address)}" target="_blank" rel="noopener">${esc(e.address)}</a>` : ""}${spots ? `<span>${esc(spots)}</span>` : ""}</div>` : ""}
      ${going.length || maybe.length ? `<div class="friends">${going.length ? `<b>${going.map((f) => esc(f.name)).join(", ")}</b> ${T(going.length === 1 ? "vai" : "vão", "going")}` : ""}${going.length && maybe.length ? " · " : ""}${maybe.length ? `${maybe.map((f) => esc(f.name)).join(", ")} ${T("talvez", "maybe")}` : ""}</div>` : ""}
      <div class="acts">
        <button type="button" class="btn small ${st === "going" ? "primary" : ""}" data-act="going" aria-pressed="${st === "going"}">${T("Vou", "Going")}</button>
        <button type="button" class="btn small ghost" data-act="maybe" aria-pressed="${st === "maybe"}">${T("Talvez", "Maybe")}</button>
        ${e.kind === "rph" && st ? `<button type="button" class="chipbtn" data-act="registered" aria-pressed="${!!m?.registered}">${T("Inscrito", "Registered")}</button><button type="button" class="chipbtn" data-act="paid" aria-pressed="${!!m?.paid}">${T("Pago", "Paid")}</button>` : ""}
        <span class="grow" style="flex:1"></span>
        ${e.kind === "rph" && e.url ? `<a class="btn small ghost" href="${esc(e.url)}" target="_blank" rel="noopener">${T("Play Hub", "Play Hub")} <i class="ic i-external"></i></a>` : e.kind === "table" ? `<a class="btn small ghost" href="../comunidades/?c=${encodeURIComponent(e.slug)}#mesas">${T("Comunidade", "Community")}</a>` : ""}
        <button type="button" class="btn small ghost" data-act="ics" title="${T("Adicionar ao calendário", "Add to calendar")}"><i class="ic i-calendar"></i>${T("Calendário", "Calendar")}</button>
        <button type="button" class="btn small ghost" data-act="share"><i class="ic i-send"></i>${T("Compartilhar", "Share")}</button></div></article>`;
  }
  function calHtml(list) {
    const now = new Date(), base = month || new Date(now.getFullYear(), now.getMonth(), 1);
    const first = new Date(base.getFullYear(), base.getMonth(), 1), start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
    const byDay = new Map(); for (const e of list) { const k = dkey(e.start); byDay.set(k, (byDay.get(k) || []).concat(e)); }
    const clash = new Set(conflicts().map(([k]) => k)), todayK = dkey(now);
    const cells = Array.from({ length: 42 }, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return d; });
    const dows = Array.from({ length: 7 }, (_, i) => new Date(2024, 0, 1 + i).toLocaleDateString(LOC, { weekday: "short" }).replace(".", ""));
    return `<div class="cal-head"><button type="button" class="btn ghost icon" id="mPrev" aria-label="${T("Mês anterior", "Previous month")}"><i class="ic i-chevron-left"></i></button><h2>${esc(cap(first.toLocaleDateString(LOC, { month: "long", year: "numeric" })))}</h2><button type="button" class="btn ghost icon" id="mNext" aria-label="${T("Próximo mês", "Next month")}"><i class="ic i-chevron-right"></i></button></div>
      <div class="cal" data-testid="calendar">${dows.map((d) => `<span class="dow">${esc(d)}</span>`).join("")}${cells.map((d) => { const k = dkey(d), l = byDay.get(k) || [];
        return `<button type="button" data-day="${k}" class="${d.getMonth() !== first.getMonth() ? "out" : ""} ${k === todayK ? "today" : ""}" aria-pressed="${day === k}" aria-label="${esc(dayTitle(k))}: ${l.length}"><span class="n">${d.getDate()}</span><span class="dots">${l.slice(0, 8).map((e) => `<i class="${clash.has(k) && statusOf(e) === "going" ? "x" : statusOf(e) ? "go" : e.kind === "table" ? "tb" : ""}"></i>`).join("")}</span></button>`; }).join("")}</div>`;
  }
  function draw() {
    const app = $("app");
    const locBox = `<section class="ev-loc" data-testid="where"><div class="where">${where ? `${esc(where.label || T("Minha localização", "My location"))}<small>${T(`Até ${km} km`, `Within ${km} km`)}</small>` : T("Onde você joga?", "Where do you play?")}</div>
      <button type="button" class="btn small" id="geo"><i class="ic i-globe"></i>${T("Usar minha localização", "Use my location")}</button>
      <form id="cityF"><input id="city" type="search" placeholder="${T("ou digite cidade, bairro, endereço ou CEP", "or type a city, district, address or postcode")}" aria-label="${T("Cidade, bairro, endereço ou CEP", "City, district, address or postcode")}"><button type="submit" class="btn small">${T("Buscar", "Search")}</button></form>
      <label class="small">${T("Raio", "Radius")} <select id="km" class="inline">${[25, 50, 100, 200, 300].map((k) => `<option value="${k}" ${k === km ? "selected" : ""}>${k} km</option>`).join("")}</select></label></section>`;
    if (!where) { app.innerHTML = locBox + `<div class="empty"><img src="../ui/assets/empty/search.svg" alt=""><b>${T("Escolha onde procurar", "Choose where to look")}</b><p>${T("Use sua localização ou digite sua cidade. Ela fica só neste aparelho.", "Use your location or type your city. It stays on this device.")}</p></div>`; wire(); return; }
    const list = all(), clash = conflicts(), clashDays = new Set(clash.map(([k]) => k));
    const formats = [...new Set(events.map((e) => e.format).filter(Boolean))].sort();
    // the list shows the next two weeks first (São Paulo alone has 200+ events in four months); "Meus" shows all
    const until = Date.now() + horizon * 864e5, cut = view === "list" && !onlyMine ? list.filter((e) => new Date(e.start).getTime() <= until) : list;
    const hidden = list.length - cut.length;
    let shown = view === "cal" && day ? list.filter((e) => dkey(e.start) === day) : cut;
    if (view === "list" && order === "km") shown = shown.slice().sort((a, b) => (a.km ?? 1e9) - (b.km ?? 1e9) || String(a.start).localeCompare(String(b.start)));
    const groups = new Map();
    if (view === "list" && order === "km") groups.set("", shown);
    else for (const e of shown) { const k = dkey(e.start); groups.set(k, (groups.get(k) || []).concat(e)); }
    app.innerHTML = locBox
      + (clash.length ? `<div class="ev-warn" role="alert" data-testid="clash"><i class="ic i-alert"></i><div>${clash.map(([k, l]) => `<div><b>${esc(dayTitle(k))}:</b> ${T("você marcou \"Vou\" em", "you said Going to")} ${l.length} ${T("eventos", "events")} (${l.map((e) => esc(e.name)).join(" · ")})</div>`).join("")}</div></div>` : "")
      + `<div class="ev-bar"><div class="seg" role="group" aria-label="${T("Ver", "View")}"><button type="button" data-view="list" aria-pressed="${view === "list"}">${T("Lista", "List")}</button><button type="button" data-view="cal" aria-pressed="${view === "cal"}">${T("Calendário", "Calendar")}</button></div>
        <button type="button" class="chipbtn" id="mine" aria-pressed="${onlyMine}">${T("Meus eventos", "My events")}</button><button type="button" class="chipbtn" id="free" aria-pressed="${onlyFree}">${T("Grátis", "Free")}</button>
        ${formats.length > 1 ? `<select id="fmt" class="inline" aria-label="${T("Formato", "Format")}"><option value="">${T("Todos os formatos", "All formats")}</option>${formats.map((f) => `<option ${f === fmt ? "selected" : ""}>${esc(f)}</option>`).join("")}</select>` : ""}
        ${view === "list" ? `<label class="small">${T("Ordenar", "Sort")} <select id="order" class="inline" data-testid="order"><option value="date" ${order === "date" ? "selected" : ""}>${T("por data", "by date")}</option><option value="km" ${order === "km" ? "selected" : ""}>${T("por distância", "by distance")}</option></select></label>` : ""}
        <span class="grow"></span><span class="small muted">${loading ? T("Carregando…", "Loading…") : esc(T(`${list.length} eventos`, `${list.length} events`))}</span></div>`
      + (view === "cal" ? calHtml(list) + (day ? `<div class="row between" style="margin-top:var(--sp-3)"><h2 style="margin:0">${esc(dayTitle(day))}</h2><button type="button" class="btn small ghost" id="allDays">${T("Ver todos os dias", "All days")}</button></div>` : "") : "")
      + (failed ? `<div class="empty"><img src="../ui/assets/empty/error.svg" alt=""><b>${T("Não conseguimos falar com o Play Hub agora.", "Couldn't reach the Play Hub now.")}</b><button type="button" class="btn" id="retry">${T("Tentar de novo", "Try again")}</button></div>`
        : shown.length ? [...groups.entries()].map(([k, l]) => `${(view === "cal" && day) || !k ? "" : `<h2 class="ev-day">${esc(dayTitle(k))}</h2>`}<div class="ev-list">${l.map((e) => evHtml(e, clashDays.has(dkey(e.start)) && statusOf(e) === "going")).join("")}</div>`).join("")
          + (view === "list" && hidden > 0 ? `<div class="ev-more"><button type="button" class="btn" id="more" data-testid="more">${esc(T(`Ver mais ${hidden} eventos (próximas semanas)`, `See ${hidden} more events (later weeks)`))}</button></div>` : "")
        : loading ? `<span class="skel" style="height:120px;border-radius:var(--r-lg)"></span>` : `<div class="empty plain"><b>${T("Nenhum evento encontrado.", "No events found.")}</b><p>${T("Aumente o raio ou tire os filtros.", "Widen the radius or clear the filters.")}</p></div>`)
      + `<p class="small faint" style="margin-top:var(--sp-6)">${T("Eventos do Disney Lorcana Play Network (Ravensburger). A inscrição e o pagamento são feitos no Play Hub; aqui você só marca para se organizar.", "Events from the Disney Lorcana Play Network (Ravensburger). Registration and payment happen on the Play Hub; here you only mark them to plan.")}</p>`;
    wire();
  }
  function wire() {
    $("geo").onclick = () => {
      if (!navigator.geolocation) { toast(T("Seu navegador não informa a localização.", "Location isn't available."), true); return; }
      navigator.geolocation.getCurrentPosition((p) => { where = { lat: +p.coords.latitude.toFixed(2), lng: +p.coords.longitude.toFixed(2), label: T("Perto de mim", "Near me") }; save(); load(); }, () => toast(T("Não foi possível pegar sua localização. Digite a cidade.", "Couldn't get your location. Type your city."), true), { maximumAge: 6e5, timeout: 1e4 });
    };
    $("cityF").onsubmit = async (e) => { e.preventDefault(); const q = $("city").value.trim(); if (q.length < 2) return;
      const g = await findPlace(q);
      if (g === undefined) { toast(T("Não foi possível buscar agora. Tente de novo.", "Couldn't search now. Try again."), true); return; }
      if (!g) { toast(T("Não achei esse lugar. Tente o bairro ou a cidade.", "Couldn't find that place. Try the district or city."), true); return; }
      where = g; save(); load(); };
    $("km").onchange = (e) => { km = +e.target.value; save(); load(); };
    document.querySelectorAll("[data-view]").forEach((b) => b.onclick = () => { view = b.dataset.view; day = null; draw(); });
    $("mine")?.addEventListener("click", () => { onlyMine = !onlyMine; draw(); });
    $("free")?.addEventListener("click", () => { onlyFree = !onlyFree; draw(); });
    $("fmt")?.addEventListener("change", (e) => { fmt = e.target.value; draw(); });
    $("retry")?.addEventListener("click", load);
    $("more")?.addEventListener("click", () => { horizon += 30; draw(); });
    $("order")?.addEventListener("change", (e) => { order = e.target.value; try { localStorage.setItem("inkwell-events-order", order); } catch { /* */ } draw(); });
    $("allDays")?.addEventListener("click", () => { day = null; draw(); });
    $("mPrev")?.addEventListener("click", () => { const b = month || new Date(new Date().getFullYear(), new Date().getMonth(), 1); month = new Date(b.getFullYear(), b.getMonth() - 1, 1); draw(); });
    $("mNext")?.addEventListener("click", () => { const b = month || new Date(new Date().getFullYear(), new Date().getMonth(), 1); month = new Date(b.getFullYear(), b.getMonth() + 1, 1); draw(); });
    document.querySelectorAll("[data-day]").forEach((b) => b.onclick = () => { day = day === b.dataset.day ? null : b.dataset.day; draw(); });
    const byKey = new Map(all().map((e) => [e.key, e]));
    document.querySelectorAll("[data-ev] [data-act]").forEach((b) => b.onclick = () => {
      const e = byKey.get(b.closest("[data-ev]").dataset.ev); if (!e) return;
      const a = b.dataset.act, st = statusOf(e), m = marks.get(String(e.id)) || {};
      if (a === "going" || a === "maybe") mark(e, { status: st === a ? null : a });
      else if (a === "registered") mark(e, { status: st, registered: !m.registered });
      else if (a === "paid") mark(e, { status: st, paid: !m.paid });
      else if (a === "ics") ics(e);
      else if (a === "share") share(e);
    });
  }
  // ?onde=Campinas (from the Início box): look the place up, then forget the parameter
  const onde = new URLSearchParams(location.search).get("onde");
  if (onde) {
    history.replaceState(null, "", location.pathname + location.hash);
    draw();
    findPlace(onde.slice(0, 120)).then((g) => { if (g) { where = g; save(); } else toast(T("Não achei esse lugar. Tente o bairro ou a cidade.", "Couldn't find that place. Try the district or city."), true); load(); draw(); });
  } else { draw(); load(); }
})();
</script>

<script>window.INKWELL_SHELL = {"page": "events"};
/* Inkwell site shell (design v2, Noite): app bar, phone tab bar, account menu and the one sign-in sheet.
   Markup and classes follow packages/ui/tokens.css (§4 Shell, §11 Sheet); see DESIGN-CHANGES.md.
   Pages set window.INKWELL_SHELL = { page: "feed" | "cards" | "decks" | "coach" | "trades" } and may call:
     window.INKWELL_SIGNIN()            open the sign-in sheet
     window.INKWELL_SHELL_BADGE(n)      set the Trocas count (requests waiting for me)
   Sign-in uses window.INKWELL_CLOUD (cloud.js): one session for the whole site. */
(() => {
  "use strict";
  let lang = "pt";
  try { lang = localStorage.getItem("inkwell-lang") || "pt"; } catch { /* */ }
  const pt = lang === "pt";
  const T = (p, e) => (pt ? p : e);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const page = (window.INKWELL_SHELL || {}).page || "";
  const UI = "../ui/";
  const CLOUD = window.INKWELL_CLOUD;
  const me = CLOUD?.user();
  // Every module stays in the top bar (design "The Great Illuminary", 26/10/2026). On phones the bottom bar has
  // the four main places plus "Mais", which lists the rest; nothing is hidden behind the account menu only.
  const NAV = [
    ["feed", "../feed/", T("Início", "Home"), "home"],
    ["cards", "../colecao/", T("Coleção", "Collection"), "cards"],
    ["decks", "../decks/", "Decks", "decks"],
    ["communities", "../comunidades/", T("Comunidades", "Communities"), "users"],
    ["coach", "../coach/", T("Jogos", "Games"), "games"],
    ["events", "../eventos/", T("Eventos", "Events"), "calendar"],
    ["trades", "../trades/", T("Trocas", "Trades"), "trades"],
    ["prices", "../precos/", T("Preços", "Prices"), "coins"],
  ];
  const TABS = ["feed", "cards", "decks", "communities"];
  const MORE = NAV.filter(([k]) => !TABS.includes(k));
  let theme = "dia"; try { theme = localStorage.getItem("inkwell-theme") === "noite" ? "noite" : "dia"; } catch { /* */ }
  const cur = (k) => (k === page ? ' aria-current="page"' : "");

  if (!document.querySelector('link[rel="manifest"]')) {
    document.head.insertAdjacentHTML("beforeend", `<link rel="manifest" href="../inkwell.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Inkwell">`);
  }
  const bar = document.createElement("header");
  bar.className = "appbar";
  bar.innerHTML = `<div class="appbar-in"><a class="brand" href="../feed/"><img src="../ink/logo-coin.png" alt="" width="32" height="32">Inkwell</a>
    <nav class="sections" aria-label="${T("Seções", "Sections")}">${NAV.map(([k, href, label, ic]) => `<a href="${href}"${cur(k)} data-iw="${k}"><i class="ic i-${ic}"></i>${label}${k === "trades" ? '<span class="count" data-trades-count hidden></span>' : ""}</a>`).join("")}</nav>
    <div class="end">
      <button type="button" class="btn ghost icon" id="iwTheme" aria-pressed="${theme === "noite"}" aria-label="${theme === "noite" ? T("Usar o tema claro", "Use the light theme") : T("Usar o tema escuro", "Use the dark theme")}"><i class="ic ${theme === "noite" ? "i-sun" : "i-moon"}"></i></button>
      <a class="btn ghost counter-btn" href="../counter/" aria-label="${T("Abrir o Contador", "Open the Counter")}"><i class="ic i-counter"></i><span>${T("Contador", "Counter")}</span></a>
      ${me ? `<button type="button" class="btn ghost icon" id="iwFind" aria-label="${T("Buscar pessoas e comunidades", "Search people and communities")}" aria-haspopup="dialog" aria-expanded="false" title="${T("Buscar", "Search")} ( / )"><i class="ic i-search"></i></button>` : ""}
      ${me ? `<button type="button" class="btn ghost icon bell-btn" id="iwBell" aria-label="${T("Notificações", "Notifications")}" aria-haspopup="menu" aria-expanded="false" hidden><i class="ic i-bell"></i><span class="count" id="iwBellN" hidden></span></button>` : ""}
      ${me ? `<button type="button" class="av-btn" id="iwAcct" aria-label="${T("Sua conta", "Your account")}" aria-haspopup="menu" aria-expanded="false"><span class="av" id="iwAv">${esc((me.email || "?")[0].toUpperCase())}</span><span class="count iw-badge" id="iwBadge" hidden></span></button>`
        : `<button type="button" class="btn ghost icon" id="iwLangBtn" aria-label="${T("Aparência e idioma", "Appearance and language")}" aria-haspopup="menu" aria-expanded="false"><i class="ic i-globe"></i></button>
           <button type="button" class="btn small" id="iwSignIn">${T("Entrar", "Sign in")}</button>`}
    </div></div>`;
  document.body.prepend(bar);
  const tabs = document.createElement("nav");
  tabs.className = "tabbar";
  tabs.setAttribute("aria-label", T("Seções", "Sections"));
  const inMore = MORE.some(([k]) => k === page);
  tabs.innerHTML = NAV.filter(([k]) => TABS.includes(k)).map(([k, href, label, ic]) => `<a href="${href}"${cur(k)} data-iw="${k}"><i class="pip"><i class="ic i-${ic}"></i></i>${label}</a>`).join("")
    + `<button type="button" id="iwMore" class="tab-more" aria-haspopup="dialog" aria-expanded="false"${inMore ? ' aria-current="page"' : ""}><i class="pip"><i class="ic i-more"></i></i>${T("Mais", "More")}<span class="count" data-trades-count hidden></span></button>`;
  document.body.append(tabs);
  document.body.classList.add("iw-has-shell");

  // ---------- menus ----------
  const end = bar.querySelector(".end");
  let menu = null, opener = null;
  const closeMenu = () => { if (!menu) return; menu.remove(); menu = null; opener?.setAttribute("aria-expanded", "false"); opener?.focus(); opener = null; };
  function openMenu(btn, html, cls = "") {
    if (menu) { const same = opener === btn; closeMenu(); if (same) return; }
    opener = btn; btn.setAttribute("aria-expanded", "true");
    menu = document.createElement("div");
    menu.className = `menu ${cls}`; menu.setAttribute("role", "menu");
    menu.innerHTML = html;
    end.append(menu);
    menu.querySelector("[role^=menuitem], button")?.focus();
    menu.querySelectorAll("[data-lang-pick]").forEach((b) => b.addEventListener("click", () => {
      if (b.dataset.langPick !== lang) { try { localStorage.setItem("inkwell-lang", b.dataset.langPick); } catch { /* */ } location.reload(); }
    }));
    menu.querySelector("[data-signout]")?.addEventListener("click", () => {
      try { sessionStorage.removeItem("inkwell-guest-intent-v1"); } catch { /* */ }   // signing out cancels a pending "save after sign-in"; the draft stays
      CLOUD?.signOut(); location.reload();
    });
  }
  document.addEventListener("click", (e) => { if (menu && !menu.contains(e.target) && !opener?.contains(e.target)) closeMenu(); });

    async function drawPush() {
      const el = $("iwPush"); if (!el) return;
      if (iosBrowser) { el.innerHTML = `<p class="small muted">${T("Para receber avisos no iPhone: toque em Compartilhar → Adicionar à Tela de Início, abra o Inkwell por lá e ative aqui.", "To get notices on iPhone: Share → Add to Home Screen, open Inkwell from there and turn them on here.")}</p>`; return; }
      if (!pushOk) { el.innerHTML = `<p class="small muted">${T("Este navegador não recebe avisos.", "This browser can't receive notices.")}</p>`; return; }
      if (Notification.permission === "denied") { el.innerHTML = `<p class="small muted">${T("Os avisos estão bloqueados nas configurações do navegador para este site.", "Notices are blocked for this site in the browser settings.")}</p>`; return; }
      let sub = null; try { sub = await (await navigator.serviceWorker.getRegistration("../push/"))?.pushManager.getSubscription(); } catch { sub = null; }
      el.innerHTML = sub ? `<span class="small"><i class="ic i-bell"></i> ${T("Avisos ligados neste aparelho", "Notices on for this device")}</span><button type="button" class="btn ghost small" data-push="off">${T("Desligar", "Turn off")}</button>`
        : `<button type="button" class="btn small primary" data-push="on"><i class="ic i-bell"></i>${T("Avisar neste aparelho", "Notify me on this device")}</button>`;
      el.querySelector("[data-push]").onclick = async (ev) => {
        ev.stopPropagation(); const b = ev.currentTarget; b.disabled = true;
        try {
          if (b.dataset.push === "on") {
            if ((await Notification.requestPermission()) !== "granted") { drawPush(); return; }
            const reg = await pushReg();   // not .ready: this page isn't in the worker's scope, so .ready never settles
            const w = reg.installing || reg.waiting;
            if (w && !reg.active) await new Promise((ok) => { w.addEventListener("statechange", () => { if (w.state === "activated") ok(); }); setTimeout(ok, 8000); });
            const s2 = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(VAPID) });
            const j = s2.toJSON();
            await CLOUD.api("rpc/save_push_sub", { method: "POST", body: { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_ua: navigator.userAgent.slice(0, 200) } });
          } else if (sub) {
            await CLOUD.api("rpc/delete_push_sub", { method: "POST", body: { p_endpoint: sub.endpoint } }).catch(() => {});
            await sub.unsubscribe();
          }
        } catch { el.insertAdjacentHTML("beforeend", `<p class="small" style="color:var(--loss)">${T("Não deu certo. Tente de novo.", "That didn't work. Try again.")}</p>`); b.disabled = false; return; }
        drawPush();
      };
    }
    $("iwBell")?.addEventListener("click", (e) => {
      const list = notes || [];
      openMenu(e.currentTarget, `<div class="menu-label">${T("Notificações", "Notifications")}</div>${list.length ? list.map((n) => `<a class="menu-item${n.unread ? " unread" : ""}" role="menuitem" href="${noteHref(n)}"><span>${n.kind === "event_soon" ? `<b>${T("Lembrete", "Reminder")}:</b> ${esc(n.ref?.text || T("seu evento", "your event"))} ${esc(T(...NK.event_soon))}` : `<b>${esc(n.name || T("Alguém", "Someone"))}</b> ${esc(T(...(NK[n.kind] || ["", ""])))}`}${n.kind !== "event_soon" && (n.ref?.text || n.ref?.name) ? `<small>${esc(n.ref.text || n.ref.name)}</small>` : ""}<small>${esc(new Date(n.at).toLocaleString(lang === "en" ? "en" : "pt-BR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }))}</small></span></a>`).join("") : `<div class="menu-item" style="pointer-events:none"><span class="small">${T("Nada por aqui ainda.", "Nothing here yet.")}</span></div>`}<div class="push-row" id="iwPush"></div>`, "notif");
      drawPush();
      if (list.some((n) => n.unread)) CLOUD.api("rpc/read_notifications", { method: "POST", body: {} }).then(() => { list.forEach((n) => { n.unread = false; }); showBell(); }).catch(() => {});
    });
    // Global search (supabase/search_privacy.sql): people with a public profile or my friends, and communities
    const findBtn = $("iwFind");
    const openFind = () => {
      if (!findBtn) return;
      openMenu(findBtn, `<div class="find" data-testid="find"><input type="search" id="iwFindQ" placeholder="${T("Buscar pessoas e comunidades", "Search people and communities")}" aria-label="${T("Buscar pessoas e comunidades", "Search people and communities")}" autocomplete="off" maxlength="60"><div id="iwFindR" aria-live="polite"><p class="small muted">${T("Digite pelo menos 2 letras.", "Type at least 2 letters.")}</p></div></div>`, "find-menu");
      const q = $("iwFindQ"), out = $("iwFindR"); let t = 0, seq = 0; q.focus();
      const ini = (n) => esc(String(n || "?").trim().charAt(0).toUpperCase() || "?");
      const sec = (title, rows) => rows.length ? `<div class="menu-label">${title}</div>${rows.join("")}` : "";
      q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(async () => {
        const v = q.value.trim(), my = ++seq;
        if (v.length < 2) { out.innerHTML = `<p class="small muted">${T("Digite pelo menos 2 letras.", "Type at least 2 letters.")}</p>`; return; }
        out.innerHTML = `<p class="small muted">${T("Buscando…", "Searching…")}</p>`;
        let r = null; try { r = await CLOUD.api("rpc/search_all", { method: "POST", body: { p_q: v } }); } catch { r = null; }
        if (my !== seq) return;
        if (!r) { out.innerHTML = `<p class="small muted">${T("A busca ainda não está disponível.", "Search isn't available yet.")}</p>`; return; }
        const people = (r.people || []).map((p) => `<a class="menu-item" role="menuitem" href="${p.handle ? `../perfil/?u=${encodeURIComponent(p.handle)}` : "../feed/#amigos"}"><span class="av sm">${ini(p.name)}</span><span><b>${esc(p.name || "")}</b><small>${esc([p.handle ? "@" + p.handle : "", p.friend ? T("Amigo", "Friend") : "", p.city || ""].filter(Boolean).join(" · "))}</small></span></a>`);
        const comms = (r.communities || []).map((c) => `<a class="menu-item" role="menuitem" href="../comunidades/?c=${encodeURIComponent(c.slug)}"><span class="av sm"><i class="ic i-users"></i></span><span><b>${esc(c.name)}</b><small>${esc([c.city, c.mine ? T("Você participa", "You're a member") : ""].filter(Boolean).join(" · "))}</small></span></a>`);
        out.innerHTML = sec(T("Pessoas", "People"), people) + sec(T("Comunidades", "Communities"), comms) || `<p class="small muted">${T("Nada encontrado.", "Nothing found.")}</p>`;
      }, 250); });
    };
    findBtn?.addEventListener("click", openFind);
    document.addEventListener("keydown", (e) => { if (e.key === "/" && !e.ctrlKey && !e.metaKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "") && !document.activeElement?.isContentEditable && !$("iwFindQ")) { e.preventDefault(); openFind(); } });
    // an invite link opened before signing in (perfil/?convite=…): accept it on whichever page the sign-in lands
    let inv = null; try { inv = localStorage.getItem("inkwell-invite"); } catch { /* */ }
    if (inv && page !== "profile") {
      try { localStorage.removeItem("inkwell-invite"); } catch { /* */ }
      CLOUD.api("rpc/accept_invite", { method: "POST", body: { p_code: inv } }).catch(() => {});
    }
    Promise.all([
      CLOUD.api(`user_loans?select=id&status=eq.requested&created_by=neq.${me.id}`).catch(() => []),
      CLOUD.api(`user_trades?select=id&status=eq.proposed&partner=eq.${me.id}`).catch(() => []),
    ]).then(([a, b]) => { if (page !== "trades") window.INKWELL_SHELL_BADGE((a || []).length + (b || []).length); });
    CLOUD.api("rpc/my_duels_sync", { method: "POST", body: {} }).then((r) => {
      const t = Date.parse(r?.[0]?.last_run_at); if (!t) return;
      const m = Math.max(0, Math.round((Date.now() - t) / 60000));
      syncAgo = m < 1 ? T("agora", "now") : m < 60 ? T(`há ${m} min`, `${m} min ago`) : T(`há ${Math.round(m / 60)} h`, `${Math.round(m / 60)} h ago`);
    }).catch(() => {});
  }

  // ---------- tap a card thumbnail to see it large (any page; not where the thumbnail is already a button or link) ----------
  const zoom = document.createElement("dialog");
  zoom.className = "iw-zoom-card"; zoom.id = "iwZoom"; zoom.setAttribute("aria-label", T("Carta ampliada", "Card, larger"));
  zoom.innerHTML = `<button type="button" class="btn ghost icon" data-zclose aria-label="${T("Fechar", "Close")}"><i class="ic i-close"></i></button><figure><img alt=""><figcaption></figcaption></figure>`;
  document.body.append(zoom);
  zoom.addEventListener("click", () => zoom.close());
  const zoomable = (el) => { const t = el.closest?.(".thumb, .iw-card"); if (!t || !t.querySelector("img") || t.closest("a, button, label, summary, dialog.iw-dialog, #iwZoom, [role=button], [data-nozoom]")) return null; return t; };
  document.addEventListener("click", (e) => {
    const t = zoomable(e.target); if (!t) return;
    const img = t.querySelector("img");
    e.preventDefault(); e.stopPropagation();
    zoom.querySelector("img").src = img.currentSrc || img.src;
    zoom.querySelector("img").alt = img.alt || "";
    zoom.querySelector("figcaption").textContent = img.alt || "";
    zoom.querySelector("figcaption").hidden = !img.alt;
    zoom.showModal();
  }, true);
  document.addEventListener("mouseover", (e) => { const t = zoomable(e.target); if (t) t.style.cursor = "zoom-in"; });
})();
</script>
</body>
</html>
