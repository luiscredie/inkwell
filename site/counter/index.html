<script>window.INKWELL_CLOUD_CONFIG = {"url": "https://sorefaetiaebmjploanp.supabase.co", "key": "sb_publishable_RkAWW-ENz70CXA6_QV7aHw_MpfD7Gn2", "redirect": "https://luiscredie.github.io/inkwell/counter/"};
/* Inkwell Lore Counter: cloud adapter for the offline app.
 *
 * Talks to the Inkwell Supabase project with plain fetch (no library to cache):
 *   sign-in   email one-time code (or the magic link, when opened in the same browser)
 *   storage   public.game_logs, one row per game, upserted on (user_id, game_id),
 *             so a retry after a dropped connection never creates a duplicate
 * The counter keeps every match locally until send() resolves true.
 * Only the public URL and publishable key are here; row-level security limits each user to their own rows.
 */
// Feature flags. The guest experience (Começar meu Inkwell, new Início) is on for everyone since 26/10/2026.
// ?preview=off shows the previous experience in this tab (sessionStorage); ?preview=visitante turns it back on.
// Rollback: set GUEST_DEFAULT to false (nothing in the database changes).
window.INKWELL_FLAGS = (() => {
  const GUEST_DEFAULT = true;
  const f = { guestProfile: GUEST_DEFAULT };
  try {
    const q = new URLSearchParams(location.search).get("preview");
    if (q === "visitante") sessionStorage.setItem("inkwell-preview", "visitante");
    if (q === "off") sessionStorage.setItem("inkwell-preview", "off");
    const v = sessionStorage.getItem("inkwell-preview");
    if (v === "visitante") f.guestProfile = true;
    if (v === "off") f.guestProfile = false;
  } catch { /* storage off: the default stays */ }
  return f;
})();
window.INKWELL_CLOUD = (() => {
  const cfg = window.INKWELL_CLOUD_CONFIG || {};
  if (!cfg.url || !cfg.key) return null;
  // One sign-in for the whole site: the counter, Coach Review, Início, Trocas and the Inkwell app itself
  // (its supabase-js client uses this same storage key), so signing in or out on one page does it on all.
  const KEY = "inkwell-counter-auth";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch { return null; } };
  let sess = load();
  const store = (x) => { sess = x; try { if (x) localStorage.setItem(KEY, JSON.stringify(x)); else localStorage.removeItem(KEY); } catch { /* private mode */ } };
  const headers = (tok) => ({ apikey: cfg.key, "Content-Type": "application/json", ...(tok ? { Authorization: `Bearer ${tok}` } : {}) });
  const claims = (jwt) => { try { return JSON.parse(atob(jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); } catch { return {}; } };
  const session = (r) => {   // the same shape supabase-js keeps, so both read each other's session
    const c = claims(r.access_token);
    const expires_at = r.expires_at || c.exp || Math.floor(Date.now() / 1000) + (r.expires_in || 3600);
    return { access_token: r.access_token, refresh_token: r.refresh_token, token_type: "bearer",
      expires_in: r.expires_in || Math.max(0, expires_at - Math.floor(Date.now() / 1000)), expires_at,
      user: { ...(r.user || {}), id: r.user?.id || c.sub, email: r.user?.email || c.email } };
  };

  // Magic link opened in this same browser: tokens arrive in the URL fragment.
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("access_token") && h.get("refresh_token")) {
    store(session({ access_token: h.get("access_token"), refresh_token: h.get("refresh_token"), expires_in: +h.get("expires_in") || 3600 }));
    history.replaceState(null, "", location.pathname + location.search);
    window.INKWELL_FROM_LINK = true;   // this tab was opened by the e-mail link (the guest editor tells the original tab apart)
  } else if (h.get("error_code") || h.get("error")) {
    // The e-mail link didn't work (already used or expired): Supabase sends back #error=…&error_code=otp_expired.
    // Some mail services (Outlook/Hotmail) open links by themselves to scan them, which uses the link up.
    history.replaceState(null, "", location.pathname + location.search);
    window.INKWELL_LINK_FAILED = h.get("error_code") || h.get("error");
  }

  async function token() {
    sess = load();   // another page (or the Inkwell app) may have signed in, out, or refreshed the tokens meanwhile
    if (!sess) return null;
    if (sess.expires_at - 60 > Date.now() / 1000) return sess.access_token;
    const used = sess.refresh_token;
    const r = await fetch(`${cfg.url}/auth/v1/token?grant_type=refresh_token`, { method: "POST", headers: headers(), body: JSON.stringify({ refresh_token: used }) });
    if (r.status === 400 || r.status === 401) {
      const now = load();   // a page that refreshed at the same moment already saved newer tokens: keep them
      if (now && now.refresh_token !== used && now.expires_at - 60 > Date.now() / 1000) { sess = now; return sess.access_token; }
      store(null); return null;   // signed out elsewhere
    }
    if (!r.ok) throw new Error(`refresh ${r.status}`);
    store(session(await r.json()));
    return sess.access_token;
  }

  // Authenticated call to the database's REST API (used by Coach Review). Errors carry a short code.
  async function api(path, { method = "GET", body, prefer } = {}) {
    const tok = await token();
    if (!tok) throw Object.assign(new Error("signed out"), { code: "auth" });
    const r = await fetch(`${cfg.url}/rest/v1/${path}`, {
      method, headers: { ...headers(tok), ...(prefer ? { Prefer: prefer } : {}) }, body: body === undefined ? undefined : JSON.stringify(body) });
    if (r.status === 401) store({ ...sess, expires_at: 0 });
    if (!r.ok) {
      const code = r.status === 401 || r.status === 403 ? "permission" : r.status === 400 || r.status === 409 || r.status === 413 ? "invalid_argument" : "unavailable";
      // the database's own reason (e.g. "adults_only", "event_full", "too_many_friend_requests") goes in the message,
      // so a page can tell the person what happened
      let why = ""; try { why = String((await r.json())?.message || "").slice(0, 200); } catch { /* no body */ }
      throw Object.assign(new Error(`${method} ${path.split("?")[0]} ${r.status}${why ? `: ${why}` : ""}`), { code, status: r.status, why });
    }
    const text = await r.text();
    return text ? JSON.parse(text) : null;
  }

  // The player's collections (public.inkwell_profiles). A new account has none yet, and every collection, deck
  // and wishlist save needs one, so the first visit creates an empty "principal" collection, then reads again.
  async function collections(select) {
    const q = `inkwell_profiles?select=${select}&order=updated_at.desc`;
    const r = await api(q);
    if (Array.isArray(r) && r.length) return r;
    const id = load()?.user?.id;
    if (!id) return r;
    await api("inkwell_profiles?on_conflict=user_id,profile", { method: "POST", prefer: "resolution=ignore-duplicates,return=minimal",
      body: { user_id: id, profile: "principal", schema: 2, data: { _schema: 2, collection: {}, decks: [], wishlist: {} } } });
    return api(q);
  }

  // an Edge Function by GET (signed in or not: the publishable key is enough for public ones)
  async function fn(name, params = {}) {
    const tok = sess ? await token().catch(() => null) : null;
    const r = await fetch(`${cfg.url}/functions/v1/${name}?${new URLSearchParams(params)}`, { headers: headers(tok) });
    if (!r.ok) throw Object.assign(new Error(`${name} ${r.status}`), { status: r.status });
    return r.json();
  }

  return {
    api, collections, fn,
    user: () => { sess = load(); return sess ? { id: sess.user?.id, email: sess.user?.email } : null; },
    status: () => { sess = load(); return sess ? { signedIn: true, email: sess.user?.email || "" } : { signedIn: false }; },
    async requestCode(email) {
      const redirect = cfg.redirect || location.href.split("#")[0];
      // where to come back after the confirmation page (/entrar/), same site only
      try { localStorage.setItem("inkwell-return", JSON.stringify({ path: location.pathname + location.search, at: Date.now() })); } catch { /* private mode */ }
      const r = await fetch(`${cfg.url}/auth/v1/otp?redirect_to=${encodeURIComponent(redirect)}`, { method: "POST", headers: headers(), body: JSON.stringify({ email, create_user: true }) });
      if (!r.ok) throw Object.assign(new Error(`otp ${r.status}`), { status: r.status });
    },
    async verify(email, code) {
      const r = await fetch(`${cfg.url}/auth/v1/verify`, { method: "POST", headers: headers(), body: JSON.stringify({ type: "email", email, token: String(code).replace(/\s/g, "") }) });
      if (!r.ok) throw Object.assign(new Error(`verify ${r.status}`), { status: r.status });
      store(session(await r.json()));
    },
    // The e-mail's own link to /entrar/?h=<token hash>: signs in only when the person presses the button there,
    // so a mail scanner that just opens the link doesn't use it up.
    async verifyHash(tokenHash, type = "email") {
      const r = await fetch(`${cfg.url}/auth/v1/verify`, { method: "POST", headers: headers(), body: JSON.stringify({ type, token_hash: String(tokenHash) }) });
      if (!r.ok) throw Object.assign(new Error(`verify ${r.status}`), { status: r.status });
      store(session(await r.json()));
    },
    signOut() {
      const old = sess; store(null);
      if (old) fetch(`${cfg.url}/auth/v1/logout`, { method: "POST", headers: headers(old.access_token) }).catch(() => {});
    },
    async send(logs) {
      const tok = await token();   // also reloads sess
      if (!tok) return false;
      const rows = logs.map((l) => ({ user_id: sess.user.id, game_id: l.game_id, source: l.source, played_at: l.played_at, log: l }));
      const r = await fetch(`${cfg.url}/rest/v1/game_logs?on_conflict=user_id,game_id`, {
        method: "POST", headers: { ...headers(tok), Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(rows) });
      if (r.status === 401) store({ ...sess, expires_at: 0 });   // force a refresh on the next try
      return r.ok;
    },
  };
})();
</script>

      // motes: specks of light rising and twinkling
      for (const m of p.motes) {
        if (!reduce.matches) { m.y -= m.v * dt; if (m.y < -10) { m.y = h + rnd(0, 30); m.x = rnd(0, w); } }
        const x = m.x + Math.sin(time * .6 + m.ph) * m.sw;
        const fade = Math.min(1, Math.max(0, (m.y / h) * 1.4)) * (.55 + .45 * Math.sin(time * 2 + m.ph * 3));
        const rad = m.r * 4;
        const g = ctx.createRadialGradient(x, m.y, 0, x, m.y, rad);
        g.addColorStop(0, m.c + "ff"); g.addColorStop(.25, m.c + "88"); g.addColorStop(1, m.c + "00");
        ctx.globalAlpha = Math.max(0, fade) * .9; ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, m.y, rad, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    }
    function frame(ts) {
      raf = requestAnimationFrame(frame);
      if (document.hidden) return;
      if (ts - last < 33) return; // ~30 fps is plenty and kind to the battery
      const dt = last ? Math.min(.1, (ts - last) / 1000) : 0; last = ts;
      const time = ts / 1000;
      for (const p of panes) draw(p, time, dt);
      if (reduce.matches) { cancelAnimationFrame(raf); } // one still frame when motion is reduced
    }
    addEventListener("resize", () => { clearTimeout(reset.tm); reset.tm = setTimeout(reset, 150); });
    return { reset };
  })();

  // ---------- tapping ----------
  const pending = zero(), timers = {};
  function clearDeltas() { for (const seat of SEATS) { pending[seat] = 0; clearTimeout(timers[seat]); $(`d${n(seat)}`)?.classList.remove("show"); } }
  function resetLore() { s.lore = zero(); s.log = []; s.gameStart = null; clearDeltas(); }
  function tap(seat, d) {
    if (s.matchDone) return startMatch();
    if (s.won) return nextGame();
    const before = s.lore[seat], after = Math.max(0, before + d);
    if (after === before) return;
    s.lore[seat] = after;
    s.gameStart ||= Date.now();
    s.log.push({ seat, from: before, to: after, at: Date.now() });
    if (s.log.length > 300) s.log.shift();
    pending[seat] += after - before;
    const del = $(`d${n(seat)}`);
    del.textContent = `${pending[seat] > 0 ? "+" : ""}${pending[seat]}`; del.classList.add("show");
    clearTimeout(timers[seat]);
    timers[seat] = setTimeout(() => { pending[seat] = 0; del.classList.remove("show"); }, 1400);
    const out = $(`o${n(seat)}`); out.classList.add("tick"); setTimeout(() => out.classList.remove("tick"), 90);
    render();
    if (after >= 20 && before < 20) award(seat, "lore");
  }
  function undo() {
    const last = s.log.pop(); if (!last) return;
    if (last.award) {
      s.match.games.pop(); s.wins[last.seat] -= 1; s.won = null; s.matchDone = false;
      if (last.auto) { const tp = s.log.pop(); if (tp) s.lore[tp.seat] = tp.from; }
    } else s.lore[last.seat] = last.from;
    render();
  }

  // ---------- sheets ----------
  function open(html, wire) { $("card").innerHTML = html; $("sheet").hidden = false; wire?.(); }
  function close() { $("sheet").hidden = true; $("card").innerHTML = ""; }
  $("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) close(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("sheet").hidden) close(); });
  function inkPicker(id, selected) {
    // the official ink symbols (../ink/<ink>.svg); the colour stays behind each one in case an image fails to load
    const nameOf = (i) => (s.lang === "pt" ? INK_PT[i] : i) || i;
    return `<div class="inks" id="${id}">${INKS.map((i) => `<button type="button" class="dot sym" data-ink="${i}" aria-pressed="${selected.includes(i)}" aria-label="${esc(nameOf(i))}" style="--c:${HEX[i]}"><img src="../ink/${i.toLowerCase()}.svg" alt="" onerror="this.remove()"></button>`).join("")}</div>
      <div class="dot-label">${INKS.map((i) => `<span>${esc(nameOf(i))}</span>`).join("")}</div>`;
  }
  function wireInks(id, sel, onChange) {
    $(id).querySelectorAll(".dot").forEach((b) => b.onclick = () => {
      const ink = b.dataset.ink, i = sel.indexOf(ink);
      if (i >= 0) sel.splice(i, 1); else { sel.push(ink); if (sel.length > 2) sel.shift(); }
      $(id).querySelectorAll(".dot").forEach((x) => x.setAttribute("aria-pressed", sel.includes(x.dataset.ink)));
      onChange?.(sel);
    });
  }
  // Decks from Inkwell, for the deck pickers: mine (my collections' decks, with the list) and my friends'
  // (name and inks only, supabase/friend_decks.sql). A copy stays here so the pickers work offline.
  async function loadInkDecks() {
    if (!CLOUD || !CLOUD.status().signedIn || navigator.onLine === false) return;
    const ink = (c) => (Array.isArray(c) ? c : []).filter((x) => HEX[x]).slice(0, 2);
    try {
      const [p, f] = await Promise.all([
        CLOUD.api("inkwell_profiles?select=profile,updated_at,decks:data->decks&order=updated_at.desc"),
        CLOUD.api("rpc/friend_decks", { method: "POST", body: {} }).catch(() => null)]);
      const mine = [];
      for (const x of p || []) for (const d of Array.isArray(x.decks) ? x.decks : []) {
        if (!d?.name) continue;
        const list = Object.entries(d.cards && typeof d.cards === "object" ? d.cards : {}).map(([card_id, q]) => ({ card_id, qty: +q || 0 })).filter((e) => e.qty > 0);
        mine.push({ id: String(d.id || ""), name: String(d.name).slice(0, 40), inks: ink(d.colors), list });
      }
      const friends = f ? f.map((r) => ({ who: r.friend, whoName: String(r.friend_name || "").slice(0, 40), id: String(r.deck_id || ""), name: String(r.name || "").slice(0, 40), inks: ink(r.colors) })) : s.ink?.friends || [];
      s.ink = { mine, friends }; save();
    } catch { /* keep the last copy */ }
  }
  function pickDeck(title, initial, cb, side = "me") {
    const sel = [...(initial?.inks || [])];
    const recent = s.recent.slice(0, 8);
    const mine = side === "me" ? s.ink?.mine || [] : [];
    const fr = side === "opp" ? s.ink?.friends || [] : [];
    const people = [...new Map(fr.map((d) => [d.who, d.whoName || "?"])).entries()];
    const chip = (attr, i, d, label) => `<button type="button" class="chip" ${attr}="${i}">${swatch(d.inks)}${esc(label ?? deckText(d))}</button>`;
    open(`<h2>${esc(title)}</h2>
      ${mine.length ? `<div class="grp"><span class="cap">${t().myDecks}</span><div class="chips">${mine.map((d, i) => chip("data-mine", i, d)).join("")}</div></div>` : ""}
      ${people.length ? `<div class="grp" id="frGrp"><span class="cap">${t().friendDeck}</span><div class="chips">${people.map(([, nm], i) => `<button type="button" class="chip" data-who="${i}">${esc(nm)}</button>`).join("")}</div></div>` : ""}
      <div class="grp"><span class="cap">${t().pick2}</span>${inkPicker("dk", sel)}</div>
      ${META.length ? `<div class="grp" id="metaGrp"></div>` : ""}
      <input class="txt" id="dn" maxlength="40" placeholder="${t().name}" value="${esc(initial?.name || "")}">
      ${recent.length ? `<div class="grp"><span class="cap">${t().recent}</span><div class="chips">${recent.map((d, i) => `<button type="button" class="chip" data-r="${i}">${swatch(d.inks)}${esc(deckText(d))}</button>`).join("")}</div></div>` : ""}
      <div class="row"><button type="button" class="btn quiet" id="dSkip">${t().skip}</button><button type="button" class="btn primary" id="dOk">${t().save}</button></div>`, () => {
      const drawMeta = () => {
        const g = $("metaGrp"); if (!g) return;
        const ms = META.filter((d) => sel.every((x) => d.inks.includes(x)));
        g.innerHTML = `<span class="cap">${t().metaDecks}</span><div class="chips">${ms.length ? ms.map((d) => `<button type="button" class="chip" data-meta="${META.indexOf(d)}">${swatch(d.inks)}${esc(d.name)}</button>`).join("") : `<span class="sub">${t().metaNone}</span>`}</div>`;
        g.querySelectorAll("[data-meta]").forEach((b) => b.onclick = () => { const d = META[+b.dataset.meta]; close(); cb({ inks: [...d.inks], name: d.name }); });
      };
      wireInks("dk", sel, drawMeta);
      drawMeta();
      document.querySelectorAll("[data-r]").forEach((b) => b.onclick = () => { const d = recent[+b.dataset.r]; close(); cb({ inks: [...d.inks], name: d.name || "" }); });
      document.querySelectorAll("[data-mine]").forEach((b) => b.onclick = () => { const d = mine[+b.dataset.mine]; close(); cb({ inks: [...d.inks], name: d.name, deck_id: d.id, list: d.list }); });
      const showPeople = () => {
        const g = $("frGrp"); if (!g) return;
        g.innerHTML = `<span class="cap">${t().friendDeck}</span><div class="chips">${people.map(([, nm], i) => `<button type="button" class="chip" data-who="${i}">${esc(nm)}</button>`).join("")}</div>`;
        g.querySelectorAll("[data-who]").forEach((b) => b.onclick = () => showDecks(+b.dataset.who));
      };
      const showDecks = (i) => {
        const [who, whoName] = people[i], ds = fr.filter((d) => d.who === who), g = $("frGrp");
        g.innerHTML = `<span class="cap">${esc(whoName)}</span><div class="chips">${ds.map((d, j) => chip("data-fd", j, d)).join("")}<button type="button" class="chip" id="frBack">${t().back}</button></div>`;
        g.querySelectorAll("[data-fd]").forEach((b) => b.onclick = () => { const d = ds[+b.dataset.fd]; close(); cb({ inks: [...d.inks], name: d.name, friend: { id: who, name: whoName } }); });
        $("frBack").onclick = showPeople;
      };
      showPeople();
      $("dSkip").onclick = () => { close(); cb(null); };
      $("dOk").onclick = () => {
        const d = { inks: [...sel], name: $("dn").value.trim() };
        close();
        if (!d.inks.length && !d.name) return cb(null);
        s.recent = [d, ...s.recent.filter((r) => deckText(r) !== deckText(d) || r.inks.join() !== d.inks.join())].slice(0, 12);
        cb(d);
      };
    });
  }

  // ---------- the opponent's deck: an Inkwell player found by name (supabase/find_player_decks.sql), or just the inks ----------
  // a library of deck names (../data/meta-archetypes.json: archetypes seen on inkdecks.com), kept for offline use
  let META = Array.isArray(s.meta) ? s.meta : [];
  fetch("../data/meta-archetypes.json").then((r) => (r.ok ? r.json() : null)).then((j) => {
    const list = (j?.decks || []).filter((d) => d && typeof d.name === "string").map((d) => ({ name: d.name.slice(0, 40), inks: (d.inks || []).filter((x) => HEX[x]).slice(0, 2) }));
    if (list.length) { META = list; s.meta = list; save(); }
  }).catch(() => {});
  const canFind = () => !!CLOUD && CLOUD.status().signedIn && navigator.onLine !== false;
  function pickOpp(cb) {
    const inks = () => pickDeck(t().oppDeck, s.match?.opp, cb, "opp");
    if (!canFind()) return inks();
    open(`<h2>${t().oppInkwell}</h2><p class="sub">${t().oppInkwellSub}</p>
      <div class="row"><button type="button" class="btn" id="oiNo">${t().no}</button><button type="button" class="btn primary" id="oiYes">${t().yes}</button></div>
      <button type="button" class="btn quiet" id="oiSkip">${t().skip}</button>`, () => {
      $("oiNo").onclick = inks; $("oiYes").onclick = () => findPlayer(cb, inks); $("oiSkip").onclick = () => { close(); cb(null); };
    });
  }
  function findPlayer(cb, inks) {
    let q = "", rows = [], state = "idle", timer = 0, seq = 0;
    const draw = () => {
      const players = [...new Map(rows.map((r) => [r.player, r])).values()];
      const list = state === "short" ? `<p class="sub">${t().typeMore}</p>` : state === "error" ? `<p class="sub">${t().findOff}</p>`
        : state === "done" && !players.length ? `<p class="sub">${t().noneFound}</p>`
        : players.map((p) => { const ds = rows.filter((r) => r.player === p.player && r.deck_id);
          return `<div class="grp fp"><span class="cap">${esc(p.name)}${p.handle ? ` · @${esc(p.handle)}` : ""}${p.friend ? ` · ${t().friendTag}` : ""}</span><div class="chips">
            ${ds.length ? ds.map((r) => `<button type="button" class="chip" data-fd="${esc(r.deck_id)}" data-fp="${esc(p.player)}">${swatch((r.colors || []).filter((x) => HEX[x]))}${esc(r.deck_name)}</button>`).join("")
              : `<span class="sub">${t().noDecks}</span> <button type="button" class="chip" data-fi="${esc(p.player)}">${t().pickInks}</button>`}</div></div>`; }).join("");
      $("fpList").innerHTML = list;
      $("fpList").querySelectorAll("[data-fd]").forEach((b) => b.onclick = () => {
        const r = rows.find((x) => x.player === b.dataset.fp && x.deck_id === b.dataset.fd);
        close(); cb({ inks: (r.colors || []).filter((x) => HEX[x]).slice(0, 2), name: String(r.deck_name || "").slice(0, 40), friend: { id: r.player, name: String(r.name || "").slice(0, 40) } });
      });
      $("fpList").querySelectorAll("[data-fi]").forEach((b) => b.onclick = () => {
        const r = rows.find((x) => x.player === b.dataset.fi);
        pickDeck(t().oppDeck, null, (d) => cb(d ? { ...d, friend: { id: r.player, name: String(r.name || "").slice(0, 40) } } : null), "opp");
      });
    };
    const search = () => {
      const my = ++seq;
      if (q.trim().length < 2) { rows = []; state = q ? "short" : "idle"; return draw(); }
      CLOUD.api("rpc/find_player_decks", { method: "POST", body: { p_q: q.trim() } })
        .then((r) => { if (my !== seq) return; rows = Array.isArray(r) ? r : []; state = "done"; draw(); })
        .catch(() => { if (my !== seq) return; rows = []; state = "error"; draw(); });
    };
    open(`<h2>${t().oppDeck}</h2>
      <input class="txt" id="fpQ" type="search" autocomplete="off" placeholder="${t().findPh}" aria-label="${t().findPh}">
      <div id="fpList" aria-live="polite"></div>
      <div class="row"><button type="button" class="btn quiet" id="fpBack">${t().back}</button><button type="button" class="btn" id="fpInks">${t().pickInks}</button></div>`, () => {
      $("fpQ").oninput = (e) => { q = e.target.value; clearTimeout(timer); timer = setTimeout(search, 300); };
      $("fpBack").onclick = () => pickOpp(cb);
      $("fpInks").onclick = inks;
      $("fpQ").focus();
      draw();
    });
  }
  const setOpp = (d) => { if (d) { s.match.opp = d; if (d.inks?.length) { s.color.p2 = d.inks; magic.reset(); } } render(); };

  // ---------- games and matches ----------
  function startMatch() {
    s.wins = zero(); resetLore(); s.won = null; s.matchDone = false;
    s.match = { started: new Date().toISOString(), tour: s.tour, players: s.players, best_of: s.bestOf, me: s.match?.me || null, opp: null, games: [] };
    render();
    if (s.decks && s.players === 2) pickDeck(t().yourDeck, s.match.me, (d) => {
      s.match.me = d; if (d?.inks?.length) { s.color.p1 = d.inks; magic.reset(); } render();
      if (!s.tour) pickOpp(setOpp);   // not a tournament: the opponent's deck right away
    });
  }
  // A game is marked the moment someone reaches 20, or from the menu (concession). No question asked.
  function award(w, reason = "lore", concededBy = null) {
    if (s.won || s.matchDone) return;
    if (!s.match) s.match = { started: new Date().toISOString(), tour: s.tour, players: s.players, best_of: s.bestOf, me: null, opp: null, games: [] };
    // Lore totals over time: public information (Tournament Rules §5.2), kept for the lore chart in Coach Review.
    const track = s.log.filter((e) => !e.award && e.at && s.gameStart).slice(-400).map((e) => [Math.round((e.at - s.gameStart) / 1000), e.seat, e.to]);
    const g = { winner: w, reason, conceded_by: concededBy, lore: { ...s.lore }, first: null, ended: new Date().toISOString(), track };
    s.match.games.push(g);
    s.wins[w] += 1; s.won = w;
    s.log.push({ award: true, auto: reason === "lore", seat: w });
    clearDeltas();
    if (s.wins[w] >= winsNeeded()) { s.matchDone = true; render(); setTimeout(finishMatch, 700); return; }
    render();
    if (s.decks && !s.tour && s.players === 2) {
      open(`<h2>${t().wentFirst}</h2><div class="row"><button type="button" class="btn" id="f1">${t().me1}</button><button type="button" class="btn" id="f2">${t().opp1}</button></div><button type="button" class="btn quiet" id="fs">${t().skip}</button>`, () => {
        const go = (f) => { g.first = f; if (s.match.opp) { close(); render(); } else pickOpp(setOpp); };
        $("f1").onclick = () => go("p1"); $("f2").onclick = () => go("p2"); $("fs").onclick = () => go(null);
      });
    }
  }
  function nextGame() { resetLore(); s.won = null; render(); }
  // The match-over card for the newest match in the history; an unknown opponent deck can still be picked here.
  function finishCard() {
    const m = s.history[0]; if (!m) return;
    open(`<h2>${t().matchOver}: ${esc(m.result.replace("-", "–"))}</h2>${s.decks && (m.players || 2) === 2 ? `<p>${swatch(m.me?.inks)} ${esc(deckText(m.me))} ${t().vs} ${swatch(m.opp?.inks)} ${esc(deckText(m.opp))}</p>` : ""}
      ${s.decks && (m.players || 2) === 2 && !m.opp ? `<button type="button" class="btn" id="nOpp">${t().pickOppNow}</button>` : ""}
      <div class="row"><button type="button" class="btn primary" id="nm">${t().newMatch}</button><button type="button" class="btn quiet" id="nc">${t().close}</button></div>${(SYNC || CLOUD) && (m.players || 2) === 2 ? `<p class="sync" id="syncMsg" aria-live="polite"></p>` : ""}`, () => {
      $("nm").onclick = () => { close(); startMatch(); }; $("nc").onclick = close;
      $("nOpp")?.addEventListener("click", () => pickOpp((d) => { if (d) histOpp(m, d); finishCard(); }));
      sync();   // after the card exists, so it can show the result
    });
  }
  // An opponent deck picked after the match: the games go out again with it (game logs are replaced by game id).
  function histOpp(m, d) {
    m.opp = d; m.exported = false;
    if (s.history[0] === m && d?.inks?.length) { s.color.p2 = d.inks; magic.reset(); render(); }
    save(); sync();
  }
  function finishMatch() {
    const done = () => {
      const m = s.match;
      s.history = [{ ...m, id: `lc-${Date.now().toString(36)}`, ended: new Date().toISOString(), result: seats().map((x) => s.wins[x]).join("-"), exported: false }, ...s.history].slice(0, 300);
      render();
      finishCard();
    };
    // the opponent's deck at the end: always in tournament mode (Rules §5.2), and in any mode if it was skipped
    if (s.decks && s.players === 2 && (s.tour || !s.match.opp)) pickOpp((d) => { if (d) { s.match.opp = d; if (d.inks?.length) { s.color.p2 = d.inks; magic.reset(); } } done(); });
    else done();
  }

  // ---------- menu ----------
  function menu() {
    const two = s.players === 2, locked = s.won || s.matchDone;
    const winBtns = two
      ? `<div class="row"><button type="button" class="btn" id="mW2" ${locked ? "disabled" : ""}>${t().iConceded}</button><button type="button" class="btn" id="mW1" ${locked ? "disabled" : ""}>${t().oppConceded}</button></div>`
      : s.players > 2 ? `<div class="grp"><span class="cap">${t().winnerIs}</span><div class="row">${seats().map((x) => `<button type="button" class="btn" data-win="${x}" ${locked ? "disabled" : ""}>${swatch(s.color[x])} ${esc(nm(x))}</button>`).join("")}</div></div>` : "";
    const others = seats().filter((x) => x !== "p1");
    open(`${others.map((x) => `<div class="grp"><span class="cap">${t().colors}: ${esc(nm(x))}</span>${inkPicker(`cp${n(x)}`, s.color[x])}</div>`).join("")}
      ${winBtns}
      <div class="row"><button type="button" class="btn" id="mUndo" ${s.log.length ? "" : "disabled"}>${t().undo}</button><button type="button" class="btn" id="mGame">${t().newGame}</button></div>
      <div class="row"><button type="button" class="btn" id="mMatch">${t().newMatch}</button><button type="button" class="btn" id="mSet">${t().settings}</button></div>
      <div class="grp"><span class="cap">${t().colors}: ${t().you}</span>${inkPicker("cp1", s.color.p1)}</div>
      ${SYNC ? `<button type="button" class="btn quiet" id="mCoach">← ${t().backCoach}</button>` : ""}`, () => {
      if (SYNC) $("mCoach").onclick = () => { close(); parent.postMessage({ type: "inkwell-close" }, "*"); };
      for (const x of seats()) {
        const sel = [...s.color[x]];
        wireInks(`cp${n(x)}`, sel, (v) => { if (v.length) { s.color[x] = [...v]; render(); magic.reset(); } });
      }
      if (two) {
        $("mW1").onclick = () => { close(); award("p1", "concede", "p2"); };   // opponent conceded
        $("mW2").onclick = () => { close(); award("p2", "concede", "p1"); };   // I conceded
      }
      document.querySelectorAll("[data-win]").forEach((b) => b.onclick = () => { close(); award(b.dataset.win, "other"); });
      $("mUndo").onclick = () => { undo(); close(); };
      $("mGame").onclick = () => { if (s.matchDone) startMatch(); else nextGame(); close(); };
      $("mMatch").onclick = () => open(`<h2>${t().confirmNew}</h2><div class="row"><button type="button" class="btn quiet" id="nn">${t().cancel}</button><button type="button" class="btn primary" id="ny">${t().yes}</button></div>`, () => {
        $("ny").onclick = () => { close(); startMatch(); }; $("nn").onclick = close;
      });
      $("mSet").onclick = settings;
    });
  }

  // ---------- settings ----------
  const toggle = (id, label, sub, on) => `<button type="button" class="item" id="${id}" role="switch" aria-checked="${on}"><span>${label}${sub ? `<small>${sub}</small>` : ""}</span><span class="switch"></span></button>`;
  const seg = (id, label, sub, opts, cur) => `<div class="item"><span>${label}${sub ? `<small>${sub}</small>` : ""}</span><span class="seg" id="${id}">${opts.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${v === cur}">${l}</button>`).join("")}</span></div>`;
  function settings() {
    open(`<h2>${t().settings}</h2>
      <div class="list">
        ${seg("sPlayers", t().players, t().playersSub, [[1, "1"], [2, "2"], [3, "3"], [4, "4"]], s.players)}
        ${seg("sBest", t().bestOf, "", [[1, "Bo1"], [3, "Bo3"], [5, "Bo5"]], s.bestOf)}
        ${toggle("sMagic", t().magic, t().magicSub, s.magic)}
        ${s.players > 1 ? toggle("sFlip", t().flip, "", s.flip) : ""}
      </div>
      <div class="list">
        ${toggle("sDecks", t().decks, t().decksSub, s.decks)}
        ${s.decks ? toggle("sTour", t().tour, t().tourSub, s.tour) : ""}
        <button type="button" class="item" id="sLang"><span>${t().lang}</span><span>${t().langName}</span></button>
      </div>
      <div class="list">
        <button type="button" class="item" id="sHist"><span>${t().history}<small>${s.history.length} ${t().matches.toLowerCase()}</small></span><span>›</span></button>
        <button type="button" class="item" id="sJudge"><span>${t().judge}</span><span>›</span></button>
        ${CLOUD ? `<button type="button" class="item" id="sCloud"><span>${t().account}<small>${cloudLine()}</small></span><span>›</span></button>` : ""}
      </div>
      <button type="button" class="btn" id="sClose">${t().close}</button>`, () => {
      $("sPlayers").querySelectorAll("button").forEach((b) => b.onclick = () => {
        const v = +b.dataset.v; if (v === s.players) return;
        s.players = v; s.wins = zero(); resetLore(); s.won = null; s.matchDone = false; s.match = null;
        build(); settings();
      });
      $("sBest").querySelectorAll("button").forEach((b) => b.onclick = () => {
        s.bestOf = +b.dataset.v; if (s.match) s.match.best_of = s.bestOf;
        if (!s.won && seats().some((x) => s.wins[x] >= winsNeeded())) { s.matchDone = true; }
        render(); settings();
      });
      if (CLOUD) $("sCloud").onclick = () => account();
      $("sMagic").onclick = () => { s.magic = !s.magic; save(); magic.reset(); settings(); };
      if ($("sFlip")) $("sFlip").onclick = () => { s.flip = !s.flip; build(); settings(); };
      $("sDecks").onclick = () => { s.decks = !s.decks; render(); if (s.decks && s.players === 2 && !s.match?.me) { close(); startMatch(); } else settings(); };
      if ($("sTour")) $("sTour").onclick = () => { s.tour = !s.tour; render(); settings(); };
      $("sLang").onclick = () => { s.lang = s.lang === "pt" ? "en" : "pt"; build(); settings(); };
      $("sHist").onclick = history;
      $("sJudge").onclick = () => open(JUDGE + `<button type="button" class="btn" id="jc">${t().close}</button>`, () => { $("jc").onclick = settings; });
      $("sClose").onclick = close;
    });
  }

  // ---------- history and export ----------
  // Game-log 1.0 (packages/gamelog): one log per game, lore totals and result only, no turns. 2-player matches only.
  function toLogs(m) {
    if ((m.players || 2) !== 2) return [];
    return m.games.map((g, i) => ({
      format_version: "1.0", game_id: `${m.id}-g${i + 1}`, source: "lore_counter",
      source_ref: { app: "inkwell-lore-counter 3.0", match: m.id, match_result: m.result, best_of: m.best_of || 3 },
      played_at: g.ended || m.ended, game_format: "core",
      event: { kind: m.tour === false ? "casual" : "other", game_in_match: i + 1 },
      players: [
        { seat: "p1", name: t().you, is_me: true, ...(g.first ? { went_first: g.first === "p1" } : {}),
          deck: { ...(m.me?.name ? { name: m.me.name } : {}), ...(m.me?.deck_id ? { inkwell_deck: m.me.deck_id } : {}), inks: m.me?.inks || [],
            ...(m.me?.list?.length ? { list: m.me.list, list_source: "inkwell" } : { list_source: "unknown" }) } },
        { seat: "p2", name: m.opp?.friend?.name || t().opp, is_me: false, ...(g.first ? { went_first: g.first === "p2" } : {}),
          deck: { archetype: m.opp?.name || m.opp?.inks?.length ? deckText(m.opp) : "Unknown", inks: m.opp?.inks || [], list_source: "unknown" } },
      ],
      turns: [],
      ...(g.track?.length ? { lore_track: g.track.filter((e) => e[1] === "p1" || e[1] === "p2").map(([tt, seat, lore]) => ({ t: tt, seat, lore: Math.min(99, lore) })) } : {}),
      result: { winner: g.winner, reason: g.reason === "concede" ? "concede" : g.reason === "lore" ? "lore" : "other", final_lore: { p1: g.lore.p1, p2: g.lore.p2 } },
      ...(g.conceded_by ? { notes: `${g.conceded_by === "p1" ? "I" : "Opponent"} conceded` } : {}),
      visibility: "private",
    }));
  }
  function historyText() {
    return s.history.map((m) => `${m.ended.slice(0, 10)}  Bo${m.best_of || 3}  ${(m.players || 2) === 2 ? `${deckText(m.me)} ${t().vs} ${deckText(m.opp)}  ` : `${m.players} ${t().players.toLowerCase()}  `}${m.result}` +
      m.games.map((g, i) => `\n   ${t().game} ${i + 1}: ${(m.players || 2) === 2 ? (g.winner === "p1" ? t().you : t().opp) : `${t().player} ${n(g.winner)}`} ${t().won} (${g.reason === "concede" ? t().byConcede : g.reason === "lore" ? t().byLore : "–"})${g.first ? ` ${g.first === "p1" ? t().me1 : t().opp1}` : ""}`).join("")).join("\n");
  }
  function history() {
    const by = new Map();
    for (const m of s.history.filter((x) => (x.players || 2) === 2)) {
      const k = deckText(m.opp), r = by.get(k) || { inks: m.opp?.inks, m: 0, mw: 0, g: 0, gw: 0 };
      const [a, b] = m.result.split("-").map(Number);
      r.m += 1; r.mw += a > b ? 1 : 0;
      for (const g of m.games) { r.g += 1; r.gw += g.winner === "p1" ? 1 : 0; }
      by.set(k, r);
    }
    const rows = [...by.entries()].sort((a, b) => b[1].m - a[1].m);
    const fresh = s.history.filter((m) => !m.exported && (m.players || 2) === 2);
    open(`<h2>${t().history}</h2>
      ${rows.length ? `<div class="grp"><span class="cap">${t().winRate}</span><table class="stats"><tr><th>${t().oppDeck}</th><th class="n">${t().matches}</th><th class="n">${t().games}</th><th class="n">${t().winPct}</th></tr>
        ${rows.map(([k, r]) => `<tr><td>${swatch(r.inks)} ${esc(k)}</td><td class="n">${r.mw}/${r.m}</td><td class="n">${r.gw}/${r.g}</td><td class="n">${Math.round(100 * r.mw / r.m)}%</td></tr>`).join("")}</table></div>` : `<p>${t().none}</p>`}
      ${(() => { const miss = s.history.filter((m) => (m.players || 2) === 2 && !m.opp).slice(0, 8);
        return miss.length ? `<div class="grp"><span class="cap">${t().noOpp}</span>${miss.map((m) => `<div class="row hmiss"><span>${esc(m.ended.slice(0, 10))} · ${swatch(m.me?.inks)} ${esc(deckText(m.me))} · ${esc(m.result)}</span><button type="button" class="btn" data-hopp="${esc(m.id)}">${t().pickOppNow}</button></div>`).join("")}</div>` : ""; })()}
      <button type="button" class="btn primary" id="hCoach" ${fresh.length ? "" : "disabled"}>${CLOUD ? t().toCloud : SYNC ? t().toCoachSync : t().toCoach} (${fresh.reduce((k, m) => k + m.games.length, 0)} ${t().toCoachSub})</button>
      <textarea class="txt" id="hx" rows="6" readonly hidden></textarea><p id="hs" aria-live="polite"></p>
      <div class="row"><button type="button" class="btn" id="hCopy" ${s.history.length ? "" : "disabled"}>${t().copy}</button><button type="button" class="btn quiet" id="hClear" ${s.history.length ? "" : "disabled"}>${t().clear}</button></div>
      <button type="button" class="btn" id="hBack">${t().close}</button>`, () => {
      const copyOut = async (text, ok) => {
        try { await navigator.clipboard.writeText(text); $("hs").textContent = ok; return true; }
        catch { $("hx").hidden = false; $("hx").value = text; $("hx").select(); $("hs").textContent = t().copyFail; return false; }
      };
      $("hCoach").onclick = async () => {
        if (!fresh.length) { $("hs").textContent = t().allSent; return; }
        if (SYNC || CLOUD) { $("hs").textContent = "…"; sync(true); return; }
        if (await copyOut(JSON.stringify(fresh.flatMap(toLogs)), t().sentHow)) { fresh.forEach((m) => { m.exported = true; }); save(); $("hCoach").disabled = true; }
      };
      document.querySelectorAll("[data-hopp]").forEach((b) => b.onclick = () => { const m = s.history.find((x) => x.id === b.dataset.hopp); pickOpp((d) => { if (d) histOpp(m, d); history(); }); });
      $("hCopy").onclick = () => copyOut(historyText(), t().copied);
      $("hClear").onclick = () => {
        if ($("hClear").dataset.c !== "1") { $("hClear").dataset.c = "1"; $("hClear").textContent = `${t().clear}?`; return; }
        s.history = []; save(); history(); $("hs").textContent = t().cleared;
      };
      $("hBack").onclick = settings;
    });
  }

  // ---------- Coach Review sync (only inside Coach Review) ----------
  // After a match ends, its 2-player games go to the parent page, which stores them in the private game list.
  // A match stays "not exported" until the parent confirms, so nothing is lost if saving fails; it retries on next start.
  const unsent = () => s.history.filter((m) => !m.exported && (m.players || 2) === 2);
  const say = (text) => { const el = $("syncMsg") || $("hs") || $("acMsg"); if (el) el.textContent = text; };
  let sending = false;
  async function sync(manual) {
    const fresh = unsent();
    if (!fresh.length) return;
    if (SYNC) { parent.postMessage({ type: "inkwell-games", matches: fresh.map((m) => m.id), logs: fresh.flatMap(toLogs) }, "*"); return; }
    if (!CLOUD || sending) return;
    if (!CLOUD.status().signedIn) { if (manual) account(); else say(t().savedHere); return; }
    if (navigator.onLine === false) { say(t().offlineWait); return; }
    sending = true;
    try {
      if (await CLOUD.send(fresh.flatMap(toLogs))) {
        const ids = new Set(fresh.map((m) => m.id));
        s.history.forEach((m) => { if (ids.has(m.id)) m.exported = true; }); save();
        say(`✓ ${t().sentCloud}`);
        if ($("hCoach")) $("hCoach").disabled = true;
        if ($("acSend")) $("acSend").disabled = true;
      } else say(t().failCloud);
    } catch { say(navigator.onLine === false ? t().offlineWait : t().failCloud); }
    finally { sending = false; }
  }
  function cloudLine() {
    const st = CLOUD.status(), k = unsent().reduce((n, m) => n + m.games.length, 0);
    return st.signedIn ? `${esc(st.email || "")} · ${k ? `${k} ${t().toSend}` : t().upToDate}` : t().noAccount;
  }
  function account(step, email) {
    const st = CLOUD.status();
    const back = `<p class="sync" id="acMsg" aria-live="polite"></p><button type="button" class="btn" id="acBack">${t().close}</button>`;
    if (st.signedIn) {
      open(`<h2>${t().account}</h2><p>${t().signedAs} <b>${esc(st.email || "")}</b></p><p class="muted">${cloudLine()}</p>
        <div class="row"><button type="button" class="btn primary" id="acSend" ${unsent().length ? "" : "disabled"}>${t().sendNow}</button><button type="button" class="btn quiet" id="acOut">${t().signOut}</button></div>${back}`, () => {
        $("acSend").onclick = () => { $("acMsg").textContent = "…"; sync(true); };
        $("acOut").onclick = () => { CLOUD.signOut(); account(); };
        $("acBack").onclick = settings;
      });
    } else if (step === "code") {
      open(`<h2>${t().account}</h2><p>${t().codeSent} <b>${esc(email)}</b>.</p>
        <input class="txt" id="acCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="${t().codePh}">
        <div class="row"><button type="button" class="btn primary" id="acIn">${t().signIn}</button><button type="button" class="btn quiet" id="acRe">${t().sendCode}</button></div>${back}`, () => {
        $("acIn").onclick = async () => {
          $("acMsg").textContent = "…";
          try { await CLOUD.verify(email, $("acCode").value); account(); setTimeout(() => sync(), 200); }
          catch { $("acMsg").textContent = t().badCode; }
        };
        $("acRe").onclick = () => account();
        $("acBack").onclick = settings;
      });
    } else {
      open(`<h2>${t().account}</h2><p class="muted">${t().accountSub}</p>
        <input class="txt" id="acEmail" type="email" autocomplete="email" placeholder="${t().emailPh}">
        <button type="button" class="btn primary" id="acCodeBtn">${t().sendCode}</button>${back}`, () => {
        $("acCodeBtn").onclick = async () => {
          const e = $("acEmail").value.trim();
          if (!/^\S+@\S+\.\S+$/.test(e)) { $("acMsg").textContent = t().badEmail; return; }
          $("acMsg").textContent = "…";
          try { await CLOUD.requestCode(e); account("code", e); } catch { $("acMsg").textContent = t().badEmail; }
        };
        $("acBack").onclick = settings;
      });
    }
  }
  if (CLOUD) {
    window.addEventListener("online", () => sync());
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") sync(); });
  }
  if (SYNC) window.addEventListener("message", (e) => {
    if (e.source !== parent || !e.data) return;
    const msg = $("syncMsg") || $("hs");
    if (e.data.type === "inkwell-saved") {
      const ids = new Set(e.data.matches || []);
      s.history.forEach((m) => { if (ids.has(m.id)) m.exported = true; }); save();
      if (msg) msg.textContent = `✓ ${t().synced}`;
      if ($("hCoach")) $("hCoach").disabled = true;
    } else if (e.data.type === "inkwell-save-failed" && msg) msg.textContent = t().syncWait;
  });

  const wake = () => { try { navigator.wakeLock?.request("screen").catch(() => {}); } catch { /* not allowed */ } };
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wake(); });
  wake();
  build();
  setTimeout(sync, 1500);
  loadInkDecks();   // retry anything a previous session couldn't save
})();
</script>

<script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
