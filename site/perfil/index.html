<script>window.INKWELL_CLOUD_CONFIG = {"url": "https://sorefaetiaebmjploanp.supabase.co", "key": "sb_publishable_RkAWW-ENz70CXA6_QV7aHw_MpfD7Gn2", "redirect": "https://luiscredie.github.io/inkwell/perfil/"};
/* Inkwell Lore Counter: cloud adapter for the offline app.
 *
 * Talks to the Inkwell Supabase project with plain fetch (no library to cache):
 *   sign-in   email one-time code (or the magic link, when opened in the same browser)
 *   storage   public.game_logs, one row per game, upserted on (user_id, game_id),
 *             so a retry after a dropped connection never creates a duplicate
 * The counter keeps every match locally until send() resolves true.
 * Only the public URL and publishable key are here; row-level security limits each user to their own rows.
 */
// Feature flags. The guest experience (Começar meu Inkwell, new Início) is on for everyone since 26/10/2026.
// ?preview=off shows the previous experience in this tab (sessionStorage); ?preview=visitante turns it back on.
// Rollback: set GUEST_DEFAULT to false (nothing in the database changes).
window.INKWELL_FLAGS = (() => {
  const GUEST_DEFAULT = true;
  const f = { guestProfile: GUEST_DEFAULT };
  try {
    const q = new URLSearchParams(location.search).get("preview");
    if (q === "visitante") sessionStorage.setItem("inkwell-preview", "visitante");
    if (q === "off") sessionStorage.setItem("inkwell-preview", "off");
    const v = sessionStorage.getItem("inkwell-preview");
    if (v === "visitante") f.guestProfile = true;
    if (v === "off") f.guestProfile = false;
  } catch { /* storage off: the default stays */ }
  return f;
})();
window.INKWELL_CLOUD = (() => {
  const cfg = window.INKWELL_CLOUD_CONFIG || {};
  if (!cfg.url || !cfg.key) return null;
  // One sign-in for the whole site: the counter, Coach Review, Início, Trocas and the Inkwell app itself
  // (its supabase-js client uses this same storage key), so signing in or out on one page does it on all.
  const KEY = "inkwell-counter-auth";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch { return null; } };
  let sess = load();
  const store = (x) => { sess = x; try { if (x) localStorage.setItem(KEY, JSON.stringify(x)); else localStorage.removeItem(KEY); } catch { /* private mode */ } };
  const headers = (tok) => ({ apikey: cfg.key, "Content-Type": "application/json", ...(tok ? { Authorization: `Bearer ${tok}` } : {}) });
  const claims = (jwt) => { try { return JSON.parse(atob(jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); } catch { return {}; } };
  const session = (r) => {   // the same shape supabase-js keeps, so both read each other's session
    const c = claims(r.access_token);
    const expires_at = r.expires_at || c.exp || Math.floor(Date.now() / 1000) + (r.expires_in || 3600);
    return { access_token: r.access_token, refresh_token: r.refresh_token, token_type: "bearer",
      expires_in: r.expires_in || Math.max(0, expires_at - Math.floor(Date.now() / 1000)), expires_at,
      user: { ...(r.user || {}), id: r.user?.id || c.sub, email: r.user?.email || c.email } };
  };

  // Magic link opened in this same browser: tokens arrive in the URL fragment.
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("access_token") && h.get("refresh_token")) {
    store(session({ access_token: h.get("access_token"), refresh_token: h.get("refresh_token"), expires_in: +h.get("expires_in") || 3600 }));
    history.replaceState(null, "", location.pathname + location.search);
    window.INKWELL_FROM_LINK = true;   // this tab was opened by the e-mail link (the guest editor tells the original tab apart)
  } else if (h.get("error_code") || h.get("error")) {
    // The e-mail link didn't work (already used or expired): Supabase sends back #error=…&error_code=otp_expired.
    // Some mail services (Outlook/Hotmail) open links by themselves to scan them, which uses the link up.
    history.replaceState(null, "", location.pathname + location.search);
    window.INKWELL_LINK_FAILED = h.get("error_code") || h.get("error");
  }

  async function token() {
    sess = load();   // another page (or the Inkwell app) may have signed in, out, or refreshed the tokens meanwhile
    if (!sess) return null;
    if (sess.expires_at - 60 > Date.now() / 1000) return sess.access_token;
    const used = sess.refresh_token;
    const r = await fetch(`${cfg.url}/auth/v1/token?grant_type=refresh_token`, { method: "POST", headers: headers(), body: JSON.stringify({ refresh_token: used }) });
    if (r.status === 400 || r.status === 401) {
      const now = load();   // a page that refreshed at the same moment already saved newer tokens: keep them
      if (now && now.refresh_token !== used && now.expires_at - 60 > Date.now() / 1000) { sess = now; return sess.access_token; }
      store(null); return null;   // signed out elsewhere
    }
    if (!r.ok) throw new Error(`refresh ${r.status}`);
    store(session(await r.json()));
    return sess.access_token;
  }

  // Authenticated call to the database's REST API (used by Coach Review). Errors carry a short code.
  async function api(path, { method = "GET", body, prefer } = {}) {
    const tok = await token();
    if (!tok) throw Object.assign(new Error("signed out"), { code: "auth" });
    const r = await fetch(`${cfg.url}/rest/v1/${path}`, {
      method, headers: { ...headers(tok), ...(prefer ? { Prefer: prefer } : {}) }, body: body === undefined ? undefined : JSON.stringify(body) });
    if (r.status === 401) store({ ...sess, expires_at: 0 });
    if (!r.ok) {
      const code = r.status === 401 || r.status === 403 ? "permission" : r.status === 400 || r.status === 409 || r.status === 413 ? "invalid_argument" : "unavailable";
      throw Object.assign(new Error(`${method} ${path.split("?")[0]} ${r.status}`), { code, status: r.status });
    }
    const text = await r.text();
    return text ? JSON.parse(text) : null;
  }

  // The player's collections (public.inkwell_profiles). A new account has none yet, and every collection, deck
  // and wishlist save needs one, so the first visit creates an empty "principal" collection, then reads again.
  async function collections(select) {
    const q = `inkwell_profiles?select=${select}&order=updated_at.desc`;
    const r = await api(q);
    if (Array.isArray(r) && r.length) return r;
    const id = load()?.user?.id;
    if (!id) return r;
    await api("inkwell_profiles?on_conflict=user_id,profile", { method: "POST", prefer: "resolution=ignore-duplicates,return=minimal",
      body: { user_id: id, profile: "principal", schema: 2, data: { _schema: 2, collection: {}, decks: [], wishlist: {} } } });
    return api(q);
  }

  return {
    api, collections,
    user: () => { sess = load(); return sess ? { id: sess.user?.id, email: sess.user?.email } : null; },
    status: () => { sess = load(); return sess ? { signedIn: true, email: sess.user?.email || "" } : { signedIn: false }; },
    async requestCode(email) {
      const redirect = cfg.redirect || location.href.split("#")[0];
      // where to come back after the confirmation page (/entrar/), same site only
      try { localStorage.setItem("inkwell-return", JSON.stringify({ path: location.pathname + location.search, at: Date.now() })); } catch { /* private mode */ }
      const r = await fetch(`${cfg.url}/auth/v1/otp?redirect_to=${encodeURIComponent(redirect)}`, { method: "POST", headers: headers(), body: JSON.stringify({ email, create_user: true }) });
      if (!r.ok) throw Object.assign(new Error(`otp ${r.status}`), { status: r.status });
    },
    async verify(email, code) {
      const r = await fetch(`${cfg.url}/auth/v1/verify`, { method: "POST", headers: headers(), body: JSON.stringify({ type: "email", email, token: String(code).replace(/\s/g, "") }) });
      if (!r.ok) throw Object.assign(new Error(`verify ${r.status}`), { status: r.status });
      store(session(await r.json()));
    },
    // The e-mail's own link to /entrar/?h=<token hash>: signs in only when the person presses the button there,
    // so a mail scanner that just opens the link doesn't use it up.
    async verifyHash(tokenHash, type = "email") {
      const r = await fetch(`${cfg.url}/auth/v1/verify`, { method: "POST", headers: headers(), body: JSON.stringify({ type, token_hash: String(tokenHash) }) });
      if (!r.ok) throw Object.assign(new Error(`verify ${r.status}`), { status: r.status });
      store(session(await r.json()));
    },
    signOut() {
      const old = sess; store(null);
      if (old) fetch(`${cfg.url}/auth/v1/logout`, { method: "POST", headers: headers(old.access_token) }).catch(() => {});
    },
    async send(logs) {
      const tok = await token();   // also reloads sess
      if (!tok) return false;
      const rows = logs.map((l) => ({ user_id: sess.user.id, game_id: l.game_id, source: l.source, played_at: l.played_at, log: l }));
      const r = await fetch(`${cfg.url}/rest/v1/game_logs?on_conflict=user_id,game_id`, {
        method: "POST", headers: { ...headers(tok), Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(rows) });
      if (r.status === 401) store({ ...sess, expires_at: 0 });   // force a refresh on the next try
      return r.ok;
    },
  };
})();
</script>

  const SETS = (CARD_INDEX?.sets || []).map((x, i) => ({ ...x, rank: setRank(x.code, i) })).sort((a, b) => a.rank - b.rank);

  const ago = (d) => { const m = (Date.now() - Date.parse(d)) / 60000; if (!(m >= 0)) return ""; if (m < 60) return Tx("{n} min ago", { n: Math.max(1, Math.round(m)) }); if (m < 1440) return Tx("{n} h ago", { n: Math.round(m / 60) }); const dd = Math.round(m / 1440); return dd === 1 ? Tx("yesterday") : Tx("{n} days ago", { n: dd }); };
  const miniAv = (avatar, name, cls = "sm") => `<span class="mi-av ${cls}" style="${artStyle(avatar)}" role="img" aria-label="${esc(name || "")}"></span>`;
  function deckView(p, deck) {

  function relationBtn(p) {
    if (p.mock || !p.relation || p.relation === "self") return "";

      ${fn > friends.length && friends.length ? `<p class="small faint" style="margin:var(--sp-2) 0 0">${Tx("+{n} with a private profile", { n: fn - friends.length })}</p>` : ""}</section>`;
    const recBox = preview ? "" : `<section class="mi-sec mi-recs" data-testid="recados"><div class="group-head"><h3>${Tx("Recados")}</h3>${recs.length ? `<span class="small muted">${recs.length}</span>` : ""}</div>

        <div class="row between"><span class="small faint">${Tx("It shows up after {name} approves it.", { name: esc(p.name || "") })}</span><button type="submit" class="btn small primary">${Tx("Send")}</button></div></form>` : ""}
      ${recs.length ? `<div class="mi-reclist">${recs.map((r) => `<article class="mi-rec1">${r.handle ? `<a href="?u=${encodeURIComponent(r.handle)}">${miniAv(r.avatar, r.name)}</a>` : miniAv(null, r.name)}
          <div><div class="small"><b>${r.handle ? `<a href="?u=${encodeURIComponent(r.handle)}">${esc(L(p, r.name))}</a>` : esc(L(p, r.name))}</b> <span class="faint">· ${esc(ago(r.at))}</span></div><p>${esc(L(p, r.body))}</p></div></article>`).join("")}</div>`
        : `<p class="mi-empty">${Tx(p.relation === "friend" ? "No recados yet. Be the first." : "No recados yet. Friends can leave one.")}</p>`}</section>`;
    return `<div class="mi" data-testid="profile">
      ${p.mock ? `<div class="mi-mock" data-testid="mock-banner"><i class="ic i-info"></i><span>${Tx("Example · fictional profile")}. ${Tx("This is a mockup to show what a profile looks like. It is not a real person.")}</span></div>` : ""}
      <section class="mi-hero">
        <div class="mi-cover" style="${artStyle(p.avatar)};--art:${BY.get(p.avatar)?.img ? `url('${imgUrl(BY.get(p.avatar))}')` : "none"}"><i class="mi-art"></i></div>
        <div class="mi-id"><div class="mi-av" style="${artStyle(p.avatar)}" role="img" aria-label="${esc(p.avatar && BY.get(p.avatar) ? BY.get(p.avatar).name : "")}"></div>
          <div style="min-width:0"><h2 class="mi-name">${esc(L(p, p.name))}</h2>${p.handle ? `<div class="mi-handle">@${esc(p.handle)}</div>` : ""}</div></div>
        <div class="mi-body">
          ${p.motto ? `<p class="mi-motto" data-testid="motto">“${esc(L(p, p.motto))}”</p>` : ""}
          <div class="mi-meta">${(p.inks || []).map(inkChip).join("")}${p.city ? `<span>${esc(p.city)}</span>` : ""}${!preview && fn ? `<span>${fn === 1 ? Tx("1 friend") : Tx("{n} friends", { n: fn })}</span>` : ""}</div>
          ${p.bio ? `<p class="mi-bio">${esc(L(p, p.bio))}</p>` : ""}
        </div>
        <div class="mi-acts">${own ? `<button type="button" class="btn" id="toEdit"><i class="ic i-edit"></i>${Tx("Edit my profile")}</button>` : ""}${preview ? "" : relationBtn(p)}
          ${!preview && p.handle ? `<button type="button" class="btn" id="copyLink"><i class="ic i-send"></i>${Tx("Share")}</button>` : ""}
          ${!preview && !own && me && !p.mock ? `<button type="button" class="btn ghost small" id="report" style="margin-left:auto"><i class="ic i-alert"></i>${Tx("Report profile")}</button>` : ""}</div>
      </section>
      <div class="mi-cols">
        <div class="mi-col">
          <section class="mi-sec mi-showsec"><div class="group-head"><h3>${Tx("Showcase")}</h3></div>
            ${show.length ? `<div class="mi-show" data-testid="showcase">${show.map((s) => { const c = BY.get(s.id); return `<figure>${thumb(c)}<figcaption>${esc(split(c.name)[0])}</figcaption><span class="tag ${s.own ? "match" : "accent"}">${Tx(s.own ? "owns it" : "favourite")}</span></figure>`; }).join("")}</div>` : `<p class="mi-empty">${Tx("Nothing here yet.")}</p>`}</section>
          ${recBox}
          ${deck ? deckView(p, deck) : ""}
        </div>
        <div class="mi-col">
          ${friendsBox}
          ${!preview && p.communities?.length ? `<section class="card mi-sec mi-comms" data-testid="profile-communities"><div class="mi-label">${Tx("Communities")}</div><div class="mi-clist">${p.communities.map((c) => `<a href="../comunidades/?c=${encodeURIComponent(c.slug)}"><span class="mi-cav" style="${artStyle(c.avatar)}"></span><span><b>${esc(L(p, c.name))}</b><span class="small muted">${esc(c.city || "")}${c.role === "owner" ? ` · ${Tx("owner")}` : ""}</span></span></a>`).join("")}</div></section>` : ""}
          ${rec ? `<section class="card mi-sec mi-recsum" data-testid="record"><div class="mi-label">${Tx("Record")}</div><div class="mi-rec" style="margin-top:var(--sp-2)"><span><b>${rec.w || 0}</b> ${Tx("wins")}</span><span><b>${rec.l || 0}</b> ${Tx("losses")}</span>${games ? `<span class="muted">${Math.round(((rec.w || 0) / games) * 100)}%</span>` : ""}</div></section>` : ""}
          ${p.trade ? `<section class="card mi-sec mi-trade" data-testid="trade"><div class="mi-label">${Tx("Looking for")}</div>${strip(want)}<div class="mi-label" style="margin-top:var(--sp-3)">${Tx("Offering")}</div>${strip(have)}</section>` : ""}
        </div>
      </div>
      <p class="small faint">${Tx("Fan project, not affiliated with Disney or Ravensburger.")} · <a href="../privacidade/">${Tx("Terms and privacy")}</a></p>
    </div>`;
  }
  function wireView(p) {
    $("copyLink")?.addEventListener("click", () => shareLink(profileUrl(p.handle), p.name));
    $("addFriend")?.addEventListener("click", async (ev) => {
      const b = ev.currentTarget; b.disabled = true;
      try { await rpc("request_friend", { p_handle: p.handle }); b.outerHTML = `<span class="tag info" data-testid="relation">${Tx("Request sent")}</span>`; toast(Tx("Friend request sent.")); }
      catch { b.disabled = false; toast(Tx("Couldn't send. Try again."), true); }
    });
    $("recForm")?.addEventListener("submit", async (ev) => {
      ev.preventDefault(); const t = $("recBody"), body = t.value.trim(); if (!body) { t.focus(); return; }
      const b = ev.currentTarget.querySelector("button"); b.disabled = true;
      try { await rpc("post_recado", { p_handle: p.handle, p_body: body }); t.value = ""; toast(Tx("Sent. It shows up when {name} approves it.", { name: p.name })); }
      catch { toast(Tx("Couldn't send. Try again."), true); }
      b.disabled = false;
    });
    $("report")?.addEventListener("click", () => openReport(p.handle));
    $("toEdit")?.addEventListener("click", () => { history.replaceState(null, "", "./"); editor(); });
  }
  const base = () => location.href.replace(/[?#].*$/, "").replace(/[^/]*$/, "");
  const profileUrl = (h) => `${base()}?u=${encodeURIComponent(h)}`;
  async function shareLink(url, title) {
    try { if (navigator.share) { await navigator.share({ title: `${title} · Inkwell`, url }); return; } } catch { return; }
    try { await navigator.clipboard.writeText(url); toast(Tx("Link copied")); } catch { prompt("", url); }
  }

  async function showPublic(h) {
    let p = null;
    try { p = await anonRpc("public_profile", { p_handle: h }); } catch { p = null; }
    if (!p) { $("app").innerHTML = emptyBox("search", Tx("Profile not found"), Tx("It doesn't exist, or its owner keeps it private.")); return; }
    document.title = `${p.name} · Inkwell`;
    try { p.communities = await anonRpc("profile_communities", { p_handle: h }); } catch { p.communities = null; }   // supabase/communities.sql
    const own = !!(mine && mine.handle && mine.handle === p.handle);
    $("app").innerHTML = (inviteQ && !me ? await inviteBanner() : "") + profileView(p, { own });
    wireInvite(); wireView(p);
  }

  // ---------- invites ----------
  async function inviteBanner() {
    let info = null; try { info = await anonRpc("invite_info", { p_code: inviteQ }); } catch { /* */ }
    if (!info) return `<div class="notice warn" style="margin-bottom:var(--sp-4)"><i class="ic i-alert"></i><div class="t">${Tx("This invite link is no longer valid.")}</div></div>`;
    try { localStorage.setItem(INVITE_KEY, inviteQ); } catch { /* */ }
    return `<section class="card" data-testid="invite" style="margin-bottom:var(--sp-5)"><h2 style="margin:0">${esc(Tx("{name} invited you to Inkwell", { name: info.name || Tx("Someone") }))}</h2>
      <p class="muted" style="margin:var(--sp-2) 0 var(--sp-3)">${Tx("Sign in and you become friends.")} ${Tx("Use your e-mail. We e-mail you a code, no password.")}</p>
      <button type="button" class="btn primary" data-signin>${Tx("Sign in")}</button></section>`;
  }
  function wireInvite() { document.querySelectorAll("[data-signin]").forEach((b) => b.onclick = () => window.INKWELL_SIGNIN?.()); }
  async function acceptPendingInvite() {
    let code = null; try { code = localStorage.getItem(INVITE_KEY); } catch { /* */ }
    if (!me || !code) return;
    try { localStorage.removeItem(INVITE_KEY); } catch { /* */ }
    let r = null; try { r = await rpc("accept_invite", { p_code: code }); } catch { return; }
    if (!r?.ok) { if (r?.reason === "unknown") toast(Tx("This invite link is no longer valid."), true); return; }
    if (r.status === "accepted") { toast(Tx("You and {name} are friends already.", { name: r.name })); return; }
    // the invite became a friend request from the inviter: the person decides
    const sh = $("sheet");
    sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="shT">${esc(Tx("{name} wants to be your friend", { name: r.name }))}</h2></div>
      <div class="sheet-body"><p class="muted" style="margin:0">${Tx("You came through their invite. Accept?")}</p></div>
      <div class="sheet-foot" data-testid="invite-ask"><button type="button" class="btn ghost" id="invNo">${Tx("Not now")}</button><button type="button" class="btn primary" id="invYes">${Tx("Accept")}</button></div>`;
    const decide = async (yes) => {
      try {
        if (yes) await CLOUD.api(`friendships?requester=eq.${r.requester}&addressee=eq.${me.id}`, { method: "PATCH", prefer: "return=minimal", body: { status: "accepted", accepted_at: new Date().toISOString() } });
        else await CLOUD.api(`friendships?requester=eq.${r.requester}&addressee=eq.${me.id}`, { method: "DELETE", prefer: "return=minimal" });
        sh.close(); if (yes) toast(Tx("You and {name} are now friends.", { name: r.name }));
      } catch { toast(Tx("Couldn't send. Try again."), true); }
    };
    $("invYes").onclick = () => decide(true); $("invNo").onclick = () => decide(false);
    sh.showModal();
  }

  // ---------- signed out, no profile asked ----------
  function welcome() {

      <div class="row" style="gap:var(--sp-2);flex-wrap:wrap"><button type="button" class="btn primary" data-signin>${Tx("Sign in")}</button><a class="btn" href="?u=rafa_exemplo">${Tx("See an example")}</a></div>
      <p class="small faint" style="margin-top:var(--sp-3)">${Tx("Use your e-mail. We e-mail you a code, no password.")}</p></section>`;

  // ---------- my profile: preview + editor ----------
  async function loadMine() {
    const [p, ip] = await Promise.all([rpc("my_profile"), CLOUD.api("inkwell_profiles?select=profile,updated_at,decks:data->decks,collection:data->collection&order=updated_at.desc").catch(() => [])]);
    mine = p || { display_name: "", handle: null, bio: "", avatar_card: null, inks: [], city: "", showcase: [], featured_deck: null, is_public: false, adult: false, show_record: true, show_trade: false };
    decksBy = (ip || []).map((x) => ({ profile: x.profile, decks: Array.isArray(x.decks) ? x.decks : [], collection: x.collection && typeof x.collection === "object" ? x.collection : {} }));
  }
  const pickProfile = (e) => decksBy.find((x) => x.profile === e.inkwell_profile) || decksBy.slice().sort((a, b) => b.decks.length - a.decks.length)[0] || { decks: [], collection: {} };
  const ownsCard = (e, id) => { const c = pickProfile(e).collection[id] || {}; return (+c.n || 0) + (+c.f || 0) > 0; };
  function asPublic(e) {   // what others would see, built locally
    const deck = pickProfile(e).decks.find((d) => d.id === e.featured_deck);
    return { name: e.display_name, handle: e.handle, bio: e.bio, motto: e.motto, avatar: e.avatar_card, inks: e.inks, city: e.adult ? e.city : "",
      showcase: (e.showcase || []).map((s) => ({ id: s.id, own: s.k === "own" && ownsCard(e, s.id) })),
      deck: deck ? { name: deck.name, format: deck.format, colors: deck.colors, cards: deck.cards } : null, record: null, trade: null, mock: false };
  }

    $("pcBox").innerHTML = `<img class="pc-prev" src="${url}" alt="${esc(Tx("Player card"))}" data-testid="player-card"><div class="row" style="gap:var(--sp-2);margin:var(--sp-3) 0">
      ${navigator.canShare && navigator.canShare({ files: [file] }) ? `<button type="button" class="btn primary" id="pcShare"><i class="ic i-send"></i>${Tx("Send the image")}</button>` : ""}
      <a class="btn" download="${esc(file.name)}" href="${url}">${Tx("Download")}</a></div>`;
    $("pcShare")?.addEventListener("click", () => navigator.share({ files: [file], title: "Inkwell" }).catch(() => {}));
  }

  // ---------- delete my account ----------
  function openDelete() {
    const sh = $("sheet"), word = lang === "pt" ? "EXCLUIR" : "DELETE";
    sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="shT">${Tx("Delete my account")}</h2><button type="button" class="btn ghost icon" data-close aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>
      <div class="sheet-body"><p>${Tx("This deletes your account and everything linked to it: collection, decks, games, profile, friends, recados, posts and trades. It cannot be undone.")}</p>
        <p class="small muted">${Tx("Communities you created pass to their longest-standing member, or are deleted if nobody else is in them. Download your data first if you want a copy.")}</p>
        <label class="field">${esc(Tx("Type {w} to confirm", { w: word }))}<input id="delWord" autocomplete="off" autocapitalize="characters"></label><p class="small" id="delMsg" role="alert"></p></div>
      <div class="sheet-foot"><button type="button" class="btn ghost" data-close>${Tx("Cancel")}</button><button type="button" class="btn danger" id="delGo" disabled>${Tx("Delete my account")}</button></div>`;
    sh.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => sh.close());
    $("delWord").oninput = (e) => { $("delGo").disabled = e.target.value.trim().toUpperCase() !== word; };
    $("delGo").onclick = async () => {
      $("delGo").disabled = true;
      try { await rpc("delete_my_account", { p_confirm: word }); dirty = false; CLOUD.signOut?.(); location.href = "../feed/?conta=excluida"; }
      catch (e) { $("delMsg").textContent = /last_admin/.test(String(e?.message || e)) ? Tx("You are the only admin. Add another admin before deleting this account.") : Tx("Couldn't delete. Try again."); $("delGo").disabled = false; }
    };
    sh.showModal(); setTimeout(() => $("delWord").focus(), 30);
  }

  // ---------- report ----------
  function openReport(h) {
    const sh = $("sheet");
    sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="shT">${Tx("Report profile")}</h2><button type="button" class="btn ghost icon" data-close aria-label="${Tx("Close")}"><i class="ic i-close"></i></button></div>
      <div class="sheet-body"><label class="field">${Tx("Why are you reporting this profile?")}<textarea id="rpWhy" maxlength="500" rows="4"></textarea></label><p class="small" id="rpMsg" role="alert"></p></div>
      <div class="sheet-foot"><button type="button" class="btn ghost" data-close>${Tx("Cancel")}</button><button type="button" class="btn primary" id="rpSend">${Tx("Send report")}</button></div>`;
    sh.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => sh.close());
    $("rpSend").onclick = async () => {
      const why = $("rpWhy").value.trim(); if (why.length < 3) { $("rpWhy").focus(); return; }
      try { await rpc("report_profile", { p_handle: h, p_reason: why }); sh.close(); toast(Tx("Report sent. Thank you.")); } catch { $("rpMsg").textContent = Tx("Couldn't send. Try again."); }
    };
    sh.showModal(); setTimeout(() => $("rpWhy").focus(), 30);
  }

  // ---------- helpers ----------
  function emptyBox(img, title, text, extra = "") { return `<div class="empty"><img src="../ui/assets/empty/${img}.svg" alt=""><b>${esc(title)}</b><p>${esc(text)}</p>${extra}</div>`; }
  let toastTimer = null;
  function toast(text, err) {
    const t = $("toast"); t.className = `toast${err ? " err" : ""}`;
    t.innerHTML = `<i class="ic ${err ? "i-alert" : "i-check"}"></i><span>${esc(text)}</span>`; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
  }

  // ---------- boot ----------
  document.documentElement.lang = LOC;
  $("title").textContent = Tx("My Inkwell");
  $("app").innerHTML = `<div class="skel" style="height:260px;border-radius:20px"></div><p class="sr-only">${Tx("Loading…")}</p>`;
  (async () => {
    if (me) { try { await loadMine(); } catch { mine = null; } await acceptPendingInvite(); }
    if (handleQ) return showPublic(handleQ);
    if (!me) {
      if (inviteQ) { $("app").innerHTML = await inviteBanner(); wireInvite(); return; }
      return welcome();
    }
    document.title = `${Tx("My Inkwell")} · Inkwell`;
    if (mine && mine.handle && mine.is_public && !qs.has("editar")) return showPublic(mine.handle);
    return editor();
  })();
})();
</script>

<script>window.INKWELL_SHELL = {"page": "profile"};
/* Inkwell site shell (design v2, Noite): app bar, phone tab bar, account menu and the one sign-in sheet.
   Markup and classes follow packages/ui/tokens.css (§4 Shell, §11 Sheet); see DESIGN-CHANGES.md.
   Pages set window.INKWELL_SHELL = { page: "feed" | "cards" | "decks" | "coach" | "trades" } and may call:
     window.INKWELL_SIGNIN()            open the sign-in sheet
     window.INKWELL_SHELL_BADGE(n)      set the Trocas count (requests waiting for me)
   Sign-in uses window.INKWELL_CLOUD (cloud.js): one session for the whole site. */
(() => {
  "use strict";
  let lang = "pt";
  try { lang = localStorage.getItem("inkwell-lang") || ((navigator.language || "pt").toLowerCase().startsWith("en") ? "en" : "pt"); } catch { /* */ }
  const pt = lang === "pt";
  const T = (p, e) => (pt ? p : e);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const page = (window.INKWELL_SHELL || {}).page || "";
  const UI = "../ui/";
  const CLOUD = window.INKWELL_CLOUD;
  const me = CLOUD?.user();
  const NAV = [
    ["feed", "../feed/", T("Início", "Home"), "home"],
    ["cards", "../colecao/", T("Coleção", "Collection"), "cards"],
    ["decks", "../decks/", "Decks", "decks"],
    ["coach", "../coach/", T("Jogos", "Games"), "games"],
    ["trades", "../trades/", T("Trocas", "Trades"), "trades"],
  ];
  const cur = (k) => (k === page ? ' aria-current="page"' : "");

  const bar = document.createElement("header");
  bar.className = "appbar";
  bar.innerHTML = `<div class="appbar-in"><a class="brand" href="../feed/"><img src="${UI}assets/logo-mark.svg" alt="">Inkwell</a>
    <nav class="sections" aria-label="${T("Seções", "Sections")}">${NAV.map(([k, href, label, ic]) => `<a href="${href}"${cur(k)} data-iw="${k}"><i class="ic i-${ic}"></i>${label}</a>`).join("")}</nav>
    <div class="end">
      <a class="btn ghost counter-btn" href="../counter/" aria-label="${T("Abrir o Contador", "Open the Counter")}"><i class="ic i-counter"></i><span>${T("Contador", "Counter")}</span></a>
      ${me ? `<button type="button" class="av-btn" id="iwAcct" aria-label="${T("Sua conta", "Your account")}" aria-haspopup="menu" aria-expanded="false"><span class="av" id="iwAv">${esc((me.email || "?")[0].toUpperCase())}</span><span class="count iw-badge" id="iwBadge" hidden></span></button>`
        : `<button type="button" class="btn ghost icon" id="iwLangBtn" aria-label="${T("Aparência e idioma", "Appearance and language")}" aria-haspopup="menu" aria-expanded="false"><i class="ic i-globe"></i></button>
           <button type="button" class="btn small" id="iwSignIn">${T("Entrar", "Sign in")}</button>`}
    </div></div>`;
  document.body.prepend(bar);
  const tabs = document.createElement("nav");
  tabs.className = "tabbar";
  tabs.setAttribute("aria-label", T("Seções", "Sections"));
  tabs.innerHTML = NAV.map(([k, href, label, ic]) => `<a href="${href}"${cur(k)} data-iw="${k}"><i class="pip"><i class="ic i-${ic}"></i></i>${label}${k === "trades" ? '<span class="count" id="iwTradesCount" hidden></span>' : ""}</a>`).join("");
  document.body.append(tabs);
  document.body.classList.add("iw-has-shell");

  // ---------- menus ----------
  const end = bar.querySelector(".end");
  let menu = null, opener = null;
  const closeMenu = () => { if (!menu) return; menu.remove(); menu = null; opener?.setAttribute("aria-expanded", "false"); opener?.focus(); opener = null; };
  function openMenu(btn, html, cls = "") {
    if (menu) { const same = opener === btn; closeMenu(); if (same) return; }
    opener = btn; btn.setAttribute("aria-expanded", "true");
    menu = document.createElement("div");
    menu.className = `menu ${cls}`; menu.setAttribute("role", "menu");
    menu.innerHTML = html;
    end.append(menu);
    menu.querySelector("[role^=menuitem], button")?.focus();
    menu.querySelectorAll("[data-lang-pick]").forEach((b) => b.addEventListener("click", () => {
      if (b.dataset.langPick !== lang) { try { localStorage.setItem("inkwell-lang", b.dataset.langPick); } catch { /* */ } location.reload(); }
    }));
    menu.querySelector("[data-signout]")?.addEventListener("click", () => {
      try { sessionStorage.removeItem("inkwell-guest-intent-v1"); } catch { /* */ }   // signing out cancels a pending "save after sign-in"; the draft stays
      CLOUD?.signOut(); location.reload();
    });
  }
  document.addEventListener("click", (e) => { if (menu && !menu.contains(e.target) && !opener?.contains(e.target)) closeMenu(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeMenu();
    if (menu && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
      const items = [...menu.querySelectorAll("[role^=menuitem], .seg button")];
      const i = items.indexOf(document.activeElement);
      items[(i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length]?.focus(); e.preventDefault();
    }
  });
  const langSeg = () => `<div class="menu-label">${T("Idioma", "Language")}</div>
    <div class="seg block" role="group" aria-label="${T("Idioma", "Language")}">${[["pt", "Português"], ["en", "English"]].map(([k, l]) => `<button type="button" data-lang-pick="${k}" aria-pressed="${k === lang}">${l}</button>`).join("")}</div>`;
  let profileName = "", syncAgo = "", isAdmin = false, news = null;
  // Notices: friend requests, recados waiting for approval, new posts in your communities (supabase/my_account.sql my_home).
  // "New" posts are the ones after you last opened Início (kept per account in this browser).
  const SEEN_KEY = me ? `inkwell-seen-${me.id}` : "";
  const seenAt = () => { try { return Date.parse(localStorage.getItem(SEEN_KEY) || "") || 0; } catch { return 0; } };
  window.INKWELL_MARK_SEEN = () => { try { localStorage.setItem(SEEN_KEY, new Date().toISOString()); } catch { /* */ } if (news) { news.posts = 0; showNews(); } };
  function showNews() {
    const b = $("iwBadge"); if (!b || !news) return;
    const n = news.requests + news.recados + news.posts;
    b.hidden = !n; b.textContent = n > 9 ? "9+" : String(n);
    $("iwAcct")?.setAttribute("aria-label", n ? T(`Sua conta · ${n} novidades`, `Your account · ${n} new`) : T("Sua conta", "Your account"));
  }
  const newsMenu = () => {
    if (!news || !(news.requests + news.recados + news.posts)) return "";
    const item = (href, ic, text, n) => (n ? `<a class="menu-item" role="menuitem" href="${href}"><i class="ic i-${ic}"></i>${text}<span class="trail"><span class="count">${n}</span></span></a>` : "");
    return `<div class="menu-sep"></div><div class="menu-label">${T("Novidades", "New for you")}</div>
      ${item("../feed/#amigos", "user-plus", news.requests === 1 ? T("Pedido de amizade", "Friend request") : T("Pedidos de amizade", "Friend requests"), news.requests)}
      ${item("../perfil/?editar=1#recados", "comment", news.recados === 1 ? T("Recado para aprovar", "Recado to approve") : T("Recados para aprovar", "Recados to approve"), news.recados)}
      ${item("../feed/", "board", T("Mensagens nas comunidades", "Community messages"), news.posts)}`;
  };
  $("iwAcct")?.addEventListener("click", (e) => openMenu(e.currentTarget, `
    <div class="menu-head"><span class="av lg">${esc((profileName || me.email || "?")[0].toUpperCase())}</span><div class="t"><b>${esc(profileName || T("Sua conta", "Your account"))}</b><div class="small">${esc(me.email || "")}</div></div></div>
    ${newsMenu()}
    <div class="menu-sep"></div>
    <a class="menu-item" role="menuitem" href="../perfil/?editar=1"><i class="ic i-users"></i>${T("Meu Inkwell", "My Inkwell")}</a>
    <a class="menu-item" role="menuitem" href="../comunidades/"><i class="ic i-board"></i>${T("Comunidades", "Communities")}</a>
    <a class="menu-item" role="menuitem" href="../feed/#amigos"><i class="ic i-shield"></i>${T("Privacidade e amigos", "Privacy and friends")}</a>
    <a class="menu-item" role="menuitem" href="../coach/"><i class="ic i-refresh"></i>${T("Jogos do duels.ink", "duels.ink games")}${syncAgo ? `<span class="trail">${esc(syncAgo)}</span>` : ""}</a>
    ${isAdmin ? `<a class="menu-item" role="menuitem" href="../admin/"><i class="ic i-shield"></i>Admin</a>` : ""}
    <a class="menu-item" role="menuitem" href="../privacidade/"><i class="ic i-info"></i>${T("Termos e privacidade", "Terms and privacy")}</a>
    ${langSeg()}
    <div class="menu-sep"></div>
    <button type="button" class="menu-item" role="menuitem" data-signout><i class="ic i-logout"></i>${T("Sair", "Sign out")}</button>`));
  $("iwLangBtn")?.addEventListener("click", (e) => openMenu(e.currentTarget, `<div class="menu-label">${T("Idioma", "Language")}</div>
    ${[["pt", "Português"], ["en", "English"]].map(([k, l]) => `<button type="button" class="menu-item" role="menuitemradio" aria-checked="${k === lang}" data-lang-pick="${k}">${l}${k === lang ? '<i class="ic i-check" style="margin-left:auto;color:var(--text)"></i>' : ""}</button>`).join("")}
    <div class="menu-sep"></div><div class="menu-label">${T("Tema: Noite", "Theme: Night")}</div>`, "sm"));
  function $(id) { return document.getElementById(id); }

  // ---------- sign-in sheet: e-mail → code from the e-mail (or the link in it) ----------
  const sheet = document.createElement("dialog");
  sheet.className = "sheet"; sheet.id = "iwSignSheet"; sheet.setAttribute("aria-labelledby", "iwSiT");
  document.body.append(sheet);
  let email = "", trigger = null;
  function stepEmail(msg = "") {
    sheet.innerHTML = `<div class="grab"></div>
      <div class="sheet-head"><div><h2 id="iwSiT">${T("Entrar no Inkwell", "Sign in to Inkwell")}</h2><div class="sub">${T("Sem senha. Mandamos um código.", "No password. We e-mail you a code.")}</div></div>
        <button type="button" class="btn ghost icon" data-close aria-label="${T("Fechar", "Close")}"><i class="ic i-close"></i></button></div>
      <div class="sheet-body"><form class="form" id="iwSiForm" novalidate>
        <label class="field">${T("E-mail", "E-mail")}<input id="iwSiEmail" type="email" inputmode="email" autocomplete="email" placeholder="voce@exemplo.com" value="${esc(email)}" required></label>
        <p class="small muted">${T("Se for a primeira vez, sua conta é criada agora. Seus jogos ficam salvos e só você decide quem vê.", "If it's your first time, your account is created now. Your games are saved and only you decide who sees them.")}</p>
        <p class="small faint">${T("Ao entrar, você concorda com os", "By signing in you agree to the")} <a href="../privacidade/">${T("Termos e a Privacidade", "Terms and Privacy")}</a>.</p>
        <p class="small" id="iwSiMsg" role="alert">${esc(msg)}</p>
      </form></div>
      <div class="sheet-foot"><button type="button" class="btn ghost" data-close>${T("Cancelar", "Cancel")}</button><button type="submit" form="iwSiForm" class="btn primary" id="iwSiSend">${T("Enviar código", "Send code")}</button></div>`;
    wireClose();
    $("iwSiForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      email = $("iwSiEmail").value.trim();
      if (!/^\S+@\S+\.\S+$/.test(email)) { $("iwSiMsg").textContent = T("Digite seu e-mail.", "Enter your e-mail."); return; }
      const b = $("iwSiSend"); b.setAttribute("aria-busy", "true"); b.disabled = true;
      try { await CLOUD.requestCode(email); sentAt = Date.now(); stepCode(); }
      catch { b.removeAttribute("aria-busy"); b.disabled = false; $("iwSiMsg").textContent = T("Não foi possível enviar o e-mail. Confira o endereço e a internet.", "Couldn't send the e-mail. Check the address and your connection."); }
    });
    setTimeout(() => $("iwSiEmail")?.focus(), 30);
  }
  // The e-mail code: Supabase sends 6 to 10 digits (Authentication → Providers → Email → "Email OTP Length").
  // One field takes the whole code, typed or pasted, and never cuts it; nothing is sent until "Entrar".
  const OTP_MIN = 6, OTP_MAX = 10, RESEND_WAIT = 60;
  let sentAt = 0;
  function stepCode(msg = "") {
    sheet.innerHTML = `<div class="grab"></div>
      <div class="sheet-head"><div><h2 id="iwSiT">${T("Digite o código", "Enter the code")}</h2><div class="sub">${esc(T("Enviado para ", "Sent to ") + email)}</div></div>
        <button type="button" class="btn ghost icon" data-close aria-label="${T("Fechar", "Close")}"><i class="ic i-close"></i></button></div>
      <div class="sheet-body"><form class="form" id="iwSiForm" novalidate>
        <label class="field">${T("Código do e-mail", "Code from the e-mail")}
          <input id="iwSiCode" class="otp-one" inputmode="numeric" autocomplete="one-time-code" spellcheck="false" autocapitalize="off" maxlength="40" aria-describedby="iwSiHint iwSiMsg"></label>
        <span class="hint" id="iwSiHint">${T("Copie ou digite o código inteiro do e-mail mais recente. Confira o spam.", "Copy or type the whole code from the latest e-mail. Check spam too.")}</span>
        <p class="small" id="iwSiMsg" role="alert">${esc(msg)}</p>
        <div class="row between small"><button type="button" class="linkbtn" id="iwSiBack">${T("Trocar e-mail", "Change e-mail")}</button><button type="button" class="linkbtn" id="iwSiAgain"></button></div>
      </form></div>
      <div class="sheet-foot"><button type="button" class="btn ghost" id="iwSiBack2">${T("Voltar", "Back")}</button><button type="submit" form="iwSiForm" class="btn primary" id="iwSiIn" disabled>${T("Entrar", "Sign in")}</button></div>`;
    wireClose();
    const box = $("iwSiCode"), go = $("iwSiIn"), say = (t) => { $("iwSiMsg").textContent = t; };
    const digits = () => box.value.replace(/\D/g, "");
    const sync = () => {
      const n = digits().length;
      go.disabled = n < OTP_MIN || n > OTP_MAX;
      box.classList.remove("err");
      if (n > OTP_MAX) say(T(`O código tem no máximo ${OTP_MAX} dígitos. Confira o que foi colado.`, `The code has at most ${OTP_MAX} digits. Check what was pasted.`));
      else if (/[^\d\s-]/.test(box.value)) say(T("Use só os números do código.", "Use only the code's digits."));
      else if ($("iwSiMsg").dataset.keep !== "1") say("");
      $("iwSiMsg").dataset.keep = "";
    };
    box.addEventListener("input", sync);
    // resend, after the provider's minimum wait between e-mails
    const again = $("iwSiAgain");
    const tick = () => {
      if (!sheet.open || !document.contains(again)) return;
      const left = Math.max(0, RESEND_WAIT - Math.floor((Date.now() - sentAt) / 1000));
      again.disabled = left > 0;
      again.textContent = left > 0 ? T(`Mandar outro código em ${left} s`, `Send another code in ${left} s`) : T("Mandar outro código", "Send another code");
      if (left > 0) setTimeout(tick, 1000);
    };
    again.onclick = async () => {
      again.disabled = true;
      try { await CLOUD.requestCode(email); sentAt = Date.now(); box.value = ""; sync(); say(T("Mandamos um código novo. Use só o do e-mail mais recente.", "We sent a new code. Use only the one in the latest e-mail.")); }
      catch (e) { say(e?.status === 429 ? T("Espere um pouco antes de pedir outro código.", "Wait a little before asking for another code.") : T("Não foi possível enviar o e-mail. Confira a internet.", "Couldn't send the e-mail. Check your connection.")); }
      tick();
    };
    tick();
    const back = () => stepEmail();
    $("iwSiBack").onclick = back; $("iwSiBack2").onclick = back;
    $("iwSiForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (go.disabled) return;
      go.setAttribute("aria-busy", "true"); go.disabled = true;
      try { await CLOUD.verify(email, digits()); location.reload(); }
      catch (err) {
        go.removeAttribute("aria-busy"); box.classList.add("err"); box.focus(); box.select?.();
        $("iwSiMsg").dataset.keep = "1"; sync();
        say(err?.status === 429 ? T("Muitas tentativas. Espere um pouco e tente de novo.", "Too many tries. Wait a little and try again.")
          : err?.status >= 400 && err?.status < 500 ? T("Esse código não vale: está errado, expirou ou já foi usado (abrir o link do e-mail também usa o código). Peça outro.", "That code doesn't work: it's wrong, expired or already used (opening the e-mail's link uses it too). Ask for another one.")
          : T("Sem conexão com o servidor. Tente de novo.", "No connection to the server. Try again."));
      }
    });
    setTimeout(() => box.focus(), 30);
  }
  function wireClose() { sheet.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => sheet.close())); }
  sheet.addEventListener("close", () => { trigger?.focus?.(); trigger = null; });
  sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.close(); });   // tap on the backdrop
  window.INKWELL_SIGNIN = () => {
    if (!CLOUD) return;
    trigger = document.activeElement;
    stepEmail();
    if (!sheet.open) sheet.showModal();
  };
  $("iwSignIn")?.addEventListener("click", () => window.INKWELL_SIGNIN());
  // Came back from an e-mail link that no longer works: say why and offer a new code, once.
  if (window.INKWELL_LINK_FAILED && CLOUD && !CLOUD.status().signedIn) {
    setTimeout(() => {
      window.INKWELL_SIGNIN();
      stepEmail(T("O link do e-mail não vale mais: ele já foi usado ou expirou. Alguns e-mails, como Outlook e Hotmail, abrem os links sozinhos para verificar. Peça um código novo e digite-o aqui.",
        "The e-mail link no longer works: it was already used or expired. Some mail services, like Outlook and Hotmail, open links by themselves to scan them. Ask for a new code and type it here."));
    }, 50);
  }

  // ---------- guest draft (Começar meu Inkwell, behind INKWELL_FLAGS.guestProfile) ----------
  if ((window.INKWELL_FLAGS || {}).guestProfile && page !== "start") {
    const main = document.querySelector("main");
    const note = (html, id) => { if (!main || document.getElementById(id)) return; const d = document.createElement("div"); d.id = id; d.className = "notice"; d.setAttribute("role", "status"); d.innerHTML = html; main.prepend(d); };
    let draft = null; try { draft = JSON.parse(sessionStorage.getItem("inkwell-guest-draft-v1") || "null"); } catch { /* */ }
    // the draft lives in this tab: other pages remind, never ask
    if (draft && typeof draft === "object") note(`<span>${T("Seu Inkwell ainda não foi salvo.", "Your Inkwell isn't saved yet.")}</span> <a href="../comecar/">${T("Continuar", "Continue")}</a>`, "iwDraftNote");
    // opened by the e-mail link: if the tab with the draft is still open, send the person back there
    if (window.INKWELL_FROM_LINK && "BroadcastChannel" in window) {
      const bc = new BroadcastChannel("inkwell-guest");
      bc.addEventListener("message", (e) => { if (e.data?.type === "here") note(T("Volte à aba em que você começou para salvar suas alterações.", "Return to the tab where you started to save your changes."), "iwOtherTab"); });
      bc.postMessage({ type: "ping" });
    }
  }

  // ---------- Trocas count, name, last duels.ink sync (best effort) ----------
  window.INKWELL_SHELL_BADGE = (n) => {
    const c = $("iwTradesCount"); if (!c) return;
    c.hidden = !n; c.textContent = n > 9 ? "9+" : String(n || "");
    const a = c.closest("a"); if (a) a.setAttribute("aria-label", `${T("Trocas", "Trades")}${n ? ` · ${n} ${T("aguardando você", "waiting for you")}` : ""}`);
  };
  if (me && CLOUD) {
    CLOUD.api("rpc/my_profile", { method: "POST", body: {} })   // supabase/my_inkwell.sql
      .then((p) => { profileName = p?.display_name || ""; isAdmin = !!p?.is_admin; return profileName ? null : CLOUD.api(`profiles?user_id=eq.${me.id}&select=display_name`); })
      .catch(() => CLOUD.api(`profiles?user_id=eq.${me.id}&select=display_name`))
      .then((r) => { if (r) profileName = r?.[0]?.display_name || ""; if (profileName) $("iwAv").textContent = profileName.trim()[0].toUpperCase(); })
      .catch(() => {});
    CLOUD.api("rpc/my_home", { method: "POST", body: {} }).then((h) => {
      if (!h) return;
      let since = seenAt();
      if (!since) { window.INKWELL_MARK_SEEN(); since = Date.now(); }   // first visit: only what comes after counts
      news = { requests: (h.friend_requests || []).length, recados: +h.recados_waiting || 0,
        posts: (h.community_posts || []).filter((p) => !p.mine && Date.parse(p.at) > since).length };
      if (page === "feed") news.posts = 0;   // Início shows them in "Para você"
      showNews();
    }).catch(() => {});
    // an invite link opened before signing in (perfil/?convite=…): accept it on whichever page the sign-in lands
    let inv = null; try { inv = localStorage.getItem("inkwell-invite"); } catch { /* */ }
    if (inv && page !== "profile") {
      try { localStorage.removeItem("inkwell-invite"); } catch { /* */ }
      CLOUD.api("rpc/accept_invite", { method: "POST", body: { p_code: inv } }).catch(() => {});
    }
    Promise.all([
      CLOUD.api(`user_loans?select=id&status=eq.requested&created_by=neq.${me.id}`).catch(() => []),
      CLOUD.api(`user_trades?select=id&status=eq.proposed&partner=eq.${me.id}`).catch(() => []),
    ]).then(([a, b]) => { if (page !== "trades") window.INKWELL_SHELL_BADGE((a || []).length + (b || []).length); });
    CLOUD.api("rpc/my_duels_sync", { method: "POST", body: {} }).then((r) => {
      const t = Date.parse(r?.[0]?.last_run_at); if (!t) return;
      const m = Math.max(0, Math.round((Date.now() - t) / 60000));
      syncAgo = m < 1 ? T("agora", "now") : m < 60 ? T(`há ${m} min`, `${m} min ago`) : T(`há ${Math.round(m / 60)} h`, `${Math.round(m / 60)} h ago`);
    }).catch(() => {});
  }
})();
</script>
</body>
</html>
