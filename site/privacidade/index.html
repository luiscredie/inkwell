<script>window.INKWELL_CLOUD_CONFIG = {"url": "https://sorefaetiaebmjploanp.supabase.co", "key": "sb_publishable_RkAWW-ENz70CXA6_QV7aHw_MpfD7Gn2", "redirect": "../privacidade/"};
/* Inkwell Lore Counter: cloud adapter for the offline app.
 *
 * Talks to the Inkwell Supabase project with plain fetch (no library to cache):
 *   sign-in   email one-time code (or the magic link, when opened in the same browser)
 *   storage   public.game_logs, one row per game, upserted on (user_id, game_id),
 *             so a retry after a dropped connection never creates a duplicate
 * The counter keeps every match locally until send() resolves true.
 * Only the public URL and publishable key are here; row-level security limits each user to their own rows.
 */
// Feature flags. The guest experience (Começar meu Inkwell, new Início) is on for everyone since 26/10/2026.
// ?preview=off shows the previous experience in this tab (sessionStorage); ?preview=visitante turns it back on.
// Rollback: set GUEST_DEFAULT to false (nothing in the database changes).
window.INKWELL_FLAGS = (() => {
  const GUEST_DEFAULT = true;
  const f = { guestProfile: GUEST_DEFAULT };
  try {
    const q = new URLSearchParams(location.search).get("preview");
    if (q === "visitante") sessionStorage.setItem("inkwell-preview", "visitante");
    if (q === "off") sessionStorage.setItem("inkwell-preview", "off");
    const v = sessionStorage.getItem("inkwell-preview");
    if (v === "visitante") f.guestProfile = true;
    if (v === "off") f.guestProfile = false;
  } catch { /* storage off: the default stays */ }
  return f;
})();
// MYP Cards prices (data/prices-br.json): off since 01/11/2026 — the store blocks automated access, so they can't be
// kept up to date; prices are TCGplayer only. Turn back on with true once there is an allowed way to refresh them.
if (window.INKWELL_PRICES_BR === undefined) window.INKWELL_PRICES_BR = false;
// The partner store (sponsor) that goes first in every "buy" row (Decks: Faltando, Fada Madrinha). None yet.
// Set it like this: { name: "Loja X", search: "https://lojax.com.br/busca?q={q}" } — {q} becomes the card's name.
if (window.INKWELL_PARTNER_STORE === undefined) window.INKWELL_PARTNER_STORE = null;
window.INKWELL_CLOUD = (() => {
  const cfg = window.INKWELL_CLOUD_CONFIG || {};
  if (!cfg.url || !cfg.key) return null;
  // One sign-in for the whole site: the counter, Coach Review, Início, Trocas and the Inkwell app itself
  // (its supabase-js client uses this same storage key), so signing in or out on one page does it on all.
  const KEY = "inkwell-counter-auth";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch { return null; } };
  let sess = load();
  const recent = new Map();   // shared reads (see shared() below)
  // POST calls that only read (STABLE functions in the database, which cannot write) or only add page statistics
  // (track): they keep the shared reads. Any other POST, PATCH or DELETE is a write and clears them; a function not
  // listed here is taken as a write, so a missing name costs a repeated request, never an old answer.
  const READ_RPC = /^rpc\/(my_[a-z_]+|feed_posts|search_all|communities_list|example_profiles|friend_decks|find_player_decks|shared_collections|friend_collection|friends_lending|share_invite_info|achievements_by_ids|achievements_of|public_profile|track)(\?|$)/;
  const store = (x) => { sess = x; recent.clear(); try { if (x) localStorage.setItem(KEY, JSON.stringify(x)); else localStorage.removeItem(KEY); } catch { /* private mode */ } };
  const headers = (tok) => ({ apikey: cfg.key, "Content-Type": "application/json", ...(tok ? { Authorization: `Bearer ${tok}` } : {}) });
  const claims = (jwt) => { try { return JSON.parse(atob(jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); } catch { return {}; } };
  const session = (r) => {   // the same shape supabase-js keeps, so both read each other's session
    const c = claims(r.access_token);
    const expires_at = r.expires_at || c.exp || Math.floor(Date.now() / 1000) + (r.expires_in || 3600);
    return { access_token: r.access_token, refresh_token: r.refresh_token, token_type: "bearer",
      expires_in: r.expires_in || Math.max(0, expires_at - Math.floor(Date.now() / 1000)), expires_at,
      user: { ...(r.user || {}), id: r.user?.id || c.sub, email: r.user?.email || c.email } };
  };

  // Magic link opened in this same browser: tokens arrive in the URL fragment.
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("access_token") && h.get("refresh_token")) {
    store(session({ access_token: h.get("access_token"), refresh_token: h.get("refresh_token"), expires_in: +h.get("expires_in") || 3600 }));
    history.replaceState(null, "", location.pathname + location.search);
    window.INKWELL_FROM_LINK = true;   // this tab was opened by the e-mail link (the guest editor tells the original tab apart)
  } else if (h.get("error_code") || h.get("error")) {
    // The e-mail link didn't work (already used or expired): Supabase sends back #error=…&error_code=otp_expired.
    // Some mail services (Outlook/Hotmail) open links by themselves to scan them, which uses the link up.
    history.replaceState(null, "", location.pathname + location.search);
    window.INKWELL_LINK_FAILED = h.get("error_code") || h.get("error");
  }

  // One refresh at a time. A page fires ~15 calls at once when it opens; with an expired token (a phone waking up
  // after an hour) each one used to refresh on its own with the same refresh token — 16 refreshes in one second,
  // Supabase answering 500 to some, and a page that could end up signed out. Now the calls of this page share one
  // refresh, and pages of other tabs wait their turn (Web Locks) and pick up the tokens the first one saved.
  let refreshing = null;
  async function token() {
    sess = load();   // another page (or the Inkwell app) may have signed in, out, or refreshed the tokens meanwhile
    if (!sess) return null;
    if (sess.expires_at - 60 > Date.now() / 1000) return sess.access_token;
    if (!refreshing) {
      const run = () => refresh();
      refreshing = (navigator.locks?.request ? navigator.locks.request("inkwell-auth-refresh", run) : run())
        .finally(() => { refreshing = null; });
    }
    return refreshing;
  }
  // a 401: refresh on the next call — unless that token was already replaced (a call that left before a refresh)
  function expire(tok) { const now = load(); if (now && now.access_token === tok) store({ ...now, expires_at: 0 }); }
  async function refresh() {
    sess = load();   // inside the lock: another tab may have just refreshed
    if (!sess) return null;
    if (sess.expires_at - 60 > Date.now() / 1000) return sess.access_token;
    const used = sess.refresh_token;
    const r = await fetch(`${cfg.url}/auth/v1/token?grant_type=refresh_token`, { method: "POST", headers: headers(), body: JSON.stringify({ refresh_token: used }) });
    if (r.status === 400 || r.status === 401) {
      const now = load();   // a page that refreshed at the same moment already saved newer tokens: keep them
      if (now && now.refresh_token !== used && now.expires_at - 60 > Date.now() / 1000) { sess = now; return sess.access_token; }
      store(null); return null;   // signed out elsewhere
    }
    if (!r.ok) throw new Error(`refresh ${r.status}`);
    store(session(await r.json()));
    return sess.access_token;
  }

  // Supabase Auth endpoints used by the passkeys (same requests supabase-js makes)
  async function auth(path, { method = "POST", body, tok } = {}) {
    const r = await fetch(`${cfg.url}/auth/v1/${path}`, { method, headers: { ...headers(tok), "X-Supabase-Api-Version": "2024-01-01" }, body: body === undefined ? undefined : JSON.stringify(body) });
    let j = null; try { j = r.status === 204 ? null : await r.json(); } catch { /* no body */ }
    if (!r.ok) throw Object.assign(new Error(`auth ${path} ${r.status}`), { status: r.status, why: String(j?.msg || j?.message || j?.error_description || "").slice(0, 200), code: j?.error_code || j?.code });
    return j;
  }
  const b64u = { dec: (s) => Uint8Array.from(atob(String(s).replace(/-/g, "+").replace(/_/g, "/") + "===".slice((String(s).length + 3) % 4)), (c) => c.charCodeAt(0)).buffer,
    enc: (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "") };
  const ids = (list) => (list || []).map((c) => ({ ...c, id: b64u.dec(c.id), type: c.type || "public-key" }));
  const pkRequest = (o) => (typeof PublicKeyCredential.parseRequestOptionsFromJSON === "function" ? PublicKeyCredential.parseRequestOptionsFromJSON(o)
    : { ...o, challenge: b64u.dec(o.challenge), ...(o.allowCredentials?.length ? { allowCredentials: ids(o.allowCredentials) } : {}) });
  const pkCreate = (o) => (typeof PublicKeyCredential.parseCreationOptionsFromJSON === "function" ? PublicKeyCredential.parseCreationOptionsFromJSON(o)
    : { ...o, challenge: b64u.dec(o.challenge), user: { ...o.user, id: b64u.dec(o.user.id) }, ...(o.excludeCredentials?.length ? { excludeCredentials: ids(o.excludeCredentials) } : {}) });
  function pkJSON(c) {   // the credential as JSON (WebAuthn level 3 toJSON, or by hand for older browsers)
    if (typeof c.toJSON === "function") return c.toJSON();
    const r = c.response, out = { id: c.id, rawId: c.id, type: "public-key", clientExtensionResults: c.getClientExtensionResults?.() || {}, authenticatorAttachment: c.authenticatorAttachment || undefined, response: { clientDataJSON: b64u.enc(r.clientDataJSON) } };
    if (r.attestationObject) out.response.attestationObject = b64u.enc(r.attestationObject);
    if (r.authenticatorData) Object.assign(out.response, { authenticatorData: b64u.enc(r.authenticatorData), signature: b64u.enc(r.signature), userHandle: r.userHandle ? b64u.enc(r.userHandle) : undefined });
    return out;
  }

  // Authenticated call to the database's REST API (used by Coach Review). Errors carry a short code.
  // anon: true also works signed out (the publishable key), for the few functions open to visitors
  async function api(path, { method = "GET", body, prefer, anon = false, keepalive = false, read = false } = {}) {
    if (method !== "GET" && !read && !READ_RPC.test(path)) recent.clear();   // a write (profile saved, friend added…): no shared answer from before it
    const tok = await token();
    if (!tok && !anon) throw Object.assign(new Error("signed out"), { code: "auth" });
    const r = await fetch(`${cfg.url}/rest/v1/${path}`, {
      method, keepalive, headers: { ...headers(tok), ...(prefer ? { Prefer: prefer } : {}) }, body: body === undefined ? undefined : JSON.stringify(body) });
    if (r.status === 401) expire(tok);
    if (!r.ok) {
      const code = r.status === 401 || r.status === 403 ? "permission" : r.status === 400 || r.status === 409 || r.status === 413 ? "invalid_argument" : "unavailable";
      // the database's own reason (e.g. "adults_only", "event_full", "too_many_friend_requests") goes in the message,
      // so a page can tell the person what happened
      let why = ""; try { why = String((await r.json())?.message || "").slice(0, 200); } catch { /* no body */ }
      throw Object.assign(new Error(`${method} ${path.split("?")[0]} ${r.status}${why ? `: ${why}` : ""}`), { code, status: r.status, why });
    }
    const text = await r.text();
    return text ? JSON.parse(text) : null;
  }

  // The same read asked twice as a page opens (the top bar and the page both want rpc/my_profile and rpc/my_home):
  // whoever asks first sends it, whoever asks within 5 s gets the same answer. Only for reads with no arguments.
  // Forgotten on any write and on any change of session (sign in, sign out, another account, token refresh).
  function shared(path) {
    const k = (load()?.user?.id || "") + " " + path, hit = recent.get(k);
    if (hit && Date.now() - hit.at < 5000) return hit.p;
    const p = api(path, { method: "POST", body: {}, read: true });
    recent.set(k, { at: Date.now(), p });
    p.catch(() => recent.delete(k));   // a failure is not shared: the next caller tries again
    return p;
  }

  // The player's collections (public.inkwell_profiles). A new account has none yet, and every collection, deck
  // and wishlist save needs one, so the first visit creates an empty "principal" collection, then reads again.
  async function collections(select) {
    const q = `inkwell_profiles?select=${select}&order=updated_at.desc`;
    const r = await api(q);
    if (Array.isArray(r) && r.length) return r;
    const id = load()?.user?.id;
    if (!id) return r;
    await api("inkwell_profiles?on_conflict=user_id,profile", { method: "POST", prefer: "resolution=ignore-duplicates,return=minimal",
      body: { user_id: id, profile: "principal", schema: 2, data: { _schema: 2, collection: {}, decks: [], wishlist: {} } } });
    return api(q);
  }

  // Storage (supabase/achievements.sql): upload one file to a private bucket, signed links to see files, remove files.
  async function storage(path, { method = "POST", body, type = "application/json" } = {}) {
    if (!path.startsWith("object/sign/")) recent.clear();   // an upload or a removal is a write too
    const tok = await token();
    const r = await fetch(`${cfg.url}/storage/v1/${path}`, { method, headers: { ...headers(tok), "Content-Type": type }, body: type === "application/json" && body !== undefined ? JSON.stringify(body) : body });
    if (!r.ok) { let why = ""; try { why = String((await r.json())?.message || "").slice(0, 200); } catch { /* */ } throw Object.assign(new Error(`storage ${r.status}${why ? `: ${why}` : ""}`), { status: r.status, why }); }
    const t = await r.text(); return t ? JSON.parse(t) : null;
  }
  const upload = (bucket, name, blob) => storage(`object/${bucket}/${name.split("/").map(encodeURIComponent).join("/")}`, { body: blob, type: blob.type || "application/octet-stream" });
  async function signed(bucket, names, seconds = 3600) {
    if (!names.length) return {};
    const r = await storage(`object/sign/${bucket}`, { body: { expiresIn: seconds, paths: names } }).catch(() => []);
    const out = {}; for (const x of r || []) if (x?.signedURL && !x.error) out[x.path] = `${cfg.url}/storage/v1${x.signedURL}`; return out;
  }
  const removeFiles = (bucket, names) => (names.length ? storage(`object/${bucket}`, { method: "DELETE", body: { prefixes: names } }) : Promise.resolve(null));

  // an Edge Function by GET (signed in or not: the publishable key is enough for public ones)
  async function fn(name, params = {}) {
    const tok = sess ? await token().catch(() => null) : null;
    const r = await fetch(`${cfg.url}/functions/v1/${name}?${new URLSearchParams(params)}`, { headers: headers(tok) });
    if (!r.ok) throw Object.assign(new Error(`${name} ${r.status}`), { status: r.status });
    return r.json();
  }

  return {
    api, shared, collections, fn, upload, signed, removeFiles,
    user: () => { sess = load(); return sess ? { id: sess.user?.id, email: sess.user?.email } : null; },
    status: () => { sess = load(); return sess ? { signedIn: true, email: sess.user?.email || "" } : { signedIn: false }; },
    async requestCode(email) {
      const redirect = cfg.redirect ? new URL(cfg.redirect, location.href).href : location.href.split("#")[0];
      // where to come back after the confirmation page (/entrar/), same site only
      try { localStorage.setItem("inkwell-return", JSON.stringify({ path: location.pathname + location.search, at: Date.now() })); } catch { /* private mode */ }
      const r = await fetch(`${cfg.url}/auth/v1/otp?redirect_to=${encodeURIComponent(redirect)}`, { method: "POST", headers: headers(), body: JSON.stringify({ email, create_user: true }) });
      if (!r.ok) throw Object.assign(new Error(`otp ${r.status}`), { status: r.status });
    },
    async verify(email, code) {
      const r = await fetch(`${cfg.url}/auth/v1/verify`, { method: "POST", headers: headers(), body: JSON.stringify({ type: "email", email, token: String(code).replace(/\s/g, "") }) });
      if (!r.ok) throw Object.assign(new Error(`verify ${r.status}`), { status: r.status });
      store(session(await r.json()));
    },
    // The e-mail's own link to /entrar/?h=<token hash>: signs in only when the person presses the button there,
    // so a mail scanner that just opens the link doesn't use it up.
    async verifyHash(tokenHash, type = "email") {
      const r = await fetch(`${cfg.url}/auth/v1/verify`, { method: "POST", headers: headers(), body: JSON.stringify({ type, token_hash: String(tokenHash) }) });
      if (!r.ok) throw Object.assign(new Error(`verify ${r.status}`), { status: r.status });
      store(session(await r.json()));
    },
    // ---------- passkeys (Face ID / digital / chave do aparelho) — Supabase Auth, experimental (Authentication → Passkeys;
    // relying party inkwell.com.br). The e-mail code stays: a passkey is created only after signing in with it once.
    passkeySupported: () => typeof window.PublicKeyCredential === "function" && !!navigator.credentials?.get && (location.protocol === "https:" || location.hostname === "localhost"),
    async passkeySignIn() {
      const o = await auth("passkeys/authentication/options", { body: {} });
      const cred = await navigator.credentials.get({ publicKey: pkRequest(o.options || o) });
      if (!cred) throw Object.assign(new Error("passkey cancelled"), { code: "cancelled" });
      const r = await auth("passkeys/authentication/verify", { body: { challenge_id: o.challenge_id, credential: pkJSON(cred) } });
      const s = r?.access_token ? r : r?.session;
      if (!s?.access_token) throw new Error("passkey: no session");
      store(session(s));
    },
    async passkeyRegister() {
      const tok = await token(); if (!tok) throw Object.assign(new Error("signed out"), { code: "auth" });
      const o = await auth("passkeys/registration/options", { body: {}, tok });
      const cred = await navigator.credentials.create({ publicKey: pkCreate(o.options || o) });
      if (!cred) throw Object.assign(new Error("passkey cancelled"), { code: "cancelled" });
      return auth("passkeys/registration/verify", { body: { challenge_id: o.challenge_id, credential: pkJSON(cred) }, tok });
    },
    async passkeys() { const tok = await token(); return tok ? auth("passkeys", { method: "GET", tok }) : []; },
    async passkeyDelete(id) { const tok = await token(); if (tok) await auth(`passkeys/${encodeURIComponent(id)}`, { method: "DELETE", tok }); },
    signOut() {
      const old = sess; store(null);
      if (old) fetch(`${cfg.url}/auth/v1/logout`, { method: "POST", headers: headers(old.access_token) }).catch(() => {});
    },
    async send(logs) {
      const tok = await token();   // also reloads sess
      if (!tok) return false;
      const rows = logs.map((l) => ({ user_id: sess.user.id, game_id: l.game_id, source: l.source, played_at: l.played_at, log: l }));
      const r = await fetch(`${cfg.url}/rest/v1/game_logs?on_conflict=user_id,game_id`, {
        method: "POST", headers: { ...headers(tok), Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(rows) });
      if (r.status === 401) expire(tok);   // force a refresh on the next try
      return r.ok;
    },
  };
})();
</script>

<script>
(() => {
  "use strict";
  let lang = "pt";
  try { lang = localStorage.getItem("inkwell-lang") || "pt"; } catch { /* */ }
  // Contact for privacy requests and removals. Empty: the page points to the report button.
  const CONTACT = "inkwell.lorcana@gmail.com";
  const VERSION = { pt: "Versão 2 · em vigor desde 27 de outubro de 2026 (inclui eventos, localização e avisos)", en: "Version 2 · in effect since 27 October 2026 (adds events, location and notices)" };
  const contact = (pt) => CONTACT ? (pt ? `pelo e-mail <a href="mailto:${CONTACT}">${CONTACT}</a>` : `by e-mail at <a href="mailto:${CONTACT}">${CONTACT}</a>`)
    : (pt ? "pelo botão <b>Denunciar</b> em qualquer perfil ou comunidade" : "with the <b>Report</b> button on any profile or community");
  const PT = `
    <h1>Termos e privacidade</h1>
    <p class="small faint">${VERSION.pt}</p>
    <div class="summary"><b>Em resumo</b><ul>
      <li>O Inkwell é um projeto de fã, gratuito, sem anúncios. Não vendemos nem cedemos seus dados.</li>
      <li>Tudo começa <b>privado</b>. Você escolhe o que fica público. Sua coleção nunca aparece para os outros.</li>
      <li>Perfil público, recados e comunidades são só para quem declara ter <b>18 anos ou mais</b>.</li>
      <li>Você pode <b>baixar todos os seus dados</b> e <b>excluir sua conta</b> a qualquer momento, em Meu Inkwell.</li>
    </ul></div>
    <h2 id="o-que-e">1. O que é o Inkwell</h2>
    <p>O Inkwell é um site gratuito feito por fã para quem joga e coleciona Disney Lorcana: coleção, decks, jogos, preços, trocas, perfis e comunidades. <b>Não tem vínculo com a Disney nem com a Ravensburger.</b> As imagens das cartas pertencem aos seus donos e são usadas de acordo com a política de conteúdo de fãs da Ravensburger.</p>
    <h2 id="quem">2. Quem pode usar</h2>
    <p>O Inkwell é pensado para maiores de 18 anos. Recursos que mostram você a outras pessoas (perfil público, recados e comunidades) exigem que você declare ter 18 anos ou mais. Menores de 18 só devem usar o Inkwell com o acompanhamento e o consentimento dos responsáveis, e não têm acesso a esses recursos.</p>
    <h2 id="dados">3. Quais dados guardamos</h2>
    <ul>
      <li><b>Conta:</b> seu e-mail (para mandar o código de entrada) e datas de criação e último acesso.</li>
      <li><b>O que você cadastra:</b> nome, coleção, decks, lista de desejos, empréstimos e trocas, jogos (do contador ou do duels.ink, se você conectar), comentários e anotações.</li>
      <li><b>Perfil Meu Inkwell:</b> endereço (@), lema, bio, carta do avatar, tintas, cidade, vitrine e deck em destaque.</li>
      <li><b>Mensagens:</b> recados, publicações em comunidades e no Início, comentários e curtidas.</li>
      <li id="conquistas"><b>Conquistas:</b> título, data, lugar, texto e uma foto que você escolher. A foto é reduzida no seu aparelho antes de enviar, e os dados de localização e da câmera saem nessa hora. Ela fica guardada de forma privada: só quem pode ver a conquista (você, seus amigos e, se ela for pública e seu perfil também, os visitantes) recebe um link temporário para ela. Apagar a conquista apaga a foto.</li>
      <li><b>Eventos:</b> os eventos do Play Hub que você marca (Vou/Talvez, inscrito, pago) e suas respostas às mesas das comunidades.</li>

      <li><b>Avisos:</b> as notificações do sino e, se você ligar os avisos no aparelho, o endereço técnico que o navegador cria para receber notificações. Desligar no sino apaga esse registro.</li>
      <li><b>Segurança:</b> denúncias enviadas e recebidas, e quando cada carta entrou na sua coleção.</li>
      <li id="estatisticas"><b>Estatísticas de uso, sem identificar ninguém:</b> para saber se o site é útil, contamos as páginas vistas e algumas ações (por exemplo, abrir o scanner ou testar um deck). Cada aba do navegador recebe um código aleatório que some quando a aba fecha. Junto vão só: se você está com conta ou não, celular ou computador, e o nome do site de onde você veio (só o domínio). <b>Não guardamos IP, cookies, nem quem você é</b>, e não cruzamos essas páginas e ações com a sua conta. Para saber quantos membros usam o site por semana e por mês, guardamos à parte, de quem está com conta, só a conta e o dia em que abriu o site (nenhuma página ou ação), também por 90 dias; esses dias vêm em “Baixar meus dados” e somem se você excluir a conta. Navegadores com “não rastrear” (Do Not Track / Global Privacy Control) não enviam nada. Fica 90 dias e só os administradores veem os totais.</li>
    </ul>
    <p>Não usamos cookies de rastreamento nem ferramentas de publicidade. O site guarda no seu navegador apenas preferências (idioma, filtros), a sessão de entrada e o código aleatório da aba.</p>
    <h2 id="quem-ve">4. Quem vê o quê</h2>
    <ul>
      <li>Seu perfil começa <b>privado</b>. Público, ele mostra só o que você escolheu. A coleção em si nunca aparece no perfil público.</li>
      <li id="colecao-compartilhada"><b>Coleção, só se você abrir:</b> você pode dividir uma coleção com alguém por um link de convite (a pessoa vê tudo e, se você deixar, altera), deixar <b>amigos</b> verem sua coleção, e aceitar pedidos de empréstimo — aí amigos que montam um deck veem quais das cartas que faltam você tem livres. Tudo começa desligado, você muda quando quiser em <i>Coleção › Compartilhar</i>, e quem divide a coleção pode sair a qualquer momento.</li>
      <li>Seus jogos ficam com você, a menos que escolha mostrá-los a amigos, grupos ou coaches. Os nomes dos adversários nunca aparecem para os outros.</li>
      <li>Recados só aparecem no seu perfil <b>depois que você aprova</b>. A conversa de uma comunidade é visível <b>só para os membros</b>.</li>
      <li>Nas listas de amigos e de membros, só aparece pelo nome quem tem perfil público.</li>
    </ul>
    <h2 id="uso">5. Para que usamos e com quem compartilhamos</h2>
    <p>Usamos seus dados só para fazer o Inkwell funcionar. Não há venda nem compartilhamento para marketing. Os dados ficam nos serviços que hospedam o site: <b>Supabase</b> (banco de dados e entrada por e-mail) e <b>GitHub Pages</b> (as páginas). Preços vêm de fontes públicas (TCGplayer via Lorcast, lojas brasileiras) e jogos podem vir do duels.ink, se você conectar sua conta. Os eventos vêm do Play Hub da Ravensburger (consultamos pela posição aproximada, sem dados seus). Quando você digita um endereço ou CEP em Eventos, a busca vai do seu navegador direto ao <b>OpenStreetMap</b> e, para CEP, ao <b>ViaCEP</b>. Os avisos no celular passam pelo serviço de notificações do seu aparelho (Apple, Google ou Mozilla). A <b>análise com IA</b> dos jogos só monta um texto: é você quem cola na IA que escolher, na sua conta. Quando você usa <b>Enviar feedback</b>, guardamos a mensagem, o tipo, a página e, se você deixar marcado, o navegador e o tamanho da tela; o e-mail só se você digitar. Só os administradores leem, e o que já foi resolvido é apagado depois de 180 dias. O link para o nosso <b>Instagram</b> (@inkwell.brasil) só abre o Instagram em outra aba: nada da Meta é carregado no Inkwell, e lá valem as regras de privacidade do Instagram.</p>
    <h2 id="direitos">6. Seus direitos</h2>
    <p>Pela Lei Geral de Proteção de Dados (LGPD), você pode, entre outros:</p>
    <ul>
      <li><b>Acessar e baixar</b> seus dados: Meu Inkwell → Seus dados → Baixar meus dados.</li>
      <li><b>Corrigir</b>: edite seu perfil, coleção e decks quando quiser.</li>
      <li><b>Excluir</b> sua conta e tudo ligado a ela: Meu Inkwell → Seus dados → Excluir minha conta. Comunidades que você criou passam para o membro mais antigo, ou são apagadas se ficarem vazias.</li>
      <li><b>Revogar</b> o que é público: deixe o perfil privado a qualquer momento.</li>
    </ul>
    <p>Para outros pedidos, fale conosco ${contact(true)}.</p>
    <h2 id="regras">7. Regras de convivência</h2>
    <p>Para recados, perfis e comunidades:</p>
    <ul>
      <li>Respeito sempre. Nada de assédio, ofensas, discriminação ou ameaças.</li>
      <li>Nada de conteúdo sexual, golpes, spam ou divulgação de dados pessoais de outras pessoas.</li>
      <li>Não se passe por outra pessoa ou loja.</li>
    </ul>
    <p>Qualquer membro pode denunciar. Denúncias são analisadas pela moderação, que pode ocultar ou apagar conteúdo, ocultar perfis e comunidades e excluir contas que descumpram estas regras. Donos de comunidade também podem ocultar mensagens e remover membros.</p>
    <h2 id="trocas">8. Trocas, vendas e empréstimos</h2>
    <p>O Inkwell ajuda a combinar trocas e empréstimos, mas <b>não intermedeia</b> negócios nem garante entregas, pagamentos ou o estado das cartas. Combinem com cuidado e por conta própria.</p>
    <h2 id="mudancas">9. Mudanças nesta página</h2>
    <p>Se estas regras mudarem, a data no topo muda e avisamos no site.</p>

    <h2>5. What we use it for, and who we share it with</h2>
    <p>We use your data only to run Inkwell. No selling, no sharing for marketing. Data lives with the services that host the site: <b>Supabase</b> (database and e-mail sign-in) and <b>GitHub Pages</b> (the pages). Prices come from public sources (TCGplayer via Lorcast, Brazilian shops), and games may come from duels.ink if you connect your account. Events come from the Ravensburger Play Hub (we ask by approximate position, with none of your data). When you type an address or postcode on Events, the lookup goes from your browser straight to <b>OpenStreetMap</b> and, for Brazilian CEPs, <b>ViaCEP</b>. Phone notices go through your device's notification service (Apple, Google or Mozilla). The <b>AI analysis</b> of games only writes a text: you paste it into the AI you choose, in your own account. When you use <b>Send feedback</b>, we keep the message, its kind, the page and, if you leave it ticked, the browser and screen size; an e-mail only if you type one. Only admins read it, and handled ones are deleted after 180 days. The link to our <b>Instagram</b> (@inkwell.brasil) only opens Instagram in another tab: nothing from Meta loads on Inkwell, and Instagram's own privacy rules apply there.</p>
    <h2>6. Your rights</h2>

        : n.kind === "event_soon" ? `<b>${T("Lembrete", "Reminder")}:</b> ${esc(n.ref?.text || T("seu evento", "your event"))} ${esc(T(...NK.event_soon))}` : n.kind === "comment_like" && n.others ? `<b>${esc(n.name || T("Alguém", "Someone"))}</b> ${esc(T(`e mais ${n.others} curtiram seu comentário`, `and ${n.others} more liked your comment`))}` : `<b>${esc(n.name || T("Alguém", "Someone"))}</b> ${esc(T(...(NK[n.kind] || ["", ""])))}`}${!/^event_(soon|near)/.test(n.kind) && (n.ref?.text || n.ref?.name) ? `<small>${esc(n.ref.text || n.ref.name)}</small>` : ""}<small>${esc(new Date(n.at).toLocaleString(lang === "en" ? "en" : "pt-BR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }))}</small></span></a>`).join("") : `<div class="menu-item" style="pointer-events:none"><span class="small">${T("Nada por aqui ainda.", "Nothing here yet.")}</span></div>`}<div class="push-row" id="iwPush"></div>`, "notif");
      drawPush();
      if (list.some((n) => n.unread)) CLOUD.api("rpc/read_notifications", { method: "POST", body: {} }).then(() => { [...list, ...(notes || [])].forEach((n) => { n.unread = false; }); showBell(); }).catch(() => {});
    });
    // Global search (supabase/search_privacy.sql): people with a public profile or my friends, and communities
    const findBtn = $("iwFind");
    const openFind = () => {
      if (!findBtn) return;
      openMenu(findBtn, `<div class="find" data-testid="find"><input type="search" id="iwFindQ" placeholder="${T("Buscar pessoas e comunidades", "Search people and communities")}" aria-label="${T("Buscar pessoas e comunidades", "Search people and communities")}" autocomplete="off" maxlength="60"><div id="iwFindR" aria-live="polite"><p class="small muted">${T("Digite pelo menos 2 letras.", "Type at least 2 letters.")}</p></div></div>`, "find-menu");
      const q = $("iwFindQ"), out = $("iwFindR"); let t = 0, seq = 0; q.focus();
      const ini = (n) => esc(String(n || "?").trim().charAt(0).toUpperCase() || "?");
      const sec = (title, rows) => rows.length ? `<div class="menu-label">${title}</div>${rows.join("")}` : "";
      q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(async () => {
        const v = q.value.trim(), my = ++seq;
        if (v.length < 2) { out.innerHTML = `<p class="small muted">${T("Digite pelo menos 2 letras.", "Type at least 2 letters.")}</p>`; return; }
        out.innerHTML = `<p class="small muted">${T("Buscando…", "Searching…")}</p>`;
        let r = null; try { r = await CLOUD.api("rpc/search_all", { method: "POST", body: { p_q: v } }); } catch { r = null; }
        if (my !== seq) return;
        if (!r) { out.innerHTML = `<p class="small muted">${T("A busca ainda não está disponível.", "Search isn't available yet.")}</p>`; return; }
        const people = (r.people || []).map((p) => `<a class="menu-item" role="menuitem" href="${p.handle ? `../perfil/?u=${encodeURIComponent(p.handle)}` : "../feed/#amigos"}"><span class="av sm">${ini(p.name)}</span><span><b>${esc(p.name || "")}</b><small>${esc([p.handle ? "@" + p.handle : "", p.friend ? T("Amigo", "Friend") : "", p.city || ""].filter(Boolean).join(" · "))}</small></span></a>`);
        const comms = (r.communities || []).map((c) => `<a class="menu-item" role="menuitem" href="../comunidades/?c=${encodeURIComponent(c.slug)}"><span class="av sm"><i class="ic i-users"></i></span><span><b>${esc(c.name)}</b><small>${esc([c.city, c.mine ? T("Você participa", "You're a member") : ""].filter(Boolean).join(" · "))}</small></span></a>`);
        out.innerHTML = sec(T("Pessoas", "People"), people) + sec(T("Comunidades", "Communities"), comms) || `<p class="small muted">${T("Nada encontrado.", "Nothing found.")}</p>`;
      }, 250); });
    };
    findBtn?.addEventListener("click", openFind);
    document.addEventListener("keydown", (e) => { if (e.key === "/" && !e.ctrlKey && !e.metaKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "") && !document.activeElement?.isContentEditable && !$("iwFindQ")) { e.preventDefault(); openFind(); } });
    // an invite link opened before signing in (perfil/?convite=…): accept it on whichever page the sign-in lands
    let inv = null; try { inv = localStorage.getItem("inkwell-invite"); } catch { /* */ }
    if (inv && page !== "profile") {
      try { localStorage.removeItem("inkwell-invite"); } catch { /* */ }
      CLOUD.api("rpc/accept_invite", { method: "POST", body: { p_code: inv } }).catch(() => {});
    }
    Promise.all([
      CLOUD.api(`user_loans?select=id&status=eq.requested&created_by=neq.${me.id}`).catch(() => []),
      CLOUD.api(`user_trades?select=id&status=eq.proposed&partner=eq.${me.id}`).catch(() => []),
    ]).then(([a, b]) => { if (page !== "trades") window.INKWELL_SHELL_BADGE((a || []).length + (b || []).length); });
    CLOUD.api("rpc/my_duels_sync", { method: "POST", body: {} }).then((r) => {
      const t = Date.parse(r?.[0]?.last_run_at); if (!t) return;
      const m = Math.max(0, Math.round((Date.now() - t) / 60000));
      syncAgo = m < 1 ? T("agora", "now") : m < 60 ? T(`há ${m} min`, `${m} min ago`) : T(`há ${Math.round(m / 60)} h`, `${Math.round(m / 60)} h ago`);
    }).catch(() => {});
  }

  // ---------- tap a card thumbnail to see it large (any page; not where the thumbnail is already a button or link) ----------
  const zoom = document.createElement("dialog");
  zoom.className = "iw-zoom-card"; zoom.id = "iwZoom"; zoom.setAttribute("aria-label", T("Carta ampliada", "Card, larger"));
  zoom.innerHTML = `<button type="button" class="btn ghost icon" data-zclose aria-label="${T("Fechar", "Close")}"><i class="ic i-close"></i></button><figure>\u003Cimg alt=""><figcaption></figcaption></figure><div class="iw-zoom-extra" hidden></div>`;
  document.body.append(zoom);
  // a tap anywhere closes it — except on what a page put under the card (window.INKWELL_ZOOM_EXTRA, e.g. Decks: your copies)
  zoom.addEventListener("click", (e) => { if (!e.composedPath().some((x) => x.classList?.contains("iw-zoom-extra"))) zoom.close(); });   // the path, not target: a button there may have been redrawn
  const zoomable = (el) => { const t = el.closest?.(".thumb, .iw-card"); if (!t || !t.querySelector("img") || t.closest("a, button, label, summary, dialog.iw-dialog, #iwZoom, [role=button], [data-nozoom]")) return null; return t; };
  document.addEventListener("click", (e) => {
    const t = zoomable(e.target); if (!t) return;
    const img = t.querySelector("img");
    e.preventDefault(); e.stopPropagation();
    zoom.querySelector("img").src = img.currentSrc || img.src;
    zoom.querySelector("img").alt = img.alt || "";
    zoom.querySelector("figcaption").textContent = img.alt || "";
    zoom.querySelector("figcaption").hidden = !img.alt;
    const extra = zoom.querySelector(".iw-zoom-extra"); extra.replaceChildren();
    let more = null; try { more = window.INKWELL_ZOOM_EXTRA?.(t, () => zoom.close()) || null; } catch { /* the card still opens */ }
    if (more) extra.append(more);
    extra.hidden = !more; zoom.classList.toggle("has-extra", !!more);
    zoom.showModal();
  }, true);
  document.addEventListener("mouseover", (e) => { const t = zoomable(e.target); if (t) t.style.cursor = "zoom-in"; });
})();
</script>
</body>
</html>
