<title>Inkwell</title>
<meta name="description" content="Inkwell — comunidade brasileira de Disney Lorcana: coleção, decks, preços, eventos.">
<meta name="theme-color" content="#0b192c">
<link rel="icon" href="./ink/icon-192.png">
<link rel="manifest" href="./inkwell.webmanifest">
<script>
  // Old app addresses (#collection, #prices…) go to the matching page.
  (function () {
    var map = { collection: 'colecao', prices: 'precos', decks: 'decks', matches: 'eventos', learn: 'comecar', overview: 'feed' };
    var h = (location.hash || '').replace(/^#\/?/, '').split(/[/?&]/)[0];
    location.replace('./' + (map[h] || 'feed') + '/' + location.search);
  })();
</script>
<meta http-equiv="refresh" content="0; url=./feed/">
