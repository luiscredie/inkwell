<script>window.INKWELL_CLOUD_CONFIG = {"url": "https://sorefaetiaebmjploanp.supabase.co", "key": "sb_publishable_RkAWW-ENz70CXA6_QV7aHw_MpfD7Gn2", "redirect": "https://luiscredie.github.io/inkwell/admin/"};
/* Inkwell Lore Counter: cloud adapter for the offline app.
 *
 * Talks to the Inkwell Supabase project with plain fetch (no library to cache):
 *   sign-in   email one-time code (or the magic link, when opened in the same browser)
 *   storage   public.game_logs, one row per game, upserted on (user_id, game_id),
 *             so a retry after a dropped connection never creates a duplicate
 * The counter keeps every match locally until send() resolves true.
 * Only the public URL and publishable key are here; row-level security limits each user to their own rows.
 */
// Feature flags. The guest experience (Começar meu Inkwell, new Início) is on for everyone since 26/10/2026.
// ?preview=off shows the previous experience in this tab (sessionStorage); ?preview=visitante turns it back on.
// Rollback: set GUEST_DEFAULT to false (nothing in the database changes).
window.INKWELL_FLAGS = (() => {
  const GUEST_DEFAULT = true;
  const f = { guestProfile: GUEST_DEFAULT };
  try {
    const q = new URLSearchParams(location.search).get("preview");
    if (q === "visitante") sessionStorage.setItem("inkwell-preview", "visitante");
    if (q === "off") sessionStorage.setItem("inkwell-preview", "off");
    const v = sessionStorage.getItem("inkwell-preview");
    if (v === "visitante") f.guestProfile = true;
    if (v === "off") f.guestProfile = false;
  } catch { /* storage off: the default stays */ }
  return f;
})();
window.INKWELL_CLOUD = (() => {
  const cfg = window.INKWELL_CLOUD_CONFIG || {};
  if (!cfg.url || !cfg.key) return null;
  // One sign-in for the whole site: the counter, Coach Review, Início, Trocas and the Inkwell app itself
  // (its supabase-js client uses this same storage key), so signing in or out on one page does it on all.
  const KEY = "inkwell-counter-auth";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch { return null; } };
  let sess = load();
  const store = (x) => { sess = x; try { if (x) localStorage.setItem(KEY, JSON.stringify(x)); else localStorage.removeItem(KEY); } catch { /* private mode */ } };
  const headers = (tok) => ({ apikey: cfg.key, "Content-Type": "application/json", ...(tok ? { Authorization: `Bearer ${tok}` } : {}) });
  const claims = (jwt) => { try { return JSON.parse(atob(jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); } catch { return {}; } };
  const session = (r) => {   // the same shape supabase-js keeps, so both read each other's session
    const c = claims(r.access_token);
    const expires_at = r.expires_at || c.exp || Math.floor(Date.now() / 1000) + (r.expires_in || 3600);
    return { access_token: r.access_token, refresh_token: r.refresh_token, token_type: "bearer",
      expires_in: r.expires_in || Math.max(0, expires_at - Math.floor(Date.now() / 1000)), expires_at,
      user: { ...(r.user || {}), id: r.user?.id || c.sub, email: r.user?.email || c.email } };
  };

  // Magic link opened in this same browser: tokens arrive in the URL fragment.
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("access_token") && h.get("refresh_token")) {
    store(session({ access_token: h.get("access_token"), refresh_token: h.get("refresh_token"), expires_in: +h.get("expires_in") || 3600 }));
    history.replaceState(null, "", location.pathname + location.search);
    window.INKWELL_FROM_LINK = true;   // this tab was opened by the e-mail link (the guest editor tells the original tab apart)
  } else if (h.get("error_code") || h.get("error")) {
    // The e-mail link didn't work (already used or expired): Supabase sends back #error=…&error_code=otp_expired.
    // Some mail services (Outlook/Hotmail) open links by themselves to scan them, which uses the link up.
    history.replaceState(null, "", location.pathname + location.search);
    window.INKWELL_LINK_FAILED = h.get("error_code") || h.get("error");
  }

  async function token() {
    sess = load();   // another page (or the Inkwell app) may have signed in, out, or refreshed the tokens meanwhile
    if (!sess) return null;
    if (sess.expires_at - 60 > Date.now() / 1000) return sess.access_token;
    const used = sess.refresh_token;
    const r = await fetch(`${cfg.url}/auth/v1/token?grant_type=refresh_token`, { method: "POST", headers: headers(), body: JSON.stringify({ refresh_token: used }) });
    if (r.status === 400 || r.status === 401) {
      const now = load();   // a page that refreshed at the same moment already saved newer tokens: keep them
      if (now && now.refresh_token !== used && now.expires_at - 60 > Date.now() / 1000) { sess = now; return sess.access_token; }
      store(null); return null;   // signed out elsewhere
    }
    if (!r.ok) throw new Error(`refresh ${r.status}`);
    store(session(await r.json()));
    return sess.access_token;
  }

  // Authenticated call to the database's REST API (used by Coach Review). Errors carry a short code.
  // anon: true also works signed out (the publishable key), for the few functions open to visitors
  async function api(path, { method = "GET", body, prefer, anon = false, keepalive = false } = {}) {
    const tok = await token();
    if (!tok && !anon) throw Object.assign(new Error("signed out"), { code: "auth" });
    const r = await fetch(`${cfg.url}/rest/v1/${path}`, {
      method, keepalive, headers: { ...headers(tok), ...(prefer ? { Prefer: prefer } : {}) }, body: body === undefined ? undefined : JSON.stringify(body) });
    if (r.status === 401) store({ ...sess, expires_at: 0 });
    if (!r.ok) {
      const code = r.status === 401 || r.status === 403 ? "permission" : r.status === 400 || r.status === 409 || r.status === 413 ? "invalid_argument" : "unavailable";
      // the database's own reason (e.g. "adults_only", "event_full", "too_many_friend_requests") goes in the message,
      // so a page can tell the person what happened
      let why = ""; try { why = String((await r.json())?.message || "").slice(0, 200); } catch { /* no body */ }
      throw Object.assign(new Error(`${method} ${path.split("?")[0]} ${r.status}${why ? `: ${why}` : ""}`), { code, status: r.status, why });
    }
    const text = await r.text();
    return text ? JSON.parse(text) : null;
  }

  // The player's collections (public.inkwell_profiles). A new account has none yet, and every collection, deck
  // and wishlist save needs one, so the first visit creates an empty "principal" collection, then reads again.
  async function collections(select) {
    const q = `inkwell_profiles?select=${select}&order=updated_at.desc`;
    const r = await api(q);
    if (Array.isArray(r) && r.length) return r;
    const id = load()?.user?.id;
    if (!id) return r;
    await api("inkwell_profiles?on_conflict=user_id,profile", { method: "POST", prefer: "resolution=ignore-duplicates,return=minimal",
      body: { user_id: id, profile: "principal", schema: 2, data: { _schema: 2, collection: {}, decks: [], wishlist: {} } } });
    return api(q);
  }

  // an Edge Function by GET (signed in or not: the publishable key is enough for public ones)
  async function fn(name, params = {}) {
    const tok = sess ? await token().catch(() => null) : null;
    const r = await fetch(`${cfg.url}/functions/v1/${name}?${new URLSearchParams(params)}`, { headers: headers(tok) });
    if (!r.ok) throw Object.assign(new Error(`${name} ${r.status}`), { status: r.status });
    return r.json();
  }

  return {
    api, collections, fn,
    user: () => { sess = load(); return sess ? { id: sess.user?.id, email: sess.user?.email } : null; },
    status: () => { sess = load(); return sess ? { signedIn: true, email: sess.user?.email || "" } : { signedIn: false }; },
    async requestCode(email) {
      const redirect = cfg.redirect || location.href.split("#")[0];
      // where to come back after the confirmation page (/entrar/), same site only
      try { localStorage.setItem("inkwell-return", JSON.stringify({ path: location.pathname + location.search, at: Date.now() })); } catch { /* private mode */ }
      const r = await fetch(`${cfg.url}/auth/v1/otp?redirect_to=${encodeURIComponent(redirect)}`, { method: "POST", headers: headers(), body: JSON.stringify({ email, create_user: true }) });
      if (!r.ok) throw Object.assign(new Error(`otp ${r.status}`), { status: r.status });
    },
    async verify(email, code) {
      const r = await fetch(`${cfg.url}/auth/v1/verify`, { method: "POST", headers: headers(), body: JSON.stringify({ type: "email", email, token: String(code).replace(/\s/g, "") }) });
      if (!r.ok) throw Object.assign(new Error(`verify ${r.status}`), { status: r.status });
      store(session(await r.json()));
    },
    // The e-mail's own link to /entrar/?h=<token hash>: signs in only when the person presses the button there,
    // so a mail scanner that just opens the link doesn't use it up.
    async verifyHash(tokenHash, type = "email") {
      const r = await fetch(`${cfg.url}/auth/v1/verify`, { method: "POST", headers: headers(), body: JSON.stringify({ type, token_hash: String(tokenHash) }) });
      if (!r.ok) throw Object.assign(new Error(`verify ${r.status}`), { status: r.status });
      store(session(await r.json()));
    },
    signOut() {
      const old = sess; store(null);
      if (old) fetch(`${cfg.url}/auth/v1/logout`, { method: "POST", headers: headers(old.access_token) }).catch(() => {});
    },
    async send(logs) {
      const tok = await token();   // also reloads sess
      if (!tok) return false;
      const rows = logs.map((l) => ({ user_id: sess.user.id, game_id: l.game_id, source: l.source, played_at: l.played_at, log: l }));
      const r = await fetch(`${cfg.url}/rest/v1/game_logs?on_conflict=user_id,game_id`, {
        method: "POST", headers: { ...headers(tok), Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(rows) });
      if (r.status === 401) store({ ...sess, expires_at: 0 });   // force a refresh on the next try
      return r.ok;
    },
  };
})();
</script>

  const fill = (s, v) => (v ? s.replace(/\{(\w+)\}/g, (m, k) => (k in v ? String(v[k]) : m)) : s);

        <span class="search" style="display:block;margin:var(--sp-3) 0"><i class="ic i-search"></i><input type="search" id="q" value="${esc(q)}" placeholder="${Tx("Search by name or e-mail")}" aria-label="${Tx("Search by name or e-mail")}"></span>
        <div data-testid="users">${list.map((u) => `<div class="adm-row" data-user="${esc(u.id)}"><div class="t"><b>${esc(u.display_name || u.email || u.id)}</b><span class="small muted">${esc(u.email || "")}${u.handle ? ` · @${esc(u.handle)}` : ""}</span>
            <div class="tags">${u.is_mock ? `<span class="tag accent">${Tx("example")}</span>` : ""}${u.is_admin ? `<span class="tag info">${Tx("admin")}</span>` : ""}<span class="tag ${u.is_public ? "match" : ""}">${Tx(u.is_public ? "public" : "private")}</span>${u.hidden ? `<span class="tag warn">${Tx("hidden")}</span>` : ""}${u.adult ? `<span class="tag">${Tx("18+")}</span>` : ""}${u.open_reports ? `<span class="tag late">${esc(Tx("{n} open reports", { n: u.open_reports }))}</span>` : ""}</div>
            <span class="small faint">${esc([Tx("joined {d}", { d: dt(u.created_at) }), u.last_sign_in_at ? Tx("last sign-in {d}", { d: dt(u.last_sign_in_at) }) : Tx("never signed in"), Tx("{n} games", { n: u.games })].join(" · "))}</span></div>
          <div class="adm-acts">${u.handle && u.is_public ? `<a class="btn small ghost" href="../perfil/?u=${esc(u.handle)}">${Tx("See profile")}</a>` : ""}${btn(u, u.hidden ? "unhide" : "hide", u.hidden ? "Show profile" : "Hide profile")}${btn(u, "signout", "Sign out everywhere")}${btn(u, "delete", "Delete account", "danger")}</div></div>`).join("")}</div>`
      : tab === "comms" ? `<div data-testid="admin-comms">${comms.length ? comms.map((c) => `<div class="adm-row"><div class="t"><b>${esc(c.name)}</b><span class="small muted">${esc([c.city, c.owner ? Tx("by {n}", { n: c.owner }) : ""].filter(Boolean).join(" · "))}</span>
            <div class="tags">${c.mock ? `<span class="tag accent">${Tx("example")}</span>` : ""}${c.hidden ? `<span class="tag warn">${Tx("hidden")}</span>` : ""}<span class="tag">${esc(Tx("{n} members", { n: c.members }))}</span><span class="tag">${esc(Tx("{n} posts", { n: c.posts }))}</span></div></div>
          <div class="adm-acts">${c.hidden ? "" : `<a class="btn small ghost" href="../comunidades/?c=${esc(c.slug)}">${Tx("See")}</a>`}<button type="button" class="btn small" data-cact="${c.hidden ? "unhide" : "hide"}" data-c="${esc(c.id)}">${Tx(c.hidden ? "Show" : "Hide")}</button>
            <button type="button" class="btn small danger" data-cact="delete" data-c="${esc(c.id)}">${armed === `cdel:${c.id}` ? Tx("Tap again to confirm") : Tx("Delete")}</button></div></div>`).join("") : `<p class="muted">${Tx("No communities.")}</p>`}</div>`
      : `<div data-testid="reports">${reports.length ? reports.map((r) => `<div class="adm-row"><div class="t"><b>${esc(Tx("about {n}", { n: r.target_name || r.target_handle || "?" }))}</b><span class="small muted">${esc([Tx("by {n}", { n: r.reporter_name || "?" }), dt(r.created_at)].join(" · "))}</span>
            <p class="adm-reason">${esc(r.reason)}</p><div class="tags"><span class="tag ${r.status === "open" ? "late" : "match"}">${Tx(r.status === "open" ? "open" : "handled")}</span></div></div>
          <div class="adm-acts">${/^\[post:([0-9a-f-]{36})\]/.test(r.reason || "") ? `<button type="button" class="btn small ghost" data-hidepost="${esc(/^\[post:([0-9a-f-]{36})\]/.exec(r.reason)[1])}">${Tx("Hide the post")}</button>` : ""}${r.target_handle ? `<a class="btn small ghost" href="../perfil/?u=${esc(r.target_handle)}">${Tx("See profile")}</a>` : ""}${r.status === "open" ? `<button type="button" class="btn small" data-resolve="${esc(r.id)}">${Tx("Mark as handled")}</button>` : ""}
            ${users.find((u) => u.id === r.target) && !users.find((u) => u.id === r.target).hidden ? btn(users.find((u) => u.id === r.target), "hide", "Hide profile") : ""}</div></div>`).join("") : `<p class="muted">${Tx("No reports.")}</p>`}</div>`}`;
    document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { tab = b.dataset.tab; armed = null; render(); });
    document.querySelectorAll("[data-days]").forEach((b) => b.onclick = () => { statDays = +b.dataset.days; loadStats(); });
    if (tab === "stats" && !stats && !statErr) loadStats();
    $("q")?.addEventListener("input", (e) => { q = e.target.value; render(); $("q").focus(); $("q").setSelectionRange(q.length, q.length); });
    document.querySelectorAll("[data-act]").forEach((b) => b.onclick = () => act(b.dataset.act, b.dataset.u));
    document.querySelectorAll("[data-cact]").forEach((b) => b.onclick = () => {
      const a = b.dataset.cact, id = b.dataset.c;
      if (a === "delete" && armed !== `cdel:${id}`) { armed = `cdel:${id}`; render(); return; }
      run(() => rpc("admin_community", { p_id: id, p_action: a }));
    });
    document.querySelectorAll("[data-resolve]").forEach((b) => b.onclick = () => run(() => rpc("admin_resolve_report", { p_id: b.dataset.resolve })));
    document.querySelectorAll("[data-hidepost]").forEach((b) => b.onclick = () => run(() => rpc("moderate_post", { p_action: "hide", p_post: b.dataset.hidepost })));   // supabase/social.sql
  }
  // ---------- Painel: supabase/site_stats.sql ----------
  async function loadStats() {
    statErr = ""; stats = null; render();
    try { stats = await rpc("admin_stats", { p_days: statDays }); }
    catch (e) { statErr = /admin_stats|404|PGRST202/.test(String(e?.message || e)) ? Tx("Run supabase/site_stats.sql to start counting.") : Tx("Couldn't load."); }
    render();
  }
  const PAGE_NAME = { feed: "Início", cards: "Coleção", decks: "Decks", communities: "Comunidades", coach: "Jogos", events: "Eventos", trades: "Trocas", prices: "Preços", profile: "Perfil", start: "Começar", entrar: "Entrar (link do e-mail)", legal: "Termos e privacidade", admin: "Admin" };
  const ACTION_NAME = { signin_open: "Abriu “Entrar”", signin_code: "Recebeu o código", signin_done: "Entrou", deck_sample: "Deck de exemplo", deck_paste: "Colou uma lista", deck_save: "“Criar conta e salvar” deck", scan_open: "Abriu o scanner", import_open: "Abriu “Importar”", share_open: "Abriu “Compartilhar”", trade_fill: "Separar repetidas", trade_post: "Anunciar no Mural", events_search: "Buscou eventos", events_box: "Buscou eventos (Início)", profile_start: "Começou um perfil", invite: "Convidar amigos" };
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const num = (n) => Number(n || 0).toLocaleString(LOC);
  function statsHtml() {
    const seg = `<div class="seg" role="group" aria-label="${Tx("Period")}" style="margin:var(--sp-3) 0">${[7, 14, 30, 90].map((d) => `<button type="button" data-days="${d}" aria-pressed="${statDays === d}">${Tx("{n} days", { n: d })}</button>`).join("")}</div>`;
    if (statErr) return seg + `<p class="muted" data-testid="stats-error">${esc(statErr)}</p>`;
    if (!stats) return seg + `<div class="skel" style="height:240px"></div>`;
    const t = stats.totals || {}, series = stats.series || [], va = +t.visits_anon || 0;
    const kpi = (v, l, sub, id) => `<div class="stat" data-testid="kpi-${id}"><b>${esc(v)}</b><span>${esc(l)}</span>${sub ? `<small class="micro muted" style="display:block">${esc(sub)}</small>` : ""}</div>`;
    const steps = [["Arrived without an account", va], ["Saw 2 or more pages", t.two_plus], ["Tried something", t.tried], ["Opened “Sign in”", t.opened_signin], ["Got the code", t.got_code], ["Signed in", t.signed_in]];
    const max = Math.max(1, ...series.map((x) => +x.visits_anon || 0));
    const dlabel = (d) => new Date(d + "T12:00:00").toLocaleDateString(LOC, { day: "numeric", month: "short" });
    return `${seg}
      <div class="stats-row four" data-testid="stats-kpis">${kpi(num(va), Tx("Visits without an account"), Tx("{p}% left on the first page", { p: pct(t.bounced, va) }), "visits")}
        ${kpi(num(t.signups), Tx("Sign-ups"), Tx("{n} confirmed the e-mail", { n: num(t.signups_confirmed) }), "signups")}
        ${kpi(num((+t.profiles_public || 0) + (+t.profiles_private || 0)), Tx("New profiles"), Tx("{a} public · {b} private", { a: num(t.profiles_public), b: num(t.profiles_private) }), "profiles")}
        ${kpi(num(t.active_7d), Tx("Members active in 7 days"), Tx("{n} members in all", { n: num(t.members) }), "active")}</div>
      <section class="card" style="margin-top:var(--sp-4)"><div class="hd"><h3>${Tx("Visits without an account, per day")}</h3></div>
        <div class="st-days" data-testid="stats-days" role="img" aria-label="${esc(Tx("Visits without an account, per day"))}">${series.map((x) => `<div class="d" tabindex="0"><i style="height:${Math.round(((+x.visits_anon || 0) / max) * 100)}%"></i><span class="tip">${esc(dlabel(x.day))}: ${esc(Tx("{n} visits", { n: num(x.visits_anon) }))} · ${esc(Tx("{n} sign-ups", { n: num(x.signups) }))}</span></div>`).join("")}</div>
        <div class="st-axis"><span>${esc(series[0] ? dlabel(series[0].day) : "")}</span><span>${esc(Tx("max {n}", { n: num(max) }))}</span><span>${esc(series.length ? dlabel(series[series.length - 1].day) : "")}</span></div>
        <details style="margin-top:var(--sp-3)"><summary class="small">${Tx("See the numbers per day")}</summary><div class="st-wrap"><table class="st-table" data-testid="stats-daytable"><thead><tr><th>${Tx("Day")}</th><th>${Tx("Visits without an account")}</th><th>${Tx("Visits signed in")}</th><th>${Tx("Sign-ups")}</th><th>${Tx("New profiles")}</th></tr></thead>
          <tbody>${series.slice().reverse().map((x) => `<tr><td>${esc(dlabel(x.day))}</td><td>${num(x.visits_anon)}</td><td>${num(x.visits_signed)}</td><td>${num(x.signups)}</td><td>${num(x.profiles)}</td></tr>`).join("")}</tbody></table></div></details></section>
      <section class="card" style="margin-top:var(--sp-4)"><div class="hd"><h3>${Tx("From visit to account")}</h3><span class="small muted">${Tx("visits that started without an account")}</span></div>
        <div class="st-funnel" data-testid="stats-funnel">${steps.map(([l, n]) => `<div class="fr"><span class="small">${esc(Tx(l))}</span><span class="track"><span class="bar" style="width:${pct(n, va)}%;display:block"></span></span><span class="n"><b>${num(n)}</b> <span class="micro muted">${pct(n, va)}%</span></span></div>`).join("")}</div>
        <p class="small muted" style="margin:var(--sp-3) 0 0">${esc(Tx("On average {n} pages per visit.", { n: String(t.avg_views ?? 0).replace(".", lang === "pt" ? "," : ".") }))} ${esc(Tx("Someone who created the account from the e-mail link on another tab counts in Sign-ups, not here."))}</p></section>
      <section class="card" style="margin-top:var(--sp-4)"><div class="hd"><h3>${Tx("Pages")}</h3></div><div class="st-wrap"><table class="st-table" data-testid="stats-pages"><thead><tr><th>${Tx("Page")}</th><th>${Tx("Views without an account")}</th><th>${Tx("Views signed in")}</th><th>${Tx("Arrived here")}</th><th>${Tx("Left from here")}</th></tr></thead>
        <tbody>${(stats.pages || []).map((p) => `<tr><td>${esc(PAGE_NAME[p.page] || p.page)}</td><td>${num(p.views_anon)}</td><td>${num(p.views_signed)}</td><td>${num(p.landed)}</td><td>${num(p.left)}</td></tr>`).join("") || `<tr><td colspan="5" class="muted">${Tx("Nothing yet.")}</td></tr>`}</tbody></table></div>
        <p class="small faint" style="margin:var(--sp-2) 0 0">${Tx("“Arrived” and “Left” count visits that started without an account: the first and the last page they saw.")}</p></section>
      <div class="grid2" style="margin-top:var(--sp-4);gap:var(--sp-4);align-items:start">
        <section class="card"><div class="hd"><h3>${Tx("What people tried")}</h3></div><div class="st-wrap"><table class="st-table" data-testid="stats-actions"><thead><tr><th>${Tx("Action")}</th><th>${Tx("Without an account")}</th><th>${Tx("With an account")}</th></tr></thead>
          <tbody>${(stats.actions || []).map((a) => `<tr><td>${esc(ACTION_NAME[a.name] || a.name)}</td><td>${num(a.anon)}</td><td>${num(a.signed)}</td></tr>`).join("") || `<tr><td colspan="3" class="muted">${Tx("Nothing yet.")}</td></tr>`}</tbody></table></div></section>
        <section class="card"><div class="hd"><h3>${Tx("Where they came from")}</h3></div><div class="st-wrap"><table class="st-table" data-testid="stats-refs"><thead><tr><th>${Tx("Site")}</th><th>${Tx("Visits")}</th></tr></thead>
          <tbody>${(stats.refs || []).map((r) => `<tr><td>${esc(r.ref || Tx("Direct or app (WhatsApp, Instagram…)"))}</td><td>${num(r.visits)}</td></tr>`).join("") || `<tr><td colspan="2" class="muted">${Tx("Nothing yet.")}</td></tr>`}</tbody></table></div>
          <p class="small muted" style="margin:var(--sp-3) 0 0" data-testid="stats-devices">${esc(Tx("Phone {a} · Computer {b}", { a: num(stats.devices?.mobile), b: num(stats.devices?.desktop) }))}</p></section></div>
      <p class="small faint" style="margin-top:var(--sp-4)">${Tx("No cookies or IP: a visit is one open browser tab. Admins and “do not track” browsers aren't counted. Kept 90 days.")}</p>`;
  }
  async function run(fn) {
    try { await fn(); await load(); armed = null; render(); toast(Tx("Done")); }
    catch (e) { armed = null; render(); toast(Tx("Couldn't do it: {e}", { e: String(e?.message || e).slice(0, 120) }), true); }
  }
  function act(a, id) {
    const key = a === "delmocks" ? "delmocks" : `${a}:${id}`;
    if ((a === "delete" || a === "signout" || a === "delmocks") && armed !== key) { armed = key; render(); return; }   // destructive: a second tap confirms
    if (a === "delmocks") return run(async () => { for (const u of users.filter((x) => x.is_mock)) await rpc("admin_action", { p_user: u.id, p_action: "delete" }); });
    return run(() => rpc("admin_action", { p_user: id, p_action: a }));
  }
  let toastTimer = null;
  function toast(text, err) {
    const t = $("toast"); t.className = `toast${err ? " err" : ""}`;
    t.innerHTML = `<i class="ic ${err ? "i-alert" : "i-check"}"></i><span>${esc(text)}</span>`; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
  }

  document.documentElement.lang = LOC;
  $("sub").textContent = Tx("Visits, members, reports and example accounts.");
  if (!me) { $("app").innerHTML = emptyBox("signedout", Tx("Sign in"), Tx("Sign in with an admin account."), `<button type="button" class="btn primary" id="si">${Tx("Sign in")}</button>`); $("si").onclick = () => window.INKWELL_SIGNIN?.(); return; }
  $("app").innerHTML = `<div class="skel" style="height:200px"></div><p class="sr-only">${Tx("Loading…")}</p>`;
  load().then(render).catch((e) => {
    const denied = /not allowed|42501|403|401/.test(String(e?.message || e));
    $("app").innerHTML = denied ? emptyBox("error", Tx("Not allowed"), Tx("This page is only for administrators.")) : emptyBox("error", Tx("Couldn't load."), "", `<button type="button" class="btn" onclick="location.reload()">${Tx("Try again")}</button>`);
  });
})();
</script>

<script>window.INKWELL_SHELL = {"page": "admin"};
/* Inkwell site shell (design v2, Noite): app bar, phone tab bar, account menu and the one sign-in sheet.
   Markup and classes follow packages/ui/tokens.css (§4 Shell, §11 Sheet); see DESIGN-CHANGES.md.
   Pages set window.INKWELL_SHELL = { page: "feed" | "cards" | "decks" | "coach" | "trades" } and may call:
     window.INKWELL_SIGNIN()            open the sign-in sheet
     window.INKWELL_SHELL_BADGE(n)      set the Trocas count (requests waiting for me)
   Sign-in uses window.INKWELL_CLOUD (cloud.js): one session for the whole site. */
(() => {
  "use strict";
  let lang = "pt";
  try { lang = localStorage.getItem("inkwell-lang") || "pt"; } catch { /* */ }
  const pt = lang === "pt";
  const T = (p, e) => (pt ? p : e);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const page = (window.INKWELL_SHELL || {}).page || "";
  const UI = "../ui/";
  const CLOUD = window.INKWELL_CLOUD;
  const me = CLOUD?.user();
  // ---------- site statistics (supabase/site_stats.sql; the admin Painel) ----------
  // No cookies, no IP: a random code that lives only while this tab is open; signed in or not; phone or computer;
  // the other site's domain. Nothing is sent from "do not track" browsers or by automated browsers.
  const STAT_OFF = navigator.webdriver || navigator.globalPrivacyControl === true || navigator.doNotTrack === "1" || window.doNotTrack === "1";
  let statSid = null;
  try { statSid = sessionStorage.getItem("inkwell-sid"); if (!/^[a-f0-9]{24}$/.test(statSid || "")) { statSid = [...crypto.getRandomValues(new Uint8Array(12))].map((b) => b.toString(16).padStart(2, "0")).join(""); sessionStorage.setItem("inkwell-sid", statSid); } } catch { statSid = null; }
  const statDev = () => (matchMedia("(pointer: coarse)").matches || innerWidth < 700 ? "mobile" : "desktop");
  const statRef = () => { try { const h = document.referrer ? new URL(document.referrer).hostname.toLowerCase() : ""; return h && h !== location.hostname ? h.replace(/^www\./, "").slice(0, 60) : null; } catch { return null; } };
  const statSend = (kind, name) => {
    if (STAT_OFF || !statSid || !CLOUD || !page) return;
    CLOUD.api("rpc/track", { method: "POST", prefer: "return=minimal", anon: true, keepalive: true, body: { p_sid: statSid, p_page: page, p_kind: kind, p_name: name || null, p_ref: kind === "view" ? statRef() : null, p_dev: statDev() } }).catch(() => {});
  };
  // pages call INKWELL_TRACK("scan_open") etc.; each action counts once per page view
  const statDone = new Set();
  window.INKWELL_TRACK = (name) => { if (!/^[a-z_]{1,30}$/.test(name || "") || statDone.has(name)) return; statDone.add(name); statSend("action", name); };
  statSend("view");
  // Every module stays in the top bar (design "The Great Illuminary", 26/10/2026). On phones the bottom bar has
  // the four main places plus "Mais", which lists the rest; nothing is hidden behind the account menu only.
  const NAV = [
    ["feed", "../feed/", T("Início", "Home"), "home"],
    ["cards", "../colecao/", T("Coleção", "Collection"), "cards"],
    ["decks", "../decks/", "Decks", "decks"],
    ["communities", "../comunidades/", T("Comunidades", "Communities"), "users"],
    ["coach", "../coach/", T("Jogos", "Games"), "games"],
    ["events", "../eventos/", T("Eventos", "Events"), "calendar"],
    ["trades", "../trades/", T("Trocas", "Trades"), "trades"],
    ["prices", "../precos/", T("Preços", "Prices"), "coins"],
  ];
  const TABS = ["feed", "cards", "decks", "communities"];
  const MORE = NAV.filter(([k]) => !TABS.includes(k));
  let theme = "dia"; try { theme = localStorage.getItem("inkwell-theme") === "noite" ? "noite" : "dia"; } catch { /* */ }
  const cur = (k) => (k === page ? ' aria-current="page"' : "");

  if (!document.querySelector('link[rel="manifest"]')) {
    document.head.insertAdjacentHTML("beforeend", `<link rel="manifest" href="../inkwell.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Inkwell">`);
  }
  const bar = document.createElement("header");
  bar.className = "appbar";
  bar.innerHTML = `<div class="appbar-in"><a class="brand" href="../feed/"><img src="../ink/logo-coin.png" alt="" width="32" height="32">Inkwell</a>
    <nav class="sections" aria-label="${T("Seções", "Sections")}">${NAV.map(([k, href, label, ic]) => `<a href="${href}"${cur(k)} data-iw="${k}"><i class="ic i-${ic}"></i>${label}${k === "trades" ? '<span class="count" data-trades-count hidden></span>' : ""}</a>`).join("")}</nav>
    <div class="end">
      <button type="button" class="btn ghost icon" id="iwTheme" aria-pressed="${theme === "noite"}" aria-label="${theme === "noite" ? T("Usar o tema claro", "Use the light theme") : T("Usar o tema escuro", "Use the dark theme")}"><i class="ic ${theme === "noite" ? "i-sun" : "i-moon"}"></i></button>
      <a class="btn ghost counter-btn" href="../counter/" aria-label="${T("Abrir o Contador", "Open the Counter")}"><i class="ic i-counter"></i><span>${T("Contador", "Counter")}</span></a>
      ${me ? `<button type="button" class="btn ghost icon" id="iwFind" aria-label="${T("Buscar pessoas e comunidades", "Search people and communities")}" aria-haspopup="dialog" aria-expanded="false" title="${T("Buscar", "Search")} ( / )"><i class="ic i-search"></i></button>` : ""}
      ${me ? `<button type="button" class="btn ghost icon bell-btn" id="iwBell" aria-label="${T("Notificações", "Notifications")}" aria-haspopup="menu" aria-expanded="false" hidden><i class="ic i-bell"></i><span class="count" id="iwBellN" hidden></span></button>` : ""}
      ${me ? `<button type="button" class="av-btn" id="iwAcct" aria-label="${T("Sua conta", "Your account")}" aria-haspopup="menu" aria-expanded="false"><span class="av" id="iwAv">${esc((me.email || "?")[0].toUpperCase())}</span><span class="count iw-badge" id="iwBadge" hidden></span></button>`
        : `<button type="button" class="btn ghost icon" id="iwLangBtn" aria-label="${T("Aparência e idioma", "Appearance and language")}" aria-haspopup="menu" aria-expanded="false"><i class="ic i-globe"></i></button>
           <button type="button" class="btn small" id="iwSignIn">${T("Entrar", "Sign in")}</button>`}
    </div></div>`;
  document.body.prepend(bar);
  const tabs = document.createElement("nav");
  tabs.className = "tabbar";
  tabs.setAttribute("aria-label", T("Seções", "Sections"));
  const inMore = MORE.some(([k]) => k === page);
  tabs.innerHTML = NAV.filter(([k]) => TABS.includes(k)).map(([k, href, label, ic]) => `<a href="${href}"${cur(k)} data-iw="${k}"><i class="pip"><i class="ic i-${ic}"></i></i>${label}</a>`).join("")
    + `<button type="button" id="iwMore" class="tab-more" aria-haspopup="dialog" aria-expanded="false"${inMore ? ' aria-current="page"' : ""}><i class="pip"><i class="ic i-more"></i></i>${T("Mais", "More")}<span class="count" data-trades-count hidden></span></button>`;
  document.body.append(tabs);
  document.body.classList.add("iw-has-shell");

  // ---------- menus ----------

        CLOUD.api(`listings?user_id=eq.${me.id}&kind=in.(buy,borrow)&select=card_id`).catch(() => []),
      ]);
      const ids = [...new Set([...(cols || []).flatMap((c) => (c.wishlist && typeof c.wishlist === "object" ? Object.keys(c.wishlist) : [])), ...(mine || []).map((l) => l.card_id)])]
        .filter((id) => /^[A-Za-z0-9-]+$/.test(id));
      if (!ids.length) return;
      let since = ""; try { since = localStorage.getItem(WANT_KEY) || ""; } catch { /* */ }
      let n = 0;
      for (let i = 0; i < ids.length && i < 600; i += 60) {
        const q = `listings?kind=in.(lend,sell,trade)&user_id=neq.${me.id}&card_id=in.(${ids.slice(i, i + 60).map((x) => `"${x}"`).join(",")})${since ? `&created_at=gt.${encodeURIComponent(since)}` : ""}&select=id&limit=100`;
        n += ((await CLOUD.api(q).catch(() => [])) || []).length;
      }
      news = news || { requests: 0, recados: 0, posts: 0 }; news.wants = n; showNews();
    })();
    // Notifications (supabase/social.sql): likes, comments, "Vou" on my tables, new tables in my communities.
    let notes = null;
    const NK = { like: ["curtiu seu post", "liked your post"], comment: ["comentou no seu post", "commented on your post"], rsvp: ["vai na sua mesa", "is going to your table"], event: ["marcou uma mesa", "set up a table"],
      community_invite: ["convidou você para uma comunidade", "invited you to a community"], join_request: ["pediu para entrar", "asked to join"], join_accepted: ["aceitou seu pedido", "accepted your request"],
      event_soon: ["é amanhã ou hoje", "is coming up"], share_accepted: ["aceitou dividir a sua coleção", "joined your shared collection"],
      loan_request: ["pediu cartas emprestadas", "asked to borrow cards"], loan_offer: ["quer emprestar cartas para você", "offered to lend you cards"] };
    const noteHref = (n) => /^loan_/.test(n.kind) ? "../trades/" : n.kind === "share_accepted" ? "../colecao/" : (n.kind === "event_soon" && n.ref?.rph) || /^event_near/.test(n.kind) ? "../eventos/" : n.ref?.post ? `../feed/#post-${encodeURIComponent(n.ref.post)}` : n.ref?.slug ? `../comunidades/?c=${encodeURIComponent(n.ref.slug)}${["event", "rsvp", "event_soon"].includes(n.kind) ? "#mesas" : ""}` : "../feed/";
    // the number on the app icon (installed app): the unread count, cleared when read
    const appBadge = (n) => { try { if (n && navigator.setAppBadge) navigator.setAppBadge(n).catch(() => {}); else if (navigator.clearAppBadge) navigator.clearAppBadge().catch(() => {}); } catch { /* */ } };
    const showBell = () => { const b = $("iwBell"), c = $("iwBellN"); if (!b || !notes) return; b.hidden = false; const n = notes.filter((x) => x.unread).length; c.hidden = !n; c.textContent = n > 9 ? "9+" : String(n); appBadge(n);
      b.setAttribute("aria-label", n ? T(`Notificações · ${n} novas`, `Notifications · ${n} new`) : T("Notificações", "Notifications")); };
    CLOUD.api("rpc/my_notifications", { method: "POST", body: {} }).then((r) => { notes = r || []; showBell(); }).catch(() => {});   // not there yet: no bell
    // Push on this device (supabase/push.sql + functions/push-send; the worker is site/push/sw.js)
    const VAPID = "BLvoLCTQgS3n-1MGGoQXBZ3OO50n_-mWuhLqRbWFVK38DvLNVEK3IOO_CCSMxDkq2AoRCiInC9R4mrEM23pWQdk";
    const pushOk = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window && (location.protocol === "https:" || location.hostname === "localhost");
    const iosBrowser = /iP(hone|ad|od)/.test(navigator.userAgent) && !(navigator.standalone || matchMedia("(display-mode: standalone)").matches);
    const b64 = (s) => { const p = "=".repeat((4 - (s.length % 4)) % 4), raw = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(raw, (c) => c.charCodeAt(0)); };
    const pushReg = () => navigator.serviceWorker.register("../push/sw.js", { scope: "../push/" });
    // state(): "on" | "off" | "denied" | "ios" (needs the Home Screen app) | "unsupported"; on()/off() throw on failure
    async function pushSub() { try { return await (await navigator.serviceWorker.getRegistration("../push/"))?.pushManager.getSubscription() || null; } catch { return null; } }
    async function pushState() {
      if (iosBrowser) return "ios";
      if (!pushOk) return "unsupported";
      if (Notification.permission === "denied") return "denied";
      return (await pushSub()) ? "on" : "off";
    }
    async function pushOn() {
      if ((await Notification.requestPermission()) !== "granted") return false;
      const reg = await pushReg();   // not .ready: this page isn't in the worker's scope, so .ready never settles
      const w = reg.installing || reg.waiting;
      if (w && !reg.active) await new Promise((ok) => { w.addEventListener("statechange", () => { if (w.state === "activated") ok(); }); setTimeout(ok, 8000); });
      const s2 = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(VAPID) });
      const j = s2.toJSON();
      await CLOUD.api("rpc/save_push_sub", { method: "POST", body: { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_ua: navigator.userAgent.slice(0, 200) } });
      return true;
    }
    async function pushOff() {
      const sub = await pushSub(); if (!sub) return;
      await CLOUD.api("rpc/delete_push_sub", { method: "POST", body: { p_endpoint: sub.endpoint } }).catch(() => {});
      await sub.unsubscribe();
    }
    window.INKWELL_PUSH = { state: pushState, on: pushOn, off: pushOff };   // Meu Inkwell › Avisos uses the same switch
    const PUSH_TEXT = {
      ios: () => T("Para receber avisos no iPhone: toque em Compartilhar → Adicionar à Tela de Início, abra o Inkwell por lá e ative aqui.", "To get notices on iPhone: Share → Add to Home Screen, open Inkwell from there and turn them on here."),
      unsupported: () => T("Este navegador não recebe avisos.", "This browser can't receive notices."),
      denied: () => T("Os avisos estão bloqueados nas configurações do navegador para este site.", "Notices are blocked for this site in the browser settings."),
    };
    async function drawPush() {
      const el = $("iwPush"); if (!el) return;
      const st = await pushState(), cfg = `<a class="small" href="../perfil/#avisos" data-testid="notif-settings">${T("Configurar avisos", "Notice settings")}</a>`;
      if (PUSH_TEXT[st]) { el.innerHTML = `<p class="small muted">${PUSH_TEXT[st]()}</p>${cfg}`; return; }
      el.innerHTML = st === "on" ? `<span class="small"><i class="ic i-bell"></i> ${T("Avisos ligados neste aparelho", "Notices on for this device")}</span><button type="button" class="btn ghost small" data-push="off">${T("Desligar", "Turn off")}</button>${cfg}`
        : `<button type="button" class="btn small primary" data-push="on"><i class="ic i-bell"></i>${T("Avisar neste aparelho", "Notify me on this device")}</button>${cfg}`;
      el.querySelector("[data-push]").onclick = async (ev) => {
        ev.stopPropagation(); const b = ev.currentTarget; b.disabled = true;
        try { if (b.dataset.push === "on") await pushOn(); else await pushOff(); }
        catch { el.insertAdjacentHTML("beforeend", `<p class="small" style="color:var(--loss)">${T("Não deu certo. Tente de novo.", "That didn't work. Try again.")}</p>`); b.disabled = false; return; }
        drawPush();
      };
    }
    $("iwBell")?.addEventListener("click", (e) => {
      const list = notes || [];
      openMenu(e.currentTarget, `<div class="menu-label">${T("Notificações", "Notifications")}</div>${list.length ? list.map((n) => `<a class="menu-item${n.unread ? " unread" : ""}" role="menuitem" href="${noteHref(n)}"><span>${n.kind === "event_near" ? `<b>${T("Evento novo perto de você", "New event near you")}:</b> ${esc(n.ref?.text || "")}${n.ref?.store || n.ref?.at ? `<small>${esc([n.ref.store, n.ref.at ? new Date(n.ref.at).toLocaleString(lang === "en" ? "en" : "pt-BR", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : ""].filter(Boolean).join(" · "))}</small>` : ""}`
        : n.kind === "event_near_many" ? `<b>${esc(T(`${n.ref?.n || "Vários"} eventos novos perto de você`, `${n.ref?.n || "Several"} new events near you`))}</b>${n.ref?.text ? ` ${esc(T("em", "in"))} ${esc(n.ref.text)}` : ""}`
        : n.kind === "event_soon" ? `<b>${T("Lembrete", "Reminder")}:</b> ${esc(n.ref?.text || T("seu evento", "your event"))} ${esc(T(...NK.event_soon))}` : `<b>${esc(n.name || T("Alguém", "Someone"))}</b> ${esc(T(...(NK[n.kind] || ["", ""])))}`}${!/^event_(soon|near)/.test(n.kind) && (n.ref?.text || n.ref?.name) ? `<small>${esc(n.ref.text || n.ref.name)}</small>` : ""}<small>${esc(new Date(n.at).toLocaleString(lang === "en" ? "en" : "pt-BR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }))}</small></span></a>`).join("") : `<div class="menu-item" style="pointer-events:none"><span class="small">${T("Nada por aqui ainda.", "Nothing here yet.")}</span></div>`}<div class="push-row" id="iwPush"></div>`, "notif");
      drawPush();
      if (list.some((n) => n.unread)) CLOUD.api("rpc/read_notifications", { method: "POST", body: {} }).then(() => { list.forEach((n) => { n.unread = false; }); showBell(); }).catch(() => {});
    });
    // Global search (supabase/search_privacy.sql): people with a public profile or my friends, and communities
    const findBtn = $("iwFind");
    const openFind = () => {
      if (!findBtn) return;
      openMenu(findBtn, `<div class="find" data-testid="find"><input type="search" id="iwFindQ" placeholder="${T("Buscar pessoas e comunidades", "Search people and communities")}" aria-label="${T("Buscar pessoas e comunidades", "Search people and communities")}" autocomplete="off" maxlength="60"><div id="iwFindR" aria-live="polite"><p class="small muted">${T("Digite pelo menos 2 letras.", "Type at least 2 letters.")}</p></div></div>`, "find-menu");
      const q = $("iwFindQ"), out = $("iwFindR"); let t = 0, seq = 0; q.focus();
      const ini = (n) => esc(String(n || "?").trim().charAt(0).toUpperCase() || "?");
      const sec = (title, rows) => rows.length ? `<div class="menu-label">${title}</div>${rows.join("")}` : "";
      q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(async () => {
        const v = q.value.trim(), my = ++seq;
        if (v.length < 2) { out.innerHTML = `<p class="small muted">${T("Digite pelo menos 2 letras.", "Type at least 2 letters.")}</p>`; return; }
        out.innerHTML = `<p class="small muted">${T("Buscando…", "Searching…")}</p>`;
        let r = null; try { r = await CLOUD.api("rpc/search_all", { method: "POST", body: { p_q: v } }); } catch { r = null; }
        if (my !== seq) return;
        if (!r) { out.innerHTML = `<p class="small muted">${T("A busca ainda não está disponível.", "Search isn't available yet.")}</p>`; return; }
        const people = (r.people || []).map((p) => `<a class="menu-item" role="menuitem" href="${p.handle ? `../perfil/?u=${encodeURIComponent(p.handle)}` : "../feed/#amigos"}"><span class="av sm">${ini(p.name)}</span><span><b>${esc(p.name || "")}</b><small>${esc([p.handle ? "@" + p.handle : "", p.friend ? T("Amigo", "Friend") : "", p.city || ""].filter(Boolean).join(" · "))}</small></span></a>`);
        const comms = (r.communities || []).map((c) => `<a class="menu-item" role="menuitem" href="../comunidades/?c=${encodeURIComponent(c.slug)}"><span class="av sm"><i class="ic i-users"></i></span><span><b>${esc(c.name)}</b><small>${esc([c.city, c.mine ? T("Você participa", "You're a member") : ""].filter(Boolean).join(" · "))}</small></span></a>`);
        out.innerHTML = sec(T("Pessoas", "People"), people) + sec(T("Comunidades", "Communities"), comms) || `<p class="small muted">${T("Nada encontrado.", "Nothing found.")}</p>`;
      }, 250); });
    };
    findBtn?.addEventListener("click", openFind);
    document.addEventListener("keydown", (e) => { if (e.key === "/" && !e.ctrlKey && !e.metaKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "") && !document.activeElement?.isContentEditable && !$("iwFindQ")) { e.preventDefault(); openFind(); } });
    // an invite link opened before signing in (perfil/?convite=…): accept it on whichever page the sign-in lands
    let inv = null; try { inv = localStorage.getItem("inkwell-invite"); } catch { /* */ }
    if (inv && page !== "profile") {
      try { localStorage.removeItem("inkwell-invite"); } catch { /* */ }
      CLOUD.api("rpc/accept_invite", { method: "POST", body: { p_code: inv } }).catch(() => {});
    }
    Promise.all([
      CLOUD.api(`user_loans?select=id&status=eq.requested&created_by=neq.${me.id}`).catch(() => []),
      CLOUD.api(`user_trades?select=id&status=eq.proposed&partner=eq.${me.id}`).catch(() => []),
    ]).then(([a, b]) => { if (page !== "trades") window.INKWELL_SHELL_BADGE((a || []).length + (b || []).length); });
    CLOUD.api("rpc/my_duels_sync", { method: "POST", body: {} }).then((r) => {
      const t = Date.parse(r?.[0]?.last_run_at); if (!t) return;
      const m = Math.max(0, Math.round((Date.now() - t) / 60000));
      syncAgo = m < 1 ? T("agora", "now") : m < 60 ? T(`há ${m} min`, `${m} min ago`) : T(`há ${Math.round(m / 60)} h`, `${Math.round(m / 60)} h ago`);
    }).catch(() => {});
  }

  // ---------- tap a card thumbnail to see it large (any page; not where the thumbnail is already a button or link) ----------
  const zoom = document.createElement("dialog");
  zoom.className = "iw-zoom-card"; zoom.id = "iwZoom"; zoom.setAttribute("aria-label", T("Carta ampliada", "Card, larger"));
  zoom.innerHTML = `<button type="button" class="btn ghost icon" data-zclose aria-label="${T("Fechar", "Close")}"><i class="ic i-close"></i></button><figure><img alt=""><figcaption></figcaption></figure>`;
  document.body.append(zoom);
  zoom.addEventListener("click", () => zoom.close());
  const zoomable = (el) => { const t = el.closest?.(".thumb, .iw-card"); if (!t || !t.querySelector("img") || t.closest("a, button, label, summary, dialog.iw-dialog, #iwZoom, [role=button], [data-nozoom]")) return null; return t; };
  document.addEventListener("click", (e) => {
    const t = zoomable(e.target); if (!t) return;
    const img = t.querySelector("img");
    e.preventDefault(); e.stopPropagation();
    zoom.querySelector("img").src = img.currentSrc || img.src;
    zoom.querySelector("img").alt = img.alt || "";
    zoom.querySelector("figcaption").textContent = img.alt || "";
    zoom.querySelector("figcaption").hidden = !img.alt;
    zoom.showModal();
  }, true);
  document.addEventListener("mouseover", (e) => { const t = zoomable(e.target); if (t) t.style.cursor = "zoom-in"; });
})();
</script>
</body>
</html>
