<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner 2.0 · anotar fotos de fichário</title>
<!--
  Gabarito (truth.json) para medir o "Escanear página" com fotos reais. Ferramenta local; não é publicada.
    cd <repo> && python3 -m http.server 8077     ->  http://localhost:8077/tools/pagescan-annotate.html
  Para cada foto: aparelho, luz, foil, os 4 cantos da área dos bolsos (clique: sup. esquerdo, sup. direito,
  inf. direito, inf. esquerdo) e a carta de cada posição (busca por nome; "vazia" quando não há carta).
  Exportar baixa truth.json; ponha-o na mesma pasta das fotos e rode docs/scanner-2.0-avaliacao.md, passo 4.
  As fotos não saem do computador.
-->
<style>
  :root { color-scheme: light dark; font: 15px/1.4 system-ui, sans-serif; }
  body { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100vh; }
  #left { overflow: auto; background: #222; position: relative; }
  #left canvas { display: block; max-width: 100%; cursor: crosshair; }
  #right { overflow: auto; padding: 12px; display: grid; gap: 10px; align-content: start; border-left: 1px solid #8884; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .grid label { display: grid; gap: 2px; font-size: 12px; }
  input, select, button { font: inherit; }
  input[list] { width: 100%; box-sizing: border-box; }
  .ok { color: #2a8; } .bad { color: #d54; }
  #files li { cursor: pointer; } #files li.cur { font-weight: 700; } #files li.done::after { content: " ✓"; color: #2a8; }
  small { opacity: .75; }
</style>
</head>
<body>
<div id="left"><canvas id="cv"></canvas></div>
<div id="right">
  <b>Anotar fotos de fichário (Scanner 2.0)</b>
  <label>Fotos <input type="file" id="pick" accept="image/*" multiple></label>
  <ol id="files"></ol>
  <div class="row">
    <label>Aparelho <input id="device" placeholder="ex.: iPhone 13" size="14"></label>
    <label>Luz <select id="light"><option>boa</option><option>fraca</option><option>reflexo</option><option>mista</option></select></label>
  </div>
  <div class="row"><label><input type="checkbox" id="tilt"> inclinada</label><label><input type="checkbox" id="foil"> tem foil</label></div>
  <div><span id="cornersSay">Clique os 4 cantos: superior esquerdo, superior direito, inferior direito, inferior esquerdo.</span> <button id="reset" type="button">Refazer cantos</button></div>
  <div class="grid" id="pockets"></div>
  <small>Digite o nome e escolha na lista (fica o código, ex.: LOR13-80). Deixe "vazia" se não houver carta.</small>
  <div class="row"><button id="prev" type="button">‹ Anterior</button><button id="next" type="button">Próxima ›</button><button id="export" type="button"><b>Exportar truth.json</b></button></div>
  <div id="status"></div>
  <datalist id="cards"></datalist>
</div>
<script>
const $ = (id) => document.getElementById(id);
const state = { pages: [], i: -1, img: null };
let CARDS = [];
fetch('../site/data/cards.json').then((r) => r.json()).then((j) => {
  CARDS = (j.cards || j).map((c) => ({ id: c.card_id, name: c.name_en || c.name || '', ver: c.version || '', set: c.set_code || '' }));
  $('cards').innerHTML = CARDS.map((c) => `<option value="${c.id}">${c.name}${c.ver ? ' – ' + c.ver : ''} (${c.id})</option>`).join('') + '<option value="vazia">sem carta</option>';
  $('status').textContent = `${CARDS.length} cartas no catálogo.`;
}).catch(() => { $('status').innerHTML = '<span class="bad">Não carreguei o catálogo: sirva a pasta do repositório (veja o topo do arquivo).</span>'; });
const IDS = () => new Set(CARDS.map((c) => c.id));
$('pockets').innerHTML = Array.from({ length: 9 }, (_, k) => `<label>${k + 1}<input list="cards" data-k="${k}"></label>`).join('');

$('pick').onchange = (e) => {
  state.pages = [...e.target.files].sort((a, b) => a.name.localeCompare(b.name)).map((f) => ({ file: f.name, blob: f, corners: [], cards: Array(9).fill(''), device: '', light: 'boa', tilt: false, foil: false }));
  drawList(); go(0);
};
function drawList() { $('files').innerHTML = state.pages.map((p, k) => `<li data-k="${k}" class="${k === state.i ? 'cur' : ''} ${complete(p) ? 'done' : ''}">${p.file}</li>`).join(''); $('files').querySelectorAll('li').forEach((li) => li.onclick = () => go(+li.dataset.k)); }
const complete = (p) => p.corners.length === 4 && p.cards.every((c) => c === 'vazia' || IDS().has(c)) && p.device;
function save() {
  const p = state.pages[state.i]; if (!p) return;
  p.device = $('device').value.trim(); p.light = $('light').value; p.tilt = $('tilt').checked; p.foil = $('foil').checked;
  p.cards = [...document.querySelectorAll('#pockets input')].map((x) => x.value.trim());
}
async function go(k) {
  save(); if (k < 0 || k >= state.pages.length) return; state.i = k; const p = state.pages[k];
  $('device').value = p.device || (state.pages[k - 1]?.device ?? ''); $('light').value = p.light; $('tilt').checked = p.tilt; $('foil').checked = p.foil;
  document.querySelectorAll('#pockets input').forEach((x, j) => { x.value = p.cards[j]; x.className = ''; });
  state.img = await createImageBitmap(p.blob); draw(); drawList(); check();
}
function draw() {
  const cv = $('cv'), p = state.pages[state.i]; cv.width = state.img.width; cv.height = state.img.height;
  const ctx = cv.getContext('2d'); ctx.drawImage(state.img, 0, 0);
  ctx.lineWidth = Math.max(3, cv.width / 300); ctx.strokeStyle = '#2f8'; ctx.fillStyle = '#2f8';
  p.corners.forEach(([x, y], j) => { ctx.beginPath(); ctx.arc(x, y, ctx.lineWidth * 3, 0, 7); ctx.fill(); ctx.fillText(String(j + 1), x + 12, y - 12); });
  if (p.corners.length === 4) {   // pocket grid, to check the corners
    const q = p.corners, L = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
    ctx.beginPath(); for (const t of [0, 1 / 3, 2 / 3, 1]) { const a = L(q[0], q[3], t), b = L(q[1], q[2], t), c = L(q[0], q[1], t), d = L(q[3], q[2], t); ctx.moveTo(...a); ctx.lineTo(...b); ctx.moveTo(...c); ctx.lineTo(...d); } ctx.stroke();
  }
}
$('cv').onclick = (e) => {
  const p = state.pages[state.i]; if (!p || p.corners.length >= 4) return;
  const r = e.target.getBoundingClientRect(); p.corners.push([Math.round((e.clientX - r.left) * e.target.width / r.width), Math.round((e.clientY - r.top) * e.target.height / r.height)]);
  draw(); check();
};
$('reset').onclick = () => { const p = state.pages[state.i]; if (p) { p.corners = []; draw(); check(); } };
$('prev').onclick = () => go(state.i - 1); $('next').onclick = () => go(state.i + 1);
document.querySelectorAll('#pockets input').forEach((x) => x.onchange = () => { x.className = x.value === 'vazia' || IDS().has(x.value) ? 'ok' : 'bad'; save(); check(); });
function check() { const p = state.pages[state.i]; if (!p) return; $('cornersSay').textContent = p.corners.length < 4 ? `Canto ${p.corners.length + 1} de 4: ${['superior esquerdo', 'superior direito', 'inferior direito', 'inferior esquerdo'][p.corners.length]}.` : 'Cantos ok (confira a grade verde).'; drawList(); }
$('export').onclick = () => {
  save();
  const bad = state.pages.filter((p) => !complete(p)).map((p) => p.file);
  if (bad.length && !confirm(`${bad.length} foto(s) incompletas ficam de fora:\n${bad.join('\n')}\nExportar assim mesmo?`)) return;
  const pages = state.pages.filter(complete).map((p) => ({ file: p.file, cond: [p.light, p.tilt ? 'inclinada' : '', p.foil ? 'foil' : ''].filter(Boolean).join('+'), device: p.device, real: true,
    cards: p.cards.map((c) => (c === 'vazia' ? null : c)), corners: p.corners, user: p.corners }));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ real: true, created: new Date().toISOString(), pages }, null, 1)], { type: 'application/json' })); a.download = 'truth.json'; a.click();
};
</script>
</body>
</html>
